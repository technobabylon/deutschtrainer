{id:'a2-01',level:'A2',title:'Erlebnisse erzählen – Perfekt komplett',cat:'perfekt',vocab:['a2-leben'],
 topics:['Perfekt aller Verbtypen','haben oder sein – Sonderfälle','Partizipien im Überblick','Zeitadverbien beim Erzählen'],
 source:'Tracker A2 · Basic German Unit 21 · Netzwerk neu A2 (Perfekt-Wiederholung)',
 goals:['ein Erlebnis zusammenhängend im Perfekt erzählen','alle Partizip-Typen sicher bilden','haben/sein automatisch richtig wählen'],
 grammar:`<h3>1. Overview of all participle types</h3>
<table><tr><th>Type</th><th>Pattern</th><th>Examples</th></tr>
<tr><td>regular</td><td>ge…t</td><td>gemacht, gewohnt, gearbeitet, geöffnet, geregnet</td></tr>
<tr><td>irregular</td><td>ge…en (+ vowel change)</td><td>gelesen, gegessen, getroffen, geholfen, gefunden, gesungen, geschrieben, gestiegen, geflogen, gezogen, gelegen, gesessen, gestanden</td></tr>
<tr><td>mixed</td><td>ge…t + vowel change</td><td>gebracht, gedacht, gekannt, genannt, gewusst, gerannt</td></tr>
<tr><td>separable</td><td>prefix + ge + …</td><td>eingekauft, angefangen, aufgestanden, mitgebracht, zurückgekommen, ferngesehen</td></tr>
<tr><td>inseparable / -ieren</td><td>no ge-</td><td>besucht, bekommen, verstanden, vergessen, erzählt, entschieden, gehört (gehören), passiert, repariert, fotografiert</td></tr></table>
<h3>2. sein – the full list to memorise</h3>
<div class="rule">Movement: gehen, fahren, fliegen, laufen, kommen, reisen, wandern, rennen, steigen, fallen, (um)ziehen, schwimmen, joggen, klettern, Ski fahren, abfahren, ankommen, einsteigen, aussteigen, umsteigen<br>Change of state: aufstehen, aufwachen, einschlafen, sterben, werden, wachsen, verschwinden, passieren, geschehen<br>Others: sein, bleiben, begegnen, gelingen</div>
<div class="warn">Same verb, two meanings: <i>Ich <b>bin</b> nach Basel gefahren</i> (I travelled) – <i>Ich <b>habe</b> das Auto in die Garage gefahren</i> (I drove the car = accusative object → haben).</div>
<h3>3. Narrating</h3><p>Use time words to structure – and keep the verb in position 2: <i><b>Zuerst</b> sind wir … <b>Dann</b> haben wir … <b>Danach</b> … <b>Später</b> … <b>Am Ende / Zum Schluss</b> …</i></p>
<p>sein, haben and modal verbs: in speech normally Präteritum (war, hatte, konnte, musste) – see A2-09.</p>`,
 pitfalls:['<b>*Ich habe aufgestanden</b> → Ich bin aufgestanden.','<b>*Ich habe gebesucht</b> → besucht.','<b>*Dann wir sind gegangen</b> → Dann sind wir gegangen.','<b>*Er hat gestorben</b> → Er ist gestorben.'],
 examples:[['Letztes Wochenende sind wir auf den Uetliberg gewandert.','Last weekend we hiked up the Uetliberg.'],['Zuerst haben wir in Zürich gefrühstückt, dann sind wir mit der S-Bahn gefahren.','First we had breakfast in Zurich, then we took the S-Bahn.'],['Oben haben wir ein Picknick gemacht und Fotos gemacht.','At the top we had a picnic and took photos.'],['Am Abend bin ich sehr müde gewesen und früh eingeschlafen.','In the evening I was very tired and fell asleep early.'],['Hast du die E-Mail von der Gemeinde bekommen?','Did you get the email from the municipality?'],['Ich habe den Brief zweimal gelesen, aber nicht alles verstanden.','I read the letter twice but didn’t understand everything.'],['Wir haben Freunde getroffen und zusammen Fondue gegessen.','We met friends and ate fondue together.'],['Was ist passiert? – Ich bin auf der Treppe gefallen.','What happened? – I fell on the stairs.'],['Meine Tochter ist im Sommer zehn Jahre alt geworden.','My daughter turned ten this summer.'],['Ich habe vergessen, dich anzurufen. Entschuldigung!','I forgot to call you. Sorry!']],
 ex:['g:perfekt|Wir ___ um 7 Uhr ___. (abfahren)|sind;abgefahren','g:perfekt|Ich ___ den Text nicht ___. (verstehen)|habe;verstanden','g:perfekt|Er ___ uns eine Geschichte ___. (erzählen)|hat;erzählt','g:perfekt|Der Film ___ um 20 Uhr ___. (anfangen)|hat;angefangen','g:perfekt|Sie ___ in Oerlikon ___. (umsteigen, she)|ist;umgestiegen','g:perfekt|Was ___ du ___? (mitbringen)|hast;mitgebracht','g:perfekt|Ich ___ gestern früh ___. (einschlafen)|bin;eingeschlafen','g:perfekt|Wir ___ das nicht ___. (denken)|haben;gedacht','g:perfekt|Mein Onkel ___ letztes Jahr ___. (sterben)|ist;gestorben','g:perfekt|Ich ___ meinen Pass ___. (vergessen)|habe;vergessen','m:perfekt|Ich ___ das Auto in die Garage gefahren.|habe~bin~hat','m:perfekt|Wir ___ nach Lugano gefahren.|sind~haben~hat','m:perfekt|Partizip von „reparieren“|repariert~gerepariert~reparierte','m:perfekt|Partizip von „bringen“|gebracht~gebringt~gebrungen','t:perfekt|Perfekt: Ich treffe meine Kollegen.|Ich habe meine Kollegen getroffen','t:perfekt|Perfekt: Der Zug kommt pünktlich an.|Der Zug ist pünktlich angekommen','t:perfekt|Perfekt: Wir bleiben zu Hause.|Wir sind zu Hause geblieben','o:wordorder|Then we went home.|Dann sind wir nach Hause gegangen']},

{id:'a2-02',level:'A2',title:'Geschenke & Hilfe – Dativ komplett',cat:'case',vocab:['a2-feste'],
 topics:['Dativ- und Akkusativobjekt','Reihenfolge der Objekte','Dativverben','Dativ Plural -n'],
 source:'Tracker A2 · Basic German Units 13, 15',
 goals:['Verben mit zwei Objekten (geben, schenken, zeigen) korrekt verwenden','Reihenfolge Nomen/Pronomen beherrschen'],
 grammar:`<h3>1. Two objects: person (dative) + thing (accusative)</h3>
<p>geben, schenken, schicken, bringen, zeigen, erklären, empfehlen, leihen, kaufen, schreiben, sagen, wünschen:</p>
<div class="rule">Ich schenke <b>meiner Mutter</b> (Dat = to whom?) <b>einen Schal</b> (Akk = what?).</div>
<h3>2. Word order of the two objects</h3>
<table><tr><th>Case</th><th>Order</th><th>Example</th></tr>
<tr><td>two nouns</td><td>Dativ → Akkusativ</td><td>Ich gebe <b>dem Kind</b> <b>den Ball</b>.</td></tr>
<tr><td>one pronoun</td><td>pronoun first</td><td>Ich gebe <b>ihm</b> den Ball. / Ich gebe <b>ihn</b> dem Kind.</td></tr>
<tr><td>two pronouns</td><td>Akkusativ → Dativ</td><td>Ich gebe <b>ihn ihm</b>.</td></tr></table>
<h3>3. Verbs with only a dative object</h3><p>helfen, danken, gefallen, gehören, gratulieren, antworten, passen, schmecken, fehlen, folgen, glauben (jdm), vertrauen, zuhören, wehtun, begegnen, raten: <i>Ich <b>gratuliere dir</b> zum Geburtstag. <b>Hör mir</b> bitte zu! Das Essen <b>schmeckt uns</b>. Was <b>fehlt Ihnen</b>?</i></p>
<h3>4. Dative plural and n-Deklination</h3><p>Dative plural: article <b>den</b> + noun <b>+n</b>: <i>mit den Kindern, den Freunden, in den Bergen</i> (not after -s or -n: den Autos, den Frauen).<br>Some masculine nouns add <b>-(e)n</b> in all cases except nominative singular (n-Deklination): der Kolleg<b>e</b> → den/dem Kolleg<b>en</b>; der Herr → Herr<b>n</b>; der Nachbar → Nachbar<b>n</b>; der Mensch → Mensch<b>en</b>; der Kunde → Kunde<b>n</b>; der Student → Student<b>en</b>. <i>Ich spreche mit Herrn Müller. Ich helfe meinem Nachbarn.</i></p>`,
 pitfalls:['<b>*Ich gebe den Ball dem Kind</b> (two nouns) → dem Kind den Ball.','<b>*Ich gebe ihm es</b> → Ich gebe es ihm.','<b>*Ich helfe meinem Nachbar</b> → Nachbarn.','<b>*Sehr geehrter Herr Müller … mit Herr Müller</b> → mit Herrn Müller.'],
 examples:[['Ich schenke meinem Vater ein Buch zum Geburtstag.','I’m giving my father a book for his birthday.'],['Kannst du mir bitte das Salz geben?','Can you pass me the salt, please?'],['Die Verkäuferin hat mir einen guten Wein empfohlen.','The shop assistant recommended a good wine to me.'],['Ich erkläre es dir später.','I’ll explain it to you later.'],['Wir gratulieren euch zur Hochzeit!','Congratulations on your wedding!'],['Das Kleid gehört meiner Schwester.','The dress belongs to my sister.'],['Ich habe gestern mit Herrn Keller telefoniert.','I phoned Mr Keller yesterday.'],['Können Sie mir sagen, wo das Gemeindehaus ist?','Can you tell me where the municipal building is?'],['Am Wochenende helfe ich meinem Nachbarn im Garten.','At the weekend I help my neighbour in the garden.'],['Die Kinder spielen mit den Hunden.','The children are playing with the dogs.']],
 ex:['g:case|Ich gebe ___ Kind einen Apfel. (the)|dem','g:case|Er schenkt ___ Frau Blumen. (his)|seiner','g:case|Wir zeigen ___ Gästen die Stadt. (the, pl.)|den','g:case|Ich helfe meinem ___. (Nachbar)|Nachbarn','g:case|Ich spreche mit ___ Weber. (Herr)|Herrn','g:case|Kannst du dem ___ helfen? (Kollege)|Kollegen','g:pron|Ich gebe ___ ___. (it – him)|es;ihm','g:pron|Kannst du ___ das erklären? (me)|mir','g:pron|Wir gratulieren ___ zum Geburtstag. (you, du)|dir','g:case|Der Kaffee schmeckt ___ Gästen nicht. (the)|den','m:pron|Ich schenke meiner Freundin die Kette. → Ich schenke ___.|sie ihr~ihr sie~sie sie','m:wordorder|Which order is correct?|Ich gebe dem Kind den Ball.~Ich gebe den Ball dem Kind.~Ich gebe dem Kind dem Ball.','m:case|Hör ___ bitte zu!|mir~mich~ich','t:pron|Replace the objects with pronouns: Ich gebe dem Mann den Schlüssel.|Ich gebe ihn ihm','t:case|Translate: I am buying my daughter a bicycle.|Ich kaufe meiner Tochter ein Velo/Ich kaufe meiner Tochter ein Fahrrad','t:case|Translate: Can you show me the way? (Sie)|Können Sie mir den Weg zeigen','o:wordorder|I’ll write you an email tomorrow.|Ich schreibe dir morgen eine E-Mail/Morgen schreibe ich dir eine E-Mail']},

{id:'a2-03',level:'A2',title:'Umziehen & Einrichten – Wo? Wohin?',cat:'wechsel',vocab:['a2-wohnen'],
 topics:['stellen/stehen, legen/liegen, setzen/sitzen, hängen','Wechselpräpositionen vertieft','Richtungsangaben: nach, zu, in, an, auf'],
 source:'Tracker A2 · Basic German Unit 24',
 goals:['beim Umzug Anweisungen geben','Positions- und Richtungsverben unterscheiden','die richtige Präposition für Ziele wählen'],
 grammar:`<h3>1. Position verbs vs. placement verbs</h3>
<table><tr><th>Wohin? + Akk (action, regular verb)</th><th>Wo? + Dat (state, irregular verb)</th></tr>
<tr><td>stellen (stellte, hat gestellt) – put upright</td><td>stehen (hat gestanden) – be standing</td></tr>
<tr><td>legen (hat gelegt) – lay down</td><td>liegen (hat gelegen) – be lying</td></tr>
<tr><td>setzen (hat gesetzt) – sit someone down</td><td>sitzen (hat gesessen) – be sitting</td></tr>
<tr><td>hängen (hat gehängt) – hang up</td><td>hängen (hat gehangen) – be hanging</td></tr>
<tr><td>stecken – put into</td><td>stecken – be stuck in</td></tr></table>
<div class="rule">Ich <b>stelle</b> die Lampe <b>auf den</b> Tisch. → Die Lampe <b>steht auf dem</b> Tisch.<br>Ich <b>lege</b> das Handy <b>auf das</b> Sofa. → Das Handy <b>liegt auf dem</b> Sofa.</div>
<h3>2. Where to? – choosing the preposition</h3>
<table><tr><th>Destination</th><th>Wohin?</th><th>Wo?</th><th>Woher?</th></tr>
<tr><td>cities, countries w/o article</td><td>nach Zug</td><td>in Zug</td><td>aus Zug</td></tr>
<tr><td>countries with article, buildings, rooms</td><td>in die Schweiz, ins Kino</td><td>in der Schweiz, im Kino</td><td>aus der Schweiz, aus dem Kino</td></tr>
<tr><td>persons, shops named by person, institutions</td><td>zum Arzt, zu Coop, zur Gemeinde</td><td>beim Arzt, bei Coop</td><td>vom Arzt</td></tr>
<tr><td>water, edges</td><td>an den See, ans Meer</td><td>am See</td><td>vom See</td></tr>
<tr><td>open spaces, islands, mountains, events</td><td>auf den Markt, auf die Post, auf den Berg</td><td>auf dem Markt</td><td>vom Markt</td></tr>
<tr><td>home</td><td>nach Hause</td><td>zu Hause</td><td>von zu Hause</td></tr></table>
<h3>3. Wo-/Wohin-adverbs</h3><p>hier/da/dort – hierher/dorthin; oben/unten, drinnen/draussen, links/rechts, vorne/hinten.</p>`,
 pitfalls:['<b>*Ich lege die Flasche in den Kühlschrank</b> – correct, but upright bottles: <i>stelle</i>.','<b>*Das Buch legt auf dem Tisch</b> → liegt.','<b>*Ich fahre in Bern</b> → nach Bern.','<b>*Wir gehen am See</b> → an den See.'],
 swiss:'Umzug in der Schweiz: innerhalb von 14 Tagen bei der neuen Gemeinde anmelden (Einwohnerkontrolle), bei der alten abmelden. Wohnungsübergabe mit Abnahmeprotokoll.',
 examples:[['Stell den Schrank bitte an die Wand!','Please put the wardrobe against the wall!'],['Der Schrank steht jetzt an der Wand.','The wardrobe is now against the wall.'],['Wohin soll ich die Bücher legen? – Leg sie ins Regal.','Where should I put the books? – Put them on the shelf.'],['Die Bücher liegen im Regal.','The books are on the shelf.'],['Ich hänge den Spiegel über das Waschbecken.','I’m hanging the mirror above the sink.'],['Der Spiegel hängt über dem Waschbecken.','The mirror hangs above the sink.'],['Am Samstag fahren wir an den Zugersee.','On Saturday we are going to Lake Zug.'],['Ich muss noch zur Gemeinde und dann auf die Post.','I still have to go to the municipality and then to the post office.'],['Wir sind letzten Monat in die Schweiz gezogen.','We moved to Switzerland last month.'],['Setz dich doch aufs Sofa!','Do sit down on the sofa!']],
 ex:['g:wechsel|Ich ___ die Vase auf den Tisch. (stellen/stehen)|stelle','g:wechsel|Die Vase ___ auf dem Tisch. (stellen/stehen)|steht','g:wechsel|Das Handy ___ auf dem Sofa. (legen/liegen)|liegt','g:wechsel|Er ___ den Mantel an die Garderobe. (hängen)|hängt','g:wechsel|Der Mantel ___ an der Garderobe. (hängen)|hängt','g:wechsel|Leg die Zeitung auf ___ Stuhl! (der)|den','g:wechsel|Die Katze sitzt auf ___ Fensterbank. (die)|der','g:prep|Wir fahren ___ Luzern.|nach','g:prep|Morgen gehe ich ___ Zahnarzt. (to the)|zum','g:prep|Im Sommer fahren wir ___ Meer. (to the)|ans','g:prep|Sie wohnt ___ Türkei. (in the)|in der','g:prep|Ich gehe ___ Markt. (to the, open space)|auf den','m:wechsel|Wo ist der Schlüssel? – Er ___ in der Tasche.|steckt~steckt in~stellt','m:prep|Ich fliege ___ USA.|in die~nach~zu den','m:wechsel|Ich habe den Teller in den Schrank ___.|gestellt~gestanden~gestellen','t:wechsel|Translate: The bottle is (standing) in the fridge.|Die Flasche steht im Kühlschrank','t:wechsel|Translate: I put the book on the table. (lay)|Ich lege das Buch auf den Tisch','t:prep|Translate: I’m going home.|Ich gehe nach Hause']},

{id:'a2-04',level:'A2',title:'Gründe & Bedingungen – weil, dass, wenn',cat:'conn',vocab:['a2-gesundheit'],
 topics:['Nebensatz: Verb am Ende','weil vs. denn','dass-Sätze','wenn (Bedingung/Zeit)','Nebensatz vor dem Hauptsatz'],
 source:'Tracker A2 (Subordinate clauses I) · Basic German Units 27, 28',
 goals:['Gründe angeben','Meinungen mit „Ich finde/glaube, dass …“ ausdrücken','Bedingungen formulieren'],
 grammar:`<h3>1. Subordinate clause = conjugated verb at the END</h3>
<div class="rule">Ich bleibe zu Hause, <b>weil</b> ich krank <b>bin</b>.<br>Ich glaube, <b>dass</b> der Bus schon <b>abgefahren ist</b>.<br><b>Wenn</b> es morgen <b>regnet</b>, gehen wir ins Museum.</div>
<p>Always a <b>comma</b> before the subordinate clause. With modal verbs and Perfekt, the conjugated verb is the very last word: …, weil ich heute arbeiten <b>muss</b> / …, weil ich zu spät aufgestanden <b>bin</b>. Separable verbs join up again: …, weil der Zug um 8 Uhr <b>abfährt</b>.</p>
<h3>2. weil vs. denn</h3><table><tr><td><b>denn</b> (position 0, main clause)</td><td>Ich komme nicht, denn ich <b>bin</b> krank.</td></tr><tr><td><b>weil</b> (subordinate, verb last)</td><td>Ich komme nicht, weil ich krank <b>bin</b>.</td></tr></table>
<h3>3. Subordinate clause first → main clause starts with the verb</h3>
<div class="rule"><b>Weil</b> ich krank bin, <b>komme</b> ich nicht. – The whole subordinate clause is position 1; the verb of the main clause takes position 2: “verb, comma, verb”.</div>
<h3>4. dass – after verbs of saying, thinking, feeling</h3><p>Ich finde/glaube/denke/hoffe/weiss, dass … · Es ist wichtig, dass … · Ich freue mich, dass …</p>
<h3>5. wenn – if / whenever</h3><p><i>Wenn du Zeit hast, ruf mich an. Immer wenn ich in Bern bin, besuche ich meine Tante.</i> (For one-off past events: <b>als</b> – see A2-10.)</p>`,
 pitfalls:['<b>*…, weil ich bin krank</b> → weil ich krank bin.','<b>*Weil ich krank bin, ich komme nicht</b> → komme ich nicht.','<b>*…, dass er hat angerufen</b> → dass er angerufen hat.','Missing comma before weil/dass/wenn.'],
 examples:[['Ich gehe heute nicht arbeiten, weil ich Fieber habe.','I’m not going to work today because I have a fever.'],['Weil ich Fieber habe, gehe ich heute nicht arbeiten.','Because I have a fever, I’m not going to work today.'],['Ich glaube, dass die Apotheke am Sonntag geschlossen ist.','I think the pharmacy is closed on Sunday.'],['Der Arzt sagt, dass ich mehr trinken soll.','The doctor says I should drink more.'],['Wenn du Kopfschmerzen hast, nimm eine Tablette.','If you have a headache, take a tablet.'],['Es ist wichtig, dass Sie die Medikamente regelmässig nehmen.','It’s important that you take the medicine regularly.'],['Ich bin zu spät gekommen, weil der Zug Verspätung hatte.','I was late because the train was delayed.'],['Ich hoffe, dass es dir bald besser geht.','I hope you feel better soon.'],['Wenn ich Zeit habe, gehe ich am Abend joggen.','When I have time, I go jogging in the evening.'],['Ich finde es gut, dass man in der Schweiz abstimmen kann.','I think it’s good that you can vote in Switzerland.']],
 ex:['t:conn|Combine with weil: Ich gehe zum Arzt. Ich habe Bauchschmerzen.|Ich gehe zum Arzt, weil ich Bauchschmerzen habe','t:conn|Combine with weil: Er kommt nicht. Er muss arbeiten.|Er kommt nicht, weil er arbeiten muss','t:conn|Combine with dass: Ich glaube. Der Kurs beginnt morgen.|Ich glaube, dass der Kurs morgen beginnt','t:conn|Combine with dass: Sie sagt. Sie hat keine Zeit.|Sie sagt, dass sie keine Zeit hat','t:conn|Start with weil: Weil ich müde bin, …(ich gehe früh ins Bett)|Weil ich müde bin, gehe ich früh ins Bett','t:conn|Start with wenn: Wenn es regnet, …(wir bleiben zu Hause)|Wenn es regnet, bleiben wir zu Hause','t:conn|Combine with weil: Ich war zu spät. Ich habe den Bus verpasst.|Ich war zu spät, weil ich den Bus verpasst habe','t:sep|Combine with weil: Ich muss früh gehen. Mein Zug fährt um 17 Uhr ab.|Ich muss früh gehen, weil mein Zug um 17 Uhr abfährt','m:conn|Ich komme nicht, ___ ich bin krank.|denn~weil~dass','m:conn|Ich komme nicht, ___ ich krank bin.|weil~denn~aber','m:conn|Ich hoffe, ___ du bald gesund bist.|dass~weil~wenn','m:wordorder|Which is correct?|Wenn ich Zeit habe, rufe ich dich an.~Wenn ich habe Zeit, ich rufe dich an.~Wenn ich Zeit habe, ich rufe dich an.','o:conn|I think that he is right.|Ich denke, dass er recht hat','o:conn|If you are tired, sleep!|Wenn du müde bist, schlaf','g:conn|Ich lerne Deutsch, ___ ich in der Schweiz wohne.|weil/da','g:wordorder|Weil der Zug Verspätung hatte, ___ ich zu spät gekommen. (sein)|bin']},

{id:'a2-05',level:'A2',title:'Sich kümmern & sich freuen – reflexive Verben',cat:'reflex',vocab:['a2-gefuehle'],
 topics:['Reflexivpronomen (Akk./Dat.)','reflexive Verben','Verben mit Präposition (Basis)','worauf? – darauf / auf wen?'],
 source:'Tracker A2 · Basic German Unit 17 · Sicher B1+ L2 (Vorschau)',
 goals:['über Gefühle, Interessen und Pläne sprechen','reflexive Verben korrekt konjugieren','Präpositionalpronomen verwenden'],
 grammar:`<h3>1. Reflexive pronouns</h3>
<table><tr><th></th><th>ich</th><th>du</th><th>er/sie/es</th><th>wir</th><th>ihr</th><th>sie/Sie</th></tr>
<tr><td>Akkusativ</td><td>mich</td><td>dich</td><td><em>sich</em></td><td>uns</td><td>euch</td><td><em>sich</em></td></tr>
<tr><td>Dativ</td><td><em>mir</em></td><td><em>dir</em></td><td><em>sich</em></td><td>uns</td><td>euch</td><td><em>sich</em></td></tr></table>
<p>Accusative is normal: <i>Ich freue <b>mich</b>. Du beeilst <b>dich</b>.</i> Dative when there is ANOTHER accusative object: <i>Ich wasche <b>mir</b> die Hände. Ich kaufe <b>mir</b> ein Velo. Das kann ich <b>mir</b> vorstellen.</i></p>
<p>Important reflexive verbs: sich anmelden, sich abmelden, sich ausruhen, sich beeilen, sich bewerben, sich duschen, sich entschuldigen, sich erholen, sich erkälten, sich fühlen, sich informieren, sich treffen, sich umziehen, sich verabreden, sich vorstellen, sich wohlfühlen.</p>
<h3>2. Verbs with a fixed preposition</h3>
<table><tr><td>sich freuen <b>auf</b> + A (future)</td><td>sich freuen <b>über</b> + A (present/past)</td></tr><tr><td>sich interessieren <b>für</b> + A</td><td>sich ärgern <b>über</b> + A</td></tr><tr><td>warten <b>auf</b> + A</td><td>denken <b>an</b> + A</td></tr><tr><td>sich kümmern <b>um</b> + A</td><td>sich treffen <b>mit</b> + D</td></tr><tr><td>Angst haben <b>vor</b> + D</td><td>sprechen <b>über</b> + A / <b>mit</b> + D</td></tr></table>
<h3>3. Asking and referring: wo(r)- / da(r)-</h3>
<div class="rule">For <b>things</b>: <b>Wo</b>rauf wartest du? – Auf den Bus. Ich warte schon lange <b>dar</b>auf.<br>For <b>people</b>: <b>Auf wen</b> wartest du? – Auf meine Frau. Ich warte auf <b>sie</b>.<br>“r” is inserted before a vowel: wo<b>r</b>an, da<b>r</b>über, wo<b>r</b>auf; but wofür, damit, davon.</div>`,
 pitfalls:['<b>*Ich freue auf das Wochenende</b> → Ich freue <b>mich</b> auf …','<b>*Ich wasche mich die Hände</b> → mir.','<b>*Ich warte für den Bus</b> → auf den Bus.','<b>*Auf was wartest du?</b> (colloquial) → Worauf wartest du?'],
 examples:[['Ich freue mich auf die Ferien.','I’m looking forward to the holidays.'],['Wir haben uns sehr über dein Geschenk gefreut.','We were very pleased about your present.'],['Interessierst du dich für Politik?','Are you interested in politics?'],['Ich muss mich noch bei der Gemeinde anmelden.','I still have to register with the municipality.'],['Beeil dich, der Zug fährt gleich!','Hurry up, the train is about to leave!'],['Ich habe mir ein neues Handy gekauft.','I bought myself a new phone.'],['Worüber habt ihr gesprochen? – Über die Abstimmung.','What did you talk about? – About the vote.'],['Ich kümmere mich um die Kinder, und du kümmerst dich um das Essen.','I’ll look after the children and you take care of the food.'],['Darauf habe ich keine Lust.','I don’t feel like that.'],['Fühlen Sie sich hier wohl?','Do you feel at home here?']],
 ex:['g:reflex|Ich freue ___ auf das Wochenende.|mich','g:reflex|Er hat ___ erkältet.|sich','g:reflex|Wir treffen ___ um acht.|uns','g:reflex|Ich wasche ___ die Hände.|mir','g:reflex|Habt ihr ___ schon angemeldet?|euch','g:reflex|Kannst du ___ das vorstellen?|dir','g:verbprep|Ich warte ___ den Bus.|auf','g:verbprep|Sie interessiert sich ___ Kunst.|für','g:verbprep|Wir freuen uns ___ dein Geschenk. (received)|über','g:verbprep|Ich denke oft ___ meine Familie.|an','g:verbprep|Er kümmert sich ___ seine Mutter.|um','g:verbprep|___ wartest du? – Auf den Zug.|Worauf','g:verbprep|Auf ___ wartest du? – Auf meinen Bruder.|wen','g:verbprep|Freust du dich auf den Urlaub? – Ja, ich freue mich sehr ___.|darauf','m:verbprep|Ich habe Angst ___ Hunden.|vor~für~von','m:reflex|Beeil ___!|dich~dir~sich','t:reflex|Translate: I feel good. (sich fühlen)|Ich fühle mich gut','t:verbprep|Translate: What are you interested in? (du)|Wofür interessierst du dich']},

{id:'a2-06',level:'A2',title:'Vergleichen – Komparativ & Superlativ',cat:'comp',vocab:['a2-einkaufen'],
 topics:['Komparativ (-er)','Superlativ (am -sten / der -ste)','so … wie / -er als','unregelmässige Formen'],
 source:'Tracker A2 · Basic German Unit 19',
 goals:['Produkte, Orte und Angebote vergleichen','Vorlieben ausdrücken (lieber, am liebsten)'],
 grammar:`<h3>1. Forms</h3>
<table><tr><th>Positiv</th><th>Komparativ</th><th>Superlativ</th></tr>
<tr><td>billig</td><td>billig<em>er</em></td><td>am billig<em>sten</em></td></tr>
<tr><td>alt</td><td><em>ä</em>lt<em>er</em></td><td>am <em>ä</em>lt<em>esten</em> (after -t, -d, -s, -z, -sch: -esten)</td></tr>
<tr><td>gross / jung / kurz / warm / kalt / lang / stark / arm</td><td>grösser / jünger / kürzer / wärmer / kälter / länger / stärker / ärmer</td><td>am grössten / jüngsten …</td></tr>
<tr><td>teuer / dunkel</td><td>teu<em>rer</em> / dunk<em>ler</em></td><td>am teuersten / dunkelsten</td></tr></table>
<p>Irregular: <b>gut – besser – am besten</b>, <b>viel – mehr – am meisten</b>, <b>gern – lieber – am liebsten</b>, <b>hoch – höher – am höchsten</b>, <b>nah – näher – am nächsten</b>.</p>
<h3>2. Comparing</h3><div class="rule">equal: <b>so</b> teuer <b>wie</b> · unequal: teur<b>er als</b> · Zürich ist grösser <b>als</b> Zug. Zug ist nicht <b>so</b> gross <b>wie</b> Zürich.</div>
<h3>3. Before a noun: normal adjective ending added</h3><p>das billig<b>ere</b> Angebot, die schön<b>ste</b> Stadt, der höch<b>ste</b> Berg, mit dem schnell<b>eren</b> Zug. <i>Der Dom ist die höchste Kirche der Schweiz?</i> – <i>Das Grossmünster ist eine der bekanntesten Kirchen.</i></p>`,
 pitfalls:['<b>*mehr billig</b> → billiger.','<b>*grösser wie</b> → grösser als.','<b>*am bestens</b> → am besten.','<b>*Das ist der am grössten Berg</b> → der grösste Berg.'],
 swiss:'Die Schweiz im Vergleich: Der höchste Berg ist die Dufourspitze (4634 m), der grösste See ganz in der Schweiz ist der Neuenburgersee, die grösste Stadt ist Zürich. Bern ist die Bundesstadt.',
 examples:[['Der Zug ist schneller als das Auto.','The train is faster than the car.'],['Bei Aldi ist die Milch billiger als bei Coop.','Milk is cheaper at Aldi than at Coop.'],['Zug ist nicht so gross wie Zürich.','Zug is not as big as Zurich.'],['Ich trinke lieber Tee als Kaffee.','I prefer tea to coffee.'],['Am liebsten fahre ich im Sommer ins Tessin.','Most of all I like going to Ticino in summer.'],['Welches Handy ist am besten?','Which phone is the best?'],['Das ist die schönste Aussicht der Welt!','That’s the most beautiful view in the world!'],['Die Mieten in Zug sind höher als in Schwyz.','Rents in Zug are higher than in Schwyz.'],['Mein Bruder ist zwei Jahre älter als ich.','My brother is two years older than me.'],['Ich möchte ein grösseres Zimmer.','I’d like a bigger room.']],
 ex:['g:comp|Der Rhein ist ___ als die Limmat. (lang)|länger','g:comp|Ein Velo ist ___ als ein Auto. (billig)|billiger','g:comp|Heute ist es ___ als gestern. (warm)|wärmer','g:comp|Dieser Laptop ist ___ als der andere. (teuer)|teurer','g:comp|Ich spiele ___ Tennis als Golf. (gern)|lieber','g:comp|Wer kocht ___? (gut, superlative: am …)|am besten','g:comp|Im Dezember sind die Tage am ___. (kurz)|kürzesten','g:comp|Er verdient ___ als ich. (viel)|mehr','g:comp|Das ist der ___ Berg der Schweiz. (hoch)|höchste','g:comp|Ich suche eine ___ Wohnung. (gross, comparative)|grössere/größere','m:comp|Basel ist kleiner ___ Zürich.|als~wie~so','m:comp|Luzern ist fast so schön ___ Bern.|wie~als~so','m:comp|Superlativ von „gut“|am besten~am gutesten~am bessten','t:comp|Translate: My sister is younger than me.|Meine Schwester ist jünger als ich','t:comp|Translate: The train is as fast as the car.|Der Zug ist so schnell wie das Auto','o:comp|I like eating fish most of all.|Am liebsten esse ich Fisch/Ich esse am liebsten Fisch']},

{id:'a2-07',level:'A2',title:'Beschreiben – Adjektivendungen I',cat:'adj',vocab:['a2-aussehen'],
 topics:['Adjektiv nach der/die/das','Adjektiv nach ein/kein/mein','Nominativ, Akkusativ, Dativ'],
 source:'Tracker A2 · Sicher B1+ L1 (Vorschau) · Basic German Unit 25',
 goals:['Personen, Dinge und Wohnungen genau beschreiben','die zwei Grundregeln der Adjektivdeklination anwenden'],
 grammar:`<h3>1. After der/die/das (and dieser, jeder, welcher)</h3>
<table><tr><th></th><th>m</th><th>n</th><th>f</th><th>pl</th></tr>
<tr><td>Nom</td><td>der neu<em>e</em> Tisch</td><td>das neu<em>e</em> Sofa</td><td>die neu<em>e</em> Lampe</td><td>die neu<b>en</b> Stühle</td></tr>
<tr><td>Akk</td><td>den neu<b>en</b> Tisch</td><td>das neu<em>e</em> Sofa</td><td>die neu<em>e</em> Lampe</td><td>die neu<b>en</b> Stühle</td></tr>
<tr><td>Dat</td><td>dem neu<b>en</b> Tisch</td><td>dem neu<b>en</b> Sofa</td><td>der neu<b>en</b> Lampe</td><td>den neu<b>en</b> Stühlen</td></tr></table>
<div class="rule">Only <b>-e</b> or <b>-en</b>. <b>-e</b> in the 5 “basic” slots (Nom sg all genders + Akk sg neuter/feminine); <b>-en</b> everywhere else.</div>
<h3>2. After ein/kein/mein/dein/unser …</h3>
<table><tr><th></th><th>m</th><th>n</th><th>f</th><th>pl (keine/meine)</th></tr>
<tr><td>Nom</td><td>ein neu<em>er</em> Tisch</td><td>ein neu<em>es</em> Sofa</td><td>eine neu<em>e</em> Lampe</td><td>meine neu<b>en</b> Stühle</td></tr>
<tr><td>Akk</td><td>einen neu<b>en</b> Tisch</td><td>ein neu<em>es</em> Sofa</td><td>eine neu<em>e</em> Lampe</td><td>meine neu<b>en</b> Stühle</td></tr>
<tr><td>Dat</td><td>einem neu<b>en</b> Tisch</td><td>einem neu<b>en</b> Sofa</td><td>einer neu<b>en</b> Lampe</td><td>meinen neu<b>en</b> Stühlen</td></tr></table>
<div class="rule">Same as table 1, except where <i>ein</i> has <b>no ending</b> (Nom m, Nom/Akk n): there the adjective shows the gender: ein neu<b>er</b> (der), ein neu<b>es</b> (das).</div>
<p>Shortcut: the gender signal (r / s / e / m / n) must appear <b>once</b> – either on the article or on the adjective.</p>
<p>No ending after sein/werden: <i>Der Tisch ist <b>neu</b>.</i> Several adjectives take the same ending: <i>ein schön<b>er</b>, gross<b>er</b> Garten</i>. <i>lila, rosa, orange, online</i> and town names in -er never change: <i>der Zürcher See, die Basler Fasnacht</i>.</p>`,
 pitfalls:['<b>*ein neue Tisch</b> → ein neuer Tisch.','<b>*mit dem neuen Auto</b> ✓ <b>*mit einem neues Auto</b> → einem neuen Auto.','<b>*Der Tisch ist neuer</b> (not comparative!) → neu.','<b>*Ich habe einen grosse Hund</b> → einen grossen Hund.'],
 examples:[['Wir haben eine schöne Wohnung mit einem grossen Balkon gefunden.','We found a nice flat with a big balcony.'],['Der neue Kollege kommt aus Deutschland.','The new colleague is from Germany.'],['Ich suche einen günstigen Kühlschrank.','I’m looking for an inexpensive fridge.'],['Sie trägt ein rotes Kleid und schwarze Schuhe.','She’s wearing a red dress and black shoes.'],['Kennst du die junge Frau mit den langen Haaren?','Do you know the young woman with the long hair?'],['Das ist ein interessanter Vorschlag.','That is an interesting suggestion.'],['Wir wohnen in einem alten Haus in der Altstadt.','We live in an old house in the old town.'],['Mein neuer Chef ist sehr freundlich.','My new boss is very friendly.'],['Ich habe kein grosses Auto, sondern ein kleines.','I don’t have a big car but a small one.'],['Die Zürcher Altstadt ist wunderschön.','Zurich’s old town is beautiful.']],
 ex:['g:adj|Der ___ Kollege ist nett. (neu)|neue','g:adj|Ich kaufe den ___ Mantel. (schwarz)|schwarzen','g:adj|Das ist ein ___ Buch. (spannend)|spannendes','g:adj|Er hat einen ___ Hund. (gross)|grossen/großen','g:adj|Sie wohnt in einer ___ Wohnung. (klein)|kleinen','g:adj|Wir sprechen mit dem ___ Nachbarn. (alt)|alten','g:adj|Das ist ein ___ Tag! (schön)|schöner','g:adj|Die ___ Kinder spielen. (klein)|kleinen','g:adj|Ich trinke ein ___ Wasser. (kalt)|kaltes','g:adj|Mein ___ Auto ist kaputt. (alt)|altes','g:adj|Sie trägt eine ___ Jacke. (blau)|blaue','g:adj|Mit meinem ___ Velo fahre ich zur Arbeit. (neu)|neuen','m:adj|Ich suche ___ Wohnung.|eine helle~ein helle~eine hellen','m:adj|Der Kaffee ist ___.|heiss~heisser~heisse','t:adj|Translate: a good idea|eine gute Idee','t:adj|Translate: with the new car|mit dem neuen Auto','t:adj|Translate: I have a small garden.|Ich habe einen kleinen Garten']},

{id:'a2-08',level:'A2',title:'Meins oder deins? – Artikelwörter & Pronomen',cat:'case',vocab:['a2-haushalt'],
 topics:['Possessivartikel in allen Fällen','Demonstrativ: dieser, der da','Indefinitpronomen: einer, keiner, welche, meiner','jeder, alle, manche'],
 source:'Tracker A2 (Possessive & demonstrative fully declined) · Basic German Unit 16',
 goals:['über Besitz sprechen','Nomen durch Pronomen ersetzen (einer/keiner/welche)'],
 grammar:`<h3>1. Possessive articles – all cases</h3>
<table><tr><th></th><th>m</th><th>n</th><th>f</th><th>pl</th></tr>
<tr><td>Nom</td><td>mein</td><td>mein</td><td>meine</td><td>meine</td></tr><tr><td>Akk</td><td>meinen</td><td>mein</td><td>meine</td><td>meine</td></tr><tr><td>Dat</td><td>meinem</td><td>meinem</td><td>meiner</td><td>meinen (+n)</td></tr><tr><td>Gen</td><td>meines (+s)</td><td>meines (+s)</td><td>meiner</td><td>meiner</td></tr></table>
<p>Choose the possessive by the <b>owner</b> (er → sein, sie → ihr), the ending by the <b>noun</b>: <i>Anna besucht <b>ihren</b> Bruder. Peter ruft <b>seine</b> Mutter an.</i> euer loses -e-: eu<b>re</b>, eu<b>ren</b>.</p>
<h3>2. Pronouns replacing a noun</h3>
<table><tr><th></th><th>m</th><th>n</th><th>f</th><th>pl</th></tr>
<tr><td>Nom</td><td>einer / keiner / meiner</td><td>eins / keins / meins</td><td>eine / keine / meine</td><td>welche / keine / meine</td></tr>
<tr><td>Akk</td><td>einen / keinen / meinen</td><td>eins / keins / meins</td><td>eine / keine / meine</td><td>welche / keine / meine</td></tr>
<tr><td>Dat</td><td>einem / keinem</td><td>einem / keinem</td><td>einer / keiner</td><td>welchen / keinen</td></tr></table>
<p><i>Hast du einen Stift? – Ja, ich habe <b>einen</b>. / Nein, ich habe <b>keinen</b>. · Brauchst du noch Eier? – Nein, wir haben noch <b>welche</b>. · Ist das dein Schirm? – Ja, das ist <b>meiner</b>.</i></p>
<h3>3. dieser, jeder, alle, manche</h3><p>Endings like der/die/das: dies<b>er</b> Zug, jed<b>en</b> Tag (Akk), mit jed<b>em</b> Kunden, all<b>e</b> Kinder, manch<b>e</b> Leute. <i>jeder</i> is singular only; plural = <i>alle</i>.</p>`,
 pitfalls:['<b>*Maria besucht seine Mutter</b> → ihre Mutter.','<b>*Ich habe kein</b> (masc.) → keinen.','<b>*Brauchst du Eier? – Ich habe schon</b> → Ich habe schon welche.','<b>*jede Tage</b> → jeden Tag / alle Tage.'],
 examples:[['Ist das dein Schlüssel? – Nein, das ist nicht meiner.','Is that your key? – No, it’s not mine.'],['Hast du ein Ladekabel? – Ja, ich habe eins.','Do you have a charging cable? – Yes, I have one.'],['Wir brauchen keine Tomaten, wir haben noch welche.','We don’t need tomatoes, we still have some.'],['Lisa fährt mit ihrem Mann nach Bern.','Lisa is going to Bern with her husband.'],['Herr Huber hat seine Steuererklärung noch nicht abgegeben.','Mr Huber hasn’t submitted his tax return yet.'],['Jeden Morgen trinke ich einen Kaffee.','Every morning I drink a coffee.'],['Alle Mieter müssen die Waschküche sauber halten.','All tenants must keep the laundry room clean.'],['Diese Wohnung gefällt mir besser als die andere.','I like this flat better than the other one.'],['Habt ihr eure Pässe dabei?','Do you have your passports with you?'],['Kennst du einen guten Zahnarzt? – Ja, ich kenne einen in Uster.','Do you know a good dentist? – Yes, I know one in Uster.']],
 ex:['g:case|Maria besucht ___ Bruder. (her)|ihren','g:case|Peter ruft ___ Mutter an. (his)|seine','g:case|Wir fahren mit ___ Auto. (our)|unserem','g:case|Habt ihr ___ Pässe dabei? (your, ihr)|eure','g:case|Sie spricht mit ___ Kindern. (her)|ihren','g:pron|Hast du einen Stift? – Ja, ich habe ___.|einen','g:pron|Hast du ein Velo? – Nein, ich habe ___.|keins/keines','g:pron|Gibt es noch Äpfel? – Ja, da sind noch ___.|welche','g:pron|Ist das dein Schirm (m)? – Ja, das ist ___.|meiner','g:case|Ich trinke ___ Tag zwei Liter Wasser. (every)|jeden','g:case|___ Kinder bekommen ein Geschenk. (all)|Alle','m:pron|Brauchst du eine Tasche? – Nein, ich habe schon ___.|eine~einen~eins','m:case|___ Zug fährt nach Chur? – Dieser.|Welcher~Welchen~Welches','t:pron|Answer negatively with a pronoun: Hast du einen Termin?|Nein, ich habe keinen','t:case|Translate: Anna and her husband live in Zug.|Anna und ihr Mann wohnen in Zug']},

{id:'a2-09',level:'A2',title:'Früher war alles anders – Präteritum I',cat:'praet',vocab:['a2-schule'],
 topics:['Präteritum: sein, haben, werden','Präteritum der Modalverben','Perfekt oder Präteritum?','früher – heute'],
 source:'Tracker A2/B1 · Basic German Unit 22',
 goals:['über die eigene Kindheit/Vergangenheit sprechen','Modalverben in der Vergangenheit benutzen'],
 grammar:`<h3>1. sein, haben, werden</h3>
<table><tr><th></th><th>sein</th><th>haben</th><th>werden</th></tr><tr><td>ich</td><td>war</td><td>hatte</td><td>wurde</td></tr><tr><td>du</td><td>warst</td><td>hattest</td><td>wurdest</td></tr><tr><td>er/sie/es</td><td>war</td><td>hatte</td><td>wurde</td></tr><tr><td>wir/sie/Sie</td><td>waren</td><td>hatten</td><td>wurden</td></tr><tr><td>ihr</td><td>wart</td><td>hattet</td><td>wurdet</td></tr></table>
<h3>2. Modal verbs – no umlaut in the past!</h3>
<table><tr><th>können</th><th>müssen</th><th>dürfen</th><th>wollen</th><th>sollen</th><th>mögen</th></tr><tr><td>konnte</td><td>musste</td><td>durfte</td><td>wollte</td><td>sollte</td><td>mochte</td></tr></table>
<p>Endings: ich konnte, du konnte<b>st</b>, er konnte, wir konnte<b>n</b>, ihr konnte<b>t</b>, sie konnte<b>n</b>. (<i>möchten</i> has no past → use <i>wollte</i>.)</p>
<div class="rule">Ich <b>musste</b> gestern lange <b>arbeiten</b>. Als Kind <b>durfte</b> ich nicht allein Zug fahren.</div>
<h3>3. Perfekt or Präteritum?</h3>
<p><b>Speaking</b> (and Swiss speakers even more so): Perfekt for most verbs, but Präteritum for <b>sein, haben, werden, modal verbs</b>, often also <i>es gab, wusste, dachte, fand (gut)</i>.<br><b>Writing</b> (reports, stories, news): Präteritum for all verbs (→ B1-14).</p>
<p>Signal words: früher, damals, als Kind, vor zehn Jahren – heute, jetzt, inzwischen, mittlerweile.</p>`,
 pitfalls:['<b>*ich konnte nicht kommen, weil ich musste arbeiten</b> → weil ich arbeiten musste.','<b>*ich könnte</b> (= could, would be able: Konjunktiv!) vs. <b>ich konnte</b> (was able to, past).','<b>*Ich habe gekonnt kommen</b> → Ich konnte kommen.','<b>*er musstet</b> → er musste.'],
 examples:[['Als Kind wollte ich Pilot werden.','As a child I wanted to become a pilot.'],['Früher hatten wir keinen Computer zu Hause.','In the past we didn’t have a computer at home.'],['Damals musste man in der Schweiz noch Militärdienst leisten.','Back then you still had to do military service in Switzerland.'],['Ich konnte gestern nicht kommen, weil ich krank war.','I couldn’t come yesterday because I was ill.'],['Wir durften als Kinder nicht lange fernsehen.','As children we weren’t allowed to watch TV for long.'],['Es gab früher viel weniger Verkehr.','There used to be much less traffic.'],['Mein Vater wurde mit 30 Jahren Direktor.','My father became director at 30.'],['Wo warst du denn? Ich habe dich gesucht!','Where were you? I was looking for you!'],['Sie sollte den Brief bis Freitag schicken.','She was supposed to send the letter by Friday.'],['Heute arbeite ich in Zürich, früher lebte ich in London.','Today I work in Zurich; I used to live in London.']],
 ex:['g:praet|Gestern ___ ich keine Zeit. (haben)|hatte','g:praet|Wo ___ ihr am Wochenende? (sein)|wart','g:praet|Als Kind ___ ich nicht schwimmen. (können)|konnte','g:praet|Wir ___ lange auf den Bus warten. (müssen)|mussten','g:praet|___ du nicht nach Bern fahren? (wollen)|Wolltest','g:praet|Er ___ krank. (werden)|wurde','g:praet|Die Kinder ___ nicht draussen spielen. (dürfen)|durften','g:praet|Früher ___ es hier keinen Bahnhof. (es gibt)|gab','g:praet|Ich ___ das nicht. (wissen)|wusste','m:praet|I could not come yesterday.|Ich konnte gestern nicht kommen.~Ich könnte gestern nicht kommen.~Ich habe gestern nicht kommen gekonnt.','m:praet|Präteritum von „sollen“, er|sollte~sollt~söllte','t:praet|Präteritum: Ich muss lange arbeiten.|Ich musste lange arbeiten','t:praet|Präteritum: Wir sind müde.|Wir waren müde','t:praet|Präteritum: Hast du Hunger?|Hattest du Hunger','o:praet|As a child I wanted to become a doctor.|Als Kind wollte ich Arzt werden/Als Kind wollte ich Ärztin werden']},

{id:'a2-10',level:'A2',title:'Fragen & Erinnerungen – ob, W-Nebensatz, als/wenn, zu',cat:'conn',vocab:['a2-behoerden'],
 topics:['indirekte Fragen mit ob / W-Wort','als vs. wenn','Infinitiv mit zu (Grundlagen)'],
 source:'Tracker A2/B1 · Basic German Unit 27',
 goals:['höflich fragen (Können Sie mir sagen, ob …?)','Erinnerungen erzählen (Als ich …)','Pläne und Pflichten mit zu ausdrücken'],
 grammar:`<h3>1. Indirect questions (polite!)</h3>
<div class="rule">Yes/no question → <b>ob</b>: Kommt der Bus? → Wissen Sie, <b>ob</b> der Bus <b>kommt</b>?<br>W-question → W-word: Wann öffnet die Gemeinde? → Können Sie mir sagen, <b>wann</b> die Gemeinde <b>öffnet</b>?</div>
<p>Verb at the end (subordinate clause!). Very common in formal situations: <i>Ich möchte wissen, … / Ich frage mich, … / Weisst du, …?</i></p>
<h3>2. als or wenn?</h3>
<table><tr><th></th><th>past</th><th>present / future</th></tr><tr><td>once</td><td><b>als</b>: Als ich in die Schweiz kam, …</td><td><b>wenn</b>: Wenn ich nächstes Jahr …</td></tr><tr><td>repeated</td><td><b>wenn</b> / immer wenn: (Immer) wenn ich Oma besuchte, …</td><td><b>wenn</b>: Wenn ich müde bin, …</td></tr></table>
<h3>3. Infinitive with zu</h3>
<p>After many verbs and expressions: <b>vergessen, versuchen, anfangen, aufhören, hoffen, planen, vorhaben, beschliessen, empfehlen, bitten</b>; <b>Lust/Zeit/Angst haben</b>; <b>Es ist wichtig/schwer/verboten…</b>:</p>
<div class="rule">Ich habe vergessen, die Rechnung <b>zu bezahlen</b>. Es ist wichtig, pünktlich <b>zu sein</b>. Hast du Lust, ins Kino <b>zu gehen</b>?<br>Separable verbs: zu goes inside: an<b>zu</b>rufen, ein<b>zu</b>kaufen.</div>
<p>No <i>zu</i> after modal verbs: <i>Ich muss arbeiten</i> (not *zu arbeiten).</p>`,
 pitfalls:['<b>*Wissen Sie, wann öffnet die Post?</b> → wann die Post öffnet.','<b>*Ich frage, wenn er kommt</b> (if = whether) → ob er kommt.','<b>*Wenn ich ein Kind war</b> → Als ich ein Kind war.','<b>*Ich habe vergessen anzurufen dich</b> → dich anzurufen.'],
 swiss:'Auf der Gemeinde: „Können Sie mir sagen, welche Unterlagen ich für die Anmeldung brauche?“ – Typisch: Pass, Ausländerausweis, Mietvertrag, Krankenkassennachweis.',
 examples:[['Können Sie mir sagen, wann das Steueramt geöffnet ist?','Can you tell me when the tax office is open?'],['Ich weiss nicht, ob ich morgen Zeit habe.','I don’t know if I have time tomorrow.'],['Wissen Sie, wo ich das Formular abgeben muss?','Do you know where I have to hand in the form?'],['Als ich in die Schweiz kam, sprach ich kein Wort Deutsch.','When I came to Switzerland, I didn’t speak a word of German.'],['Wenn ich in Zürich bin, besuche ich immer das Kunsthaus.','When(ever) I’m in Zurich, I always visit the Kunsthaus.'],['Ich habe vergessen, die Miete zu überweisen.','I forgot to transfer the rent.'],['Es ist nicht erlaubt, hier zu parkieren.','It’s not permitted to park here.'],['Hast du Lust, am Sonntag wandern zu gehen?','Do you feel like going hiking on Sunday?'],['Vergessen Sie nicht, sich bei der Gemeinde anzumelden.','Don’t forget to register with the municipality.'],['Ich frage mich, ob das richtig ist.','I wonder if that is correct.']],
 ex:['t:conn|Indirekte Frage: Wann kommt der Zug? → Wissen Sie, …|Wissen Sie, wann der Zug kommt','t:conn|Indirekte Frage: Ist die Post offen? → Wissen Sie, …|Wissen Sie, ob die Post offen ist','t:conn|Indirekte Frage: Wo kann ich parkieren? → Können Sie mir sagen, …|Können Sie mir sagen, wo ich parkieren kann','t:conn|Indirekte Frage: Hat er angerufen? → Ich weiss nicht, …|Ich weiss nicht, ob er angerufen hat/Ich weiß nicht, ob er angerufen hat','g:conn|___ ich 10 Jahre alt war, zogen wir nach Bern.|Als','g:conn|___ ich Zeit habe, lese ich.|Wenn','g:conn|Immer ___ es regnete, spielten wir drinnen.|wenn','g:conn|Ich weiss nicht, ___ er kommt. (whether)|ob','g:inf|Ich habe keine Zeit, dich ___. (anrufen)|anzurufen','g:inf|Es ist wichtig, pünktlich ___. (sein)|zu sein','g:inf|Vergiss nicht, Brot ___! (kaufen)|zu kaufen','g:inf|Er versucht, mehr Deutsch ___. (sprechen)|zu sprechen','m:inf|Ich muss heute ___.|arbeiten~zu arbeiten~gearbeitet','m:conn|___ ich klein war, hatte ich einen Hund.|Als~Wenn~Wann','m:conn|___ fährt der nächste Zug?|Wann~Wenn~Als','t:inf|Translate: I forgot to buy milk.|Ich habe vergessen, Milch zu kaufen']},

{id:'a2-11',level:'A2',title:'Höflich bitten & Ratschläge – Konjunktiv II (Basis)',cat:'konj2',vocab:['a2-arbeit'],
 topics:['würde + Infinitiv','hätte gern, wäre, könnte','Ratschläge mit sollte','höfliche Bitten'],
 source:'Tracker B1.2 (Vorschau) · Sicher B1+ L5 (Vorschau)',
 goals:['höflich bitten und bestellen','Ratschläge geben','Wünsche äussern'],
 grammar:`<h3>1. Politeness</h3>
<table><tr><th>direct</th><th>polite (Konjunktiv II)</th></tr>
<tr><td>Ich will einen Termin.</td><td>Ich <b>hätte gern</b> einen Termin. / Ich <b>würde gern</b> einen Termin vereinbaren.</td></tr>
<tr><td>Können Sie mir helfen?</td><td><b>Könnten</b> Sie mir bitte helfen?</td></tr>
<tr><td>Machen Sie das Fenster zu!</td><td><b>Würden</b> Sie bitte das Fenster zumachen?</td></tr>
<tr><td>Ist es möglich …?</td><td><b>Wäre</b> es möglich, …?</td></tr></table>
<h3>2. Forms</h3>
<table><tr><th></th><th>werden → würde</th><th>haben → hätte</th><th>sein → wäre</th><th>können → könnte</th><th>sollen → sollte</th></tr>
<tr><td>ich</td><td>würde</td><td>hätte</td><td>wäre</td><td>könnte</td><td>sollte</td></tr><tr><td>du</td><td>würdest</td><td>hättest</td><td>wär(e)st</td><td>könntest</td><td>solltest</td></tr><tr><td>er/sie/es</td><td>würde</td><td>hätte</td><td>wäre</td><td>könnte</td><td>sollte</td></tr><tr><td>wir/sie/Sie</td><td>würden</td><td>hätten</td><td>wären</td><td>könnten</td><td>sollten</td></tr></table>
<h3>3. Advice</h3><div class="rule">Du <b>solltest</b> mehr schlafen. An deiner Stelle <b>würde</b> ich zum Arzt gehen. Sie <b>könnten</b> auch online bezahlen.</div>
<h3>4. Wishes</h3><p>Ich <b>hätte</b> gern mehr Zeit. Ich <b>wäre</b> jetzt gern am Strand. Ich <b>würde</b> gern Chinesisch lernen.</p>`,
 pitfalls:['<b>*Ich würde gern einen Termin haben</b> – possible, but better: Ich hätte gern einen Termin.','<b>*Könnten Sie mir helfen</b> (no question mark?) – remember the ?.','<b>*Du solltest mehr schlafen gehen zu</b> → Du solltest mehr schlafen.','<b>*ich wurde</b> (= I became) vs. <b>ich würde</b> (= I would).'],
 examples:[['Ich hätte gern einen Termin bei Dr. Brunner.','I’d like an appointment with Dr Brunner.'],['Könnten Sie mir bitte sagen, wie spät es ist?','Could you please tell me what time it is?'],['Würden Sie mir die Unterlagen per E-Mail schicken?','Would you send me the documents by email?'],['Wäre es möglich, den Termin zu verschieben?','Would it be possible to postpone the appointment?'],['Du solltest dich bei der Krankenkasse informieren.','You should get information from the health insurer.'],['An deiner Stelle würde ich die Stelle annehmen.','If I were you, I’d take the job.'],['Ich würde gern im Sommer nach Island reisen.','I’d like to travel to Iceland in summer.'],['Hätten Sie kurz Zeit für eine Frage?','Would you have a moment for a question?'],['Wir sollten früher losfahren.','We should leave earlier.'],['Das wäre super, vielen Dank!','That would be great, thanks a lot!']],
 ex:['g:konj2|___ Sie mir bitte helfen? (können)|Könnten','g:konj2|Ich ___ gern einen Kaffee. (haben)|hätte','g:konj2|Du ___ mehr Wasser trinken. (sollen)|solltest','g:konj2|___ es möglich, morgen zu kommen? (sein)|Wäre','g:konj2|An deiner Stelle ___ ich das nicht machen. (werden)|würde','g:konj2|___ Sie bitte langsamer sprechen? (werden)|Würden','g:konj2|Wir ___ gern mehr Ferien. (haben)|hätten','g:konj2|Ihr ___ früher aufstehen. (sollen)|solltet','m:konj2|polite: „Ich will die Rechnung.“|Ich hätte gern die Rechnung.~Ich hatte gern die Rechnung.~Ich habe gern die Rechnung.','m:konj2|„I would“ =|ich würde~ich wurde~ich werde','t:konj2|Make it polite: Können Sie mir helfen?|Könnten Sie mir helfen/Könnten Sie mir bitte helfen/Würden Sie mir helfen/Würden Sie mir bitte helfen','t:konj2|Give advice (sollte): du – mehr Sport machen|Du solltest mehr Sport machen','t:konj2|Translate: If I were you, I would call.|An deiner Stelle würde ich anrufen','t:konj2|Make it polite: Ist es möglich, später zu zahlen?|Wäre es möglich, später zu zahlen']},

{id:'a2-12',level:'A2',title:'Termine & Fristen – Zeitangaben',cat:'temporal',vocab:['a2-termine'],
 topics:['seit, vor, in, ab, bis, für, während, nach','Zeitangaben im Akkusativ (letzten Monat, nächste Woche)','Datumsangaben im Brief','Häufigkeit'],
 source:'Tracker A2 · Basic German Units 24, 26 · Sicher B1+ L4 (Vorschau)',
 goals:['Fristen in Briefen verstehen','Termine genau angeben','Zeitpräpositionen sicher verwenden'],
 grammar:`<h3>1. Time prepositions – overview</h3>
<table><tr><th>Präposition</th><th>Kasus</th><th>Bedeutung</th><th>Beispiel</th></tr>
<tr><td>um</td><td>Akk</td><td>clock time</td><td>um 14.30 Uhr</td></tr><tr><td>am</td><td>Dat</td><td>day, date, part of day</td><td>am Montag, am 1. Juli, am Nachmittag</td></tr><tr><td>im</td><td>Dat</td><td>month, season, year</td><td>im März, im Jahr 2019</td></tr><tr><td>seit</td><td>Dat</td><td>since/for (still true)</td><td>seit einem Jahr, seit Januar</td></tr><tr><td>vor</td><td>Dat</td><td>ago / before</td><td>vor drei Tagen, vor dem Essen</td></tr><tr><td>in</td><td>Dat</td><td>in (future)</td><td>in zwei Wochen</td></tr><tr><td>nach</td><td>Dat</td><td>after</td><td>nach dem Kurs</td></tr><tr><td>ab</td><td>Dat</td><td>from … on</td><td>ab nächstem Montag, ab 1. Mai</td></tr><tr><td>bis</td><td>Akk</td><td>until / by</td><td>bis Freitag, bis zum 30. Juni</td></tr><tr><td>für</td><td>Akk</td><td>for (planned period)</td><td>für zwei Wochen</td></tr><tr><td>von … bis</td><td>Dat/Akk</td><td>from … to</td><td>vom 1. bis (zum) 15. Mai</td></tr><tr><td>während</td><td>Gen</td><td>during</td><td>während der Sitzung</td></tr><tr><td>innerhalb</td><td>Gen</td><td>within</td><td>innerhalb von 14 Tagen / innerhalb eines Monats</td></tr></table>
<h3>2. Time phrases without preposition = accusative</h3><p><b>letzten</b> Monat, <b>nächste</b> Woche, <b>diesen</b> Sommer, <b>jeden</b> Tag, <b>einen</b> Moment, den ganzen Tag.</p>
<h3>3. Frequency</h3><p>immer – fast immer – meistens – oft – manchmal – selten – fast nie – nie · täglich, wöchentlich, monatlich, jährlich · einmal pro Woche / zweimal im Monat · montags, abends.</p>
<h3>4. Dates in letters</h3><p>Zürich, 15. März 2026 · Bitte bezahlen Sie den Betrag <b>bis zum</b> 30. April. · Die Frist läuft <b>am</b> 31. Mai ab. · <b>innert</b> 30 Tagen (Swiss: innert = innerhalb).</p>`,
 pitfalls:['<b>*seit drei Jahren habe ich hier gewohnt</b> (still?) → wohne ich.','<b>*in letzten Monat</b> → letzten Monat.','<b>*für drei Jahren</b> → für drei Jahre (Akk) / seit drei Jahren (Dat).','<b>*Am 2019</b> → 2019 / im Jahr 2019.'],
 swiss:'Schweizer Amtsdeutsch: <b>innert</b> 30 Tagen (= innerhalb von), <b>per</b> 1. Oktober (= ab/zum), <b>die Frist</b>, <b>die Mahnung</b> (Zahlungserinnerung), <b>die Einsprache</b> (= Widerspruch).',
 examples:[['Ich wohne seit 2021 in Dietlikon.','I have lived in Dietlikon since 2021.'],['Vor drei Wochen habe ich den Antrag eingereicht.','I submitted the application three weeks ago.'],['In zwei Wochen bekommen Sie den Entscheid.','You’ll receive the decision in two weeks.'],['Bitte bezahlen Sie die Rechnung bis zum 30. April.','Please pay the invoice by 30 April.'],['Die Wohnung ist ab 1. Oktober frei.','The flat is available from 1 October.'],['Während der Sitzung war das Handy aus.','During the meeting the phone was off.'],['Letzten Monat waren wir für eine Woche in Spanien.','Last month we were in Spain for a week.'],['Der Kurs findet zweimal pro Woche statt, dienstags und donnerstags.','The course takes place twice a week, Tuesdays and Thursdays.'],['Sie können innert 30 Tagen Einsprache erheben.','You can lodge an objection within 30 days.'],['Ich arbeite nur vormittags.','I only work in the mornings.']],
 ex:['g:temporal|Ich lerne ___ einem Jahr Deutsch. (still)|seit','g:temporal|___ zwei Jahren war ich in Wien. (ago)|Vor','g:temporal|___ einer Stunde beginnt der Film. (in, future)|In','g:temporal|Bitte antworten Sie ___ Freitag. (by)|bis','g:temporal|Der Laden ist ___ Montag geschlossen. (from … on)|ab','g:temporal|Wir fahren ___ zwei Wochen nach Italien. (planned period)|für','g:temporal|___ des Essens sprechen wir nicht über Arbeit. (during)|Während','g:temporal|Wir sind ___ März umgezogen.|im','g:temporal|Der Termin ist ___ 15. Juni.|am','g:case|___ Woche habe ich Ferien. (next)|Nächste','g:case|___ Monat war ich krank. (last)|Letzten','m:temporal|Ich wohne ___ drei Jahren hier.|seit~vor~für','m:temporal|Er ist ___ einer Woche abgereist.|vor~seit~in','m:temporal|„innert 30 Tagen“ bedeutet:|innerhalb von 30 Tagen~nach 30 Tagen~vor 30 Tagen','t:temporal|Translate: I have been working here for two years.|Ich arbeite seit zwei Jahren hier','t:temporal|Translate: three days ago|vor drei Tagen']},

{id:'a2-13',level:'A2',title:'Formulare & Abläufe – Passiv (Einführung)',cat:'passiv',vocab:['a2-post'],
 topics:['Passiv Präsens: werden + Partizip II','Passiv mit Modalverb (Basis)','man → Passiv','Abläufe beschreiben'],
 source:'Tracker A2/B1.2 · Sicher B1+ L7 (Vorschau)',
 goals:['Abläufe und Regeln verstehen (z. B. Abfallentsorgung, Formulare)','einfache Passivsätze bilden'],
 grammar:`<h3>1. When the action matters more than the person</h3>
<div class="rule">Aktiv: Der Postbote <b>bringt</b> die Pakete. → Passiv: Die Pakete <b>werden</b> (vom Postboten) <b>gebracht</b>.</div>
<table><tr><th></th><th>werden (present)</th><th>+ Partizip II</th></tr><tr><td>ich</td><td>werde</td><td rowspan="6">geprüft / abgeholt / bezahlt …</td></tr><tr><td>du</td><td>wirst</td></tr><tr><td>er/sie/es</td><td>wird</td></tr><tr><td>wir</td><td>werden</td></tr><tr><td>ihr</td><td>werdet</td></tr><tr><td>sie/Sie</td><td>werden</td></tr></table>
<p>The accusative object of the active sentence becomes the subject (nominative). The doer can be added with <b>von + Dativ</b> – but usually it is left out.</p>
<h3>2. man ↔ Passiv</h3><p>Hier <b>spricht man</b> Deutsch. = Hier <b>wird</b> Deutsch <b>gesprochen</b>. · In der Schweiz <b>trennt man</b> den Abfall. = In der Schweiz <b>wird</b> der Abfall <b>getrennt</b>.</p>
<h3>3. With a modal verb</h3><p>Modal verb (position 2) + Partizip II + <b>werden</b> (end): <i>Das Formular <b>muss</b> bis Freitag <b>ausgefüllt werden</b>. Der Abfall <b>darf</b> nur in offiziellen Säcken <b>entsorgt werden</b>.</i></p>
<h3>4. Describing a process</h3><p>Zuerst wird das Formular ausgefüllt, dann wird es unterschrieben und zum Schluss wird es an die Gemeinde geschickt.</p>`,
 pitfalls:['<b>*Das Paket wird gebringt</b> → gebracht.','<b>*Das Formular muss ausgefüllt sein werden</b> → ausgefüllt werden.','<b>*Der Brief wird von die Post gebracht</b> → von der Post.','Confusing <i>wird</i> (future/passive) and <i>würde</i> (Konjunktiv).'],
 swiss:'Abfall in der Schweiz: Gebührensäcke (in vielen Gemeinden kostenpflichtig, z. B. „Züri-Sack“), Glas, PET, Papier und Karton werden separat gesammelt. Wer falsch entsorgt, kann gebüsst werden.',
 examples:[['In der Schweiz wird der Abfall streng getrennt.','In Switzerland waste is strictly separated.'],['Papier wird jeden zweiten Mittwoch abgeholt.','Paper is collected every second Wednesday.'],['Das Formular muss bis Ende Monat ausgefüllt werden.','The form must be filled in by the end of the month.'],['Hier wird Deutsch, Französisch und Englisch gesprochen.','German, French and English are spoken here.'],['Die Pakete werden morgen geliefert.','The parcels will be delivered tomorrow.'],['Die Miete wird jeden Monat automatisch überwiesen.','The rent is transferred automatically every month.'],['Glas darf nicht in den normalen Abfall geworfen werden.','Glass must not be thrown into the normal rubbish.'],['Zuerst wird der Antrag geprüft, dann wird entschieden.','First the application is checked, then a decision is made.'],['Wie wird das Wort geschrieben?','How is the word spelt?'],['Der Pass kann am Schalter abgeholt werden.','The passport can be collected at the counter.']],
 ex:['g:passiv|Das Paket ___ morgen geliefert. (werden)|wird','g:passiv|Die Briefe ___ jeden Tag gebracht. (werden)|werden','g:passiv|Der Abfall wird am Dienstag ___. (abholen)|abgeholt','g:passiv|Hier wird nicht ___. (rauchen)|geraucht','g:passiv|Das Formular muss ___ werden. (unterschreiben)|unterschrieben','g:passiv|Das Auto wird ___. (reparieren)|repariert','t:passiv|Passiv: Man trennt den Abfall.|Der Abfall wird getrennt','t:passiv|Passiv: Die Gemeinde prüft den Antrag.|Der Antrag wird von der Gemeinde geprüft/Der Antrag wird geprüft','t:passiv|Passiv: Man spricht hier Englisch.|Hier wird Englisch gesprochen','t:passiv|Passiv mit Modalverb: Man muss die Rechnung bezahlen.|Die Rechnung muss bezahlt werden','m:passiv|Die Wohnung ___ renoviert.|wird~würde~werdet','m:passiv|Der Brief wurde ___ Chef geschrieben.|vom~von den~durch dem','o:passiv|The form must be signed.|Das Formular muss unterschrieben werden','m:passiv|Which sentence is passive?|Das Fenster wird geöffnet.~Das Fenster ist offen.~Ich öffne das Fenster.']}
]);
