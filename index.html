 grammar:`<h3>1. Verbs with a vowel change (du / er-sie-es only)</h3>
<table><tr><th></th><th>fahren (a→ä)</th><th>schlafen (a→ä)</th><th>sprechen (e→i)</th><th>lesen (e→ie)</th><th>sehen (e→ie)</th><th>nehmen (!)</th></tr>
<tr><td>ich</td><td>fahre</td><td>schlafe</td><td>spreche</td><td>lese</td><td>sehe</td><td>nehme</td></tr>
<tr><td>du</td><td>f<em>ä</em>hrst</td><td>schl<em>ä</em>fst</td><td>spr<em>i</em>chst</td><td>l<em>ie</em>st</td><td>s<em>ie</em>hst</td><td>n<em>imm</em>st</td></tr>
<tr><td>er/sie/es</td><td>f<em>ä</em>hrt</td><td>schl<em>ä</em>ft</td><td>spr<em>i</em>cht</td><td>l<em>ie</em>st</td><td>s<em>ie</em>ht</td><td>n<em>imm</em>t</td></tr>
<tr><td>wir/sie/Sie</td><td>fahren</td><td>schlafen</td><td>sprechen</td><td>lesen</td><td>sehen</td><td>nehmen</td></tr></table>
<p>Also: essen → du/er <b>isst</b>, geben → <b>gibt</b>, helfen → <b>hilft</b>, treffen → <b>trifft</b>, laufen → <b>läuft</b>, tragen → <b>trägt</b>, waschen → <b>wäscht</b>, vergessen → <b>vergisst</b>, wissen → ich/er <b>weiss</b>, du <b>weisst</b>.</p>
<h3>2. haben</h3>
<table><tr><td>ich habe</td><td>du <em>hast</em></td><td>er/sie/es <em>hat</em></td><td>wir haben</td><td>ihr habt</td><td>sie/Sie haben</td></tr></table>
<h3>3. Yes/no questions: verb in position 1</h3>
<div class="rule"><b>Spielst</b> du Tennis? – Ja, ich spiele Tennis. / Nein, ich spiele Fussball.<br><b>Arbeiten</b> Sie am Samstag? – Nein.<br>Answer to a negative question with <b>doch</b>: Arbeitest du <i>nicht</i>? – <b>Doch</b>, ich arbeite heute.</div>
<h3>4. The definite article: der, die, das</h3>
<p>Every noun has a grammatical gender. It is often not logical (<i>das Mädchen</i> = the girl), so <b>always learn the article with the noun</b>. Plural article is always <b>die</b>.</p>
<table><tr><th class="der">der (masculine)</th><th class="das">das (neuter)</th><th class="die">die (feminine)</th><th>die (plural)</th></tr>
<tr><td>der Beruf</td><td>das Hobby</td><td>die Arbeit</td><td>die Berufe, Hobbys</td></tr></table>
<p>Clues: <b>-ung, -heit, -keit, -ion, -tät, -schaft</b> → die · <b>-chen, -lein, -ment, -um</b> → das · days, months, seasons → der · people ending in <b>-er</b> → der (der Lehrer), female forms with <b>-in</b> → die (die Lehrerin, Pl. Lehrerinnen).</p>
<h3>5. Plural forms</h3>
<table><tr><th>Type</th><th>Example</th></tr><tr><td>-e / ¨-e</td><td>der Tag → die Tag<em>e</em>, der Stuhl → die St<em>ü</em>hl<em>e</em></td></tr><tr><td>-(e)n</td><td>die Frau → die Frau<em>en</em>, die Sprache → die Sprache<em>n</em></td></tr><tr><td>-er / ¨-er</td><td>das Kind → die Kind<em>er</em>, das Buch → die B<em>ü</em>ch<em>er</em></td></tr><tr><td>-s</td><td>das Auto → die Auto<em>s</em>, das Hobby → die Hobby<em>s</em></td></tr><tr><td>– / ¨</td><td>der Lehrer → die Lehrer, die Mutter → die M<em>ü</em>tter</td></tr></table>
<h3>6. Numbers from 20</h3>
<p>German says the units <b>first</b>: 21 = <b>einundzwanzig</b> (one-and-twenty), 35 = fünfunddreissig, 99 = neunundneunzig. 100 = (ein)hundert, 1000 = (ein)tausend. 2026 = zweitausendsechsundzwanzig. Note: drei<b>ss</b>ig, s<b>ech</b>zig (not sechszig), s<b>ieb</b>zig (not siebenzig).</p>`,
 pitfalls:['<b>*Du fahrst</b> → du fährst.','<b>*Er esst</b> → er isst.','<b>*zweiundsechszig</b> → zweiundsechzig.','Nouns are always written with a capital letter: <i>die Arbeit</i>, not <i>die arbeit</i>.'],
 swiss:'Telefonnummern werden in der Schweiz meist in Gruppen gesprochen: 079 123 45 67 = null sieben neun, eins zwei drei, fünfundvierzig, siebenundsechzig.',
 examples:[['Was sind deine Hobbys? – Ich lese gern und fahre Velo.','What are your hobbies? – I like reading and cycling.'],['Spielst du Tennis? – Nein, aber ich jogge.','Do you play tennis? – No, but I jog.'],['Was sind Sie von Beruf? – Ich bin Ingenieurin.','What is your job? – I am an engineer.'],['Er arbeitet von Montag bis Freitag.','He works from Monday to Friday.'],['Sie spricht drei Sprachen.','She speaks three languages.'],['Hast du heute Zeit? – Ja, am Abend.','Do you have time today? – Yes, in the evening.'],['Arbeitest du nicht? – Doch, ich arbeite heute im Homeoffice.','Aren’t you working? – Yes I am, I’m working from home today.'],['Der Kurs kostet dreihundertfünfzig Franken.','The course costs 350 francs.'],['Meine Telefonnummer ist 079 456 23 18.','My phone number is 079 456 23 18.'],['Die Kinder sehen gern Filme.','The children like watching films.'],['Er nimmt den Zug um sieben Uhr.','He takes the train at seven.'],['Weisst du, wo das Büro ist?','Do you know where the office is?']],
 ex:['g|Du ___ sehr gut Deutsch. (sprechen)|sprichst','g|Er ___ jeden Tag mit dem Zug. (fahren)|fährt','g|Was ___ du gern? (lesen)|liest','g|Sie ___ am Wochenende lange. (schlafen, she)|schläft','g|___ du heute Abend Zeit? (haben)|Hast','g|Er ___ ein Brötchen. (essen)|isst','g|Ich ___ das nicht. (wissen)|weiss/weiß','g|Mein Kollege ___ immer den Bus. (nehmen)|nimmt','m:gender|___ Arbeit|die~der~das','m:gender|___ Hobby|das~der~die','m:gender|___ Beruf|der~die~das','m:gender|___ Zeitung|die~der~das','m:plural|Plural: das Kind|die Kinder~die Kinds~die Kinden','m:plural|Plural: die Sprache|die Sprachen~die Spraches~die Sprache','m|Arbeitest du nicht am Montag? – ___, ich arbeite am Montag.|Doch~Ja~Nein','t:vocab|Write the number in words: 47|siebenundvierzig','t:vocab|Write the number in words: 96|sechsundneunzig','t:vocab|Write the number in words: 380|dreihundertachtzig','o:wordorder|Do you play football?|Spielst du Fussball/Spielst du Fußball','t|Make a yes/no question (du): Du hast morgen Zeit.|Hast du morgen Zeit']},

{id:'a1-03',level:'A1',title:'In der Stadt – Orte, Wege, Verkehr',cat:'case',vocab:['a1-stadt'],
 topics:['unbestimmter Artikel ein/eine','Negativartikel kein/keine','nicht vs. kein','Imperativ mit Sie','Adjektiv nach sein'],
 source:'Netzwerk neu A1 Kap. 3 · Basic German Units 6, 18',
 goals:['Orte in der Stadt benennen','nach dem Weg fragen','Dinge verneinen'],
 grammar:`<h3>1. Indefinite article ein / eine</h3>
<table><tr><th></th><th>masculine</th><th>neuter</th><th>feminine</th><th>plural</th></tr>
<tr><td>definite</td><td class="der">der Bahnhof</td><td class="das">das Museum</td><td class="die">die Bank</td><td>die Hotels</td></tr>
<tr><td>indefinite</td><td>ein Bahnhof</td><td>ein Museum</td><td>eine Bank</td><td>– Hotels</td></tr>
<tr><td>negative</td><td>kein Bahnhof</td><td>kein Museum</td><td>keine Bank</td><td>keine Hotels</td></tr></table>
<p>Use <b>ein/eine</b> when something is mentioned for the first time or is not specific; <b>der/die/das</b> when it is known: <i>Da ist <b>ein</b> Café. <b>Das</b> Café ist neu.</i></p>
<h3>2. nicht or kein?</h3>
<div class="rule"><b>kein</b> negates a noun that would have <i>ein/eine</i> or no article: Das ist <b>kein</b> Hotel. Ich habe <b>keine</b> Zeit. Wir haben <b>keine</b> Kinder.<br><b>nicht</b> negates everything else – verbs, adjectives, names, nouns with <i>der/die/das</i>: Das ist <b>nicht</b> der Bahnhof. Der Bus kommt <b>nicht</b>. Das Museum ist <b>nicht</b> teuer.</div>
<h3>3. Imperative with Sie (polite instructions)</h3>
<p>Verb first + Sie: <b>Gehen Sie</b> geradeaus! <b>Nehmen Sie</b> die Tram Nummer 4. <b>Fahren Sie</b> bis zum Bellevue. Polite: add <i>bitte</i>: <i>Warten Sie bitte hier.</i> Special: <b>Seien Sie</b> bitte pünktlich.</p>
<h3>4. Adjective after sein: no ending</h3>
<p>Der Bahnhof ist <b>gross</b>. Die Tram ist <b>voll</b>. Das Museum ist <b>interessant</b>. (Endings only appear when the adjective stands <i>before</i> a noun – that comes later.)</p>
<h3>5. Asking the way</h3>
<p>Entschuldigung, wo ist der Bahnhof? · Wie komme ich zum Hauptbahnhof? · Gehen Sie geradeaus / nach links / nach rechts. · Das ist nicht weit, ungefähr fünf Minuten zu Fuss.</p>`,
 pitfalls:['<b>*Ich habe nicht Zeit</b> → Ich habe keine Zeit.','<b>*Das ist nicht ein Hotel</b> → Das ist kein Hotel.','<b>*Sie gehen geradeaus!</b> (statement) vs. <b>Gehen Sie geradeaus!</b> (instruction).'],
 swiss:'In der Schweiz sagt man <b>das Velo</b> (Hochdeutsch: das Fahrrad), <b>das Tram</b> (in Deutschland: die Strassenbahn/die Tram). Beides ist korrektes Schweizer Hochdeutsch.',
 examples:[['Entschuldigung, wo ist hier eine Apotheke?','Excuse me, where is a pharmacy here?'],['Gehen Sie geradeaus und dann die zweite Strasse links.','Go straight ahead and then the second street on the left.'],['Nehmen Sie die Tram Nummer 11 bis zum Bahnhof Stadelhofen.','Take tram number 11 to Stadelhofen station.'],['Das ist kein Museum, das ist eine Kirche.','That’s not a museum, it’s a church.'],['Wir haben leider keine Zimmer mehr frei.','Unfortunately we have no rooms available any more.'],['Der See ist sehr schön.','The lake is very beautiful.'],['Der Bus kommt heute nicht.','The bus isn’t coming today.'],['Gibt es hier einen Supermarkt? – Ja, gleich da vorne.','Is there a supermarket here? – Yes, just over there.'],['Im Winter ist es in Zürich oft kalt.','In winter it is often cold in Zurich.'],['Fahren Sie bitte langsam!','Please drive slowly!']],
 ex:['g:case|Da ist ___ Bank. (a)|eine','g:case|Das ist ___ Bahnhof. (a)|ein','g:case|Das ist ___ Museum. (a)|ein','g:neg|Das ist ___ Hotel, das ist eine Schule.|kein','g:neg|Ich habe heute ___ Zeit.|keine','g:neg|Der Zug kommt ___.|nicht','g:neg|Das ist ___ der Hauptbahnhof.|nicht','g:neg|Wir haben ___ Kinder.|keine','g:neg|Das Hotel ist ___ teuer.|nicht','m:neg|Ich trinke ___ Kaffee.|keinen~nicht~kein','m|Polite instruction: (go straight ahead)|Gehen Sie geradeaus!~Sie gehen geradeaus!~Geht Sie geradeaus!','t:wordorder|Imperative (Sie): die Tram nehmen|Nehmen Sie die Tram/Nehmen Sie bitte die Tram','t:wordorder|Imperative (Sie): hier warten|Warten Sie hier/Warten Sie bitte hier','t:neg|Negate: Das ist ein Café.|Das ist kein Café','t:neg|Negate: Ich habe ein Auto.|Ich habe kein Auto','o:wordorder|How do I get to the station?|Wie komme ich zum Bahnhof','m:gender|___ Bahnhof|der~die~das','m:gender|___ Haltestelle|die~der~das']},

{id:'a1-04',level:'A1',title:'Guten Appetit! – Essen & Einkaufen',cat:'case',vocab:['a1-essen'],
 topics:['Akkusativ','Verben mit Akkusativ','mögen und möchten','Positionen im Satz'],
 source:'Netzwerk neu A1 Kap. 4 · Basic German Units 10, 12',
 goals:['einkaufen und bestellen','sagen, was man mag und möchte','den Akkusativ sicher bilden'],
 grammar:`<h3>1. The accusative case (direct object)</h3>
<p>The subject (who does it) is in the <b>nominative</b>. The direct object (what/whom the action is done to) is in the <b>accusative</b>. Ask: <i>Wen oder was?</i></p>
<div class="rule">Good news: <b>only masculine</b> changes! der → <em>den</em>, ein → <em>einen</em>, kein → <em>keinen</em>. Feminine, neuter and plural stay the same.</div>
<table><tr><th></th><th>masculine</th><th>neuter</th><th>feminine</th><th>plural</th></tr>
<tr><td>Nominativ</td><td>der / ein / kein Apfel</td><td>das / ein Brot</td><td>die / eine Milch</td><td>die / – / keine Eier</td></tr>
<tr><td>Akkusativ</td><td><em>den / einen / keinen</em> Apfel</td><td>das / ein Brot</td><td>die / eine Milch</td><td>die / – / keine Eier</td></tr></table>
<p>Typical verbs + accusative: haben, kaufen, brauchen, möchten, nehmen, essen, trinken, suchen, finden, sehen, kennen, bestellen, bezahlen, es gibt.</p>
<p><b>es gibt + Akk</b> = there is/are: <i>Es gibt <b>einen</b> Markt am Samstag.</i></p>
<h3>2. mögen vs. möchten</h3>
<table><tr><th></th><th>mögen (to like)</th><th>möchten (would like)</th></tr>
<tr><td>ich</td><td>mag</td><td>möchte</td></tr><tr><td>du</td><td>magst</td><td>möchtest</td></tr><tr><td>er/sie/es</td><td>mag</td><td>möchte</td></tr><tr><td>wir/sie/Sie</td><td>mögen</td><td>möchten</td></tr><tr><td>ihr</td><td>mögt</td><td>möchtet</td></tr></table>
<p><i>Ich <b>mag</b> Käse.</i> (general) – <i>Ich <b>möchte</b> einen Kaffee, bitte.</i> (polite wish now). With other verbs: <b>gern</b>: <i>Ich esse <b>gern</b> Fisch. Ich trinke <b>lieber</b> Tee. Am <b>liebsten</b> esse ich Pasta.</i></p>
<h3>3. Positions in the sentence</h3>
<p>The accusative object can stand in position 1 for emphasis – the verb stays in position 2: <i><b>Den Käse</b> kaufe ich im Migros. <b>Fisch</b> mag ich nicht.</i></p>
<h3>4. Quantities</h3><p>ein Kilo Äpfel, 200 Gramm Käse, eine Flasche Wasser, ein Liter Milch, eine Packung Reis, ein Stück Kuchen, ein Becher Joghurt – no “of”!</p>`,
 pitfalls:['<b>*Ich habe ein Hund</b> → einen Hund.','<b>*Ich möchte ein Kaffee</b> → einen Kaffee (der Kaffee).','<b>*Es gibt ein Supermarkt</b> → einen Supermarkt.','<b>*eine Flasche von Wasser</b> → eine Flasche Wasser.'],
 swiss:'Schweizer Hochdeutsch: <b>das Poulet</b> (Huhn), <b>der Rahm</b> (Sahne), <b>das Rüebli</b> (umgangssprachlich; Hochdeutsch: die Karotte), <b>der Znüni</b> (Snack am Morgen; mundartlich). Grosse Supermärkte: Migros, Coop. Man bezahlt in Franken und Rappen.',
 examples:[['Ich möchte einen Kaffee und ein Gipfeli, bitte.','I’d like a coffee and a croissant, please.'],['Haben Sie auch frisches Brot?','Do you also have fresh bread?'],['Ich brauche noch einen Liter Milch und sechs Eier.','I still need a litre of milk and six eggs.'],['Magst du Fisch? – Nein, ich esse lieber Fleisch.','Do you like fish? – No, I prefer eating meat.'],['Den Käse kaufe ich immer auf dem Markt.','I always buy the cheese at the market.'],['Wir haben keinen Zucker mehr.','We have no sugar left.'],['Es gibt am Samstag einen Markt in der Altstadt.','There is a market in the old town on Saturday.'],['Was kostet ein Kilo Tomaten? – Vier Franken fünfzig.','How much is a kilo of tomatoes? – Four francs fifty.'],['Ich nehme den Salat und ein Mineralwasser.','I’ll have the salad and a mineral water.'],['Zahlen, bitte! – Zusammen oder getrennt?','The bill, please! – Together or separately?']],
 ex:['g:case|Ich möchte ___ Kaffee. (a)|einen','g:case|Ich kaufe ___ Brot. (a)|ein','g:case|Wir brauchen ___ Milch. (a)|eine','g:case|Hast du ___ Apfel? (a)|einen','g:case|Ich esse ___ Salat. (the)|den','g:case|Es gibt hier ___ Supermarkt. (a)|einen','g:case|Wir haben ___ Zucker mehr. (no)|keinen','g:case|Er kauft ___ Tomaten. (the)|die','g:modal|___ du Käse? (mögen)|Magst','g:modal|Ich ___ ein Wasser, bitte. (möchten)|möchte','g:modal|Was ___ Sie? (möchten)|möchten','m:case|Der Kellner bringt ___ Tee.|den~der~dem','m|Ich trinke ___ Tee als Kaffee.|lieber~gern~mehr gern','t:case|Translate: I need a spoon.|Ich brauche einen Löffel','t:case|Translate: Do you have a pen? (du)|Hast du einen Stift/Hast du einen Kugelschreiber','o:wordorder|I always buy the bread at the bakery.|Das Brot kaufe ich immer in der Bäckerei/Ich kaufe das Brot immer in der Bäckerei','t|Translate: a bottle of water|eine Flasche Wasser','m:gender|___ Käse|der~die~das','m:gender|___ Brot|das~der~die']},

{id:'a1-05',level:'A1',title:'Alltag und Familie – Uhrzeit & Modalverben',cat:'modal',vocab:['a1-familie','a1-zeit'],
 topics:['Uhrzeit','am, um, von … bis','Possessivartikel (Nom./Akk.)','Modalverben müssen, können, wollen','Satzklammer'],
 source:'Netzwerk neu A1 Kap. 5 · Basic German Units 16, 20, 26',
 goals:['Uhrzeit offiziell und informell sagen','Termine vereinbaren','über die Familie sprechen'],
 grammar:`<h3>1. Telling the time</h3>
<table><tr><th></th><th>official (radio, SBB, appointments)</th><th>informal</th></tr>
<tr><td>8:00</td><td>acht Uhr</td><td>acht</td></tr><tr><td>8:15</td><td>acht Uhr fünfzehn</td><td>Viertel nach acht</td></tr><tr><td>8:30</td><td>acht Uhr dreissig</td><td><b>halb neun</b> (!)</td></tr><tr><td>8:45</td><td>acht Uhr fünfundvierzig</td><td>Viertel vor neun</td></tr><tr><td>8:20</td><td>acht Uhr zwanzig</td><td>zwanzig nach acht</td></tr><tr><td>20:10</td><td>zwanzig Uhr zehn</td><td>zehn nach acht (abends)</td></tr></table>
<div class="warn"><b>halb neun</b> = 8:30 (half <i>to</i> nine), not 9:30!</div>
<h3>2. Time prepositions</h3><p><b>um</b> + clock time (um 9 Uhr) · <b>am</b> + day/part of day (am Montag, am Abend, am Wochenende) · <b>von … bis</b> (von 8 bis 17 Uhr) · <b>in der Nacht</b> · <b>im</b> + month/season (im Mai, im Winter). Wie spät ist es? / Wie viel Uhr ist es? – Es ist …</p>
<h3>3. Possessive articles</h3>
<table><tr><th>ich</th><th>du</th><th>er/es</th><th>sie</th><th>wir</th><th>ihr</th><th>sie</th><th>Sie</th></tr>
<tr><td>mein</td><td>dein</td><td>sein</td><td>ihr</td><td>unser</td><td>euer</td><td>ihr</td><td>Ihr</td></tr></table>
<p>They take the same endings as <b>ein/kein</b>: mein Vater, mein Kind, mein<em>e</em> Mutter, mein<em>e</em> Eltern; accusative masculine: Ich besuche mein<em>en</em> Bruder. (euer → eure, euren)</p>
<h3>4. Modal verbs & the sentence bracket (Satzklammer)</h3>
<table><tr><th></th><th>können (can)</th><th>müssen (must)</th><th>wollen (want)</th></tr>
<tr><td>ich</td><td>kann</td><td>muss</td><td>will</td></tr><tr><td>du</td><td>kannst</td><td>musst</td><td>willst</td></tr><tr><td>er/sie/es</td><td>kann</td><td>muss</td><td>will</td></tr><tr><td>wir/sie/Sie</td><td>können</td><td>müssen</td><td>wollen</td></tr><tr><td>ihr</td><td>könnt</td><td>müsst</td><td>wollt</td></tr></table>
<div class="rule">The modal verb (conjugated) is in <b>position 2</b>, the second verb goes to the <b>end</b> in the infinitive: Ich <b>muss</b> heute bis 18 Uhr <b>arbeiten</b>. <b>Kannst</b> du morgen um 10 Uhr <b>kommen</b>?</div>
<p>Note: ich and er/sie/es have <b>no ending</b> (ich kann, er muss). <i>wollen</i> = to want (not “will”!). Future = <i>werden</i>.</p>`,
 pitfalls:['<b>*Ich muss arbeiten heute</b> → Ich muss heute arbeiten.','<b>*Er kannt</b> → Er kann.','<b>*halb acht = 8:30</b> → halb acht = 7:30.','<b>*Ich will gehen morgen</b> → Ich will morgen gehen.'],
 swiss:'In der Schweiz ist Pünktlichkeit sehr wichtig. Wer zu spät kommt, ruft an: „Entschuldigung, ich komme ca. zehn Minuten später.“ Die SBB-Fahrpläne verwenden die 24-Stunden-Zeit.',
 examples:[['Wie spät ist es? – Es ist Viertel nach drei.','What time is it? – It’s a quarter past three.'],['Der Zug fährt um 7 Uhr 32.','The train leaves at 7:32.'],['Ich arbeite von Montag bis Freitag, von 8 bis 17 Uhr.','I work Monday to Friday, from 8 to 5.'],['Kannst du am Samstag um halb elf? – Ja, das passt.','Can you make Saturday at half past ten? – Yes, that works.'],['Ich muss heute länger arbeiten.','I have to work longer today.'],['Meine Frau kommt aus Italien, ihre Eltern wohnen in Rom.','My wife is from Italy; her parents live in Rome.'],['Besuchst du deinen Bruder am Wochenende?','Are you visiting your brother at the weekend?'],['Unsere Tochter will Ärztin werden.','Our daughter wants to become a doctor.'],['Entschuldigung, ich komme zehn Minuten später.','Sorry, I’ll be ten minutes late.'],['Haben Sie am Dienstag einen Termin frei?','Do you have an appointment free on Tuesday?']],
 ex:['g:modal|Ich ___ heute arbeiten. (müssen)|muss','g:modal|___ du Deutsch sprechen? (können)|Kannst','g:modal|Er ___ ein neues Auto kaufen. (wollen)|will','g:modal|Wir ___ um 8 Uhr da sein. (müssen)|müssen','g:modal|Ihr ___ gut kochen. (können)|könnt','g:temporal|Der Kurs beginnt ___ 9 Uhr.|um','g:temporal|Wir treffen uns ___ Montag.|am','g:temporal|Ich arbeite ___ 8 ___ 17 Uhr.|von;bis','g:case|Ich besuche ___ Vater. (my)|meinen','g:case|Das ist ___ Schwester. (my)|meine','g:case|Wie heisst ___ Frau? (your, du)|deine','g:case|Peter und ___ Kinder wohnen in Bern. (his)|seine','m|8:30 informell|halb neun~halb acht~acht halb','m|6:45 informell|Viertel vor sieben~Viertel nach sechs~Viertel vor sechs','o:wordorder|I have to work on Saturday.|Ich muss am Samstag arbeiten/Am Samstag muss ich arbeiten','o:wordorder|Can you come tomorrow?|Kannst du morgen kommen','t:wordorder|Add the modal verb „müssen“: Ich arbeite heute lange.|Ich muss heute lange arbeiten','t:wordorder|Add „können“: Wir kommen am Freitag.|Wir können am Freitag kommen','t|Translate: Her mother lives in Basel.|Ihre Mutter wohnt in Basel']},

{id:'a1-06',level:'A1',title:'Zeit mit Freunden – Freizeit & Einladungen',cat:'sep',vocab:['a1-freizeit'],
 topics:['Datum & Ordinalzahlen','trennbare Verben','Personalpronomen im Akkusativ','für + Akkusativ','Präteritum von haben und sein'],
 source:'Netzwerk neu A1 Kap. 6 · Basic German Units 5, 15, 22, 26',
 goals:['Datum sagen und Einladungen schreiben','trennbare Verben im Satz richtig stellen','über Vergangenes mit war/hatte berichten'],
 grammar:`<h3>1. Dates</h3><p>Der Wievielte ist heute? – Heute ist der <b>dritte</b> Mai. · Wann hast du Geburtstag? – <b>Am dritten</b> Mai. Written: <i>am 3. Mai</i> / <i>am 3.5.</i></p>
<p>1. erste · 2. zweite · 3. <b>dritte</b> · 4. vierte · 7. <b>siebte</b> · 8. <b>achte</b> · up to 19: +te · from 20: +ste (zwanzigste, einunddreissigste). After <i>am</i>: ending -en (am ersten, am zwanzigsten).</p>
<h3>2. Separable verbs (trennbare Verben)</h3>
<div class="rule">The prefix goes to the <b>end</b> of the clause: <b>auf</b>stehen → Ich <b>stehe</b> um 6 Uhr <b>auf</b>. <b>an</b>rufen → <b>Rufst</b> du mich morgen <b>an</b>? <b>ein</b>kaufen → Wir <b>kaufen</b> am Samstag <b>ein</b>.</div>
<p>Separable prefixes are stressed: <b>AN</b>rufen, <b>AUF</b>stehen. Common: ab-, an-, auf-, aus-, ein-, fern-, mit-, nach-, statt-, vor-, weg-, zu-, zurück-. With a modal verb the verb stays together at the end: Ich <b>muss</b> früh <b>aufstehen</b>.</p>
<h3>3. Personal pronouns – accusative</h3>
<table><tr><th>Nom</th><td>ich</td><td>du</td><td>er</td><td>sie</td><td>es</td><td>wir</td><td>ihr</td><td>sie/Sie</td></tr><tr><th>Akk</th><td><em>mich</em></td><td><em>dich</em></td><td><em>ihn</em></td><td>sie</td><td>es</td><td><em>uns</em></td><td><em>euch</em></td><td>sie/Sie</td></tr></table>
<p><i>Ich lade <b>dich</b> ein. Kennst du <b>ihn</b>? Ich rufe <b>Sie</b> morgen an.</i></p>
<h3>4. für + accusative</h3><p><i>Das Geschenk ist <b>für dich</b>. Ich kaufe einen Kuchen <b>für meinen</b> Kollegen.</i> (Also accusative: durch, gegen, ohne, um.)</p>
<h3>5. Past of sein and haben (Präteritum)</h3>
<table><tr><th></th><th>sein</th><th>haben</th></tr><tr><td>ich</td><td>war</td><td>hatte</td></tr><tr><td>du</td><td>warst</td><td>hattest</td></tr><tr><td>er/sie/es</td><td>war</td><td>hatte</td></tr><tr><td>wir/sie/Sie</td><td>waren</td><td>hatten</td></tr><tr><td>ihr</td><td>wart</td><td>hattet</td></tr></table>
<p>These two are normally used in the Präteritum even in speech: <i>Wie <b>war</b> das Konzert? – Super! Ich <b>hatte</b> viel Spass.</i></p>`,
 pitfalls:['<b>*Ich aufstehe um 6</b> → Ich stehe um 6 auf.','<b>*Ich rufe an dich</b> → Ich rufe dich an.','<b>*Das ist für du</b> → für dich.','<b>*am dreite Mai</b> → am dritten Mai.'],
 swiss:'Einladungen in der Schweiz: man bringt oft etwas mit (Wein, Blumen, Schokolade) und sagt rechtzeitig ab, wenn man nicht kommen kann.',
 examples:[['Ich lade dich zu meiner Geburtstagsparty ein.','I’m inviting you to my birthday party.'],['Die Party findet am Samstag, den 14. Juni statt.','The party takes place on Saturday 14 June.'],['Kommst du mit ins Kino?','Are you coming along to the cinema?'],['Ich rufe dich heute Abend an.','I’ll call you this evening.'],['Am Wochenende stehe ich spät auf.','At the weekend I get up late.'],['Das Geschenk ist für dich.','The present is for you.'],['Wie war die Party? – Toll, wir hatten viel Spass.','How was the party? – Great, we had a lot of fun.'],['Gestern war ich müde und hatte keine Zeit.','Yesterday I was tired and had no time.'],['Ich kaufe am Samstag immer im Coop ein.','I always go shopping at Coop on Saturday.'],['Leider kann ich nicht kommen. Ich muss früh aufstehen.','Unfortunately I can’t come. I have to get up early.']],
 ex:['g:sep|Ich ___ um 6 Uhr ___. (aufstehen)|stehe;auf','g:sep|___ du mich morgen ___? (anrufen)|Rufst;an','g:sep|Wir ___ am Samstag ___. (einkaufen)|kaufen;ein','g:sep|Der Film ___ um 20 Uhr ___. (anfangen)|fängt;an','g:sep|Das Konzert ___ im Hallenstadion ___. (stattfinden)|findet;statt','g:pron|Ich liebe ___. (you, du)|dich','g:pron|Kennst du Herrn Weber? – Ja, ich kenne ___.|ihn','g:pron|Wir besuchen ___ morgen. (you, ihr)|euch','g:pron|Das Geschenk ist für ___. (me)|mich','g:praet|Gestern ___ ich krank. (sein)|war','g:praet|Wir ___ keine Zeit. (haben)|hatten','g:praet|Wo ___ du am Wochenende? (sein)|warst','m|Heute ist der ___ Mai. (3.)|dritte~dreite~dreiste','m|Ich habe ___ 7. Juli Geburtstag.|am~im~um','t:sep|Translate: I get up at seven.|Ich stehe um sieben auf/Ich stehe um sieben Uhr auf/Ich stehe um 7 Uhr auf/Ich stehe um 7 auf','t:sep|Add „müssen“: Ich stehe früh auf.|Ich muss früh aufstehen','o:sep|Are you coming along?|Kommst du mit']},

{id:'a1-07',level:'A1',title:'Arbeitsalltag – Dativ & Ortsangaben',cat:'case',vocab:['a1-buero'],
 topics:['und, oder, aber','Artikel im Dativ','mit + Dativ','Präpositionen mit Dativ: aus, bei, mit, nach, seit, von, zu'],
 source:'Netzwerk neu A1 Kap. 7 · Basic German Units 13, 24, 27',
 goals:['den Arbeitstag beschreiben','sagen, wie und wohin man fährt','den Dativ nach Präpositionen sicher bilden'],
 grammar:`<h3>1. Linking sentences: und, oder, aber (position 0)</h3><p>They do <b>not</b> change word order: <i>Ich arbeite bei einer Bank, <b>und</b> meine Frau <b>ist</b> Lehrerin. Ich möchte kommen, <b>aber</b> ich <b>habe</b> keine Zeit.</i> (Comma before aber; not needed before und/oder.)</p>
<h3>2. The dative case</h3>
<table><tr><th></th><th>masculine</th><th>neuter</th><th>feminine</th><th>plural</th></tr>
<tr><td>Nom</td><td>der/ein Kollege</td><td>das/ein Büro</td><td>die/eine Firma</td><td>die Kollegen</td></tr>
<tr><td>Dativ</td><td><em>dem / einem</em></td><td><em>dem / einem</em></td><td><em>der / einer</em></td><td><em>den</em> Kollegen + <em>n</em></td></tr></table>
<p>Possessives follow ein: mit mein<em>em</em> Chef, mit mein<em>er</em> Kollegin, mit mein<em>en</em> Kinder<em>n</em>. Dative plural nouns add <b>-n</b> (unless they already end in -n or -s): mit den Freunde<em>n</em>, mit den Autos.</p>
<h3>3. Prepositions that ALWAYS take the dative</h3>
<div class="rule"><b>aus, bei, mit, nach, seit, von, zu</b> (+ gegenüber) – memory chant: “aus-bei-mit-nach-seit-von-zu”.</div>
<p>Contractions: zu + dem = <b>zum</b>, zu + der = <b>zur</b>, bei + dem = <b>beim</b>, von + dem = <b>vom</b>.</p>
<table><tr><th>Wohin? (where to)</th><th>Wo? (where)</th><th>Woher? (where from)</th></tr>
<tr><td>zu + person/place: zum Arzt, zur Arbeit, zu Frau Weber</td><td>bei + person/company: beim Arzt, bei Google, bei meinen Eltern</td><td>von + person/place: vom Arzt, von der Arbeit</td></tr>
<tr><td>nach + city/country without article, nach Hause: nach Bern, nach Hause</td><td>in + city/country: in Bern; zu Hause</td><td>aus + city/country/building: aus Bern, aus dem Haus</td></tr></table>
<p>Transport: <b>mit dem</b> Zug / Bus / Auto / Velo, <b>mit der</b> Tram / S-Bahn, <b>zu Fuss</b>.</p>`,
 pitfalls:['<b>*mit der Zug</b> → mit dem Zug.','<b>*Ich gehe zu Hause</b> → Ich gehe nach Hause. / Ich bin zu Hause.','<b>*Ich arbeite für Google</b> (possible but) usually: bei Google.','<b>*mit meine Kinder</b> → mit meinen Kindern.'],
 swiss:'Viele Pendler in der Schweiz fahren <b>mit der S-Bahn</b> oder <b>mit dem Zug</b>; man hat ein <b>GA</b> (Generalabonnement) oder ein <b>Halbtax</b>.',
 examples:[['Ich fahre jeden Tag mit dem Zug zur Arbeit.','I go to work by train every day.'],['Nach der Arbeit gehe ich direkt nach Hause.','After work I go straight home.'],['Meine Frau arbeitet bei einer Versicherung.','My wife works for an insurance company.'],['Ich komme gerade vom Arzt.','I’m just coming from the doctor’s.'],['Seit einem Jahr arbeite ich in Zürich.','I have been working in Zurich for a year.'],['Heute Mittag esse ich mit meinen Kollegen.','Today at lunch I’m eating with my colleagues.'],['Die Sitzung ist um zehn, aber ich habe noch keine Unterlagen.','The meeting is at ten, but I don’t have the documents yet.'],['Kannst du das bitte drucken? – Ja, gleich.','Can you print that, please? – Yes, right away.'],['Ich gehe zur Bank und dann zur Post.','I’m going to the bank and then to the post office.'],['Er wohnt gegenüber dem Bahnhof.','He lives opposite the station.']],
 ex:['g:case|Ich fahre mit ___ Bus. (the)|dem','g:case|Ich fahre mit ___ Tram. (the)|der','g:case|Er spricht mit ___ Chef. (his)|seinem','g:case|Wir essen mit ___ Kollegen. (our, pl.)|unseren','g:prep|Ich gehe ___ Arzt. (to the)|zum','g:prep|Sie geht ___ Arbeit. (to the)|zur','g:prep|Ich arbeite ___ Swisscom.|bei','g:prep|Am Abend fahre ich ___ Hause.|nach','g:prep|Am Abend bin ich ___ Hause.|zu','g:prep|Er kommt ___ Spanien.|aus','g:prep|Ich wohne ___ zwei Jahren in Zug.|seit','g:case|Ich spiele mit den ___. (Kind, pl.)|Kindern','m:prep|Ich fahre ___ Bern.|nach~zu~in','m:prep|Ich komme gerade ___ Supermarkt.|vom~aus dem~von','m:conn|Ich möchte kommen, ___ ich habe keine Zeit.|aber~und~oder','t:case|Translate: I go to work by bike.|Ich fahre mit dem Velo zur Arbeit/Ich fahre mit dem Fahrrad zur Arbeit','t:prep|Translate: I am at my parents’ (place).|Ich bin bei meinen Eltern','o:wordorder|After work I go home.|Nach der Arbeit gehe ich nach Hause']},

{id:'a1-08',level:'A1',title:'Fit und gesund – beim Arzt',cat:'modal',vocab:['a1-koerper'],
 topics:['Imperativ mit du, ihr, Sie','Modalverben sollen, müssen, dürfen','Körperteile & Krankheiten'],
 source:'Netzwerk neu A1 Kap. 8 · Basic German Units 6, 20',
 goals:['beim Arzt sagen, was weh tut','Anweisungen verstehen und geben','Ratschläge wiedergeben (sollen)'],
 grammar:`<h3>1. The imperative</h3>
<table><tr><th>Infinitive</th><th>Sie</th><th>du</th><th>ihr</th></tr>
<tr><td>kommen</td><td>Kommen Sie!</td><td>Komm!</td><td>Kommt!</td></tr>
<tr><td>trinken</td><td>Trinken Sie viel Wasser!</td><td>Trink viel Wasser!</td><td>Trinkt viel Wasser!</td></tr>
<tr><td>nehmen (e→i)</td><td>Nehmen Sie …!</td><td><b>Nimm</b> …!</td><td>Nehmt …!</td></tr>
<tr><td>schlafen (a→ä)</td><td>Schlafen Sie!</td><td><b>Schlaf</b>! (no umlaut!)</td><td>Schlaft!</td></tr>
<tr><td>arbeiten</td><td>Arbeiten Sie!</td><td>Arbeite!</td><td>Arbeitet!</td></tr>
<tr><td>anrufen</td><td>Rufen Sie an!</td><td>Ruf an!</td><td>Ruft an!</td></tr>
<tr><td>sein</td><td>Seien Sie!</td><td>Sei!</td><td>Seid!</td></tr></table>
<div class="rule"><b>du-imperative</b> = du-form minus <i>-st</i> and minus <i>du</i>: du nimmst → <b>Nimm!</b>, du gehst → <b>Geh!</b> – but a→ä verbs lose the umlaut: du fährst → <b>Fahr!</b></div>
<h3>2. sollen, müssen, dürfen</h3>
<table><tr><th></th><th>sollen</th><th>dürfen</th></tr><tr><td>ich</td><td>soll</td><td>darf</td></tr><tr><td>du</td><td>sollst</td><td>darfst</td></tr><tr><td>er/sie/es</td><td>soll</td><td>darf</td></tr><tr><td>wir/sie/Sie</td><td>sollen</td><td>dürfen</td></tr><tr><td>ihr</td><td>sollt</td><td>dürft</td></tr></table>
<p><b>sollen</b> = someone else says you should: <i>Der Arzt sagt, ich <b>soll</b> im Bett bleiben.</i><br><b>dürfen</b> = be allowed to; <b>nicht dürfen</b> = must not: <i>Sie <b>dürfen</b> heute keinen Sport machen.</i><br><b>nicht müssen</b> = don’t have to: <i>Sie <b>müssen</b> nicht ins Spital.</i></p>
<div class="warn"><b>must not</b> = nicht dürfen (not *nicht müssen*).</div>
<h3>3. Saying what hurts</h3><p>Ich habe Kopfschmerzen / Bauchschmerzen / Fieber / Husten / Schnupfen. Mein Bein tut weh. Meine Füsse tun weh. Mir ist schlecht.</p>`,
 pitfalls:['<b>*Du nimm!</b> → Nimm!','<b>*Fähr langsam!</b> → Fahr langsam!','<b>*Sie müssen nicht rauchen</b> (=you don’t have to) – meant: Sie dürfen nicht rauchen.','<b>*Mein Kopf tut wehen</b> → Mein Kopf tut weh.'],
 swiss:'In der Schweiz sagt man oft <b>das Spital</b> (Deutschland: das Krankenhaus). Zuerst ruft man die Hausärztin / den Hausarzt an; im Notfall 144. Arztzeugnis = ärztliches Attest für den Arbeitgeber.',
 examples:[['Was fehlt Ihnen? – Ich habe seit gestern Fieber und Halsschmerzen.','What’s the matter? – I’ve had a fever and sore throat since yesterday.'],['Mein Rücken tut sehr weh.','My back hurts a lot.'],['Nehmen Sie dreimal täglich eine Tablette.','Take one tablet three times a day.'],['Trink viel Tee und bleib im Bett!','Drink lots of tea and stay in bed!'],['Die Ärztin sagt, ich soll mehr Sport machen.','The doctor says I should do more sport.'],['Sie dürfen drei Tage nicht arbeiten.','You must not work for three days.'],['Sie müssen nicht ins Spital, es ist nicht schlimm.','You don’t have to go to hospital, it’s not serious.'],['Ich brauche ein Arztzeugnis für meinen Arbeitgeber.','I need a doctor’s certificate for my employer.'],['Ruft bitte den Arzt an!','Please call the doctor! (ihr)'],['Sei nicht traurig, gute Besserung!','Don’t be sad, get well soon!']],
 ex:['t:wordorder|du-Imperativ: Du trinkst viel Wasser.|Trink viel Wasser/Trinke viel Wasser','t:wordorder|du-Imperativ: Du nimmst eine Tablette.|Nimm eine Tablette','t:wordorder|du-Imperativ: Du fährst langsam.|Fahr langsam/Fahre langsam','t:wordorder|Sie-Imperativ: Sie bleiben im Bett.|Bleiben Sie im Bett','t:wordorder|ihr-Imperativ: Ihr seid leise.|Seid leise','t:sep|du-Imperativ: Du rufst den Arzt an.|Ruf den Arzt an/Rufe den Arzt an','g:modal|Der Arzt sagt, ich ___ viel schlafen. (sollen)|soll','g:modal|Hier ___ man nicht rauchen. (dürfen)|darf','g:modal|___ ich das Fenster öffnen? (dürfen)|Darf','g:modal|Ihr ___ mehr Obst essen. (sollen)|sollt','m:modal|You must not drive today.|Sie dürfen heute nicht Auto fahren.~Sie müssen heute nicht Auto fahren.~Sie sollen heute nicht Auto fahren.','m:modal|You don’t have to come.|Sie müssen nicht kommen.~Sie dürfen nicht kommen.~Sie können nicht kommen.','m:conj|Mein Füsse ___ weh.|tun~tut~tue','g:conj|Mein Kopf ___ weh. (tun)|tut','m:gender|___ Bein|das~der~die','m:gender|___ Rücken|der~die~das','t|Translate: I have a headache.|Ich habe Kopfschmerzen/Ich habe Kopfweh']},

{id:'a1-09',level:'A1',title:'Meine Wohnung – Wechselpräpositionen',cat:'wechsel',vocab:['a1-wohnung'],
 topics:['sein + Adjektiv','in + Akkusativ (Wohin?)','Wechselpräpositionen mit Dativ (Wo?)','Farben, Möbel'],
 source:'Netzwerk neu A1 Kap. 9 · Basic German Unit 24',
 goals:['eine Wohnung beschreiben','sagen, wo etwas steht','Wohnungsanzeigen verstehen'],
 grammar:`<h3>1. Two-way prepositions (Wechselpräpositionen)</h3>
<p><b>an, auf, hinter, in, neben, über, unter, vor, zwischen</b> take either accusative or dative:</p>
<div class="rule"><b>Wo?</b> (location, no change of place) → <b>Dativ</b>: Das Sofa steht <b>im</b> Wohnzimmer. Die Lampe hängt <b>über dem</b> Tisch.<br><b>Wohin?</b> (movement to a destination) → <b>Akkusativ</b>: Wir stellen das Sofa <b>ins</b> Wohnzimmer. Ich hänge die Lampe <b>über den</b> Tisch.</div>
<table><tr><th></th><th>m</th><th>n</th><th>f</th><th>pl</th></tr><tr><td>Wo? (Dat)</td><td>in <em>dem</em> → <b>im</b> Flur</td><td><b>im</b> Bad</td><td>in <em>der</em> Küche</td><td>in <em>den</em> Zimmer<em>n</em></td></tr><tr><td>Wohin? (Akk)</td><td>in <em>den</em> Flur</td><td>in <em>das</em> → <b>ins</b> Bad</td><td>in <em>die</em> Küche</td><td>in <em>die</em> Zimmer</td></tr></table>
<p>Contractions: in dem = <b>im</b>, in das = <b>ins</b>, an dem = <b>am</b>, an das = <b>ans</b>.</p>
<p>Positions: <i>an</i> = on a vertical surface/at the edge (an der Wand, am Fenster) · <i>auf</i> = on a horizontal surface (auf dem Tisch) · <i>in</i> = in · <i>über</i> = above · <i>unter</i> = under · <i>vor</i> = in front of · <i>hinter</i> = behind · <i>neben</i> = next to · <i>zwischen</i> = between.</p>
<h3>2. Gefallen & opinions</h3><p>Die Wohnung ist <b>hell</b> und <b>gross</b>, aber die Küche ist <b>klein</b>. · Das Zimmer gefällt mir (sehr). · Ich finde den Balkon toll.</p>
<h3>3. Reading flat ads</h3><p>3½-Zimmer-Wohnung, 85 m², Miete CHF 2'350.– inkl. NK (Nebenkosten), ab 1. Oktober, Balkon, Lift, Nähe ÖV. In Swiss ads, the living room counts as a room and the kitchen as half (3½ Zimmer = 2 bedrooms + living room + kitchen).</p>`,
 pitfalls:['<b>*Ich gehe im Zimmer</b> → in das (ins) Zimmer.','<b>*Das Bild hängt an die Wand</b> → an der Wand (Wo?).','<b>*Ich stelle die Vase auf dem Tisch</b> → auf den Tisch (Wohin?).'],
 swiss:'Schweizer Wohnungsanzeigen: „3½ Zimmer“, „NK“ = Nebenkosten, „Kaution“ (meist 3 Monatsmieten), „Waschküche“ (gemeinsame Waschmaschine mit Waschplan). Mieten sind brutto/netto angegeben.',
 examples:[['Die Wohnung hat drei Zimmer, eine Küche und ein Bad.','The flat has three rooms, a kitchen and a bathroom.'],['Das Wohnzimmer ist hell und gross.','The living room is bright and large.'],['Das Sofa steht im Wohnzimmer.','The sofa is (standing) in the living room.'],['Wir stellen das Sofa ins Wohnzimmer.','We put the sofa in the living room.'],['Das Bild hängt an der Wand über dem Sofa.','The picture hangs on the wall above the sofa.'],['Die Katze liegt unter dem Tisch.','The cat is lying under the table.'],['Der Schlüssel liegt auf dem Tisch neben der Lampe.','The key is on the table next to the lamp.'],['Wie gefällt dir die neue Wohnung? – Sie gefällt mir sehr.','How do you like the new flat? – I like it a lot.'],['Die Miete beträgt 2400 Franken inklusive Nebenkosten.','The rent is 2400 francs including utilities.'],['Der Supermarkt ist zwischen der Post und der Bank.','The supermarket is between the post office and the bank.']],
 ex:['g:wechsel|Das Buch liegt auf ___ Tisch. (Wo?)|dem','g:wechsel|Ich lege das Buch auf ___ Tisch. (Wohin?)|den','g:wechsel|Wir gehen ___ Küche. (in + die)|in die','g:wechsel|Das Kind ist ___ Garten. (in + dem)|im','g:wechsel|Stell die Flasche bitte ___ Kühlschrank! (in + den)|in den','g:wechsel|Das Bild hängt an ___ Wand.|der','g:wechsel|Ich hänge das Bild an ___ Wand.|die','g:wechsel|Die Katze schläft unter ___ Bett. (das)|dem','g:wechsel|Der Hund läuft ___ Haus. (in + das)|ins','g:wechsel|Die Lampe steht zwischen ___ Sofa und ___ Regal.|dem;dem','m:wechsel|Wohin gehst du? – ___ Bad.|Ins~Im~In der','m:wechsel|Wo ist die Milch? – ___ Kühlschrank.|Im~In den~Ins','m|Die Wohnung ___ mir gut.|gefällt~gefallt~mag','t:wechsel|Translate: The lamp is on the table.|Die Lampe steht auf dem Tisch/Die Lampe ist auf dem Tisch','t:wechsel|Translate: I go into the living room.|Ich gehe ins Wohnzimmer','m:gender|___ Küche|die~der~das','m:gender|___ Schrank|der~die~das','m:gender|___ Zimmer|das~der~die']},

{id:'a1-10',level:'A1',title:'Studium und Beruf – das Perfekt',cat:'perfekt',vocab:['a1-arbeit'],
 topics:['Perfekt: Satzklammer','Partizip II regelmässig, unregelmässig, -ieren','Perfekt mit haben und sein'],
 source:'Netzwerk neu A1 Kap. 10 · Basic German Unit 21',
 goals:['über Vergangenes sprechen','einen Lebenslauf mündlich erzählen','haben/sein richtig wählen'],
 grammar:`<h3>1. The Perfekt = spoken past tense</h3>
<div class="rule"><b>haben/sein</b> (conjugated, position 2) + … + <b>Partizip II</b> (end): Ich <b>habe</b> gestern bis 20 Uhr <b>gearbeitet</b>. Wir <b>sind</b> nach Genf <b>gefahren</b>.</div>
<h3>2. Forming the Partizip II</h3>
<table><tr><th>Type</th><th>Rule</th><th>Examples</th></tr>
<tr><td>regular</td><td><b>ge</b>-stem-<b>t</b></td><td>machen → gemacht, kaufen → gekauft, arbeiten → gearbeit<b>et</b>, wohnen → gewohnt</td></tr>
<tr><td>irregular</td><td><b>ge</b>-stem(often new vowel)-<b>en</b></td><td>fahren → gefahren, schreiben → geschrieben, trinken → getrunken, sprechen → gesprochen, nehmen → genommen, gehen → gegangen, sein → gewesen</td></tr>
<tr><td>-ieren</td><td>no ge-, -t</td><td>studieren → studiert, telefonieren → telefoniert</td></tr>
<tr><td>mixed</td><td>ge- … -t with vowel change</td><td>bringen → gebracht, denken → gedacht, kennen → gekannt, wissen → gewusst</td></tr></table>
<h3>3. haben or sein?</h3>
<div class="rule"><b>sein</b> with verbs of <b>movement from A to B</b> (gehen, fahren, fliegen, kommen, laufen, reisen, umziehen, schwimmen*) and <b>change of state</b> (aufstehen, einschlafen, aufwachen, werden, sterben, passieren) + <b>sein</b> and <b>bleiben</b>.<br><b>haben</b> with everything else (most verbs, all reflexive verbs, verbs with an accusative object).</div>
<p>Ich <b>bin</b> nach Zürich gezogen. Ich <b>bin</b> zu Hause geblieben. Ich <b>habe</b> Deutsch gelernt. Was <b>ist</b> passiert?</p>
<h3>4. Telling your story</h3><p>Ich habe in Bath Wirtschaft studiert. Danach habe ich in London gearbeitet. 2015 bin ich nach Hongkong gezogen. Seit drei Jahren wohne ich in der Schweiz. (Note: <i>seit</i> + present tense for something still continuing!)</p>`,
 pitfalls:['<b>*Ich habe nach Zürich gefahren</b> → Ich bin … gefahren.','<b>*Ich habe gestern gearbeiten</b> → gearbeitet.','<b>*Ich habe studieret / gestudiert</b> → studiert.','<b>*Seit drei Jahren habe ich in Zürich gewohnt</b> (still living there) → Seit drei Jahren wohne ich in Zürich.'],
 swiss:'Im Gespräch auf der Gemeinde oder im Einbürgerungsgespräch erzählt man seinen Lebenslauf im Perfekt: „Ich bin 2018 in die Schweiz gekommen und habe zuerst in Zürich gewohnt.“',
 examples:[['Was hast du am Wochenende gemacht?','What did you do at the weekend?'],['Ich habe lange geschlafen und dann ein Buch gelesen.','I slept for a long time and then read a book.'],['Wir sind mit dem Zug nach Luzern gefahren.','We went to Lucerne by train.'],['Er hat in London Wirtschaft studiert.','He studied economics in London.'],['Ich bin 2019 in die Schweiz gezogen.','I moved to Switzerland in 2019.'],['Gestern bin ich zu Hause geblieben.','Yesterday I stayed at home.'],['Hast du schon mit dem Chef gesprochen?','Have you already spoken to the boss?'],['Was ist passiert? – Ich habe den Zug verpasst.','What happened? – I missed the train.'],['Ich habe drei Jahre bei einer Bank gearbeitet.','I worked at a bank for three years.'],['Um wie viel Uhr bist du heute aufgestanden?','What time did you get up today?']],
 ex:['g:perfekt|Ich ___ gestern Fussball ___. (spielen)|habe;gespielt','g:perfekt|Wir ___ nach Bern ___. (fahren)|sind;gefahren','g:perfekt|Er ___ einen Brief ___. (schreiben)|hat;geschrieben','g:perfekt|___ du schon ___? (essen)|Hast;gegessen','g:perfekt|Sie ___ in Basel ___. (studieren, she)|hat;studiert','g:perfekt|Ich ___ um 6 Uhr ___. (aufstehen)|bin;aufgestanden','g:perfekt|Was ___ ___? (passieren)|ist;passiert','g:perfekt|Wir ___ zu Hause ___. (bleiben)|sind;geblieben','g:perfekt|Er ___ viel ___. (arbeiten)|hat;gearbeitet','g:perfekt|Ich ___ das nicht ___. (wissen)|habe;gewusst','m:perfekt|Ich ___ nach Zug umgezogen.|bin~habe~hat','m:perfekt|Wir ___ einen Kaffee getrunken.|haben~sind~hat','m:perfekt|Partizip von „telefonieren“|telefoniert~getelefoniert~telefonierte','m:perfekt|Partizip von „nehmen“|genommen~genehmt~genimmt','t:perfekt|Perfekt: Ich gehe ins Kino.|Ich bin ins Kino gegangen','t:perfekt|Perfekt: Er kauft ein Auto.|Er hat ein Auto gekauft','t:perfekt|Perfekt: Wir fliegen nach Hongkong.|Wir sind nach Hongkong geflogen','o:perfekt|I worked yesterday until 8 pm.|Ich habe gestern bis 20 Uhr gearbeitet/Gestern habe ich bis 20 Uhr gearbeitet']},

{id:'a1-11',level:'A1',title:'Die Jacke gefällt mir! – Kleidung & Dativ',cat:'pron',vocab:['a1-kleidung'],
 topics:['welcher? dieser','Partizip II trennbar/untrennbar','Personalpronomen im Dativ','Verben mit Dativ'],
 source:'Netzwerk neu A1 Kap. 11 · Basic German Units 15, 21',
 goals:['im Geschäft einkaufen und Kleidung beschreiben','Komplimente machen','Dativverben und -pronomen benutzen'],
 grammar:`<h3>1. welcher? – dieser</h3><p>They take the same endings as der/die/das: <i>Welch<em>er</em> Pullover? – Dies<em>er</em> hier. Welch<em>es</em> Hemd? – Dies<em>es</em>. Welch<em>e</em> Jacke? – Dies<em>e</em>.</i> Accusative masc.: <i>Welch<em>en</em> Mantel nimmst du? – Dies<em>en</em>.</i></p>
<h3>2. Partizip II of separable and inseparable verbs</h3>
<table><tr><th>separable: ge in the middle</th><th>inseparable (be-, ver-, er-, ent-, emp-, ge-, miss-, zer-): no ge-</th></tr>
<tr><td>einkaufen → ein<b>ge</b>kauft<br>anrufen → an<b>ge</b>rufen<br>anziehen → an<b>ge</b>zogen<br>aufstehen → auf<b>ge</b>standen</td><td>bezahlen → bezahlt<br>verkaufen → verkauft<br>bekommen → bekommen<br>vergessen → vergessen<br>erklären → erklärt</td></tr></table>
<h3>3. Personal pronouns in the dative</h3>
<table><tr><th>Nom</th><td>ich</td><td>du</td><td>er</td><td>sie</td><td>es</td><td>wir</td><td>ihr</td><td>sie/Sie</td></tr><tr><th>Dat</th><td><em>mir</em></td><td><em>dir</em></td><td><em>ihm</em></td><td><em>ihr</em></td><td><em>ihm</em></td><td>uns</td><td>euch</td><td><em>ihnen/Ihnen</em></td></tr></table>
<h3>4. Verbs with the dative</h3>
<div class="rule">gefallen, gehören, helfen, danken, passen, stehen (=suit), schmecken, antworten, gratulieren, wehtun: <i>Die Jacke <b>gefällt mir</b>. Das Kleid <b>steht dir</b> gut. Kann ich <b>Ihnen helfen</b>? Die Hose <b>passt mir</b> nicht. Wem <b>gehört</b> das?</i></div>
<p>Note: with gefallen/schmecken/passen the <b>thing</b> is the subject: Die Schuhe gefall<b>en</b> mir (plural verb!).</p>`,
 pitfalls:['<b>*Ich gefalle die Jacke</b> → Die Jacke gefällt mir.','<b>*Kann ich Sie helfen?</b> → Kann ich Ihnen helfen?','<b>*Ich habe bezahlt / gebezahlt</b> → bezahlt.','<b>*Die Schuhe gefällt mir</b> → gefallen.'],
 swiss:'Viele Geschäfte in der Schweiz schliessen am Samstag um 17 oder 18 Uhr und sind am Sonntag geschlossen (Ausnahme: Bahnhöfe, Flughafen).',
 examples:[['Kann ich Ihnen helfen? – Ja, ich suche eine Winterjacke.','Can I help you? – Yes, I’m looking for a winter jacket.'],['Welche Grösse haben Sie? – Grösse 40.','What size are you? – Size 40.'],['Die Jacke gefällt mir, aber sie ist zu teuer.','I like the jacket, but it’s too expensive.'],['Das Hemd steht dir sehr gut!','The shirt really suits you!'],['Die Hose passt mir leider nicht.','Unfortunately the trousers don’t fit me.'],['Welchen Pullover nimmst du? – Diesen hier.','Which jumper are you taking? – This one.'],['Ich habe gestern Schuhe eingekauft.','I bought shoes yesterday.'],['Hast du schon bezahlt?','Have you already paid?'],['Wem gehört der Schirm? – Er gehört mir.','Whose umbrella is this? – It’s mine.'],['Ich danke Ihnen für die Hilfe.','Thank you for your help.']],
 ex:['g:pron|Die Jacke gefällt ___. (me)|mir','g:pron|Kann ich ___ helfen? (you, formal)|Ihnen','g:pron|Das Kleid steht ___ gut. (you, du)|dir','g:pron|Ich gebe ___ das Buch. (him)|ihm','g:pron|Wir danken ___. (her)|ihr','g:pron|Der Kuchen schmeckt ___. (us)|uns','g:conj|Die Schuhe ___ mir nicht. (gefallen)|gefallen','g:perfekt|Ich habe den Mantel ___. (anziehen)|angezogen','g:perfekt|Wir haben im Restaurant ___. (bezahlen)|bezahlt','g:perfekt|Er hat das Auto ___. (verkaufen)|verkauft','g:perfekt|Hast du Mama ___? (anrufen)|angerufen','g:case|___ Pullover nimmst du? (which, Akk)|Welchen','g:case|Ich nehme ___ Hose hier. (this)|diese','m:pron|Wem gehört das Handy? – Es gehört ___.|ihm~ihn~er','m:pron|Ich helfe ___.|dir~dich~du','t:pron|Translate: I like the shirt. (use gefallen)|Das Hemd gefällt mir','t:pron|Translate: Can I help you? (formal)|Kann ich Ihnen helfen']},

{id:'a1-12',level:'A1',title:'Ab in den Urlaub! – Reisen & Wetter',cat:'conn',vocab:['a1-reisen'],
 topics:['Pronomen man','Sätze verbinden mit denn','Fragewörter wer? wen? wem? was?','Zeitangaben mit Dativ: vor, nach, in, seit, ab'],
 source:'Netzwerk neu A1 Kap. 12 · Basic German Units 7, 24, 27',
 goals:['über Reisen und das Wetter sprechen','Gründe nennen (denn)','A1-Grammatik zusammenführen'],
 grammar:`<h3>1. man (one / people / you)</h3><p><b>man</b> + 3rd person singular: <i>In der Schweiz <b>isst</b> man viel Käse. Hier <b>darf</b> man nicht parkieren. Wie <b>sagt</b> man das auf Deutsch?</i> Accusative: <i>einen</i>, dative: <i>einem</i>.</p>
<h3>2. Giving reasons with denn (position 0)</h3><p><i>Ich fahre gern in die Berge, <b>denn</b> ich <b>wandere</b> gern.</i> – normal word order after <i>denn</i> (verb in position 2). Compare <i>weil</i> (A2): verb at the end.</p>
<h3>3. Question words by case</h3>
<table><tr><th>Nominativ</th><th>Akkusativ</th><th>Dativ</th></tr><tr><td><b>Wer</b> kommt mit?</td><td><b>Wen</b> besuchst du?</td><td><b>Wem</b> hilfst du?</td></tr><tr><td><b>Was</b> ist das?</td><td><b>Was</b> machst du?</td><td>Mit <b>wem</b> fährst du?</td></tr></table>
<h3>4. Time expressions with the dative</h3>
<table><tr><td><b>vor</b> + Dat (ago)</td><td>vor einer Woche, vor zwei Jahren</td></tr><tr><td><b>nach</b> + Dat (after)</td><td>nach dem Frühstück, nach der Arbeit</td></tr><tr><td><b>in</b> + Dat (in … time, future)</td><td>in einer Stunde, in zwei Wochen</td></tr><tr><td><b>seit</b> + Dat (since/for, still continuing)</td><td>seit einem Monat, seit 2020</td></tr><tr><td><b>ab</b> + Dat (from … on)</td><td>ab nächster Woche, ab dem 1. Mai</td></tr><tr><td><b>bei</b> + Dat (during)</td><td>beim Essen</td></tr></table>
<h3>5. Weather</h3><p>Es regnet / schneit. Die Sonne scheint. Es ist sonnig / bewölkt / windig / neblig / heiss / kalt. Es sind 25 Grad. Im Tessin ist es wärmer als in Zürich. Der Föhn ist ein warmer Wind in den Alpen.</p>`,
 pitfalls:['<b>*Ich habe vor zwei Jahren hier gewohnt</b> ✓ but <b>*Ich wohne vor zwei Jahren hier</b> ✗ → seit zwei Jahren.','<b>*denn ich gerne wandere</b> → denn ich wandere gern.','<b>*Wer hilfst du?</b> → Wem hilfst du?','<b>*In der Schweiz man isst</b> → isst man.'],
 swiss:'Beliebte Reiseziele in der Schweiz: das Tessin (italienischsprachig), Graubünden (auch Rätoromanisch), das Berner Oberland, das Wallis. In der Schweiz gibt es vier Landessprachen: Deutsch, Französisch, Italienisch, Rätoromanisch.',
 examples:[['Im Sommer fahren wir ins Tessin, denn dort ist es warm.','In summer we go to Ticino, because it’s warm there.'],['Vor zwei Wochen war ich in Graubünden.','Two weeks ago I was in Graubünden.'],['Nach dem Frühstück haben wir eine Wanderung gemacht.','After breakfast we went hiking.'],['In einer Stunde fährt der Zug nach Lugano.','The train to Lugano leaves in an hour.'],['Wie ist das Wetter? – Es regnet und es ist kalt.','What’s the weather like? – It’s raining and cold.'],['Morgen scheint die Sonne, es werden 28 Grad.','Tomorrow the sun will shine, it’ll be 28 degrees.'],['In der Schweiz spricht man vier Sprachen.','In Switzerland four languages are spoken.'],['Mit wem fährst du in den Urlaub?','Who are you going on holiday with?'],['Ab Montag habe ich zwei Wochen Ferien.','From Monday I have two weeks of holiday.'],['Liebe Grüsse aus Ascona!','Best wishes from Ascona!']],
 ex:['g:temporal|Ich war ___ drei Tagen in Bern. (ago)|vor','g:temporal|Ich wohne ___ drei Jahren in der Schweiz. (for, still)|seit','g:temporal|Der Bus kommt ___ zehn Minuten. (in)|in','g:temporal|___ der Arbeit gehe ich joggen. (after)|Nach','g:case|Ich war vor ___ Woche in Genf. (a)|einer','g:case|Seit ___ Monat lerne ich Deutsch. (a)|einem','g:conj|Hier ___ man nicht rauchen. (dürfen)|darf','g:conj|Wie ___ man das auf Deutsch? (sagen)|sagt','m:pron|___ hilfst du? – Meiner Mutter.|Wem~Wen~Wer','m:pron|___ besuchst du? – Meinen Onkel.|Wen~Wem~Wer','m:conn|Ich bleibe zu Hause, denn ___.|ich bin krank~ich krank bin~bin ich krank','o:conn|I’m staying at home because it is raining.|Ich bleibe zu Hause, denn es regnet','t:conn|Combine with „denn“: Wir fahren in die Berge. Wir wandern gern.|Wir fahren in die Berge, denn wir wandern gern','t|Translate: It is snowing.|Es schneit','t|Translate: Two years ago I was in Zurich.|Vor zwei Jahren war ich in Zürich/Ich war vor zwei Jahren in Zürich','m:wordorder|Which is correct?|In der Schweiz isst man viel Käse.~In der Schweiz man isst viel Käse.~In der Schweiz man viel Käse isst.']}
]);
