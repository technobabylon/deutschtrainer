  <div class="grid g3"><div class="card stat"><b>${vocabDue().length}</b><span>heute fällig</span><div style="margin-top:8px"><a class="btn pri sm" href="#/vocab/review">Wiederholen</a></div></div><div class="card stat"><b>${vocabStarted()}</b><span>begonnen</span></div><div class="card stat"><b>${vocabLearned()}</b><span>gefestigt (Box ≥ 3)</span></div></div>
  <div class="row" style="margin:16px 0"><input type="text" id="vs" placeholder="Wort suchen (Deutsch oder Englisch)…" style="max-width:340px"><button id="newBtn" class="pri">${S.settings.dailyNew} neue Wörter (aktueller Stand)</button></div><div id="vsr"></div>
  ${LEVELS.map(l=>`<h2><span class="lvl">${l}</span></h2><div class="grid g3">${decks.filter(x=>x.d.level===l).map(x=>`<div class="card click" data-deck="${x.d.id}"><b>${esc(x.d.theme)}</b><div class="small muted">${x.n} Wörter · ${x.ln} gefestigt</div><div class="bar ok" style="margin-top:6px"><i style="width:${x.n?x.ln/x.n*100:0}%"></i></div></div>`).join('')}</div>`).join('')}`;
  $$('[data-deck]').forEach(c=>c.onclick=()=>nav('#/deck/'+c.dataset.deck));
  $('#newBtn').onclick=()=>{const lv=LEVELS.filter(levelReached);const fresh=cards().filter(c=>lv.includes(c.level)&&!S.vocab[c.id]);fresh.sort((a,b)=>LEVELS.indexOf(a.level)-LEVELS.indexOf(b.level));vocabSession(fresh.slice(0,S.settings.dailyNew),'Neue Wörter','#/vocab')};
  $('#vs').oninput=e=>{const q=e.target.value.trim().toLowerCase();if(q.length<2){$('#vsr').innerHTML='';return}const r=cards().filter(c=>(c.de+' '+c.en).toLowerCase().includes(q)).slice(0,30);$('#vsr').innerHTML=`<div class="card"><table class="t">${r.map(c=>`<tr><td class="nw">${sayBtn(nounStr(c))}${starBtn(nounStr(c),c.en,c.level+' · '+(c.theme||''),c.id)}</td><td>${artSpan(c)}${c.plural?` <span class="small muted">Pl. ${esc(c.plural)}</span>`:''}${c.forms?` <span class="small muted">(${esc(c.forms)})</span>`:''}</td><td>${esc(c.en)}</td><td><span class="lvl">${c.level}</span></td><td class="small muted">${esc(c.exDe)}</td></tr>`).join('')||'<tr><td>Nichts gefunden.</td></tr>'}</table></div>`}};
R.deck=function(id){const d=VOCAB.find(x=>x.id===id);if(!d)return R.vocab();const cs=cards().filter(c=>c.deck===id);
  main().innerHTML=`<a href="#/vocab" class="small">← Wortschatz</a><h1><span class="lvl">${d.level}</span> ${esc(d.theme)}</h1><p class="sub">${cs.length} Wörter${d.note?' · '+esc(d.note):''}</p>
  <div class="row" style="margin-bottom:14px"><button class="pri" id="l1">Neue lernen</button><button id="l2">Alle abfragen</button><button id="l3">Nur Artikel-Training</button></div>
  <div class="card"><table class="t">${cs.map(c=>`<tr><td class="nw">${sayBtn(nounStr(c))}${starBtn(nounStr(c),c.en,d.level+' · '+d.theme,c.id)}</td><td>${artSpan(c)}${c.plural?` <span class="small muted">· Pl. ${esc(c.plural)}</span>`:''}${c.forms?` <span class="small muted">(${esc(c.forms)})</span>`:''}</td><td>${esc(c.en)}</td><td class="small muted">${c.exDe?sayBtn(c.exDe)+' '+esc(c.exDe):''}</td><td>${S.vocab[c.id]?`<span class="pill ${S.vocab[c.id].box>=3?'ok':''}">Box ${S.vocab[c.id].box}</span>`:''}</td></tr>`).join('')}</table></div>`;
  $('#l1').onclick=()=>vocabSession(cs.filter(c=>!S.vocab[c.id]).slice(0,S.settings.dailyNew),d.theme,'#/deck/'+id);
  $('#l2').onclick=()=>vocabSession(cs.map(c=>{S.vocab[c.id]=S.vocab[c.id]||{box:1,reps:0,lapses:0,due:today()};return c}),d.theme,'#/deck/'+id);
  $('#l3').onclick=()=>{const ns=cs.filter(c=>c.art);if(!ns.length)return toast('Keine Nomen in diesem Thema.');runSession({title:'Artikel: '+d.theme,back:'#/deck/'+id,items:shuffle(ns).map(c=>({type:'m',prompt:'___ '+c.lemma+'  ('+c.en+')',correct:c.art,options:['der','die','das'],answers:[c.art],cat:'gender',src:'vocab',key:'v:'+c.id+':art',spec:'v|'+c.id+'|prod',level:c.level,card:c})),onItem:(it,ok)=>{if(S.vocab[it.card.id])vReview(it.card,ok)}})}};

/* ERRORS */
R.errors=function(sub,arg){
  if(sub==='train'){const es=dueErrors().length?dueErrors():openErrors();const items=shuffle(es).slice(0,25).map(e=>itemFromSpec(e.spec,e)).filter(Boolean);return runSession({title:'Fehlertraining',items,back:'#/errors'})}
  if(sub==='cat'){return catTrain(arg)}
  const cs=catStats();const op=openErrors(),closed=S.errors.filter(e=>e.closed);
  main().innerHTML=`<h1>Fehlertraining</h1><p class="sub">${LH('Jede falsche Antwort wird gespeichert, automatisch einem Fehlermuster zugeordnet und so lange wiederholt, bis sie an <b>zwei verschiedenen Tagen</b> richtig war (offen → beobachten → behoben).','Every wrong answer is saved, automatically assigned to a mistake pattern and repeated until you get it right on <b>two different days</b> (open → watching → fixed).')}</p>
  <div class="grid g4"><div class="card stat"><b>${op.filter(e=>!e.streak).length}</b><span>offen</span></div><div class="card stat"><b>${op.filter(e=>e.streak).length}</b><span>beobachten (1× richtig)</span></div><div class="card stat"><b>${closed.length}</b><span>behoben</span></div><div class="card stat"><b>${dueErrors().length}</b><span>heute fällig</span><div style="margin-top:6px"><a class="btn pri sm" href="#/errors/train">Starten</a></div></div></div>
  <h2>Fehlermuster</h2><div class="card">${cs.length?`<table class="t"><tr><th>Muster</th><th>offen</th><th>gesamt</th><th></th></tr>${cs.map(c=>`<tr><td><b>${esc(catName(c.cat))}</b><div class="small muted">${esc((META.cats[c.cat]||{}).d||'')}</div></td><td>${c.open}</td><td>${c.total}</td><td><a class="btn sm" href="#/errors/cat/${c.cat}">Gezielt üben</a></td></tr>`).join('')}</table>`:'<p class="muted">Noch keine Fehler. Sobald Sie üben, erscheinen hier Ihre persönlichen Fehlermuster.</p>'}</div>
  <h2>Eigenen Fehler erfassen</h2><div class="card"><p class="small muted">Z. B. aus einer Schreibkorrektur, aus dem Unterricht oder aus einem Gespräch. Der Fehler wird dann wie alle anderen wiederholt.</p>
  <div class="grid g2"><input type="text" id="mw" placeholder="Falsch: z. B. Ich habe nach Zürich gefahren."><input type="text" id="mr" placeholder="Richtig: Ich bin nach Zürich gefahren."></div>
  <div class="row" style="margin-top:8px"><select id="mc" style="max-width:300px">${Object.entries(META.cats).map(([k,v])=>`<option value="${k}">${esc(v.n)}</option>`).join('')}</select><input type="text" id="mn" placeholder="Notiz / Regel (optional)" style="flex:1"><button class="pri" id="madd">Hinzufügen</button></div></div>
  <h2>Alle offenen Fehler (${op.length})</h2><div class="card"><table class="t"><tr><th>Datum</th><th>Muster</th><th>Ihre Antwort</th><th>Richtig</th><th>×</th><th>Status</th></tr>${op.slice().reverse().slice(0,200).map(e=>`<tr><td class="small">${e.date}</td><td class="small">${esc(catName(e.cat))}</td><td class="small" style="color:var(--bad)">${esc(e.given||'—')}</td><td class="small"><b>${esc(e.exp)}</b></td><td>${e.count}</td><td>${e.streak?'<span class="pill warn">beobachten</span>':'<span class="pill bad">offen</span>'}</td></tr>`).join('')}</table></div>`;
  $('#madd').onclick=()=>{const w=$('#mw').value.trim(),r=$('#mr').value.trim();if(!w||!r)return toast('Bitte falsche und richtige Version eingeben.');const spec='man|'+w.replace(/\|/g,'/')+'|'+r.replace(/\|/g,'/')+'|'+$('#mn').value.replace(/\|/g,'/');
    S.errors.push({id:'e'+Date.now().toString(36),key:'man:'+hash(spec),spec,src:'manual',cat:$('#mc').value,given:w,exp:r,ts:Date.now(),date:today(),count:1,streak:0,due:today(),closed:false});save();updateBadge();toast('Fehler gespeichert.');R.errors()}};
function catTrain(cat){const c=META.cats[cat]||{n:cat};const errs=openErrors().filter(e=>e.cat===cat).map(e=>itemFromSpec(e.spec,e)).filter(Boolean);
  const pool=[];UNITS.filter(u=>unitReached(u)).forEach(u=>unitItems(u).forEach(it=>{if(it.cat===cat||(u.cat===cat))pool.push(it)}));
  const extra=sample(pool.filter(p=>!errs.find(e=>e.key===p.key)),Math.max(0,15-errs.length));
  const rel=UNITS.filter(u=>u.cat===cat||(u.tags||[]).includes(cat));
  main().innerHTML=`<a href="#/errors" class="small">← Fehlertraining</a><h1>${esc(c.n)}</h1><p class="sub">${esc(c.d||'')}</p><div class="gram" style="padding-top:14px">${TH(c.tip||'',(IC().cats||{})[cat])}</div>
  ${rel.length?`<p class="small" style="margin-top:12px">Zugehörige Einheiten: ${rel.map(u=>`<a href="#/unit/${u.id}">${u.level} ${U(u.title)}</a>`).join(' · ')}</p>`:''}
  <div class="row" style="margin-top:14px"><button class="pri" id="go">${errs.length} eigene Fehler + ${extra.length} Zusatzaufgaben üben</button></div>`;
  $('#go').onclick=()=>runSession({title:'Gezielt: '+c.n,items:shuffle(errs.concat(extra)),back:'#/errors/cat/'+cat})}

/* DICTATION & SHADOWING (TTS based) */
R.dictation=function(uid){const pool=[];const us=uid?[unitById(uid)]:UNITS.filter(unitReached);us.forEach(u=>(u.examples||[]).forEach(e=>pool.push({u,s:e[0]})));
  const items=sample(pool,uid?pool.length:12).map(p=>({type:'d',prompt:'',answers:[p.s],cat:'listening',src:'dict',key:'d:'+hash(p.s),spec:'dict|'+p.s,level:p.u.level}));
  runSession({title:'Diktat',items,back:uid?'#/unit/'+uid+'/exs':'#/listen'})};
R.shadow=function(uid){const pool=[];const us=uid?[unitById(uid)]:UNITS.filter(unitReached);us.forEach(u=>(u.examples||[]).forEach(e=>pool.push(e[0])));
  shadowSession(uid?pool:sample(pool,10),uid?'#/unit/'+uid+'/exs':'#/speak')};
function shadowSession(sents,back){let i=0,scores=[];
  function show(){if(i>=sents.length){main().innerHTML=`<div class="quiz"><div class="qcard result"><div class="big">${scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length*100):0}%</div><p>Durchschnittliche Erkennungsquote</p><a class="btn pri" href="${back}">Fertig</a></div></div>`;return}
    const s=sents[i];main().innerHTML=`<div class="quiz"><div class="qhead"><a class="btn sm" href="${back}">✕</a><div class="bar"><i style="width:${i/sents.length*100}%"></i></div><span class="small muted">${i+1}/${sents.length}</span></div>
    <div class="qcard"><div class="qtype">Nachsprechen</div><div class="qprompt">${esc(s)}</div><div class="row"><button id="pl">▶ Vorsprechen</button><button id="sl">▶ Langsam</button><span class="spacer"></span>${REC?'<button class="mic" id="mic" title="Sprechen">🎤</button>':''}</div>
    ${REC?'':`<div style="margin-top:14px"><textarea id="dict" style="min-height:70px" placeholder="Tippen Sie hier, dann auf das Mikrofon Ihrer Tastatur und sprechen Sie den Satz (Tastatur-Sprache: Deutsch)."></textarea><div class="row" style="margin-top:8px"><button class="pri" id="dchk">Aussprache prüfen</button><span class="small muted">Die Diktierfunktion der Tastatur erkennt, was Sie gesagt haben.</span></div></div>`}
    <div id="out" style="margin-top:14px"></div><div class="qfoot"><button id="nx" class="pri">Weiter</button></div></div></div>`;
    $('#pl').onclick=()=>say(s);$('#sl').onclick=()=>saySlow(s);setTimeout(()=>say(s),300);
    $('#nx').onclick=()=>{i++;show()};
    const evalS=t=>{const sc=speechScore(s,t);scores.push(sc.score);hist().n++;if(sc.score>=0.85)hist().ok++;addXP(2);if(sc.missed.length)logPron(s,sc.missed,t);
        $('#out').innerHTML=`<div class="fb ${sc.score>=0.85?'ok':sc.score>=0.6?'warn':'bad'}"><b class="h">${Math.round(sc.score*100)}% erkannt</b><div>Erkannt: „${esc(t)}“</div><div style="margin-top:6px">${sc.html}</div>${sc.missed.length?`<div class="small" style="margin-top:6px">Nicht erkannt: ${sc.missed.map(w=>`<b>${esc(w)}</b> ${sayBtn(w)}`).join(' ')}</div>`:''}</div>`};
    const dc=$('#dchk');if(dc)dc.onclick=()=>{const t=$('#dict').value.trim();if(t)evalS(t)};
    const mic=$('#mic');if(mic)mic.onclick=async()=>{if(!REC){$('#out').innerHTML=`<div class="fb warn">Spracherkennung wird in diesem Browser nicht unterstützt. Bitte Chrome oder Edge verwenden (Mikrofon erlauben). Sie können trotzdem laut nachsprechen und mit dem Vorbild vergleichen.</div>`;return}
      const m=$('#mic');m.classList.add('rec');$('#out').innerHTML='<span class="muted">Ich höre zu…</span>';
      try{const t=await recognize(x=>$('#out').innerHTML='<span class="muted">'+esc(x)+'</span>');m.classList.remove('rec');const sc=speechScore(s,t);scores.push(sc.score);hist().n++;if(sc.score>=0.85)hist().ok++;addXP(2);
        if(sc.missed.length)logPron(s,sc.missed,t);
        $('#out').innerHTML=`<div class="fb ${sc.score>=0.85?'ok':sc.score>=0.6?'warn':'bad'}"><b class="h">${Math.round(sc.score*100)}% erkannt</b><div>Erkannt: „${esc(t)}“</div><div style="margin-top:6px">${sc.html}</div>${sc.missed.length?`<div class="small" style="margin-top:6px">Nicht erkannt: ${sc.missed.map(w=>`<b>${esc(w)}</b> ${sayBtn(w)}`).join(' ')}</div>`:''}</div>`}
      catch(e){m.classList.remove('rec');$('#out').innerHTML=`<div class="fb warn">Mikrofon/Erkennung nicht verfügbar (${esc(e.error||e.message||e)}). Prüfen Sie die Mikrofonberechtigung im Browser.</div>`}}}
  show()}
function wnorm(s){return baseNorm(s).toLowerCase().replace(/[.,!?;:"„“'()–-]/g,' ').split(/\s+/).filter(Boolean)}
function speechScore(target,heard){const a=wnorm(target),b=wnorm(heard);const d=lcs(a,b);const hit=d.filter(x=>x[0]==='=').length;const missed=d.filter(x=>x[0]==='-').map(x=>x[1]);
  return{score:a.length?hit/a.length:0,missed,html:d.filter(x=>x[0]!=='+').map(([k,w])=>k==='='?`<span style="color:var(--ok)">${esc(w)}</span>`:`<span style="color:var(--bad);text-decoration:underline">${esc(w)}</span>`).join(' ')}}
function logPron(sent,missed,heard){const key='pr:'+hash(sent);const ex=S.errors.find(e=>e.key===key&&!e.closed);
  if(ex){ex.count++;ex.given=heard;ex.date=today();ex.streak=0}else S.errors.push({id:'e'+Date.now().toString(36),key,spec:'dict|'+sent,src:'speak',cat:'aussprache',given:heard+'  (nicht erkannt: '+missed.join(', ')+')',exp:sent,ts:Date.now(),date:today(),count:1,streak:0,due:addDays(today(),1),closed:false});save();updateBadge()}

function unitTracksHTML(u){const tr=[];(LISTEN.groups||[]).forEach(g=>g.tracks.forEach(t=>{if(t.unit===u.id)tr.push(t)}));if(!tr.length)return '';
  const main=tr.filter(t=>t.qs&&t.qs.length),rest=tr.filter(t=>!(t.qs&&t.qs.length));
  return `<div class="card" style="margin-top:14px"><b>♪ Hörtexte aus dem Kursbuch (${esc(tr[0].chapter)})</b><p class="small muted" style="margin:4px 0 8px">Originalaufnahmen zum Thema dieser Einheit – mit Lückentext und Transkript.</p><div class="chips">${main.concat(rest).slice(0,10).map(t=>`<a class="chip" href="#/listen/track/${t.id}">${t.qs&&t.qs.length?'★ ':''}${esc(t.label)} · ${esc(t.title.slice(0,38))}</a>`).join('')}</div></div>`}
/* LISTENING */
const AUDIO={};let TRANSCRIPTS_LOADED=false;
/* audio packs (Audio-Paket-N.dta): compressed book audio for phones, cached in IndexedDB */
const PK={of:0,have:new Set(),cached:false};
function pkDB(){return new Promise((res,rej)=>{const r=indexedDB.open('dt-audio',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function pkParse(blob){const hd=await blob.slice(0,12).arrayBuffer();const u=new Uint8Array(hd);if(String.fromCharCode(...u.slice(0,8))!=='DTAUDIO1')throw new Error('nopack');
  const hl=new DataView(hd).getUint32(8,true);const h=JSON.parse(await blob.slice(12,12+hl).text());const base=12+hl;
  h.files.forEach(f=>{if(AUDIO[f.n])URL.revokeObjectURL(AUDIO[f.n]);AUDIO[f.n]=URL.createObjectURL(new Blob([blob.slice(base+f.o,base+f.o+f.l)],{type:'audio/mpeg'}))});
  if(h.transcripts)mergeTranscripts(h.transcripts);if(h.exam_b1)window.EXAM_B1=h.exam_b1;PK.of=h.of;PK.have.add(h.pack);return h}
async function pkStore(key,blob){try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
  try{const d=await pkDB();await new Promise((r,j)=>{const t=d.transaction('p','readwrite');t.objectStore('p').put(blob,key);t.oncomplete=r;t.onerror=()=>j(t.error);t.onabort=()=>j(t.error)});PK.cached=true;return true}catch(e){return false}}
async function pkLoadAll(){try{const d=await pkDB();const all=await new Promise(r=>{const out=[];const q=d.transaction('p').objectStore('p').openCursor();q.onsuccess=()=>{const c=q.result;if(c){out.push(c.value);c.continue()}else r(out)};q.onerror=()=>r(out)});
  for(const b of all){try{await pkParse(b);PK.cached=true}catch(e){}}if(all.length&&/^listen|^speak|^mock/.test(CUR||''))route()}catch(e){}}
function pkStatus(){return PK.have.size?`📦 ${PK.have.size}/${PK.of} Audio-Pakete ${PK.cached?'auf diesem Gerät gespeichert':'geladen (nur für diese Sitzung)'}`:''}
const AUD_BASE=(()=>{try{return /\/app\/[^\/]*$/i.test(decodeURIComponent(location.pathname))?'../':''}catch(e){return ''}})();
function audioURL(path){const b=path.split('/').pop();if(AUDIO[b])return AUDIO[b];return AUD_BASE+path.split('/').map(encodeURIComponent).join('/')}
function hasAudio(path){return !!AUDIO[path.split('/').pop()]}
function pickerHTML(){return `<div class="card" style="margin:12px 0"><b>Audio aus Ihren Büchern laden</b><p class="small muted" style="margin:6px 0 10px">${IN_VIEWER?'In der Web-Version liegen die Originalaudios nicht online. Wählen Sie den Ordner „German“ (Computer) oder die MP3-Dateien (Handy, z. B. aus OneDrive/iCloud/Dateien). Liegt <i>trainer/data/listening.js</i> dabei, werden auch die Transkripte und Lückentexte freigeschaltet. Die Dateien bleiben auf Ihrem Gerät.':'Falls die Audios nicht gefunden werden: Ordner „German“ oder einzelne MP3-Dateien wählen.'}</p>
 <div class="row"><label class="btn pri">Ordner wählen<input type="file" id="pkDir" webkitdirectory multiple style="display:none"></label><label class="btn">Dateien wählen<input type="file" id="pkFiles" multiple accept="audio/*,.mp3,.js" style="display:none"></label><label class="btn">📦 Audio-Pakete (Handy)<input type="file" id="pkPack" multiple style="display:none"></label><span class="small muted" id="pkStat">${PK.have.size?pkStatus():Object.keys(AUDIO).length?Object.keys(AUDIO).length+' Audiodateien geladen'+(TRANSCRIPTS_LOADED?' · Transkripte geladen':''):''}</span></div>
 <p class="small muted" style="margin:10px 0 0"><b>Handy:</b> „📦 Audio-Pakete“ tippen und die 9 Dateien <i>Audio-Paket-1…9.dta</i> aus dem Ordner <i>German › App › Audio</i> (pCloud) wählen – alle auf einmal oder nacheinander. Sie werden einmalig auf dem Handy gespeichert (ca. 200 MB) und funktionieren danach auch offline.</p></div>`}
function bindPicker(after){const h=async e=>{const fs=[...e.target.files];let n=0,np=0,stored=true;const st=$('#pkStat');for(const f of fs){const nm=f.name;
   if(/\.dta$/i.test(nm)||(!/\.(mp3|js)$/i.test(nm)&&f.size>1e6)){if(st)st.textContent='Lade '+nm+' …';try{const b=new Blob([await f.arrayBuffer()],{type:'application/octet-stream'});const h=await pkParse(b);np++;n+=h.files.length;if(!(await pkStore('pack'+h.pack,b)))stored=false}catch(x){toast('Keine gültige Audio-Paket-Datei: '+nm)}continue}
   if(/\.mp3$/i.test(nm)){if(AUDIO[nm])URL.revokeObjectURL(AUDIO[nm]);AUDIO[nm]=URL.createObjectURL(f);n++}else if(nm==='listening.js'){try{const t=await f.text();const d=JSON.parse(t.replace(/^\s*window\.LISTEN\s*=\s*/,'').replace(/;\s*$/,''));mergeTranscripts(d)}catch(x){toast('Transkripte konnten nicht gelesen werden.')}}}
   if(np){toast(pkStatus()+(PK.have.size<PK.of?' – bitte noch die übrigen Pakete wählen.':' ✓')+(stored?'':' (Speichern auf dem Gerät nicht möglich – beim nächsten Mal erneut wählen.)'))}else toast(n+' Audiodateien geladen'+(TRANSCRIPTS_LOADED?' · Transkripte freigeschaltet':''));after&&after()};
  ['pkDir','pkFiles','pkPack'].forEach(id=>{const el=document.getElementById(id);if(el)el.onchange=h})}
function mergeTranscripts(d){const map={};(d.groups||[]).forEach(g=>g.tracks.forEach(t=>map[t.id]=t.text));(d.aussprache||[]).forEach(a=>a.tracks.forEach(t=>map[t.id]=t.text));
  (LISTEN.groups||[]).forEach(g=>g.tracks.forEach(t=>{if(map[t.id])t.text=map[t.id]}));(LISTEN.aussprache||[]).forEach(a=>a.tracks.forEach(t=>{if(map[t.id])t.text=map[t.id]}));TRANSCRIPTS_LOADED=true}

  <div class="grid g3"><div class="card click" onclick="nav('#/dictation')"><h3>Diktat (alle Niveaus)</h3><p class="small muted">12 Sätze aus freigeschalteten Einheiten. Hören → schreiben → Vergleich Wort für Wort.</p></div>
  <div class="card"><h3>Hörtipps</h3><p class="small muted">Erst ohne Transkript hören, Fragen lösen. Dann mit Transkript nochmal. Dann Lückentext. Zum Schluss laut mitlesen (Shadowing).</p></div>
  <div class="card"><h3>Audio-Dateien</h3><p class="small muted" id="audchk">${IN_VIEWER?'Web-Version: Audios unten aus Ihrem Ordner wählen.':'Die Originalaufnahmen werden aus Ihrem Ordner geladen. Diese Seite muss dazu im Ordner „German“ liegen.'}</p></div></div>
  ${IN_VIEWER||Object.keys(AUDIO).length?pickerHTML():''}
  ${['A1','A2','B1','B2'].filter(l=>groups.some(g=>g.level===l)).map(l=>`<h2>Originalaufnahmen ${l} <span class="lvl">${l}</span></h2>`+groups.filter(g=>g.level===l).map(g=>{const done=g.tracks.filter(t=>(S.listen[t.id]||{}).best!=null).length;const chs=[...new Set(g.tracks.map(t=>t.chapter||''))];
   return `<details class="card lgroup"><summary><b>${esc(g.title)}</b> <span class="small muted">· ${g.tracks.length} Tracks${done?` · ${done} bearbeitet`:''}</span></summary><p class="small muted">${esc(g.note||'')}</p>${chs.map(ch=>`<h4 style="margin:12px 0 4px">${esc(ch)}</h4><table class="t">${g.tracks.filter(t=>(t.chapter||'')===ch).map(t=>{const st=S.listen[t.id]||{};return `<tr><td style="width:70px"><span class="pill">${esc(t.label)}</span></td><td><a href="#/listen/track/${t.id}"><b>${t.qs&&t.qs.length?'★ ':''}${esc(t.title)}</b></a></td><td class="small">${t.qs&&t.qs.length?t.qs.length+' Fragen · ':''}${t.notext?'Hören & Nachsprechen':'Lückentext'}</td><td>${st.best!=null?`<span class="pill ${st.best>=0.8?'ok':'warn'}">${Math.round(st.best*100)}%</span>`:''}</td></tr>`}).join('')}</table>`).join('')}</details>`}).join('')).join('')}`;
  bindPicker(()=>R.listen());const t0=groups[0]&&groups[0].tracks[0];if(t0&&!IN_VIEWER){const a=new Audio();a.preload='metadata';a.onloadedmetadata=()=>{$('#audchk').innerHTML='✓ Audio-Dateien gefunden.'};a.onerror=()=>{const e=$('#audchk');if(e)e.innerHTML='<span style="color:var(--bad)">⚠ Audio-Dateien nicht gefunden.</span> Auf dem Handy: unten „📦 Audio-Pakete“ wählen. Am Computer: <b>App/Deutsch-Trainer.html</b> im Ordner „German“ öffnen.';if(!$('#pkDir')){const c=e&&e.closest('.grid');if(c){c.insertAdjacentHTML('afterend',pickerHTML());bindPicker(()=>R.listen())}}};a.src=audioURL(t0.file)}};
function trackView(id){let t,g;for(const gg of LISTEN.groups||[]){const f=gg.tracks.find(x=>x.id===id);if(f){t=f;g=gg}}if(!t)return R.listen();
  main().innerHTML=`<a href="#/listen" class="small">← Hören</a><h1>${esc(t.title)}</h1><p class="sub">${esc(g.title)} · <span>${esc(t.chapter||'')}</span></p>
  <div class="card"><audio controls preload="metadata" id="au" src="${audioURL(t.file)}"></audio><div class="row small"><span>Tempo:</span>${[0.75,0.9,1,1.15].map(r=>`<button class="sm" data-rate="${r}">${r}×</button>`).join('')}<button class="sm" id="back5">⟲ 5 s</button><span class="spacer"></span><span class="muted">${esc(t.task||'')}</span></div></div>
  <div class="tabs"><button data-t="q" class="on">${t.qs&&t.qs.length?'Fragen':'Aufgabe'}</button>${t.notext?'':'<button data-t="c">Lückentext</button><button data-t="tr">Transkript</button>'}</div><div id="tt"></div>`;
  const au=$('#au');$$('[data-rate]').forEach(b=>b.onclick=()=>au.playbackRate=+b.dataset.rate);$('#back5').onclick=()=>au.currentTime=Math.max(0,au.currentTime-5);
  au.onerror=()=>{if($('#pkDir'))return;$('#tt').insertAdjacentHTML('beforebegin','<div class="fb warn">Audio nicht gefunden: <b>'+esc(t.file.split('/').pop())+'</b>.</div>'+pickerHTML());bindPicker(()=>trackView(id))};
  const tabs=$$('.tabs button');tabs.forEach(b=>b.onclick=()=>{tabs.forEach(x=>x.classList.toggle('on',x===b));show(b.dataset.t)});
  function show(k){const tt=$('#tt');
    if((k==='tr'||k==='c')&&!t.text){tt.innerHTML=`<div class="card"><p>Das Transkript stammt aus Ihrem Buch und ist in der Web-Version nicht gespeichert.</p><p class="small muted">Wählen Sie den Ordner „German“ (bzw. die Datei <i>trainer/data/listening.js</i>), um Transkript und Lückentext auf diesem Gerät freizuschalten.</p></div>${$('#pkDir')?'':pickerHTML()}`;bindPicker(()=>show(k));return}
    if(k==='tr')tt.innerHTML=`<div class="transcript">${esc(t.text)}</div><p class="small muted">Tipp: Transkript mitlesen, dann Abschnitte laut nachsprechen (Shadowing).</p>`;
    else if(k==='c')clozeView(t,tt);

      inlineQuiz(tt,t.qs.map((q,i)=>parseItem(q,{src:'listen:'+t.id,key:'L:'+t.id+'#'+i,cat:'listening',level:g.level})),pct=>{const st=S.listen[t.id]=S.listen[t.id]||{};st.best=Math.max(st.best||0,pct);st.last=today();save()})}}
  show('q')}
function clozeView(t,el){const words=t.text.split(/(\s+)/);let n=0,k=0;const blanks=[];
  const html=words.map(w=>{if(/^\s+$/.test(w))return esc(w);const core=w.match(/^([„"(]*)([A-Za-zÄÖÜäöüß]{4,})([.,!?;:“")]*)$/);n++;
    if(core&&n%7===3&&!/:$/.test(w)){blanks.push(core[2]);return esc(core[1])+`<input type="text" data-c="${k++}" style="width:${core[2].length*10+16}px" autocomplete="off" spellcheck="false">`+esc(core[3])}return esc(w)}).join('');
  el.innerHTML=`<div class="transcript cloze">${html}</div><div class="row" style="margin-top:10px"><button class="pri" id="cchk">Auswerten</button><button id="csol">Lösungen zeigen</button><span id="cres"></span></div>`;
  $('#cchk').onclick=()=>{let ok=0;$$('[data-c]',el).forEach(i=>{const a=blanks[+i.dataset.c];const r=baseNorm(i.value).toLowerCase()===baseNorm(a).toLowerCase();i.className=r?'r':'w';if(r)ok++});const pct=ok/blanks.length;$('#cres').innerHTML=`<b>${ok}/${blanks.length}</b> richtig`;hist().n+=blanks.length;hist().ok+=ok;addXP(Math.round(ok/2));const st=S.listen[t.id]=S.listen[t.id]||{};st.cloze=Math.max(st.cloze||0,pct);save()};
  $('#csol').onclick=()=>$$('[data-c]',el).forEach(i=>{if(i.className!=='r'){i.value=blanks[+i.dataset.c];i.className='w'}})}
function inlineQuiz(el,items,onScore){
  el.innerHTML=`<div class="card">${items.map((it,i)=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)" data-q="${i}"><div><b>${i+1}.</b> ${esc(it.prompt)}</div>${it.type==='m'?`<div class="row" style="margin-top:6px">${(/^(Richtig~Falsch|Falsch~Richtig)$/.test(it.answerRaw)?['Richtig','Falsch']:shuffle(it.options)).map(o=>`<label class="chip"><input type="radio" name="q${i}" value="${esc(o)}" style="display:none">${esc(o)}</label>`).join('')}</div>`:`<input type="text" style="margin-top:6px" autocomplete="off">`}<div class="qfb small"></div></div>`).join('')}
  <div class="row" style="margin-top:14px"><button class="pri" id="qchk">Auswerten</button><span id="qres"></span></div></div>`;
  $$('.chip',el).forEach(c=>c.onclick=()=>{$$('.chip',c.parentNode).forEach(x=>x.classList.remove('on'));c.classList.add('on');c.querySelector('input').checked=true});
  $('#qchk').onclick=()=>{let ok=0;items.forEach((it,i)=>{const box=$(`[data-q="${i}"]`,el);let given,res;
    if(it.type==='m'){const r=$('input:checked',box);given=r?r.value:'';res={ok:given===it.correct,best:it.correct}}else{given=$('input',box).value;res=check(given,it.answers||it.gaps.map(g=>g[0]))}
    if(res.ok){ok++;errorFixed(it)}else logError(it,given,it.cat);
    $('.qfb',box).innerHTML=res.ok?'<span style="color:var(--ok)">✓ richtig</span>':`<span style="color:var(--bad)">✗ richtig: <b>${esc(res.best)}</b></span>${it.explain?' – '+esc(it.explain):''}`});
    hist().n+=items.length;hist().ok+=ok;addXP(ok*2);$('#qres').innerHTML=`<b>${ok}/${items.length}</b> richtig`;onScore&&onScore(ok/items.length)}}

function claudePrompt(kind,t,text){return `Du bist mein strenger Deutschlehrer (Hochdeutsch, Ziel: ${t.level}, Prüfung: ${t.exam||'Einbürgerung Schweiz'}).\n${kind==='speak'?'Hier ist das automatische Transkript meiner mündlichen Antwort (Erkennungsfehler möglich – nur echte Grammatik-/Wortschatzfehler bewerten).':'Hier ist mein schriftlicher Text.'}\n\nAufgabe: ${t.title}\n${(t.promptText||t.prompt||'').replace(/<[^>]+>/g,' ')}\n\nMein Text:\n"""\n${text}\n"""\n\nBitte:\n1. Bewerte nach den Kriterien der Prüfung (Aufgabenerfüllung, Kohärenz, Wortschatz, Strukturen) mit geschätztem Niveau.\n2. Liste JEDEN Fehler als Tabelle: Falsch | Richtig | Fehlerkategorie (Kasus, Artikel/Genus, Satzstellung, Verbkonjugation, Adjektivendung, Präposition, Perfekt, Konnektor, Wortschatz, Rechtschreibung, Register) | kurze Regel.\n3. Zeige eine verbesserte Version auf ${t.level}-Niveau.\n4. Nenne meine 3 wichtigsten wiederkehrenden Fehlermuster.\nDie Fehlerliste übertrage ich in meinen Trainer.`}

function writingChecks(txt,t){const out=[];let bad=0;const n=txt.split(/\s+/).filter(Boolean).length;
  if(n<t.words*0.9){out.push(`⚠ Zu kurz: ${n}/${t.words} Wörter`);bad++}
  if(t.formal){if(!/^(Sehr geehrte|Guten Tag)/m.test(txt.trim())){out.push('⚠ Formelle Anrede fehlt (Sehr geehrte Damen und Herren, / Sehr geehrte Frau …,)');bad++}
    if(!/(Freundliche Grüsse|Freundliche Grüße|Mit freundlichen Grüssen|Mit freundlichen Grüßen)/i.test(txt)){out.push('⚠ Formeller Gruss fehlt (Freundliche Grüsse / Mit freundlichen Grüssen)');bad++}
    if(/\b(du|dich|dir|dein|deine)\b/i.test(txt)){out.push('⚠ „du“ in einem formellen Text gefunden – Sie-Form verwenden');bad++}
    const m=txt.match(/[a-zäöü,] (sie|ihnen|ihr) (bitte|mitteilen|danken|helfen)/g);if(m){out.push('⚠ Höflichkeitsform gross schreiben: Sie / Ihnen / Ihr');bad++}}
  if(t.informal&&/^Sehr geehrte/m.test(txt.trim())){out.push('⚠ Informelle Aufgabe – Anrede „Liebe/Lieber …“ passt besser');bad++}
  const longS=txt.split(/[.!?]/).filter(s=>s.split(/\s+/).length>35).length;if(longS)out.push(`ℹ ${longS} sehr lange(r) Satz/Sätze – prüfen Sie Verbposition und Kommas`);
  if(/,\s*(dass|weil|obwohl|wenn|ob|damit|nachdem|bevor|während)\s+[^,.]*\b(ist|hat|kann|muss|will|wird|sind|haben)\s+[a-zäöü]+\s*[.,]/i.test(txt))out.push('ℹ Nebensatz gefunden, in dem nach dem Hilfsverb noch ein Wort folgt – steht das konjugierte Verb am Ende?');
  if((t.points||[]).length)out.push(`☐ Prüfen: Haben Sie alle ${t.points.length} Inhaltspunkte behandelt?`);
  return{bad,html:out.join('<br>')||'✓ Formale Checks bestanden.'}}

function mockRubric(prefix,criteria,run,max){return `<table class="t mk-rub"><tr><th>Kriterium</th>${Object.keys(MK_LV).map(l=>`<th>${l}</th>`).join('')}</tr>${criteria.map(c=>`<tr><td><b>${esc(c.n)}</b><div class="small muted">${esc(c.d)}</div></td>${Object.keys(MK_LV).map(l=>`<td><button type="button" class="sm ${run.rate[prefix+c.k]===l?'pri':''}" data-rate="${prefix+c.k}" data-l="${l}">${l}</button></td>`).join('')}</tr>`).join('')}</table><p class="small muted">Punkte: <b data-sum="${prefix}">${mockRubricPts(prefix,criteria,run,max)}</b> / ${max}</p>`}
function mockRubricPts(prefix,criteria,run,max){const r=criteria.map(c=>run.rate[prefix+c.k]);if(r.some(x=>!x))return '–';if(run.rate[prefix+'erf']==='E')return 0;return Math.round(r.reduce((s,l)=>s+MK_LV[l],0)/criteria.length*max)}
function mockLevels(levels){return `<details class="small"><summary>Was bedeuten A–E?</summary><ul>${levels.map(([l,d])=>`<li><b>${l}</b> – ${esc(d)}</li>`).join('')}</ul></details>`}
function mockWrite(){const E=window.EXAM_B1,W=E.schreiben,run=mockRun('schreiben');run.rate=run.rate||{};run.txt=run.txt||{};const done=!!run.done;
  const wc=s=>(String(s||'').trim().match(/\S+/g)||[]).length;
  main().innerHTML=`<div class="row mk-head"><a href="#/mock" class="btn sm">← Übersicht</a><h1 style="margin:0">Schreiben · B1</h1><span class="spacer"></span>${done?'':`<span class="timer" id="mkT"></span>`}</div>
  <p class="sub">${W.min} Minuten für alle drei Aufgaben. Schreiben Sie ohne Hilfsmittel. Danach: mit Claude korrigieren lassen und sich selbst nach den offiziellen Kriterien einstufen.</p>
  ${W.tasks.map(t=>`<div class="card mk-task" style="margin-bottom:16px"><h3>Aufgabe ${t.n} <span class="small muted">· ${t.min} Min. · ca. ${t.words} Wörter · ${t.pts} Punkte</span></h3><p><b>${esc(t.title)}</b></p><p>${esc(t.situation)}</p>
   ${t.quote?`<div class="readtext small"><b>${esc(t.quote.who)}</b><p>${esc(t.quote.text)}</p></div>`:''}${t.points.length>1?`<ul>${t.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`:''}<p class="small">${esc(t.note)}</p>
   <textarea id="mkW${t.n}" data-w="${t.n}" ${done?'readonly':''} placeholder="Ihr Text …" style="min-height:180px">${esc(run.txt[t.n]||'')}</textarea>
   <p class="small muted"><span data-wc="${t.n}">${wc(run.txt[t.n])}</span> Wörter (Ziel ca. ${t.words}; unter ${Math.round(t.words/2)} = 0 Punkte)</p>
   <div class="row" data-ai="${t.n}"><button class="sm" data-cp="${t.n}">📋 Kopieren (für Claude)</button></div>
   ${done?`<h4>Selbsteinschätzung</h4>${mockRubric('w'+t.n,W.criteria,run,t.pts)}`:''}</div>`).join('')}
  ${done?mockLevels(W.levels)+`<div class="card mk-res" style="margin-top:12px"><h3>Schreiben gesamt: <span id="mkWS">${mockWriteTotal(W,run)}</span> / 100</h3><p class="small muted">Schätzung nach den offiziellen Kriterien (Aufgabe 1 und 2: je 40, Aufgabe 3: 20 Punkte; Erfüllung „E“ = 0 Punkte für die Aufgabe).</p><button class="pri" id="mkSave">Ergebnis speichern</button> <button id="mkAgain">↺ Neu beginnen</button></div>`:`<div class="row" style="margin:20px 0"><button class="pri" id="mkDone">✔ Fertig – zur Bewertung</button></div>`}`;
  if(!done)mockTimer($('#mkT'),'schreiben',W.min,()=>{toast('Zeit abgelaufen.');run.done=true;save();route()});
  W.tasks.forEach(t=>{const row=$(`[data-ai="${t.n}"]`);addAiButton(row,()=>$('#mkW'+t.n).value,{level:'B1',title:t.title,prompt:t.situation+' '+t.points.join(' ')+' '+t.note,points:t.points,exam:'Goethe-/ÖSD-Zertifikat B1, Schreiben Aufgabe '+t.n+' ('+t.funcs+')'},'write')});
  main().oninput=e=>{const n=e.target.dataset.w;if(!n)return;run.txt[n]=e.target.value;$(`[data-wc="${n}"]`).textContent=wc(e.target.value);clearTimeout(run._h);run._h=setTimeout(save,500)};
  main().onclick=e=>{const cp=e.target.closest('[data-cp]');if(cp){const t=W.tasks[cp.dataset.cp-1];copy(claudePrompt('write',{level:'B1',title:t.title,prompt:t.situation+' '+t.note,points:t.points},$('#mkW'+t.n).value));return}
    const r=e.target.closest('[data-rate]');if(r){run.rate[r.dataset.rate]=r.dataset.l;save();$$(`[data-rate="${r.dataset.rate}"]`).forEach(x=>x.classList.toggle('pri',x===r));W.tasks.forEach(t=>{const s=$(`[data-sum="w${t.n}"]`);if(s)s.textContent=mockRubricPts('w'+t.n,W.criteria,run,t.pts)});$('#mkWS').textContent=mockWriteTotal(W,run);return}
    if(e.target.id==='mkDone'){run.done=true;save();route()}
    if(e.target.id==='mkSave'){const p=mockWriteTotal(W,run);if(p==='–'){toast('Bitte alle Kriterien bewerten.');return}mockS().res.schreiben={pts:p,date:today()};W.tasks.forEach(t=>{if(run.txt[t.n])S.writing['mockB1-'+t.n]={text:String(run.txt[t.n]).slice(0,4000),date:today()}});addXP(20);save();toast('Gespeichert.');nav('#/mock')}
    if(e.target.id==='mkAgain'){delete mockS().run.schreiben;save();route()}}}
function mockWriteTotal(W,run){const p=W.tasks.map(t=>mockRubricPts('w'+t.n,W.criteria,run,t.pts));return p.includes('–')?'–':p.reduce((a,b)=>a+b,0)}
const MK_SP_MAX={1:28,2:40,3:16,aus:16};
function mockSpeak(){const E=window.EXAM_B1,P=E.sprechen,run=mockRun('sprechen');run.rate=run.rate||{};const done=!!run.done;run.theme=run.theme||0;
  const crit=P.criteria.filter(c=>c.k!=='aus'),aus=P.criteria.filter(c=>c.k==='aus');
  const T2=P.teile[1].themes[run.theme];
  main().innerHTML=`<div class="row mk-head"><a href="#/mock" class="btn sm">← Übersicht</a><h1 style="margin:0">Sprechen · B1</h1><span class="spacer"></span><span class="timer" id="mkT"></span></div>
  <p class="sub">Vorbereitung ${P.prep} Minuten (Notizen erlaubt), dann ca. ${P.min} Minuten Prüfung zu zweit. Üben Sie mit einer Partnerin/einem Partner oder sprechen Sie Teil 1 in beiden Rollen. Tipp: Nehmen Sie sich mit dem Handy auf und hören Sie danach kritisch zu.</p>
  <div class="row" style="margin-bottom:10px"><button class="sm" data-tm="prep">⏱ Vorbereitung (${P.prep} Min.)</button><button class="sm" data-tm="t1">Teil 1 (3 Min.)</button><button class="sm" data-tm="t2">Teil 2 (3 Min.)</button><button class="sm" data-tm="t3">Teil 3 (2 Min.)</button></div>
  ${P.teile.map(t=>`<div class="card" style="margin-bottom:14px"><h3>Teil ${t.n}: ${esc(t.title)} <span class="small muted">· ca. ${t.min} Min.</span></h3>
    ${t.situation?`<p><i>${esc(t.situation)}</i></p>`:''}<p>${esc(t.task)}</p>
    ${t.head?`<div class="readtext"><b>${esc(t.head)}</b><ul>${t.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`:''}
    ${t.themes?`<div class="row">${t.themes.map((x,i)=>`<button class="sm ${run.theme===i?'pri':''}" data-theme="${i}">Thema ${i+1}</button>`).join('')}</div><h4>${esc(T2.t)}</h4><ol>${T2.slides.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:''}
    ${t.qs?`<p class="small"><b>Mögliche Fragen der Prüfer:</b></p><ul class="small">${t.qs.map(q=>`<li>${esc(q)} <button class="say" data-say="${esc(q)}">🔊</button></li>`).join('')}</ul>`:''}
    <details class="small"><summary>Nützliche Redemittel</summary><ul>${t.phrases.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></details>
    ${done?`<h4>Selbsteinschätzung Teil ${t.n}</h4>${mockRubric('s'+t.n,crit,run,MK_SP_MAX[t.n])}`:''}</div>`).join('')}
  ${done?`<div class="card"><h4>Aussprache (einmal für die ganze Prüfung)</h4>${mockRubric('saus',aus,run,MK_SP_MAX.aus)}</div>`+mockLevels(E.schreiben.levels)+`<div class="card mk-res" style="margin-top:12px"><h3>Sprechen gesamt: <span id="mkSS">${mockSpeakTotal(crit,aus,run)}</span> / 100</h3><p class="small muted">Schätzung nach den offiziellen Kriterien. Die Gewichtung der Teile (28 / 40 / 16 + Aussprache 16) ist eine Annäherung.</p><button class="pri" id="mkSave">Ergebnis speichern</button> <button id="mkAgain">↺ Neu beginnen</button></div>`:`<div class="row" style="margin:20px 0"><button class="pri" id="mkDone">✔ Fertig – zur Selbsteinschätzung</button></div>`}`;
  const tEl=$('#mkT');let th=null;const startT=(min)=>{clearInterval(th);const end=Date.now()+min*60000;const f=()=>{if(!tEl.isConnected){clearInterval(th);return}const l=Math.max(0,end-Date.now());tEl.textContent=`⏱ ${Math.floor(l/60000)}:${String(Math.floor(l%60000/1000)).padStart(2,'0')}`;if(!l){clearInterval(th);toast('Zeit!')}};f();th=setInterval(f,1000)};
  main().onclick=e=>{const tm=e.target.closest('[data-tm]');if(tm){startT({prep:P.prep,t1:3,t2:3,t3:2}[tm.dataset.tm]);return}
    const th2=e.target.closest('[data-theme]');if(th2){run.theme=+th2.dataset.theme;save();route();return}
    const sy=e.target.closest('[data-say]');if(sy){say(sy.dataset.say);return}
    const r=e.target.closest('[data-rate]');if(r){run.rate[r.dataset.rate]=r.dataset.l;save();$$(`[data-rate="${r.dataset.rate}"]`).forEach(x=>x.classList.toggle('pri',x===r));[1,2,3].forEach(n=>{const s=$(`[data-sum="s${n}"]`);if(s)s.textContent=mockRubricPts('s'+n,crit,run,MK_SP_MAX[n])});const s=$('[data-sum="saus"]');if(s)s.textContent=mockRubricPts('saus',aus,run,MK_SP_MAX.aus);$('#mkSS').textContent=mockSpeakTotal(crit,aus,run);return}
    if(e.target.id==='mkDone'){run.done=true;save();route()}
    if(e.target.id==='mkSave'){const p=mockSpeakTotal(crit,aus,run);if(p==='–'){toast('Bitte alle Kriterien bewerten.');return}mockS().res.sprechen={pts:p,date:today()};addXP(20);save();toast('Gespeichert.');nav('#/mock')}
    if(e.target.id==='mkAgain'){delete mockS().run.sprechen;save();route()}}}
function mockSpeakTotal(crit,aus,run){const p=[1,2,3].map(n=>mockRubricPts('s'+n,crit,run,MK_SP_MAX[n])).concat([mockRubricPts('saus',aus,run,MK_SP_MAX.aus)]);return p.includes('–')?'–':p.reduce((a,b)=>a+b,0)}

window.__DT={S:()=>S,cards,UNITS,classify,check,parseItem,pluralOf,save};
