<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deutsch"><meta name="theme-color" content="#c8102e">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Deutsch-Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --bg:#f6f5f2; --panel:#ffffff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e4e2dc;
  --accent:#c8102e; --accent-ink:#fff; --accent-soft:#fbe9ec;
  --ok:#1f7a4d; --ok-soft:#e3f3ea; --bad:#b42318; --bad-soft:#fdeceb; --warn:#a15c00; --warn-soft:#fff4e0;
  --der:#1f5fbf; --die:#c0262d; --das:#1d7f4e; --pl:#7a4bb3;
  --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16161a; --panel:#1f1f24; --ink:#ececf0; --muted:#a0a0aa; --line:#33333b;
    --accent:#ff5a6e; --accent-soft:#3a1c22; --ok:#5fd39a; --ok-soft:#173326; --bad:#ff7b70; --bad-soft:#3b1d1b;
    --warn:#ffbe5c; --warn-soft:#3a2c14; --der:#78a9ff; --die:#ff7f86; --das:#5fd39a; --pl:#c3a2f0;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#16161a; --panel:#1f1f24; --ink:#ececf0; --muted:#a0a0aa; --line:#33333b;
  --accent:#ff5a6e; --accent-soft:#3a1c22; --ok:#5fd39a; --ok-soft:#173326; --bad:#ff7b70; --bad-soft:#3b1d1b;
  --warn:#ffbe5c; --warn-soft:#3a2c14; --der:#78a9ff; --die:#ff7f86; --das:#5fd39a; --pl:#c3a2f0; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
a{color:var(--accent)}
#shell{display:flex;min-height:100vh}
#nav{width:250px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.brand b{display:block;font-size:17px}.brand small{color:var(--muted);font-size:12px}
.flag{width:30px;height:30px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px;line-height:1}
#nav nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:15px}
#nav nav a i{font-style:normal;width:20px;text-align:center;color:var(--muted)}
#nav nav a:hover{background:var(--bg)}
#nav nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
#nav nav a.on i{color:var(--accent)}
.badge{margin-left:auto;background:var(--accent);color:#fff;border-radius:20px;font-size:11px;padding:1px 7px;font-weight:700}
.badge:empty{display:none}
.navfoot{margin-top:auto;font-size:12px;color:var(--muted);padding:12px 8px 0}
main{flex:1;min-width:0;padding:28px 36px 80px;max-width:1080px}
h1{font-size:26px;margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:19px;margin:28px 0 10px}
h3{font-size:16px;margin:18px 0 8px}
.sub{color:var(--muted);margin:0 0 20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.card.click{cursor:pointer;transition:border-color .15s}
.card.click:hover{border-color:var(--accent)}
.card h3{margin-top:0}
.stat b{display:block;font-size:26px;line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{border-color:var(--muted)}
button.pri,.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.pri:hover{filter:brightness(1.07)}
button.ghost{border-color:transparent;background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
button.sm{padding:4px 10px;font-size:13px}
input[type=text],textarea,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 12px;width:100%}
input[type=text]:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea{min-height:220px;line-height:1.55}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:8px}
.bar.ok>i{background:var(--ok)}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:20px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.lvl{font-weight:800;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--ink);color:var(--panel)}
.unitrow{display:flex;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:8px;cursor:pointer}
.unitrow:hover{border-color:var(--accent)}
.unitrow.locked{opacity:.5;cursor:not-allowed}
.unitrow .num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-weight:700;font-size:13px;flex:none}
.unitrow.done .num{background:var(--ok);color:#fff}
.unitrow .t{flex:1;min-width:0}.unitrow .t b{display:block}.unitrow .t small{color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0 18px;flex-wrap:wrap}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:9px 14px;color:var(--muted)}
.tabs button.on{border-bottom-color:var(--accent);color:var(--ink);font-weight:600}
.gram{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:6px 22px 18px}
.gram table{border-collapse:collapse;margin:10px 0 14px;font-size:15px;width:auto;max-width:100%}
.gram th,.gram td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.gram th{background:var(--bg);font-weight:600}
.gram .rule{background:var(--accent-soft);border-left:4px solid var(--accent);padding:10px 14px;border-radius:6px;margin:12px 0}
.gram .warn{background:var(--warn-soft);border-left:4px solid var(--warn);padding:10px 14px;border-radius:6px;margin:12px 0}
.gram .ch{background:var(--bg);border-left:4px solid var(--muted);padding:10px 14px;border-radius:6px;margin:12px 0;font-size:15px}
.gram em{color:var(--accent);font-style:normal;font-weight:600}
.gram code,.mono{font-family:var(--mono);font-size:.92em}
.ex{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
.ex:last-child{border-bottom:none}
.ex .de{font-weight:500}.ex .en{color:var(--muted);font-size:14px}
.say{border:none;background:var(--bg);width:30px;height:30px;padding:0;border-radius:50%;flex:none;justify-content:center;font-size:13px}
.say:hover{background:var(--accent-soft);color:var(--accent)}
.der{color:var(--der);font-weight:600}.die{color:var(--die);font-weight:600}.das{color:var(--das);font-weight:600}.plu{color:var(--pl);font-weight:600}
/* exercise */
.quiz{max-width:760px}
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qhead .bar{flex:1}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow)}
.qtype{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.qprompt{font-size:20px;line-height:1.5;margin-bottom:16px}
.qprompt input.gap{display:inline-block;width:auto;min-width:90px;padding:3px 8px;font-size:18px;margin:0 3px;border-width:0 0 2px;border-radius:4px;background:var(--bg)}
.qprompt .hint{color:var(--muted);font-size:15px}
.opts{display:grid;gap:8px}
.opts button{justify-content:flex-start;padding:12px 14px;font-size:17px;text-align:left}
.opts button.sel{border-color:var(--accent);background:var(--accent-soft)}
.opts button.right{border-color:var(--ok);background:var(--ok-soft)}
.opts button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:10px;border:1px dashed var(--line);border-radius:10px;margin-bottom:10px}
.tiles.pool{border-style:solid;background:var(--bg)}
.tile{padding:7px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--line);cursor:pointer;font-size:17px;user-select:none}
.tile:hover{border-color:var(--accent)}
.fb{margin-top:16px;padding:14px 16px;border-radius:10px;font-size:15px}
.fb.ok{background:var(--ok-soft)}.fb.bad{background:var(--bad-soft)}.fb.warn{background:var(--warn-soft)}
.fb b.h{display:block;margin-bottom:4px;font-size:16px}
.fb .ans{font-size:17px;font-weight:600}
.diff ins{background:var(--ok-soft);color:var(--ok);text-decoration:none;border-radius:3px;padding:0 2px;font-weight:600}
.diff del{background:var(--bad-soft);color:var(--bad);border-radius:3px;padding:0 2px}
.keys{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.keys button{padding:4px 11px;font-size:15px}
.qfoot{display:flex;gap:10px;margin-top:18px;align-items:center}
.flash{text-align:center;padding:30px 20px}
.flash .w{font-size:32px;font-weight:700;margin:6px 0}
.flash .pl{color:var(--muted)}
.flash .exs{color:var(--muted);margin-top:12px;font-size:16px}
.result{text-align:center;padding:30px}
.result .big{font-size:54px;font-weight:800;line-height:1}
/* table */
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.transcript{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:14px 16px;font-size:15px;max-height:420px;overflow:auto;border:1px solid var(--line)}
.cloze input{display:inline-block;width:auto;padding:1px 6px;font-size:15px;border-width:0 0 2px;border-radius:3px;margin:0 2px}
.cloze input.r{background:var(--ok-soft);border-color:var(--ok)}
.cloze input.w{background:var(--bad-soft);border-color:var(--bad)}
audio{width:100%;margin:8px 0}
.mic{width:64px;height:64px;border-radius:50%;justify-content:center;font-size:24px}
.mic.rec{background:var(--accent);color:#fff;border-color:var(--accent);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px var(--accent-soft)}}
.timer{font-family:var(--mono);font-size:22px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:3px 10px;border-radius:20px;background:var(--bg);border:1px solid var(--line);font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.readtext{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 22px;font-size:17px;line-height:1.7}
.readtext p{margin:0 0 12px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 18px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;font-size:14px}
#toast.on{opacity:1}
.heat{display:grid;grid-template-columns:repeat(30,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--line);display:block}
.loading{padding:40px;color:var(--muted)}
details{margin:8px 0}summary{cursor:pointer;font-weight:600}
.kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted)}
@media (max-width:860px){
  #shell{flex-direction:column}
  #nav{width:auto;height:auto;position:static;padding:10px}
  #nav nav{display:flex;overflow-x:auto;gap:4px}
  #nav nav a{white-space:nowrap;font-size:14px}
  .brand,.navfoot{display:none}
  main{padding:18px 16px 60px}
  .g2,.g3,.g4{grid-template-columns:1fr 1fr}
}
@media (max-width:520px){.g2,.g3,.g4{grid-template-columns:1fr}.qprompt{font-size:18px}}
/* phone / tablet refinements */
main{padding-left:max(36px, env(safe-area-inset-left, 0px));padding-right:max(36px, env(safe-area-inset-right, 0px))}
@media (max-width:860px){
  #nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-left:max(10px, env(safe-area-inset-left, 0px));padding-right:max(10px, env(safe-area-inset-right, 0px));border-right:none;border-bottom:1px solid var(--line)}
  #nav nav{scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #nav nav::-webkit-scrollbar{display:none}
  main{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .navfoot{display:block;order:2;padding:6px 4px 0;font-size:11px}
  .navfoot .bar{display:none}
  .tabs{overflow-x:auto;flex-wrap:nowrap}
  .tabs button{white-space:nowrap}
  .qcard{padding:16px}
  .opts button{font-size:16px}
  .unitrow{padding:10px}
  table.t{font-size:13px}
  .card table.t{display:block;overflow-x:auto}
}
input,textarea,select{font-size:16px}
button,.btn,.tile,.chip{touch-action:manipulation}

@media (max-width:860px){.navfoot .nf-x{display:none}.navfoot{padding:4px 6px 0}.navfoot div{margin:0!important}}

.profchip{font-size:13px;padding:10px 10px 0;color:var(--muted)}.profchip:empty{display:none}.profchip b{color:var(--ink)}
@media (max-width:860px){.profchip{padding:4px 6px 0}}

.tr-en{color:var(--muted);font-weight:400;font-size:.88em}
.tr-en[style*=block]{margin-top:2px}

.profchip{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.langbar{display:inline-flex;align-items:center;gap:4px}
.langbar .lb{font:inherit;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;border:1px solid var(--line,#ccc);background:transparent;color:var(--ink);cursor:pointer;min-height:30px}
.langbar .lb.on{background:var(--accent,#c8102e);border-color:var(--accent,#c8102e);color:#fff}
.profchip .ver{font-size:11px;opacity:.6;margin-left:auto}

/* ---------- fx: animations ---------- */
#fxl{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}
.fx-canvas{position:absolute;inset:0;width:100%;height:100%}
.fx-dot{position:absolute;width:8px;height:8px;border-radius:50%;margin:-4px 0 0 -4px;animation:fxDot .75s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes fxDot{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.fx-float{position:absolute;transform:translate(-50%,0);font-weight:800;font-size:18px;color:var(--ok,#2e9e5b);text-shadow:0 1px 0 rgba(255,255,255,.6);animation:fxFloat 1.25s ease-out forwards;white-space:nowrap}
@keyframes fxFloat{0%{opacity:0;transform:translate(-50%,6px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
.qcard{position:relative}
.quiz .qcard:not(.result){animation:fxIn .32s cubic-bezier(.2,.8,.3,1)}
@keyframes fxIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.qcard.fx-ok{animation:fxOk .55s ease}
@keyframes fxOk{0%{box-shadow:0 0 0 0 rgba(46,158,91,.55)}40%{transform:scale(1.015)}100%{box-shadow:0 0 0 18px rgba(46,158,91,0);transform:none}}
.qcard.fx-shake{animation:fxShake .45s ease}
@keyframes fxShake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.fb{animation:fxFb .3s ease}
@keyframes fxFb{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.opts button.right{animation:fxPulse .5s ease}
@keyframes fxPulse{50%{transform:scale(1.04)}}
.qhead .bar i{transition:width .5s cubic-bezier(.2,.8,.3,1)}
.bar i{transition:width .6s ease}
.tile{transition:transform .15s ease}.tile:active{transform:scale(.94)}
.fx-combo{position:absolute;top:-14px;right:14px;background:linear-gradient(135deg,#ff8a00,#c8102e);color:#fff;font-weight:800;font-size:14px;padding:6px 12px;border-radius:999px;box-shadow:0 6px 18px rgba(200,16,46,.35);animation:fxCombo 2.2s ease forwards;z-index:3}
@keyframes fxCombo{0%{opacity:0;transform:scale(.4) rotate(-8deg)}12%{opacity:1;transform:scale(1.12) rotate(2deg)}20%{transform:scale(1) rotate(0)}85%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
.fx-banner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;background:rgba(0,0,0,.12);animation:fxFade .25s ease}
.fx-banner.out{opacity:0;transition:opacity .45s}
.fx-b-in{background:var(--panel,#fff);color:var(--ink);border-radius:22px;padding:26px 34px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25);max-width:min(86vw,420px);animation:fxBanner .6s cubic-bezier(.2,1.4,.4,1)}
.fx-emoji{font-size:54px;line-height:1;animation:fxBounce 1s ease .2s}
.fx-big{font-size:24px;font-weight:800;margin-top:8px}
.fx-small{color:var(--muted);margin-top:4px}
@keyframes fxFade{from{opacity:0}}
@keyframes fxBanner{from{opacity:0;transform:scale(.6) translateY(30px)}to{opacity:1;transform:none}}
@keyframes fxBounce{0%,100%{transform:none}30%{transform:translateY(-14px) rotate(-8deg)}60%{transform:translateY(0) rotate(6deg)}}
.fx-stars{display:flex;justify-content:center;gap:10px;margin:4px 0 6px;font-size:40px}
.fx-stars span{color:var(--line,#ddd);transform:scale(0);animation:fxStar .5s cubic-bezier(.2,1.6,.4,1) forwards}
.fx-stars span.on{color:#f2b705;text-shadow:0 2px 10px rgba(242,183,5,.5)}
@keyframes fxStar{to{transform:scale(1)}}
.qcard.result{animation:fxBanner .5s cubic-bezier(.2,1.2,.4,1)}
.flame{display:inline-block}.flame.lit{animation:fxFlame 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes fxFlame{0%,100%{transform:scale(1) rotate(0)}25%{transform:scale(1.12) rotate(-6deg)}50%{transform:scale(.96) rotate(3deg)}75%{transform:scale(1.08) rotate(-2deg)}}
.fx-tick{animation:fxPulse .45s ease}
.card.click,.unitrow{transition:transform .15s ease,box-shadow .15s ease}
.card.click:hover{transform:translateY(-2px)}
@media (prefers-reduced-motion: reduce){.quiz .qcard,.fb,.flame.lit,.qcard.result,.fx-stars span{animation:none!important}.fx-stars span{transform:none}}
.tr-en-block{margin:14px 0 4px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--panel)}
.tr-en-block>summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:14px}
.tr-en-block[open]>summary{margin-bottom:8px}

/* ---------- big, obvious Next / Check button ---------- */
.qfoot{flex-wrap:wrap}
.qfoot #nx,.qfoot #chk{flex:1 1 100%;min-height:60px;font-size:21px;font-weight:800;justify-content:center;border-radius:16px;letter-spacing:.01em;box-shadow:0 8px 22px rgba(200,16,46,.30)}

d.appendChild(pre);m.appendChild(d)}catch(x){}},3500)})();

levels:{

},
connectors:['und','aber','oder','denn','sondern','weil','dass','obwohl','wenn','als','ob','damit','um zu','deshalb','deswegen','darum','daher','trotzdem','dennoch','allerdings','außerdem','ausserdem','zudem','jedoch','nachdem','bevor','während','sobald','seitdem','bis','falls','sodass','so dass','indem','ohne dass','statt','anstatt','einerseits','andererseits','zwar','nicht nur','sowohl','weder','entweder','je','desto','umso','meiner Meinung nach','meines Erachtens','zum Beispiel','beispielsweise','schliesslich','schließlich','zunächst','danach','anschliessend','anschließend','zusammenfassend','folglich','infolgedessen','hingegen','wohingegen','dagegen','im Gegensatz dazu','aus diesem Grund'],
subordinators:['weil','dass','obwohl','wenn','als','ob','damit','nachdem','bevor','während','sobald','seitdem','bis','falls','sodass','indem','da','wohingegen','sofern','solange'],
speakChecklist:['Habe ich alle Punkte der Aufgabe behandelt?','Steht das Verb im Hauptsatz an Position 2 – auch nach „Dann“, „Deshalb“, „Meiner Meinung nach“?','Steht das Verb im Nebensatz (weil, dass, obwohl…) am Ende?','Artikel und Kasus nach Präpositionen (mit + Dativ, für + Akkusativ) richtig?','Perfekt mit „sein“ bei Bewegung/Zustandsänderung (Ich bin gefahren)?','Habe ich Konnektoren benutzt, um Gedanken zu verbinden (deshalb, trotzdem, einerseits … andererseits)?','Habe ich meine Meinung begründet und ein Beispiel gegeben?','Habe ich auf den Gesprächspartner reagiert (zustimmen, widersprechen, nachfragen)?','Register passend (Sie/du)?'],
cats:{
 conj:{n:'Verbkonjugation',d:'Falsche Personalendung oder Stammänderung (z. B. du fährst, er liest).',tip:'<table><tr><th></th><th>regelmässig</th><th>a→ä / e→i(e)</th></tr><tr><td>ich</td><td>wohn<em>e</em></td><td>fahr<em>e</em> / les<em>e</em></td></tr><tr><td>du</td><td>wohn<em>st</em></td><td>f<em>ä</em>hr<em>st</em> / l<em>ie</em>s<em>t</em></td></tr><tr><td>er/sie/es</td><td>wohn<em>t</em></td><td>f<em>ä</em>hr<em>t</em> / l<em>ie</em>s<em>t</em></td></tr><tr><td>wir/sie/Sie</td><td>wohn<em>en</em></td><td>fahr<em>en</em></td></tr><tr><td>ihr</td><td>wohn<em>t</em></td><td>fahr<em>t</em></td></tr></table><p>Stammwechsel nur bei <b>du</b> und <b>er/sie/es</b>. Stamm auf -t/-d: du arbeit<em>e</em>st, er arbeit<em>e</em>t.</p>'},
 wordorder:{n:'Satzstellung (V2 / Satzklammer)',d:'Konjugiertes Verb nicht an Position 2 oder zweiter Verbteil nicht am Ende.',tip:'<div class="rule"><b>Hauptsatz:</b> Das konjugierte Verb steht <em>immer an Position 2</em>. Wenn etwas anderes als das Subjekt auf Position 1 steht, kommt das Subjekt <em>nach</em> dem Verb: <i>Morgen <b>fahre</b> ich nach Zug.</i></div><div class="rule"><b>Satzklammer:</b> Zweiter Verbteil (Infinitiv, Partizip, Präfix) ans Ende: <i>Ich <b>muss</b> heute <b>arbeiten</b>. Ich <b>habe</b> gestern <b>gearbeitet</b>. Ich <b>rufe</b> dich <b>an</b>.</i></div><div class="rule"><b>Nebensatz:</b> konjugiertes Verb ans Ende: <i>…, weil ich heute arbeiten <b>muss</b>.</i> Nebensatz auf Position 1 → Hauptsatz beginnt mit dem Verb: <i>Weil es regnet, <b>bleibe</b> ich zu Hause.</i></div><p>Positionen 0 (kein Einfluss): und, aber, oder, denn, sondern.</p><p>Mittelfeld-Faustregel: <b>Te-Ka-Mo-Lo</b> (temporal – kausal – modal – lokal): <i>Ich fahre morgen wegen der Arbeit mit dem Zug nach Bern.</i></p>'},
 sep:{n:'Trennbare Verben',d:'Präfix nicht abgetrennt oder nicht am Satzende.',tip:'<p>Trennbare Präfixe (an-, auf-, aus-, ein-, mit-, vor-, zu-, zurück-, fern-, statt-…) gehen im Hauptsatz ans Ende: <i>Ich <b>rufe</b> dich morgen <b>an</b>.</i> Im Nebensatz bleibt das Verb zusammen: <i>…, dass ich dich morgen <b>anrufe</b>.</i> Partizip: an<b>ge</b>rufen. zu-Infinitiv: an<b>zu</b>rufen. Untrennbar (be-, emp-, ent-, er-, ge-, miss-, ver-, zer-): kein ge-: <i>verstanden, bezahlt</i>.</p>'},
 case:{n:'Artikel & Kasus',d:'Richtiges Geschlecht, aber falscher Fall (Nominativ/Akkusativ/Dativ/Genitiv).',tip:'<table><tr><th></th><th>mask.</th><th>neutr.</th><th>fem.</th><th>Plural</th></tr><tr><td>Nom</td><td>der / ein</td><td>das / ein</td><td>die / eine</td><td>die / –</td></tr><tr><td>Akk</td><td><em>den / einen</em></td><td>das / ein</td><td>die / eine</td><td>die / –</td></tr><tr><td>Dat</td><td><em>dem / einem</em></td><td><em>dem / einem</em></td><td><em>der / einer</em></td><td><em>den / – (+n)</em></td></tr><tr><td>Gen</td><td>des / eines (+s)</td><td>des / eines (+s)</td><td>der / einer</td><td>der / –</td></tr></table><p>Nur das <b>Maskulinum</b> ändert sich im Akkusativ. Dativ Plural: Nomen bekommt -n (mit den Kinder<em>n</em>). Fragen: Wer? (Nom) Wen/Was? (Akk) Wem? (Dat) Wessen? (Gen).</p>'},
 gender:{n:'Genus (der/die/das)',d:'Falsches grammatisches Geschlecht des Nomens.',tip:'<p>Genus immer mit dem Nomen lernen (Farben: <span class="der">der</span> <span class="die">die</span> <span class="das">das</span>). Hilfreiche Endungen:</p><table><tr><th>der</th><td>-er (Personen), -ling, -ismus, -ant, -ent, -ig, -or; Tage, Monate, Jahreszeiten</td></tr><tr><th>die</th><td>-ung, -heit, -keit, -schaft, -ion, -tät, -ik, -ie, -ei, -ur, -enz; meist -e</td></tr><tr><th>das</th><td>-chen, -lein, -ment, -um, -ma; nominalisierte Infinitive (das Essen)</td></tr></table><p>Komposita: Das <b>letzte</b> Wort bestimmt den Artikel: die Haus+<b>die</b> Tür → die Haustür.</p>'},
 plural:{n:'Pluralbildung',d:'Falsche Pluralform.',tip:'<p>Typen: -e (Tage), ¨-e (Stühle), -er/¨-er (Kinder, Häuser), -(e)n (Frauen, Namen), -s (Autos, Handys), – / ¨ (Lehrer, Mütter). Feminin auf -e/-ung/-heit/-keit → fast immer -(e)n. Fremdwörter auf Vokal → oft -s.</p>'},
 adj:{n:'Adjektivendungen',d:'Falsche Endung des Adjektivs vor einem Nomen.',tip:'<div class="rule"><b>Regel 1:</b> Nach <b>der/die/das</b>-Wörtern: Endung <em>-e</em> in den 5 „Grundformen“ (Nom Sg alle, Akk Sg fem/neutr), sonst <em>-en</em>.</div><div class="rule"><b>Regel 2:</b> Nach <b>ein/kein/mein</b> ohne Endung (Nom mask, Nom/Akk neutr) zeigt das Adjektiv das Genus: ein gut<em>er</em> Wein, ein gut<em>es</em> Buch. Sonst wie Regel 1.</div><div class="rule"><b>Regel 3:</b> <b>Ohne Artikel</b> übernimmt das Adjektiv die Artikelendung: gut<em>er</em> Wein (der), mit gut<em>em</em> Wein (dem), gut<em>e</em> Milch (die), Ausnahme Gen. mask./neutr.: trotz schlecht<em>en</em> Wetters.</div><p>Prädikativ (nach sein/werden/bleiben) keine Endung: <i>Der Wein ist gut.</i></p>'},
 comp:{n:'Komparativ & Superlativ',d:'Falsche Steigerungsform.',tip:'<p>schnell – schnell<em>er</em> – am schnell<em>sten</em>; Umlaut bei vielen Einsilbern: alt – älter – am ältesten; unregelmässig: gut – besser – am besten, viel – mehr – am meisten, gern – lieber – am liebsten, hoch – höher – am höchsten. Vergleich: <i>so … wie</i> (gleich), <i>…er als</i> (ungleich). Vor Nomen mit Endung: das schnell<em>ere</em> Auto.</p>'},
 prep:{n:'Präpositionen',d:'Falsche Präposition oder falscher Kasus nach der Präposition.',tip:'<table><tr><th>+ Akkusativ</th><td>durch, für, gegen, ohne, um, bis, entlang (nachgestellt)</td></tr><tr><th>+ Dativ</th><td>aus, bei, mit, nach, seit, von, zu, gegenüber, ab</td></tr><tr><th>Wechsel (Akk/Dat)</th><td>an, auf, hinter, in, neben, über, unter, vor, zwischen</td></tr><tr><th>+ Genitiv</th><td>während, wegen, trotz, statt, innerhalb, ausserhalb, aufgrund</td></tr></table><p>Ort: <i>nach</i> Zürich / in die Schweiz / zu Freunden / zum Arzt; <i>in</i> Zürich / in der Schweiz / bei Freunden / beim Arzt; <i>aus</i> Zürich / vom Arzt.</p>'},
 wechsel:{n:'Wechselpräpositionen (Wo? / Wohin?)',d:'Dativ statt Akkusativ oder umgekehrt nach an/auf/in/über/unter/vor/hinter/neben/zwischen.',tip:'<div class="rule"><b>Wohin?</b> (Bewegung zu einem Ziel) → <em>Akkusativ</em>: Ich lege das Buch auf <b>den</b> Tisch. – stellen, legen, setzen, hängen (regelmässig).<br><b>Wo?</b> (Position) → <em>Dativ</em>: Das Buch liegt auf <b>dem</b> Tisch. – stehen, liegen, sitzen, hängen (unregelmässig).</div>'},
 perfekt:{n:'Perfekt (haben/sein, Partizip II)',d:'Falsches Hilfsverb oder falsches Partizip.',tip:'<p><b>sein</b> bei Ortswechsel (gehen, fahren, fliegen, kommen, laufen, reisen, umziehen…), Zustandsänderung (aufstehen, einschlafen, aufwachen, sterben, werden, passieren) und bei <i>sein, bleiben</i>. Sonst <b>haben</b>.</p><p>Partizip: regelmässig ge-…-t (gekauft), unregelmässig ge-…-en (gefahren, gesprochen); trennbar: ein<b>ge</b>kauft; ohne ge- bei be-/ver-/er-/ent-/zer-/ge-/miss- und -ieren (besucht, studiert).</p>'},
 praet:{n:'Präteritum',d:'Falsche Präteritumform.',tip:'<p>Regelmässig: -te (machte, wohnte, arbeitete). Unregelmässig mit Vokalwechsel und ohne Endung bei ich/er: ging, kam, sah, fuhr, las, sprach, nahm, gab, fand, blieb, schrieb. Gemischt: dachte, brachte, wusste, kannte. Modalverben ohne Umlaut: konnte, musste, durfte, wollte, sollte, mochte. war, hatte, wurde.</p>'},
 modal:{n:'Modalverben',d:'Falsche Form oder Infinitiv nicht am Ende.',tip:'<table><tr><th></th><th>können</th><th>müssen</th><th>dürfen</th><th>wollen</th><th>sollen</th><th>möchten</th></tr><tr><td>ich/er</td><td>kann</td><td>muss</td><td>darf</td><td>will</td><td>soll</td><td>möchte</td></tr><tr><td>du</td><td>kannst</td><td>musst</td><td>darfst</td><td>willst</td><td>sollst</td><td>möchtest</td></tr><tr><td>wir/sie</td><td>können</td><td>müssen</td><td>dürfen</td><td>wollen</td><td>sollen</td><td>möchten</td></tr></table><p>ich und er/sie/es haben <b>keine Endung</b>. Infinitiv am Satzende: <i>Ich <b>kann</b> heute nicht <b>kommen</b>.</i> „nicht müssen“ = not have to; „nicht dürfen“ = must not.</p>'},
 pron:{n:'Pronomen',d:'Falsches Personal-/Reflexivpronomen oder falscher Kasus.',tip:'<table><tr><th>Nom</th><td>ich</td><td>du</td><td>er</td><td>sie</td><td>es</td><td>wir</td><td>ihr</td><td>sie/Sie</td></tr><tr><th>Akk</th><td>mich</td><td>dich</td><td>ihn</td><td>sie</td><td>es</td><td>uns</td><td>euch</td><td>sie/Sie</td></tr><tr><th>Dat</th><td>mir</td><td>dir</td><td>ihm</td><td>ihr</td><td>ihm</td><td>uns</td><td>euch</td><td>ihnen/Ihnen</td></tr></table><p>Reihenfolge: Dativ-Nomen vor Akkusativ-Nomen; aber Akkusativ-Pronomen vor Dativ: <i>Ich gebe <b>es ihm</b>.</i></p>'},
 reflex:{n:'Reflexive Verben',d:'Reflexivpronomen fehlt oder falscher Kasus.',tip:'<p>sich freuen, sich treffen, sich anmelden, sich beeilen, sich interessieren für…: ich freue <b>mich</b>, du freust <b>dich</b>, er freut <b>sich</b>, wir freuen <b>uns</b>, ihr freut <b>euch</b>, sie freuen <b>sich</b>. Mit Akkusativobjekt → Dativ: Ich wasche <b>mir</b> die Hände. Ich kann <b>mir</b> das vorstellen.</p>'},
 neg:{n:'Negation (nicht / kein)',d:'„nicht“ statt „kein“ (oder umgekehrt) bzw. falsche Position von „nicht“.',tip:'<p><b>kein</b> verneint Nomen mit unbestimmtem oder ohne Artikel: <i>Ich habe <b>kein</b> Auto / <b>keine</b> Zeit.</i> <b>nicht</b> verneint alles andere: Verben, Adjektive, Nomen mit bestimmtem Artikel. Position: vor dem, was verneint wird, oder am Satzende – aber vor dem 2. Verbteil, Präpositionalergänzung, Ortsangabe und Prädikativ.</p>'},
 conn:{n:'Konnektoren & Nebensätze',d:'Falscher Konnektor oder falsche Verbstellung danach.',tip:'<table><tr><th>Position 0 (Verb bleibt Pos. 2)</th><td>und, aber, oder, denn, sondern</td></tr><tr><th>Position 1 (Verb direkt danach!)</th><td>deshalb, deswegen, darum, trotzdem, dann, danach, außerdem, sonst, also, dennoch</td></tr><tr><th>Nebensatz (Verb am Ende)</th><td>weil, da, dass, ob, wenn, als, obwohl, damit, nachdem, bevor, während, bis, seit(dem), sobald, falls, sodass, indem</td></tr></table><p><b>als</b> = einmalig in der Vergangenheit; <b>wenn</b> = Gegenwart/Zukunft oder wiederholt (immer wenn). <b>denn</b> (Hauptsatz) ≈ <b>weil</b> (Nebensatz).</p>'},
 rel:{n:'Relativsätze',d:'Falsches Relativpronomen oder Verb nicht am Ende.',tip:'<p>Genus/Numerus vom Bezugswort, <b>Kasus aus dem Relativsatz</b>.</p><table><tr><th></th><th>m</th><th>n</th><th>f</th><th>Pl</th></tr><tr><td>Nom</td><td>der</td><td>das</td><td>die</td><td>die</td></tr><tr><td>Akk</td><td>den</td><td>das</td><td>die</td><td>die</td></tr><tr><td>Dat</td><td>dem</td><td>dem</td><td>der</td><td><em>denen</em></td></tr><tr><td>Gen</td><td>dessen</td><td>dessen</td><td>deren</td><td>deren</td></tr></table><p>Präposition steht vor dem Relativpronomen: <i>die Frau, <b>mit der</b> ich spreche</i>. Nach alles/etwas/nichts/Superlativ: <b>was</b>; bei Orten: <b>wo</b>.</p>'},
 gen:{n:'Genitiv',d:'Genitivform fehlt (z. B. -s am Nomen) oder falscher Artikel.',tip:'<p>des/eines + Nomen<b>-(e)s</b> (mask./neutr.): die Meinung des Arzt<b>es</b>, das Ende des Film<b>s</b>; der/einer (fem./Plural): die Wohnung der Familie. Präpositionen: wegen, trotz, während, statt, innerhalb, ausserhalb, aufgrund, anlässlich.</p>'},
 konj2:{n:'Konjunktiv II',d:'Falsche Form (würde/hätte/wäre/könnte) oder falscher Gebrauch.',tip:'<p>Formen: <b>wäre, hätte, würde, könnte, müsste, dürfte, sollte, wollte</b>, ginge, käme, wüsste; sonst <b>würde + Infinitiv</b>. Vergangenheit: <b>hätte/wäre + Partizip II</b> (Ich hätte mehr lernen sollen. Wenn ich das gewusst hätte, wäre ich gekommen.) Gebrauch: Wunsch, irreale Bedingung, Höflichkeit (Könnten Sie…?), Ratschlag (An deiner Stelle würde ich…).</p>'},
 konj1:{n:'Konjunktiv I / indirekte Rede',d:'Falsche Form in der indirekten Rede.',tip:'<p>Konjunktiv I = Stamm + e (er komm<b>e</b>, er hab<b>e</b>, er könn<b>e</b>), sein: er <b>sei</b>, sie <b>seien</b>. Ist Konj. I = Indikativ (meist Plural: sie haben), nimm Konj. II (sie <b>hätten</b>). Vergangenheit: er habe/sei + Partizip. Zukunft: er werde + Infinitiv.</p>'},
 passiv:{n:'Passiv',d:'werden/sein-Form oder Partizip falsch.',tip:'<table><tr><td>Präsens</td><td>Das Formular <b>wird</b> ausgefüllt.</td></tr><tr><td>Präteritum</td><td>Das Formular <b>wurde</b> ausgefüllt.</td></tr><tr><td>Perfekt</td><td>Das Formular <b>ist</b> ausgefüllt <b>worden</b>.</td></tr><tr><td>mit Modalverb</td><td>Das Formular <b>muss</b> ausgefüllt <b>werden</b>.</td></tr><tr><td>Zustandspassiv</td><td>Das Formular <b>ist</b> ausgefüllt.</td></tr></table><p>Agens mit <b>von + Dativ</b> (Person), <b>durch + Akk</b> (Mittel/Ursache).</p>'},
 inf:{n:'Infinitiv mit zu',d:'„zu“ fehlt, steht falsch oder ist überflüssig.',tip:'<p>Nach Verben wie versuchen, anfangen, vergessen, hoffen, vorhaben, beschliessen; nach Ausdrücken wie Es ist wichtig/schwer…, Ich habe Lust/Zeit/keine Angst…: <i>Ich versuche, pünktlich <b>zu</b> sein.</i> Trennbar: an<b>zu</b>rufen. <b>Kein zu</b> nach Modalverben, lassen, werden, sehen, hören, gehen, bleiben. um…zu (Ziel), ohne…zu, (an)statt…zu.</p>'},
 verbprep:{n:'Verben/Adjektive mit Präposition',d:'Falsche feste Präposition (warten auf, denken an…).',tip:'<p>Feste Präpositionen lernen: warten <b>auf</b> + A, denken <b>an</b> + A, sich interessieren <b>für</b>, sich freuen <b>auf</b> (Zukunft) / <b>über</b> (Gegenwart/Vergangenheit), teilnehmen <b>an</b> + D, sich beschweren <b>über</b>, abhängen <b>von</b>, sich kümmern <b>um</b>, Angst haben <b>vor</b> + D. Fragen/Verweise: bei Sachen <b>wo(r)-/da(r)-</b> (Worauf wartest du? Darauf!), bei Personen Präp. + Pronomen (Auf wen? Auf ihn).</p>'},
 nominal:{n:'Wortbildung & Nominalstil',d:'Falsche Nominalisierung, Präfix oder Suffix.',tip:'<p>Verb → Nomen: -ung (entscheiden → die Entscheidung), Infinitiv (das Lesen), Stamm (beginnen → der Beginn). Adjektiv → Nomen: -heit/-keit (die Freiheit, die Möglichkeit). Verbalstil ↔ Nominalstil: <i>weil es regnete</i> ↔ <i>wegen des Regens</i>; <i>nachdem er angekommen war</i> ↔ <i>nach seiner Ankunft</i>.</p>'},
 vocab:{n:'Wortschatz',d:'Falsches Wort oder Wort nicht gewusst.',tip:'<p>Wörter immer im Kontext lernen: Nomen mit Artikel + Plural, Verben mit Präposition/Kasus und Perfekt. Täglich wiederholen (Spaced Repetition).</p>'},
 spelling:{n:'Rechtschreibung',d:'Kleiner Tippfehler / Buchstabe falsch.',tip:'<p>Nomen gross, Verben/Adjektive klein. Doppelkonsonant nach kurzem Vokal (kommen, Bett), Dehnungs-h (fahren, Stuhl), ie für langes i (viel, Brief). In der Schweiz immer „ss“ statt „ß“.</p>'},
 umlaut:{n:'Umlaute',d:'ä/ö/ü fehlt oder steht falsch.',tip:'<p>Umlaute ändern die Bedeutung bzw. Form: schon/schön, zahlen/zählen, Mutter/Mütter, fahre/fährt. Auf der Schweizer Tastatur: ä ö ü direkt; in der App die Buttons nutzen.</p>'},
 caps:{n:'Gross-/Kleinschreibung',d:'Nomen klein oder Nicht-Nomen gross geschrieben.',tip:'<p>Alle Nomen und Nominalisierungen gross (das Essen, beim Lesen, etwas Gutes), Höflichkeitsform Sie/Ihnen/Ihr gross; Adjektive, Verben, Pronomen klein.</p>'},
 comma:{n:'Kommasetzung',d:'Komma fehlt oder steht falsch (kleiner Fehler).',tip:'<p>Komma <b>immer</b> vor Nebensätzen (…, dass / weil / obwohl / wenn / der/die/das (Relativsatz)) und nach einem vorangestellten Nebensatz. Kein Komma vor „und/oder“ zwischen zwei Hauptsätzen nötig. Komma bei erweitertem Infinitiv mit um/ohne/statt.</p>'},
 listening:{n:'Hörverstehen / Diktat',d:'Falsch verstanden oder falsch geschrieben.',tip:'<p>Beim Diktat zuerst den ganzen Satz hören, dann in Sinneinheiten schreiben. Endungen besonders beachten (-en/-em/-er). Langsam abspielen.</p>'},
 lesen:{n:'Leseverstehen',d:'Information im Text falsch verstanden.',tip:'<p>Erst Fragen lesen, dann Text. Schlüsselwörter markieren. Achtung bei Negation, Synonymen und Einschränkungen (nur, nicht mehr, kaum).</p>'},
 aussprache:{n:'Aussprache',d:'Wörter wurden von der Spracherkennung nicht verstanden.',tip:'<p>Typische Problemlaute: ü/ö, ch (ich/ach), langes/kurzes e, r, Endung -er ([ɐ]), Wortakzent (meist erste Silbe; nicht bei be-/ver-/-ieren). Langsam vorsprechen lassen und imitieren.</p>'},
 particle:{n:'Modalpartikeln',d:'Partikel (doch, mal, ja, denn, eigentlich) falsch gebraucht.',tip:'<p><b>doch</b> (Aufforderung/Widerspruch), <b>mal</b> (abschwächende Bitte), <b>ja</b> (bekannt/überrascht), <b>denn</b> (Interesse in Fragen), <b>eigentlich</b> (beiläufige Frage). Position: im Mittelfeld, meist nach Pronomen.</p>'},
 temporal:{n:'Zeitangaben',d:'Falsche Zeitpräposition (am/um/im/seit/vor…).',tip:'<p><b>um</b> 8 Uhr, <b>am</b> Montag / am Morgen / am 3. Mai, <b>im</b> Juli / im Sommer / im Jahr 2020 (oder nur: 2020), <b>seit</b> + Dativ (seit drei Jahren – bis jetzt), <b>vor</b> + Dativ (vor drei Jahren – damals), <b>in</b> + Dativ (in drei Tagen – Zukunft), <b>von … bis</b>, <b>ab</b> Montag.</p>'},
 futur:{n:'Futur I / II',d:'werden + Infinitiv falsch.',tip:'<p>Futur I: werden + Infinitiv (Vermutung, Vorhersage, Versprechen): <i>Er wird wohl krank sein.</i> Futur II: werden + Partizip + haben/sein (Vermutung über Vergangenes): <i>Er wird den Zug verpasst haben.</i></p>'},
 register:{n:'Register / Stil',d:'Zu informell / zu formell für die Situation.',tip:'<p>Formell: Sie-Form, „Sehr geehrte…“, „Ich möchte Sie bitten…“, Konjunktiv II für Höflichkeit, Nominalstil in Briefen. Informell: du, „Liebe/r…“, „Viele Grüsse“.</p>'},
 ending:{n:'Endungen (allgemein)',d:'Wortendung falsch.',tip:'<p>Prüfen: Ist es ein Verb (Person?), Adjektiv (Artikel/Kasus?), Nomen (Plural/Dativ Plural -n/Genitiv -s)?</p>'},
 other:{n:'Sonstiges',d:'Nicht automatisch zugeordnet.',tip:''}
},
exam:{
 intro:'Die Sprachanforderungen hängen vom Kanton ab. Für Schwyz und Zug gilt: B2 mündlich und B1 schriftlich – das ist Ihr massgebliches Ziel. Für Zürich genügen B1 mündlich und A2 schriftlich.',
 checked:'Stand recherchiert am 1. November 2026 auf zg.ch, sz.ch und zh.ch. Vor der Anmeldung bei der Gemeinde/dem Kanton prüfen, welche Zertifikate genau akzeptiert werden (insbesondere modulare Teilprüfungen).',
 cantons:[
  {name:'Zürich',oral:'B1',written:'A2',note:'Nachweis per Kantonalem Deutschtest (KDE) oder anerkanntem Zertifikat (z. B. fide, Goethe, telc, ÖSD). Zusätzlich Grundkenntnistest (Staatskunde), sofern keine Befreiung.'},
  {name:'Schwyz',oral:'B2',written:'B1',note:'Sprachdiplom, das das Niveau ausdrücklich bescheinigt (oder Schul-/Hochschulabschluss auf Deutsch). Grundkenntnisse (Schweiz, Kanton Schwyz, Gemeinde) im Gespräch oder per Test (BBZ Pfäffikon/Goldau).'},
  {name:'Zug',oral:'B2',written:'B1',note:'Seit 1.1.2025 verschärft (vorher B1/A2). Sprachzertifikat erforderlich; bei Zweifeln kann ein Sprachtest verlangt werden. Staatsbürgerliches Gespräch (Geschichte, Staatskunde, Rechte & Pflichten).'}
 ],
 formats:[
  {name:'Wichtig: fide geht nur bis B1',html:'<p>Der <b>fide-Test</b> prüft die Niveaus A1–B1 (mündlich und schriftlich getrennt). Er kann daher <b>kein B2</b> bescheinigen. Für B2 mündlich (Schwyz/Zug) brauchen Sie ein international anerkanntes B2-Zertifikat, z. B. <b>Goethe-Zertifikat B2</b>, <b>telc Deutsch B2</b> oder <b>ÖSD Zertifikat B2</b>. Für Zürich reicht fide (B1 mündlich / A2 schriftlich) oder der KDE.</p><p>Das Goethe-Zertifikat B1 und B2 ist <b>modular</b> (Lesen, Hören, Schreiben, Sprechen einzeln ablegbar). Eine mögliche Kombination wäre Goethe B2 <i>Sprechen</i> + B1 <i>Schreiben</i> – vorher beim Kanton bestätigen lassen, dass einzelne Module akzeptiert werden.</p>'},
  {name:'Goethe-Zertifikat B2',html:'<table class="t"><tr><td><b>Lesen</b> 65 Min.</td><td>5 Teile (Meinungen, Artikel, Ratgeber, Regeln)</td></tr><tr><td><b>Hören</b> ca. 40 Min.</td><td>4 Teile (Ansagen, Interview, Diskussion, Vortrag)</td></tr><tr><td><b>Schreiben</b> 75 Min.</td><td>Teil 1: Forumsbeitrag/Meinung (ca. 150 Wörter); Teil 2: formelle Nachricht (ca. 100 Wörter)</td></tr><tr><td><b>Sprechen</b> ca. 15 Min.</td><td>Teil 1: Vortrag (ca. 4 Min.) + Fragen; Teil 2: Diskussion mit Partner (ca. 5 Min.)</td></tr></table><p>Ihr Buch <i>So geht\'s zu B2</i> (Klett) ist genau auf dieses Format ausgerichtet.</p>'},
  {name:'Goethe-Zertifikat B1 (Schreiben)',html:'<p>60 Min., 3 Teile: (1) informelle E-Mail ca. 80 Wörter, (2) Meinungsbeitrag ca. 80 Wörter, (3) kurze formelle Nachricht ca. 40 Wörter.</p>'},
  {name:'fide (A1–B1)',html:'<p>Szenarienbasiert, Schweizer Alltag: Wohnen, Arbeit, Gesundheit, Behörden, Kinder/Schule, Einkaufen, Mobilität. Mündlich: Gespräch über sich, Bilder, Rollenspiele. Schriftlich: Formulare, kurze Mitteilungen, Hören/Lesen von Alltagstexten. Die App enthält fide-artige Rollenspiele (Sprechen A2/B1).</p>'},
  {name:'Kantonaler Deutschtest Zürich (KDE)',html:'<p>Mündlich (B1): sich vorstellen, über ein Alltagsthema sprechen. Schriftlich (A2): Hören, Lesen, Schreiben (3 Teile). Die Gemeinde teilt Ort und Termin mit.</p>'}
 ]
}
};

conj: `<table><tr><th></th><th>regular</th><th>a→ä / e→i(e)</th></tr><tr><td>ich</td><td>wohn<em>e</em></td><td>fahr<em>e</em> / les<em>e</em></td></tr><tr><td>du</td><td>wohn<em>st</em></td><td>f<em>ä</em>hr<em>st</em> / l<em>ie</em>s<em>t</em></td></tr><tr><td>er/sie/es</td><td>wohn<em>t</em></td><td>f<em>ä</em>hr<em>t</em> / l<em>ie</em>s<em>t</em></td></tr><tr><td>wir/sie/Sie</td><td>wohn<em>en</em></td><td>fahr<em>en</em></td></tr><tr><td>ihr</td><td>wohn<em>t</em></td><td>fahr<em>t</em></td></tr></table><p>The stem vowel changes only with <b>du</b> and <b>er/sie/es</b>. Stem ending in -t/-d: du arbeit<em>e</em>st, er arbeit<em>e</em>t.</p>`,
wordorder: `<div class="rule"><b>Main clause:</b> the conjugated verb is <em>always in position 2</em>. If something other than the subject comes first, the subject goes <em>after</em> the verb: <i>Morgen <b>fahre</b> ich nach Zug.</i></div><div class="rule"><b>Verb bracket:</b> the second verb part (infinitive, participle, separable prefix) goes to the end: <i>Ich <b>muss</b> heute <b>arbeiten</b>. Ich <b>habe</b> gestern <b>gearbeitet</b>. Ich <b>rufe</b> dich <b>an</b>.</i></div><div class="rule"><b>Subordinate clause:</b> conjugated verb at the end: <i>…, weil ich heute arbeiten <b>muss</b>.</i> If the subordinate clause comes first, the main clause starts with the verb: <i>Weil es regnet, <b>bleibe</b> ich zu Hause.</i></div><p>Position 0 (no effect on word order): und, aber, oder, denn, sondern.</p><p>Rule of thumb for the middle field: <b>Te-Ka-Mo-Lo</b> (time – reason – manner – place): <i>Ich fahre morgen wegen der Arbeit mit dem Zug nach Bern.</i></p>`,
sep: `<p>Separable prefixes (an-, auf-, aus-, ein-, mit-, vor-, zu-, zurück-, fern-, statt-…) go to the end in a main clause: <i>Ich <b>rufe</b> dich morgen <b>an</b>.</i> In a subordinate clause the verb stays together: <i>…, dass ich dich morgen <b>anrufe</b>.</i> Participle: an<b>ge</b>rufen. zu-infinitive: an<b>zu</b>rufen. Inseparable prefixes (be-, emp-, ent-, er-, ge-, miss-, ver-, zer-): no ge-: <i>verstanden, bezahlt</i>.</p>`,
case: `<table><tr><th></th><th>masc.</th><th>neut.</th><th>fem.</th><th>plural</th></tr><tr><td>Nom</td><td>der / ein</td><td>das / ein</td><td>die / eine</td><td>die / –</td></tr><tr><td>Acc</td><td><em>den / einen</em></td><td>das / ein</td><td>die / eine</td><td>die / –</td></tr><tr><td>Dat</td><td><em>dem / einem</em></td><td><em>dem / einem</em></td><td><em>der / einer</em></td><td><em>den / – (+n)</em></td></tr><tr><td>Gen</td><td>des / eines (+s)</td><td>des / eines (+s)</td><td>der / einer</td><td>der / –</td></tr></table><p>Only the <b>masculine</b> changes in the accusative. Dative plural: the noun gets -n (mit den Kinder<em>n</em>). Questions: Wer? (who – Nom) Wen/Was? (whom/what – Acc) Wem? (to whom – Dat) Wessen? (whose – Gen).</p>`,
gender: `<p>Always learn the gender together with the noun (colours: <span class="der">der</span> <span class="die">die</span> <span class="das">das</span>). Helpful endings:</p><table><tr><th>der</th><td>-er (people), -ling, -ismus, -ant, -ent, -ig, -or; days, months, seasons</td></tr><tr><th>die</th><td>-ung, -heit, -keit, -schaft, -ion, -tät, -ik, -ie, -ei, -ur, -enz; most nouns in -e</td></tr><tr><th>das</th><td>-chen, -lein, -ment, -um, -ma; infinitives used as nouns (das Essen)</td></tr></table><p>Compound nouns: the <b>last</b> word decides the article: das Haus + <b>die</b> Tür → die Haustür.</p>`,
plural: `<p>Types: -e (Tage), ¨-e (Stühle), -er/¨-er (Kinder, Häuser), -(e)n (Frauen, Namen), -s (Autos, Handys), – / ¨ (Lehrer, Mütter). Feminine nouns in -e/-ung/-heit/-keit → almost always -(e)n. Foreign words ending in a vowel → often -s.</p>`,
adj: `<div class="rule"><b>Rule 1:</b> after <b>der/die/das</b> words: ending <em>-e</em> in the 5 “basic forms” (nominative singular all genders, accusative singular fem./neut.), otherwise <em>-en</em>.</div><div class="rule"><b>Rule 2:</b> after <b>ein/kein/mein</b> with no ending (nom. masc., nom./acc. neut.) the adjective shows the gender: ein gut<em>er</em> Wein, ein gut<em>es</em> Buch. Otherwise as rule 1.</div><div class="rule"><b>Rule 3:</b> with <b>no article</b> the adjective takes the article’s ending: gut<em>er</em> Wein (der), mit gut<em>em</em> Wein (dem), gut<em>e</em> Milch (die). Exception genitive masc./neut.: trotz schlecht<em>en</em> Wetters.</div><p>After sein/werden/bleiben (predicative) there is no ending: <i>Der Wein ist gut.</i></p>`,
comp: `<p>schnell – schnell<em>er</em> – am schnell<em>sten</em>; umlaut in many one-syllable adjectives: alt – älter – am ältesten; irregular: gut – besser – am besten, viel – mehr – am meisten, gern – lieber – am liebsten, hoch – höher – am höchsten. Comparing: <i>so … wie</i> (equal), <i>…er als</i> (unequal). Before a noun it takes an ending: das schnell<em>ere</em> Auto.</p>`,
prep: `<table><tr><th>+ accusative</th><td>durch, für, gegen, ohne, um, bis, entlang (placed after the noun)</td></tr><tr><th>+ dative</th><td>aus, bei, mit, nach, seit, von, zu, gegenüber, ab</td></tr><tr><th>two-way (acc/dat)</th><td>an, auf, hinter, in, neben, über, unter, vor, zwischen</td></tr><tr><th>+ genitive</th><td>während, wegen, trotz, statt, innerhalb, ausserhalb, aufgrund</td></tr></table><p>Going to: <i>nach</i> Zürich / in die Schweiz / zu Freunden / zum Arzt; being at: <i>in</i> Zürich / in der Schweiz / bei Freunden / beim Arzt; coming from: <i>aus</i> Zürich / vom Arzt.</p>`,
wechsel: `<div class="rule"><b>Wohin? (where to?)</b> – movement towards a goal → <em>accusative</em>: Ich lege das Buch auf <b>den</b> Tisch. – stellen, legen, setzen, hängen (regular verbs).<br><b>Wo? (where?)</b> – position → <em>dative</em>: Das Buch liegt auf <b>dem</b> Tisch. – stehen, liegen, sitzen, hängen (irregular verbs).</div>`,
perfekt: `<p><b>sein</b> for change of place (gehen, fahren, fliegen, kommen, laufen, reisen, umziehen…), change of state (aufstehen, einschlafen, aufwachen, sterben, werden, passieren) and with <i>sein, bleiben</i>. Otherwise <b>haben</b>.</p><p>Participle: regular ge-…-t (gekauft), irregular ge-…-en (gefahren, gesprochen); separable: ein<b>ge</b>kauft; no ge- with be-/ver-/er-/ent-/zer-/ge-/miss- and verbs in -ieren (besucht, studiert).</p>`,
praet: `<p>Regular: -te (machte, wohnte, arbeitete). Irregular: vowel change and no ending for ich/er: ging, kam, sah, fuhr, las, sprach, nahm, gab, fand, blieb, schrieb. Mixed: dachte, brachte, wusste, kannte. Modal verbs lose the umlaut: konnte, musste, durfte, wollte, sollte, mochte. Also: war, hatte, wurde.</p>`,
modal: `<table><tr><th></th><th>können</th><th>müssen</th><th>dürfen</th><th>wollen</th><th>sollen</th><th>möchten</th></tr><tr><td>ich/er</td><td>kann</td><td>muss</td><td>darf</td><td>will</td><td>soll</td><td>möchte</td></tr><tr><td>du</td><td>kannst</td><td>musst</td><td>darfst</td><td>willst</td><td>sollst</td><td>möchtest</td></tr><tr><td>wir/sie</td><td>können</td><td>müssen</td><td>dürfen</td><td>wollen</td><td>sollen</td><td>möchten</td></tr></table><p>ich and er/sie/es have <b>no ending</b>. The infinitive goes to the end: <i>Ich <b>kann</b> heute nicht <b>kommen</b>.</i> “nicht müssen” = not have to; “nicht dürfen” = must not.</p>`,
pron: `<table><tr><th>Nom</th><td>ich</td><td>du</td><td>er</td><td>sie</td><td>es</td><td>wir</td><td>ihr</td><td>sie/Sie</td></tr><tr><th>Acc</th><td>mich</td><td>dich</td><td>ihn</td><td>sie</td><td>es</td><td>uns</td><td>euch</td><td>sie/Sie</td></tr><tr><th>Dat</th><td>mir</td><td>dir</td><td>ihm</td><td>ihr</td><td>ihm</td><td>uns</td><td>euch</td><td>ihnen/Ihnen</td></tr></table><p>Order: dative noun before accusative noun; but an accusative pronoun comes before the dative: <i>Ich gebe <b>es ihm</b>.</i></p>`,
reflex: `<p>sich freuen, sich treffen, sich anmelden, sich beeilen, sich interessieren für…: ich freue <b>mich</b>, du freust <b>dich</b>, er freut <b>sich</b>, wir freuen <b>uns</b>, ihr freut <b>euch</b>, sie freuen <b>sich</b>. If there is also an accusative object, the reflexive pronoun is dative: Ich wasche <b>mir</b> die Hände. Ich kann <b>mir</b> das vorstellen.</p>`,
neg: `<p><b>kein</b> negates nouns with an indefinite article or no article: <i>Ich habe <b>kein</b> Auto / <b>keine</b> Zeit.</i> <b>nicht</b> negates everything else: verbs, adjectives, nouns with a definite article. Position: before the thing being negated or at the end of the clause – but before the second verb part, a prepositional object, a place and a predicative.</p>`,
conn: `<table><tr><th>Position 0 (verb stays in position 2)</th><td>und, aber, oder, denn, sondern</td></tr><tr><th>Position 1 (verb comes straight after!)</th><td>deshalb, deswegen, darum, trotzdem, dann, danach, außerdem, sonst, also, dennoch</td></tr><tr><th>Subordinate clause (verb at the end)</th><td>weil, da, dass, ob, wenn, als, obwohl, damit, nachdem, bevor, während, bis, seit(dem), sobald, falls, sodass, indem</td></tr></table><p><b>als</b> = a single event in the past; <b>wenn</b> = present/future or repeated (“whenever”). <b>denn</b> (main clause) ≈ <b>weil</b> (subordinate clause).</p>`,
rel: `<p>Gender/number come from the noun it refers to; the <b>case comes from the relative clause</b>.</p><table><tr><th></th><th>m</th><th>n</th><th>f</th><th>pl</th></tr><tr><td>Nom</td><td>der</td><td>das</td><td>die</td><td>die</td></tr><tr><td>Acc</td><td>den</td><td>das</td><td>die</td><td>die</td></tr><tr><td>Dat</td><td>dem</td><td>dem</td><td>der</td><td><em>denen</em></td></tr><tr><td>Gen</td><td>dessen</td><td>dessen</td><td>deren</td><td>deren</td></tr></table><p>A preposition goes before the relative pronoun: <i>die Frau, <b>mit der</b> ich spreche</i>. After alles/etwas/nichts/superlative: <b>was</b>; for places: <b>wo</b>.</p>`,
gen: `<p>des/eines + noun <b>-(e)s</b> (masc./neut.): die Meinung des Arzt<b>es</b>, das Ende des Film<b>s</b>; der/einer (fem./plural): die Wohnung der Familie. Prepositions with genitive: wegen, trotz, während, statt, innerhalb, ausserhalb, aufgrund, anlässlich.</p>`,
konj2: `<p>Forms: <b>wäre, hätte, würde, könnte, müsste, dürfte, sollte, wollte</b>, ginge, käme, wüsste; otherwise <b>würde + infinitive</b>. Past: <b>hätte/wäre + past participle</b> (Ich hätte mehr lernen sollen. Wenn ich das gewusst hätte, wäre ich gekommen.) Used for: wishes, unreal conditions, politeness (Könnten Sie…?), advice (An deiner Stelle würde ich…).</p>`,
konj1: `<p>Subjunctive I = stem + e (er komm<b>e</b>, er hab<b>e</b>, er könn<b>e</b>); sein: er <b>sei</b>, sie <b>seien</b>. If subjunctive I looks the same as the normal form (mostly plural: sie haben), use subjunctive II instead (sie <b>hätten</b>). Past: er habe/sei + participle. Future: er werde + infinitive.</p>`,
passiv: `<table><tr><td>present</td><td>Das Formular <b>wird</b> ausgefüllt.</td></tr><tr><td>simple past</td><td>Das Formular <b>wurde</b> ausgefüllt.</td></tr><tr><td>perfect</td><td>Das Formular <b>ist</b> ausgefüllt <b>worden</b>.</td></tr><tr><td>with modal verb</td><td>Das Formular <b>muss</b> ausgefüllt <b>werden</b>.</td></tr><tr><td>state passive</td><td>Das Formular <b>ist</b> ausgefüllt.</td></tr></table><p>The doer: <b>von + dative</b> (a person), <b>durch + accusative</b> (a means/cause).</p>`,
inf: `<p>After verbs such as versuchen, anfangen, vergessen, hoffen, vorhaben, beschliessen; after expressions such as Es ist wichtig/schwer…, Ich habe Lust/Zeit/keine Angst…: <i>Ich versuche, pünktlich <b>zu</b> sein.</i> Separable verbs: an<b>zu</b>rufen. <b>No zu</b> after modal verbs, lassen, werden, sehen, hören, gehen, bleiben. um…zu (purpose), ohne…zu (without), (an)statt…zu (instead of).</p>`,
verbprep: `<p>Learn the fixed prepositions: warten <b>auf</b> + Acc, denken <b>an</b> + Acc, sich interessieren <b>für</b>, sich freuen <b>auf</b> (future) / <b>über</b> (present/past), teilnehmen <b>an</b> + Dat, sich beschweren <b>über</b>, abhängen <b>von</b>, sich kümmern <b>um</b>, Angst haben <b>vor</b> + Dat. Questions/references: for things use <b>wo(r)-/da(r)-</b> (Worauf wartest du? Darauf!), for people preposition + pronoun (Auf wen? Auf ihn).</p>`,
nominal: `<p>Verb → noun: -ung (entscheiden → die Entscheidung), infinitive (das Lesen), stem (beginnen → der Beginn). Adjective → noun: -heit/-keit (die Freiheit, die Möglichkeit). Verbal style ↔ nominal style: <i>weil es regnete</i> ↔ <i>wegen des Regens</i>; <i>nachdem er angekommen war</i> ↔ <i>nach seiner Ankunft</i>.</p>`,
vocab: `<p>Always learn words in context: nouns with article + plural, verbs with their preposition/case and perfect form. Review every day (spaced repetition).</p>`,
spelling: `<p>Nouns with a capital letter, verbs/adjectives small. Double consonant after a short vowel (kommen, Bett), lengthening h (fahren, Stuhl), ie for a long i (viel, Brief). In Switzerland always “ss” instead of “ß”.</p>`,
umlaut: `<p>Umlauts change the meaning or form: schon/schön, zahlen/zählen, Mutter/Mütter, fahre/fährt. On a Swiss keyboard ä ö ü are direct keys; in the app use the buttons.</p>`,
caps: `<p>All nouns and words used as nouns are capitalised (das Essen, beim Lesen, etwas Gutes), as is the polite form Sie/Ihnen/Ihr; adjectives, verbs and pronouns are small.</p>`,
comma: `<p>A comma <b>always</b> goes before a subordinate clause (…, dass / weil / obwohl / wenn / der/die/das (relative clause)) and after a subordinate clause that comes first. No comma needed before “und/oder” between two main clauses. Comma with an extended infinitive with um/ohne/statt.</p>`,
listening: `<p>In dictation, first listen to the whole sentence, then write it in chunks of meaning. Pay particular attention to endings (-en/-em/-er). Use slow playback.</p>`,
lesen: `<p>Read the questions first, then the text. Mark key words. Watch out for negation, synonyms and restrictions (nur, nicht mehr, kaum).</p>`,
aussprache: `<p>Typical problem sounds: ü/ö, ch (ich/ach), long/short e, r, the ending -er ([ɐ]), word stress (usually the first syllable; not with be-/ver-/-ieren). Have it read slowly and imitate it.</p>`,
particle: `<p><b>doch</b> (urging/contradicting), <b>mal</b> (softens a request), <b>ja</b> (known fact / surprise), <b>denn</b> (shows interest in questions), <b>eigentlich</b> (casual question). Position: in the middle of the clause, usually after pronouns.</p>`,
temporal: `<p><b>um</b> 8 Uhr, <b>am</b> Montag / am Morgen / am 3. Mai, <b>im</b> Juli / im Sommer / im Jahr 2020 (or just: 2020), <b>seit</b> + dative (seit drei Jahren – for three years, until now), <b>vor</b> + dative (vor drei Jahren – three years ago), <b>in</b> + dative (in drei Tagen – in three days, future), <b>von … bis</b> (from … to), <b>ab</b> Montag (from Monday on).</p>`,
futur: `<p>Future I: werden + infinitive (assumption, prediction, promise): <i>Er wird wohl krank sein.</i> Future II: werden + participle + haben/sein (assumption about the past): <i>Er wird den Zug verpasst haben.</i></p>`,
register: `<p>Formal: Sie form, “Sehr geehrte…”, “Ich möchte Sie bitten…”, subjunctive II for politeness, nominal style in letters. Informal: du, “Liebe/r…”, “Viele Grüsse”.</p>`,
ending: `<p>Check: is it a verb (which person?), an adjective (which article/case?), a noun (plural / dative plural -n / genitive -s)?</p>`,
other: ``
};

Object.assign(I18N_C.units, {
'b1-01':{title:'Solid sentence structure: position 1, middle field, time adverbs',
 topics:['Time adverbs (oft, montags, zuerst, anschliessend)','Word order in the main clause','Te-Ka-Mo-Lo in the middle field','Position of pronouns'],
 goals:['put any part of the sentence in position 1','order the middle field naturally','structure sequences with zuerst/dann/anschliessend'],
 grammar:`<h3>1. Time adverbs (do not change form)</h3>
<table><tr><th>Meaning</th><th>Adverbs</th><th>Example</th></tr>
<tr><td>frequency</td><td>immer, meistens, oft, manchmal, selten, nie</td><td>Nuriye trifft oft Freunde online.</td></tr>
<tr><td>repetition</td><td>morgens, vormittags, abends, montags, täglich, wöchentlich, monatlich</td><td>Sonntags telefoniere ich mit meiner Mutter.</td></tr>
<tr><td>sequence</td><td>zuerst, dann, danach, anschliessend, schliesslich, zum Schluss</td><td>Zuerst gehen Sie auf die Webseite, anschliessend registrieren Sie sich.</td></tr></table>
<h3>2. In a main clause the verb is ALWAYS in position 2</h3>
<table><tr><th>Position 1</th><th>Pos. 2</th><th>Middle field</th><th>End</th></tr>
<tr><td>Meine Eltern (subject)</td><td>wollen</td><td>dieses Jahr Urlaub am Meer</td><td>machen.</td></tr>
<tr><td>Den Haustausch (acc. object)</td><td>findet</td><td>Lukas nicht so gut.</td><td></td></tr>
<tr><td>Mir (dat. object)</td><td>gefällt</td><td>der Zürichsee viel besser.</td><td></td></tr>
<tr><td>Letztes Jahr (time)</td><td>haben</td><td>meine Eltern auch so etwas</td><td>gemacht.</td></tr>
<tr><td>Weil es lustiger ist, (subordinate clause)</td><td>bleibt</td><td>Lukas lieber zu Hause.</td><td></td></tr></table>
<h3>3. Order in the middle field</h3>
<div class="rule"><b>Pronouns first</b> (Nom → Acc → Dat): Gestern hat <b>er es ihr</b> gegeben.<br>Then nouns: dative before accusative: Er hat <b>seiner Frau</b> <b>Blumen</b> geschenkt.<br>Adverbials: <b>Te – Ka – Mo – Lo</b> (time – reason – manner – place): Ich fahre <b>morgen</b> <b>wegen eines Termins</b> <b>mit dem Zug</b> <b>nach Bern</b>.</div>
<p><i>nicht</i> usually comes late in the middle field (→ B1-13).</p>
<div class="ch">English: Subject – Verb – Object – Place – Time. German: time usually <b>before</b> place! <i>Ich gehe am Abend ins Kino</i> (not: ins Kino am Abend).</div>`},
'b1-02':{title:'Adjective endings – complete',
 source:'Sicher! B1+ Grammatik L1 · Basic German Unit 25 · Tracker B1.1 · Netzwerk neu B1 ch. 5, 9',
 topics:['after the definite article','after the indefinite article / possessive / kein','without an article','plural','genitive'],
 goals:['build adjective endings systematically (not by memorising)','decline correctly without an article and in the genitive'],
 pitfalls:['<b>*mit freundliche Grüssen</b> → mit freundlichen Grüssen (dative plural without article: -en).','<b>*Sehr geehrter Damen und Herren</b> → Sehr geehrte Damen und Herren (nominative plural without article).','<b>*ein gutes Wein</b> → ein guter Wein.','<b>*trotz schlechtes Wetters</b> → trotz schlechten Wetters.'],
 grammar:`<h3>a) After the definite article (der, dieser, jeder, welcher, alle)</h3>
<table><tr><th></th><th>masculine</th><th>neuter</th><th>feminine</th><th>plural</th></tr>
<tr><td>N</td><td>der schön<em>e</em> Satz</td><td>das schön<em>e</em> Wort</td><td>die schön<em>e</em> Sprache</td><td>die schön<b>en</b> Wörter</td></tr>
<tr><td>A</td><td>den schön<b>en</b> Satz</td><td>das schön<em>e</em> Wort</td><td>die schön<em>e</em> Sprache</td><td>die schön<b>en</b> Wörter</td></tr>
<tr><td>D</td><td>dem schön<b>en</b> Satz</td><td>dem schön<b>en</b> Wort</td><td>der schön<b>en</b> Sprache</td><td>den schön<b>en</b> Wörtern</td></tr>
<tr><td>G</td><td>des schön<b>en</b> Satzes</td><td>des schön<b>en</b> Wortes</td><td>der schön<b>en</b> Sprache</td><td>der schön<b>en</b> Wörter</td></tr></table>
<h3>b) After ein/kein/mein (singular) – plural: meine/keine</h3>
<table><tr><th></th><th>masculine</th><th>neuter</th><th>feminine</th><th>plural</th></tr>
<tr><td>N</td><td>ein schön<em>er</em> Satz</td><td>ein schön<em>es</em> Wort</td><td>eine schön<em>e</em> Sprache</td><td>meine schön<b>en</b> Wörter</td></tr>
<tr><td>A</td><td>einen schön<b>en</b> Satz</td><td>ein schön<em>es</em> Wort</td><td>eine schön<em>e</em> Sprache</td><td>meine schön<b>en</b> Wörter</td></tr>
<tr><td>D</td><td>einem schön<b>en</b> Satz</td><td>einem schön<b>en</b> Wort</td><td>einer schön<b>en</b> Sprache</td><td>meinen schön<b>en</b> Wörtern</td></tr>
<tr><td>G</td><td>eines schön<b>en</b> Satzes</td><td>eines schön<b>en</b> Wortes</td><td>einer schön<b>en</b> Sprache</td><td>meiner schön<b>en</b> Wörter</td></tr></table>
<h3>c) Without an article – the adjective takes the article’s ending</h3>
<table><tr><th></th><th>masculine</th><th>neuter</th><th>feminine</th><th>plural</th></tr>
<tr><td>N</td><td>schnell<em>er</em> Erfolg</td><td>lang<em>es</em> Warten</td><td>gut<em>e</em> Leistung</td><td>schön<em>e</em> Wörter</td></tr>
<tr><td>A</td><td>schnell<em>en</em> Erfolg</td><td>lang<em>es</em> Warten</td><td>gut<em>e</em> Leistung</td><td>schön<em>e</em> Wörter</td></tr>
<tr><td>D</td><td>schnell<em>em</em> Erfolg</td><td>lang<em>em</em> Warten</td><td>gut<em>er</em> Leistung</td><td>schön<em>en</em> Wörtern</td></tr>
<tr><td>G</td><td>schnell<b>en</b> Erfolgs (!)</td><td>lang<b>en</b> Wartens (!)</td><td>gut<em>er</em> Leistung</td><td>schön<em>er</em> Wörter</td></tr></table>
<div class="rule"><b>The system in one sentence:</b> the gender/case signal (-r, -s, -e, -m, -n) appears exactly once – on the article <i>or</i> on the adjective. If the article already carries it, the adjective only gets -e/-en. Without an article the adjective carries the signal (exception genitive m/n: -en, because the noun already has -s).</div>
<p>Also after numbers and <i>viele, einige, mehrere, wenige</i>: as without an article (zwei gut<b>e</b> Freunde, mit vielen neu<b>en</b> Ideen). After <i>alle</i>: as after the definite article (alle neu<b>en</b> Mitarbeiter).</p>`},
'b1-03':{title:'Speaking naturally – modal particles',
 goals:['make spoken German sound more natural','make requests friendlier','understand undertones in conversations'],
 pitfalls:['<b>*Doch kommen Sie herein</b> – a particle never goes in position 1: Kommen Sie doch herein!','<b>denn</b> as a particle only in questions.','Do not use particles in formal letters.'],
 grammar:`<p>Modal particles change the <b>effect</b> a sentence has on the listener – not its content. They stand in the middle field (usually after pronouns) and are unstressed.</p>
<table><tr><th>Particle</th><th>Function</th><th>Example</th></tr>
<tr><td>doch</td><td>contrast / reminder</td><td>Der Bus war <b>doch</b> ganz pünktlich. Das weisst du <b>doch</b>!</td></tr>
<tr><td>doch</td><td>friendly invitation/request</td><td>Kommen Sie <b>doch</b> bitte herein! Setz dich <b>doch</b>!</td></tr>
<tr><td>denn</td><td>interest in questions</td><td>Sind wir hier <b>denn</b> richtig? Was ist <b>denn</b> los?</td></tr>
<tr><td>eigentlich</td><td>casual question / softening</td><td>Kennen Sie sich <b>eigentlich</b>? Es war <b>eigentlich</b> ganz einfach.</td></tr>
<tr><td>ja</td><td>surprise / known fact</td><td>Ihre Wohnung ist <b>ja</b> toll! Sie wissen <b>ja</b>, dass …</td></tr>
<tr><td>mal</td><td>softens a request</td><td>Möchtest du <b>mal</b> probieren? Schau <b>mal</b> auf die Uhr!</td></tr>
<tr><td>halt / eben</td><td>resignation, can’t be changed</td><td>Das ist <b>halt</b> so. Dann nehmen wir <b>eben</b> den nächsten Zug.</td></tr>
<tr><td>schon</td><td>reassurance / restriction</td><td>Das klappt <b>schon</b>. Das ist <b>schon</b> gut, aber teuer.</td></tr></table>
<div class="rule">Combination: <i>Komm <b>doch mal</b> vorbei!</i> (friendly invitation). Imperatives without a particle often sound too direct in German.</div>
<p>In the exam (speaking B1/B2) particles sound natural – but don’t overdo it. Avoid them in formal texts.</p>`},
'b1-04':{title:'Verbs with prepositions & prepositional adverbs',
 topics:['verbs with preposition + accusative','verbs with preposition + dative','wo(r)- and da(r)-','people vs. things'],
 goals:['master the 40 most important verb–preposition combinations','refer to things and clauses with darauf/daran/dafür'],
 source:'Sicher! B1+ Grammatik L2 (verbs with prepositions, prepositional pronouns) – list from p. 112 in the course book · Netzwerk neu B1 ch. 4',
 pitfalls:['<b>*Ich warte für dich</b> → auf dich.','<b>*Ich interessiere mich über Politik</b> → für Politik.','<b>*Ich nehme teil an den Kurs</b> → an dem (am) Kurs (dative).','<b>*Ich freue mich auf das Geschenk, das ich gestern bekommen habe</b> → über (past).'],
 grammar:`<h3>a) Preposition + accusative</h3>
<table><tr><td><b>an</b></td><td>denken an, sich erinnern an, glauben an, sich gewöhnen an, schreiben an</td></tr>
<tr><td><b>auf</b></td><td>achten auf, sich freuen auf, hoffen auf, warten auf, sich verlassen auf, sich vorbereiten auf, sich konzentrieren auf, aufpassen auf, reagieren auf, antworten auf</td></tr>
<tr><td><b>für</b></td><td>sich bedanken für, sich entscheiden für, sich interessieren für, sorgen für, sich engagieren für, sich entschuldigen für, ausgeben für</td></tr>
<tr><td><b>über</b></td><td>sich ärgern über, sich beschweren über, sich freuen über, nachdenken über, sprechen/diskutieren über, sich informieren über, sich wundern über</td></tr>
<tr><td><b>um</b></td><td>bitten um, sich kümmern um, sich bewerben um, es geht um, sich sorgen um</td></tr></table>
<h3>b) Preposition + dative</h3>
<table><tr><td><b>an</b></td><td>teilnehmen an, arbeiten an, zweifeln an, leiden an</td></tr><tr><td><b>bei</b></td><td>sich bedanken bei, helfen bei, sich bewerben bei, sich entschuldigen bei, sich melden bei</td></tr>
<tr><td><b>mit</b></td><td>anfangen/aufhören mit, sich beschäftigen mit, telefonieren mit, sich treffen mit, sich verabreden mit, vergleichen mit, zufrieden sein mit</td></tr>
<tr><td><b>nach</b></td><td>fragen nach, suchen nach, sich erkundigen nach, riechen/schmecken nach</td></tr><tr><td><b>von</b></td><td>abhängen von, erzählen von, sich erholen von, träumen von, sich verabschieden von, überzeugt sein von</td></tr>
<tr><td><b>vor</b></td><td>Angst haben vor, warnen vor, sich fürchten vor, schützen vor</td></tr><tr><td><b>zu</b></td><td>einladen zu, gratulieren zu, gehören zu, passen zu, raten zu</td></tr></table>
<h3>c) Asking and referring</h3>
<div class="rule"><b>Things:</b> wo(r) + prep. / da(r) + prep.: <i>Worauf freust du dich? – Auf das Riesenrad. Darauf freue ich mich am meisten.</i><br><b>People:</b> prep. + wen/wem / prep. + pronoun: <i>Auf wen wartest du? – Auf Claudia. Auf sie muss man immer warten.</i></div>
<p>Likewise: woran/daran, wofür/dafür, worüber/darüber, worum/darum, wobei/dabei, womit/damit, wovon/davon, wozu/dazu, wovor/davor.</p>
<p><b>da(r)- + clause/infinitive:</b> <i>Ich freue mich <b>darauf</b>, dass du kommst. Er hat sich <b>darüber</b> beschwert, dass es zu laut ist. Denk <b>daran</b>, den Müll rauszubringen!</i></p>`},
'b1-05':{title:'Future & assumptions – werden + infinitive',
 topics:['future I','assumptions with wohl/wahrscheinlich','prediction, promise, plan','present tense for the future'],
 goals:['express plans, predictions and promises','make assumptions'],
 pitfalls:['<b>*Ich werde morgen nach Bern fahre</b> → fahren (infinitive).','<b>*Ich will morgen kommen</b> ≠ I will come; will = want → Ich werde morgen kommen.','<b>*Er wird wohl krank</b> → Er wird wohl krank sein.'],
 grammar:`<p><b>werden</b> (position 2) + <b>infinitive</b> (end). Future I often has a <b>modal</b> function:</p>
<table><tr><th>Function</th><th>Example</th></tr>
<tr><td>assumption (+ wohl, wahrscheinlich, vermutlich, sicher)</td><td>Wir <b>werden</b> (wohl) dieses Jahr wieder ans Meer <b>fahren</b>. – Er <b>wird</b> wohl krank <b>sein</b>.</td></tr>
<tr><td>prediction</td><td>Das Elektroauto <b>wird</b> leise und umweltschonend <b>sein</b>. Morgen <b>wird</b> es regnen.</td></tr>
<tr><td>promise</td><td>Ja, das <b>werde</b> ich <b>machen</b>. Ich <b>werde</b> dich nie vergessen.</td></tr>
<tr><td>plan / resolution</td><td>Im Sommer <b>werde</b> ich nach Australien <b>fliegen</b>. Ab morgen <b>werde</b> ich weniger Zucker essen.</td></tr></table>
<div class="rule">For a simple future with a time expression German usually just uses the <b>present tense</b>: <i>Morgen fahre ich nach Bern.</i> The future tense stresses assumption, promise or resolution.</div>
<table><tr><td>ich werde</td><td>du wirst</td><td>er/sie/es wird</td><td>wir werden</td><td>ihr werdet</td><td>sie/Sie werden</td></tr></table>
<p>In a subordinate clause: …, dass er morgen kommen <b>wird</b>. With a modal verb (rare): Ich werde das machen <b>müssen</b>.</p>
<h3>werden – three uses</h3><p>1. Full verb (become): Sie <b>wird</b> Ärztin. 2. Future: Sie <b>wird</b> kommen. 3. Passive: Das Haus <b>wird</b> renoviert.</p>`},
'b1-06':{title:'Describing more precisely – relative clauses',
 topics:['relative pronouns nom/acc/dat/gen','relative clause with a preposition','wo, was, wer','word order'],
 goals:['describe people and things more precisely with relative clauses','choose the relative pronoun in every case'],
 pitfalls:['<b>*die Leute, die ich helfe</b> → denen ich helfe (helfen + dative).','<b>*das Buch, was ich lese</b> → das ich lese (was only after alles/etwas/nichts…).','<b>*die Frau, mit der ich habe gesprochen</b> → mit der ich gesprochen habe.','Forgetting the comma at the end of the relative clause.'],
 grammar:`<p>A relative clause describes a noun more precisely. It is a subordinate clause: <b>verb at the end</b>, commas before and after.</p>
<div class="rule">Sie erhalten eine Rechnung. Sie können die Rechnung bargeldlos bezahlen.<br>→ Sie erhalten eine Rechnung, <b>die</b> Sie bargeldlos bezahlen <b>können</b>.</div>
<h3>Relative pronouns</h3>
<table><tr><th></th><th>masculine</th><th>neuter</th><th>feminine</th><th>plural</th></tr>
<tr><td>Nom</td><td>der</td><td>das</td><td>die</td><td>die</td></tr><tr><td>Acc</td><td><em>den</em></td><td>das</td><td>die</td><td>die</td></tr><tr><td>Dat</td><td><em>dem</em></td><td><em>dem</em></td><td><em>der</em></td><td><em>denen</em></td></tr><tr><td>Gen</td><td><em>dessen</em></td><td><em>dessen</em></td><td><em>deren</em></td><td><em>deren</em></td></tr></table>
<div class="rule"><b>Gender and number</b> come from the noun referred to, the <b>case</b> comes from the relative clause.<br>der Mann, <b>der</b> dort steht (Nom) · der Mann, <b>den</b> ich kenne (Acc: ich kenne ihn) · der Mann, <b>dem</b> ich helfe (Dat: ich helfe ihm) · der Mann, <b>dessen</b> Auto kaputt ist (Gen)</div>
<h3>With a preposition</h3><p>Preposition + relative pronoun at the start: <i>Kontrolleure haben einen Apparat, <b>mit dem</b> Sie die Anmeldung überprüfen können. Die Kollegin, <b>auf die</b> ich warte, …</i></p>
<h3>wo, was, wer</h3>
<table><tr><td><b>wo</b></td><td>after places, names of cities and countries, da/dort/überall</td><td>Zürich ist die Stadt, <b>wo</b> ich arbeite. (= in der)</td></tr>
<tr><td><b>was</b></td><td>after etwas, nichts, alles, vieles, das; after a superlative used as a noun; referring to a whole clause</td><td>Das ist alles, <b>was</b> ich weiss. Das ist das Beste, <b>was</b> es gibt. Er kam pünktlich, <b>was</b> mich überraschte.</td></tr>
<tr><td><b>wo(r) + prep.</b></td><td>for was / whole-clause reference with a preposition</td><td>Es gibt etwas, <b>worüber</b> ich mit Ihnen sprechen möchte.</td></tr></table>`},
'b1-07':{title:'Living & swapping – word formation, (nicht) brauchen zu',
 topics:['compounds: adjective/noun/verb + noun','suffixes -er, -ler, -ent, -chen, -ung, -heit, -keit, -ei, -ie, -ik','nicht/nur brauchen … zu'],
 goals:['work out the article of new words','understand long compound nouns','express “not have to” elegantly with “nicht brauchen zu”'],
 source:'Sicher! B1+ Grammatik L4 & L7 (noun formation, nicht/nur brauchen … zu, suffixes) · Netzwerk neu B1 ch. 8',
 pitfalls:['<b>*die Haustür → das Haustür</b> – the last part decides: die Tür → die Haustür.','<b>*Du brauchst nicht kommen</b> (colloquial) → Du brauchst nicht zu kommen.','<b>*Du brauchst zu kommen</b> (positive without nur) → Du musst kommen.'],
 grammar:`<h3>1. Compound nouns</h3><p>The <b>last</b> word decides the article and the meaning:</p>
<table><tr><td>adjective + noun</td><td>hoch + das Bett → <b>das</b> Hochbett</td></tr><tr><td>noun + noun</td><td>das Sofa + der Kasten → <b>der</b> Sofakasten</td></tr><tr><td>verb + noun</td><td>klapp(en) + der Tisch → <b>der</b> Klapptisch</td></tr></table>
<p>Often with a linking s: die Wohnung<b>s</b>suche, die Arbeit<b>s</b>zeit (after -ung, -heit, -keit, -ion, -tät, -ling, -schaft).</p>
<h3>2. Suffixes give away the article</h3>
<table><tr><th>der</th><th>das</th><th>die</th></tr><tr><td>-er (people): Banker, Spieler<br>-ler: Händler · -ent: Student, Präsident · -ant: Praktikant · -ling · -ismus</td><td>-chen: Päckchen, Brötchen<br>-lein · -ment · -um</td><td>-ung: Quittung, Rechnung · -heit: Sicherheit · -keit: Möglichkeit · -ik: Elektronik · -ei: Bäckerei · -ie: Drogerie · -ion · -tät · -schaft</td></tr></table>
<p>Careful: -er for things is not always der: <i>das Zimmer, das Wetter, das Fenster</i>.</p>
<h3>3. nicht/nur brauchen … zu</h3>
<div class="rule"><b>nicht brauchen … zu</b> = not have to: Man <b>braucht</b> für die Unterkunft <b>nicht zu</b> bezahlen. = Man muss … nicht bezahlen.<br><b>kein- brauchen … zu</b>: Sie brauchen <b>keinen</b> Cent <b>zu</b> bezahlen.<br><b>nur brauchen … zu</b> = only have to: Sie <b>brauchen nur</b> einen Tauschpartner <b>zu</b> finden.</div>
<p>brauchen + object (no zu) = need: Ich brauche eine grössere Wohnung.</p>`},
'b1-08':{title:'Expressing time precisely – time prepositions & clauses',
 topics:['gegen, seit, von … an, ausserhalb, innerhalb, während','als, wenn, während, bevor, nachdem, seit(dem), bis, sobald','sequence of tenses with nachdem'],
 goals:['describe sequences in time precisely','use nachdem with the correct tense'],
 source:'Sicher! B1+ Grammatik L4 (time prepositions) · Tracker B1.1 (Subordinate clauses II) · Netzwerk neu B1 ch. 3, 7',
 pitfalls:['<b>*Wenn ich gestern nach Hause kam</b> → Als ich gestern …','<b>*Nachdem ich esse, gehe ich</b> → Nachdem ich gegessen habe, …','<b>*Während dem Essen</b> (colloquial) → während des Essens.','<b>*bevor zu gehen</b> → bevor du gehst / vor dem Gehen.'],
 grammar:`<h3>1. Time prepositions</h3>
<table><tr><th>Preposition</th><th>Meaning</th><th>Example</th></tr><tr><td>gegen + acc</td><td>about, around (point in time)</td><td>Sie gehen gegen 20 Uhr ins Bett.</td></tr><tr><td>seit + dat</td><td>started in the past, still continuing</td><td>Er wohnt seit drei Jahren in der WG.</td></tr><tr><td>von … an + dat</td><td>from this point on</td><td>von nächstem Montag an</td></tr><tr><td>ausserhalb + gen</td><td>outside a period</td><td>ausserhalb der Öffnungszeiten</td></tr><tr><td>innerhalb + gen</td><td>within a period</td><td>innerhalb des letzten Jahres</td></tr><tr><td>während + gen</td><td>during, at the same time</td><td>während des Essens</td></tr></table>
<h3>2. Time clauses (verb at the end)</h3>
<table><tr><th>Connector</th><th>Meaning</th><th>Example</th></tr>
<tr><td>als</td><td>once, in the past</td><td>Als ich in die Schweiz kam, war alles neu.</td></tr>
<tr><td>wenn</td><td>repeated / present, future</td><td>Wenn ich nach Hause komme, koche ich.</td></tr>
<tr><td>während</td><td>at the same time</td><td>Während ich koche, hört mein Mann Radio.</td></tr>
<tr><td>bevor</td><td>before</td><td>Bevor du gehst, mach bitte das Licht aus.</td></tr>
<tr><td>nachdem</td><td>after (tense shift!)</td><td>Nachdem ich gegessen <b>hatte</b>, <b>ging</b> ich spazieren.</td></tr>
<tr><td>seit(dem)</td><td>since – start until now</td><td>Seitdem ich hier wohne, fahre ich Velo.</td></tr>
<tr><td>bis</td><td>until – end point</td><td>Warte, bis ich zurückkomme.</td></tr>
<tr><td>sobald</td><td>as soon as</td><td>Sobald ich Bescheid weiss, melde ich mich.</td></tr></table>
<div class="rule"><b>nachdem</b>: the subordinate clause is one tense step earlier.<br>Main clause present/future → subordinate clause <b>perfect</b>: Nachdem ich die Arbeit beendet <b>habe</b>, gehe ich nach Hause.<br>Main clause simple past/perfect → subordinate clause <b>past perfect</b> (hatte/war + participle): Nachdem er angekommen <b>war</b>, rief er an.</div>`},
'b1-09':{title:'If I could … – subjunctive II: wishes & conditions',
 topics:['unreal wishes','unreal conditions (wenn … würde)','forms: würde, hätte, wäre, könnte, käme, ginge, wüsste','past subjunctive II','conditional clause without wenn'],
 goals:['express wishes and unreal situations','talk about missed chances (hätte … sollen)'],
 source:'Sicher! B1+ Grammatik L5 (subjunctive II) · Tracker B1.2 · Netzwerk neu B1 ch. 4',
 pitfalls:['<b>*Wenn ich würde Zeit haben</b> → Wenn ich Zeit hätte.','<b>*Wenn ich reich wäre, ich würde …</b> → würde ich …','<b>*Ich hätte mehr gelernt sollen</b> → Ich hätte mehr lernen sollen.','<b>*ich wollte</b> (simple past) for a wish → ich möchte / ich würde gern.'],
 grammar:`<div class="rule">Wenn ich gut singen <b>könnte</b>, <b>würde</b> ich eine Band gründen. (→ But I can’t sing well.)</div>
<h3>a) Forms (present)</h3><p>Mostly <b>würde + infinitive</b>. With haben, sein, modal verbs and some frequent verbs (kommen, gehen, wissen, geben, finden) the original form is more common. It is derived from the simple past (kam → käme).</p>
<table><tr><th></th><th>werden</th><th>haben</th><th>sein</th><th>müssen</th><th>kommen</th><th>gehen</th><th>wissen</th></tr>
<tr><td>ich</td><td>würde</td><td>hätte</td><td>wäre</td><td>müsste</td><td>käme</td><td>ginge</td><td>wüsste</td></tr><tr><td>du</td><td>würdest</td><td>hättest</td><td>wär(e)st</td><td>müsstest</td><td>käm(e)st</td><td>ging(e)st</td><td>wüsstest</td></tr><tr><td>er/sie/es</td><td>würde</td><td>hätte</td><td>wäre</td><td>müsste</td><td>käme</td><td>ginge</td><td>wüsste</td></tr><tr><td>wir/sie/Sie</td><td>würden</td><td>hätten</td><td>wären</td><td>müssten</td><td>kämen</td><td>gingen</td><td>wüssten</td></tr><tr><td>ihr</td><td>würdet</td><td>hättet</td><td>wärt</td><td>müsstet</td><td>käm(e)t</td><td>ging(e)t</td><td>wüsstet</td></tr></table>
<p>Likewise: können → könnte, dürfen → dürfte, sollen → sollte, wollen → wollte (= same as simple past!), mögen → möchte.</p>
