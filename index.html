{id:'b2-01',level:'B2',title:'Argumente verbinden – zweiteilige Konnektoren & Mittelfeld',cat:'conn',vocab:['b2-gesellschaft'],
 topics:['zwar … aber, einerseits … andererseits, je … desto/umso','nicht nur … sondern auch, sowohl … als auch, weder … noch, entweder … oder','Mittelfeld: Angaben (Te-Ka-Mo-Lo) und Ergänzungen'],
 source:'Sicher! B2 Grammatik L1 (Zweiteilige Konnektoren, Mittelfeld im Hauptsatz)',
 goals:['im Prüfungsgespräch abwägen und gewichten','lange Mittelfelder korrekt ordnen'],
 grammar:`<h3>1. Zweiteilige Konnektoren</h3>
<table><tr><th>Konnektor</th><th>Funktion</th><th>Beispiel</th></tr>
<tr><td><b>zwar … aber</b></td><td>Einschränkung</td><td>Freundschaften im Netz sind <b>zwar</b> praktisch, <b>aber</b> sie ersetzen keine echten Treffen.</td></tr>
<tr><td><b>einerseits … andererseits</b></td><td>zwei Seiten abwägen</td><td><b>Einerseits</b> ist die Stadt teuer, <b>andererseits</b> bietet sie viele Möglichkeiten.</td></tr>
<tr><td><b>je … desto / umso</b></td><td>proportionale Steigerung</td><td><b>Je</b> länger ich in der Schweiz <b>lebe</b>, <b>desto</b> besser <b>gefällt</b> es mir.</td></tr>
<tr><td><b>nicht nur … sondern auch</b></td><td>Erweiterung</td><td>Er ist <b>nicht nur</b> Kollege, <b>sondern auch</b> ein guter Freund.</td></tr>
<tr><td><b>sowohl … als auch</b></td><td>Aufzählung</td><td><b>Sowohl</b> Jung <b>als auch</b> Alt nutzen soziale Netzwerke.</td></tr>
<tr><td><b>weder … noch</b></td><td>doppelte Verneinung</td><td>Sie hat <b>weder</b> angerufen <b>noch</b> geschrieben.</td></tr>
<tr><td><b>entweder … oder</b></td><td>Alternative</td><td><b>Entweder</b> wir finden einen Kompromiss, <b>oder</b> das Projekt scheitert.</td></tr></table>
<div class="rule"><b>je + Komparativ … (Verb am Ende), desto/umso + Komparativ + Verb …</b>: Je mehr man übt, desto sicherer wird man.<br><b>zwar</b> und <b>einerseits</b> können Position 1 besetzen → Verb folgt: Zwar <b>ist</b> die Wohnung klein, aber …</div>
<h3>2. Das Mittelfeld</h3>
<p><b>a) Angaben:</b> Te(mporal) – Ka(usal) – Mo(dal) – Lo(kal): <i>Ich treffe mich <b>heute</b> <b>wegen des Projekts</b> <b>gern</b> <b>im Büro</b> mit ihm.</i> (Flexibel, aber diese Reihenfolge ist neutral.)</p>
<p><b>b) Ergänzungen:</b> Dativ vor Akkusativ (Nomen); Akkusativ-Pronomen vor Dativ-Pronomen; Pronomen vor Nomen; Präpositional- und Lokalergänzungen am Ende des Mittelfeldes: <i>Ich habe <b>meinem Freund</b> <b>das Buch</b> <b>gestern</b> zurückgegeben. Ich habe <b>es ihm</b> gestern zurückgegeben. Er hat sich gestern lange <b>über den Lärm</b> beschwert.</i></p>`,
 pitfalls:['<b>*Je mehr ich lerne, desto ich verstehe mehr</b> → desto mehr verstehe ich.','<b>*Zwar ich verstehe das, aber …</b> → Zwar verstehe ich das / Ich verstehe das zwar, aber …','<b>*weder … oder</b> → weder … noch.','<b>*Einerseits … anderseits … auf der anderen Seite</b> – nicht mischen.'],
 examples:[['Einerseits sind die Löhne in der Schweiz hoch, andererseits sind auch die Lebenskosten hoch.','On the one hand wages in Switzerland are high, on the other hand living costs are too.'],['Je früher man mit einer Sprache beginnt, desto leichter fällt sie einem.','The earlier you start a language, the easier it is.'],['Das Angebot ist zwar günstig, aber die Qualität überzeugt mich nicht.','The offer is cheap, but the quality doesn’t convince me.'],['Die direkte Demokratie bietet nicht nur Mitsprache, sondern verlangt auch Verantwortung.','Direct democracy not only offers a say but also demands responsibility.'],['Weder die Regierung noch das Parlament wollten nachgeben.','Neither the government nor parliament wanted to give way.'],['Sowohl Arbeitgeber als auch Gewerkschaften begrüssen den Kompromiss.','Both employers and unions welcome the compromise.'],['Entweder man investiert jetzt, oder es wird später teurer.','Either you invest now, or it will be more expensive later.'],['Je mehr ich darüber nachdenke, umso weniger überzeugt mich die Idee.','The more I think about it, the less the idea convinces me.'],['Ich habe es ihm gestern ausführlich erklärt.','I explained it to him in detail yesterday.'],['Wir haben uns letzte Woche wegen der Kündigung lange mit dem Vermieter unterhalten.','Last week we had a long talk with the landlord about the termination.']],
 ex:['t:conn|je … desto: Man übt viel. Man spricht flüssig.|Je mehr man übt, desto flüssiger spricht man','t:conn|je … desto: Die Wohnung ist zentral. Sie ist teuer.|Je zentraler die Wohnung ist, desto teurer ist sie','t:conn|zwar … aber: Die Stelle ist interessant. Sie ist schlecht bezahlt.|Die Stelle ist zwar interessant, aber sie ist schlecht bezahlt/Die Stelle ist zwar interessant, aber schlecht bezahlt/Zwar ist die Stelle interessant, aber sie ist schlecht bezahlt','t:conn|weder … noch: Er hat nicht angerufen. Er hat nicht geschrieben.|Er hat weder angerufen noch geschrieben','t:conn|einerseits … andererseits: Ich möchte reisen. Ich muss sparen.|Einerseits möchte ich reisen, andererseits muss ich sparen','m:conn|Je älter man wird, ___ ruhiger wird man.|desto~so~als','m:conn|Er spricht ___ Französisch noch Italienisch.|weder~entweder~sowohl','m:conn|Das Auto ist ___ alt, aber es fährt noch gut.|zwar~einerseits~sowohl','m:wordorder|Welcher Satz ist korrekt?|Je mehr ich lese, desto mehr verstehe ich.~Je mehr ich lese, desto ich verstehe mehr.~Je mehr lese ich, desto mehr ich verstehe.','m:wordorder|Welche Reihenfolge ist neutral?|Ich fahre morgen wegen der Prüfung mit dem Zug nach Bern.~Ich fahre nach Bern mit dem Zug morgen wegen der Prüfung.~Ich fahre mit dem Zug wegen der Prüfung nach Bern morgen.','m:pron|Ich habe ___ gestern gegeben.|es ihm~ihm es~ihn es','g:conn|Sowohl die Schweiz ___ Österreich sind Alpenländer.|als auch','o:conn|The longer I wait, the more nervous I get.|Je länger ich warte, desto nervöser werde ich']},

{id:'b2-02',level:'B2',title:'Zustände & Eigenschaften – Zustandspassiv, Partizipien als Adjektive',cat:'passiv',vocab:['b2-arbeit'],
 topics:['Zustandspassiv (sein + Partizip II)','Vorgangs- vs. Zustandspassiv','Partizip I und II als Adjektiv','Wortbildung: Nachsilben bei Nomen'],
 source:'Sicher! B2 Grammatik L1 & L2 (Nachsilben, Zustandspassiv, Partizip I und II als Adjektive)',
 goals:['Ergebnisse und Zustände ausdrücken','kompakte Nominalgruppen mit Partizipien bilden'],
 grammar:`<h3>1. Zustandspassiv: sein + Partizip II</h3>
<table><tr><th>Vorgangspassiv (Prozess)</th><th>Zustandspassiv (Resultat)</th></tr><tr><td>Das Büro <b>wird</b> gerade <b>geputzt</b>.</td><td>Das Büro <b>ist</b> jetzt <b>geputzt</b>.</td></tr><tr><td>Der Vertrag <b>wurde</b> gestern <b>unterschrieben</b>.</td><td>Der Vertrag <b>ist</b> (schon) <b>unterschrieben</b>.</td></tr></table>
<p>Präteritum: Das Geschäft <b>war</b> geschlossen. Mit Modalverb: Die Unterlagen <b>müssen</b> bis Freitag <b>eingereicht sein</b>.</p>
<h3>2. Partizip I und II als Adjektiv</h3>
<table><tr><th>Partizip I (Infinitiv + d): aktiv, gleichzeitig</th><th>Partizip II: passiv / abgeschlossen</th></tr><tr><td>das <b>weinende</b> Kind (das Kind, das weint)<br>steigende Preise<br>die <b>wachsende</b> Bevölkerung<br>ein <b>überzeugendes</b> Argument</td><td>das <b>reparierte</b> Auto (das repariert wurde)<br>gestiegene Preise (die gestiegen sind)<br>die <b>ausgefüllten</b> Formulare<br>ein <b>geschlossenes</b> Fenster</td></tr></table>
<p>Partizipien bekommen normale Adjektivendungen. Als Adverb: Er sprach <b>überzeugend</b>.</p>
<h3>3. Nachsilben bei Nomen (Wiederholung + B2)</h3><p>-ung (die Lösung), -heit/-keit (die Gesundheit, die Pünktlichkeit), -schaft (die Gesellschaft), -tum (das Eigentum, der Irrtum!), -nis (das Ergebnis, die Erlaubnis), -ling (der Lehrling), -ei (die Bäckerei), -ie (die Bürokratie), -ion (die Integration), -tät (die Qualität), -ismus (der Föderalismus), -ur (die Kultur), -enz/-anz (die Konkurrenz, die Toleranz).</p>`,
 pitfalls:['<b>*Das Geschäft wird geschlossen</b> (meint: ist jetzt zu) → ist geschlossen.','<b>*die gestiegenden Preise</b> → die gestiegenen / die steigenden Preise.','<b>*ein überzeugender Argument</b> → ein überzeugendes Argument (das Argument).'],
 examples:[['Der Vertrag ist bereits unterschrieben.','The contract has already been signed.'],['Am Sonntag sind die meisten Geschäfte geschlossen.','On Sunday most shops are closed.'],['Die steigenden Mieten sind ein grosses Problem.','The rising rents are a big problem.'],['Die gestiegenen Krankenkassenprämien belasten viele Familien.','The increased health insurance premiums are a burden for many families.'],['Bitte senden Sie uns das ausgefüllte Formular zurück.','Please return the completed form to us.'],['Die Präsentation war sehr überzeugend.','The presentation was very convincing.'],['Die Unterlagen müssen bis Ende Monat eingereicht sein.','The documents must be submitted by the end of the month.'],['Das ist eine nicht zu unterschätzende Herausforderung.','That is a challenge not to be underestimated.'],['Die wachsende Bevölkerung braucht mehr Wohnraum.','The growing population needs more housing.'],['Das Ergebnis der Untersuchung liegt noch nicht vor.','The result of the investigation is not yet available.']],
 ex:['g:passiv|Das Fenster ___ offen – es ___ geöffnet. (Zustand)|ist;ist','g:passiv|Die Tür ___ gerade gestrichen. (Vorgang)|wird','g:passiv|Keine Sorge, alles ___ schon organisiert. (Zustand)|ist','g:adj|die ___ Preise (steigen, Partizip I)|steigenden','g:adj|das ___ Formular (ausfüllen, Partizip II)|ausgefüllte','g:adj|ein ___ Argument (überzeugen, Partizip I)|überzeugendes','g:adj|die ___ Kinder (spielen, Partizip I)|spielenden','g:adj|der ___ Zug (verspäten, Partizip II)|verspätete','t:adj|Partizip: das Auto, das repariert wurde|das reparierte Auto','t:adj|Partizip: die Kosten, die steigen|die steigenden Kosten','t:adj|Partizip: die Bewerber, die eingeladen wurden|die eingeladenen Bewerber','m:passiv|Am Sonntag ___ die Post geschlossen.|ist~wird~würde','m:gender|___ Ergebnis|das~die~der','m:gender|___ Gesellschaft|die~der~das','m:gender|___ Irrtum|der~das~die','m:gender|___ Erlaubnis|die~das~der']},

{id:'b2-03',level:'B2',title:'Ursachen benennen – kausale Zusammenhänge & Vorsilben',cat:'conn',vocab:['b2-medien'],
 topics:['kausal: da, weil, zumal, nämlich, denn, deshalb, folglich','Präpositionen: wegen, aufgrund, infolge, dank, aus, vor','Wortbildung: Vorsilben bei Nomen (Miss-, Un-, Ur-, Haupt-, Neben-)'],
 source:'Sicher! B2 Grammatik L2 & L3 (Vorsilben bei Nomen, kausale Zusammenhänge)',
 goals:['Ursachen im Verbal- und Nominalstil ausdrücken','Präpositionen mit Genitiv in formellen Texten verwenden'],
 grammar:`<h3>1. Kausale Konnektoren</h3>
<table><tr><th>Nebensatz</th><th>Hauptsatz (Pos. 0)</th><th>Hauptsatz (Pos. 1/3)</th></tr><tr><td>weil, da, zumal (= besonders weil)</td><td>denn</td><td>deshalb, deswegen, daher, darum, folglich, aus diesem Grund; nämlich (nur Pos. 3+)</td></tr></table>
<p><b>zumal</b>: zusätzlicher, verstärkender Grund: <i>Ich nehme den Zug, <b>zumal</b> das Wetter schlecht ist.</i></p>
<h3>2. Kausale Präpositionen (Nominalstil)</h3>
<table><tr><td><b>wegen</b> + Gen</td><td>allgemein</td><td>wegen des Streiks</td></tr><tr><td><b>aufgrund</b> + Gen</td><td>formell (Grund)</td><td>aufgrund der hohen Nachfrage</td></tr><tr><td><b>infolge</b> + Gen</td><td>Folge eines Ereignisses</td><td>infolge eines Unfalls</td></tr><tr><td><b>dank</b> + Gen/Dat</td><td>positiver Grund</td><td>dank Ihrer Hilfe</td></tr><tr><td><b>aus</b> + Dat</td><td>innerer Grund, ohne Artikel</td><td>aus Angst, aus Liebe, aus Neugier</td></tr><tr><td><b>vor</b> + Dat</td><td>unwillkürliche Reaktion</td><td>vor Freude weinen, vor Kälte zittern</td></tr></table>
<div class="rule">Verbal → nominal: <i>Weil die Nachfrage hoch ist, steigen die Preise.</i> → <i><b>Aufgrund der hohen Nachfrage</b> steigen die Preise.</i></div>
<h3>3. Vorsilben bei Nomen</h3><p><b>Miss-</b> (negativ/falsch: das Missverständnis, der Misserfolg), <b>Un-</b> (Gegenteil/negativ: die Unsicherheit, das Unglück, die Unmenge = sehr viel), <b>Ur-</b> (ursprünglich/sehr alt: der Urgrossvater, der Urwald), <b>Haupt-</b> (das Hauptproblem), <b>Neben-</b> (die Nebenkosten), <b>Rück-</b> (die Rückfrage), <b>Gegen-</b> (der Gegenvorschlag).</p>`,
 pitfalls:['<b>*wegen dem Wetter</b> – mündlich üblich; schriftlich: wegen des Wetters.','<b>*aus der Angst</b> → aus Angst.','<b>*Aufgrund die Nachfrage</b> → aufgrund der Nachfrage.'],
 examples:[['Aufgrund der hohen Nachfrage sind die Tickets ausverkauft.','Due to high demand the tickets are sold out.'],['Infolge eines Unfalls ist die Strecke gesperrt.','As a result of an accident the line is closed.'],['Dank Ihrer Unterstützung konnte das Projekt realisiert werden.','Thanks to your support the project could be realised.'],['Sie hat aus Angst nichts gesagt.','She said nothing out of fear.'],['Die Kinder schrien vor Freude.','The children screamed with joy.'],['Ich bleibe zu Hause, zumal ich noch viel arbeiten muss.','I’m staying at home, especially as I still have a lot of work to do.'],['Das Hauptproblem sind die hohen Nebenkosten.','The main problem is the high utility costs.'],['Das war ein Missverständnis.','That was a misunderstanding.'],['Die Zeitung musste schliessen; folglich verloren 50 Personen ihre Stelle.','The newspaper had to close; consequently 50 people lost their jobs.'],['Da die Frist abgelaufen ist, kann der Antrag nicht mehr berücksichtigt werden.','As the deadline has passed, the application can no longer be considered.']],
 ex:['t:nominal|Nominalstil mit „aufgrund“: Weil das Wetter schlecht ist, fällt das Fest aus.|Aufgrund des schlechten Wetters fällt das Fest aus/Das Fest fällt aufgrund des schlechten Wetters aus','t:nominal|Nominalstil mit „wegen“: Weil er krank war, fehlte er.|Wegen seiner Krankheit fehlte er/Er fehlte wegen seiner Krankheit','t:nominal|Nominalstil mit „infolge“: Weil ein Unfall passiert ist, gibt es Stau.|Infolge eines Unfalls gibt es Stau','t:nominal|Nominalstil mit „dank“: Weil du geholfen hast, haben wir es geschafft.|Dank deiner Hilfe haben wir es geschafft/Wir haben es dank deiner Hilfe geschafft','g:prep|Sie zitterte ___ Kälte.|vor','g:prep|Er hat es ___ Liebe getan.|aus','g:gen|Aufgrund ___ Streiks fahren keine Züge. (der)|des','g:gen|Dank ___ Engagements hat es geklappt. (Ihr)|Ihres','m:conn|Ich nehme ein Taxi, ___ es spät ist und regnet.|zumal~trotzdem~obwohl','m:conn|Die Firma macht Verluste; ___ werden Stellen abgebaut.|folglich~weil~obwohl','m:prep|Er weinte ___ Freude.|vor~aus~wegen','m:nominal|Gegenteil von „Erfolg“ mit Vorsilbe|der Misserfolg~der Unerfolg~der Urerfolg','m:nominal|„die Nebenkosten“ sind …|zusätzliche Kosten (Heizung, Wasser)~die wichtigsten Kosten~sehr alte Kosten']},

{id:'b2-04',level:'B2',title:'Texte zusammenhalten – Verweiswörter, uneingeleitete Bedingungssätze',cat:'conn',vocab:['b2-gesundheit'],
 topics:['Verweiswörter: dies, das, es, dabei, darauf, dafür, deshalb, letzterer','uneingeleitete wenn-Sätze','Wortbildung: Nachsilben bei Adjektiven (-bar, -lich, -ig, -isch, -los, -voll, -sam, -haft)'],
 source:'Sicher! B2 Grammatik L3 (Verweiswörter im Text, Nachsilben bei Adjektiven, uneingeleitete wenn-Sätze)',
 goals:['kohärente Texte schreiben','Wiederholungen durch Verweiswörter vermeiden','Bedingungen formell ohne wenn formulieren'],
 grammar:`<h3>1. Verweiswörter</h3><p>Sie beziehen sich auf vorher Gesagtes (oder Folgendes) und machen einen Text flüssig:</p>
<table><tr><td>Pronomen</td><td>er, sie, es, dieser, jener, derselbe; <b>Letzterer/Ersterer</b></td><td>Es gibt zwei Angebote. <b>Letzteres</b> ist günstiger.</td></tr>
<tr><td>dies / das</td><td>verweist auf ganze Aussagen</td><td>Viele arbeiten Teilzeit. <b>Dies</b> hat Vorteile.</td></tr>
<tr><td>da(r)+Präposition</td><td>dabei, dafür, dagegen, darauf, damit, davon</td><td>Die Gemeinde plant einen Neubau. <b>Dagegen</b> gibt es Widerstand.</td></tr>
<tr><td>Adverbien</td><td>dort, damals, deshalb, trotzdem, so</td><td>2015 zog ich nach Zug. <b>Damals</b> sprach ich kaum Deutsch.</td></tr>
<tr><td>es (Platzhalter)</td><td>verweist auf folgenden Nebensatz</td><td>Ich finde <b>es</b> wichtig, <b>dass</b> alle mitreden können.</td></tr></table>
<h3>2. Uneingeleitete wenn-Sätze</h3>
<div class="rule">Das Verb rückt an Position 1, „wenn“ fällt weg: <i>Wenn Sie Fragen haben, rufen Sie uns an.</i> → <i><b>Haben</b> Sie Fragen, (so/dann) rufen Sie uns an.</i><br><i>Sollten</i> Sie Fragen haben, … (formell, sehr häufig in Briefen!)</div>
<h3>3. Nachsilben bei Adjektiven</h3>
<table><tr><td>-bar</td><td>kann gemacht werden</td><td>essbar, machbar, erreichbar, zahlbar</td></tr><tr><td>-lich</td><td>Eigenschaft / kann</td><td>freundlich, verständlich, ärztlich</td></tr><tr><td>-ig</td><td>hat etwas</td><td>sonnig, wichtig, eilig</td></tr><tr><td>-isch</td><td>Herkunft/Art</td><td>politisch, schweizerisch, typisch</td></tr><tr><td>-los</td><td>ohne</td><td>arbeitslos, kostenlos, hoffnungslos</td></tr><tr><td>-voll</td><td>mit viel</td><td>wertvoll, sinnvoll, respektvoll</td></tr><tr><td>-sam</td><td>Neigung</td><td>sparsam, langsam, einsam</td></tr><tr><td>-haft</td><td>wie</td><td>fehlerhaft, vorbildhaft, lebhaft</td></tr></table>`,
 pitfalls:['<b>*Sollten Sie Fragen haben, Sie können uns anrufen</b> → können Sie uns anrufen / rufen Sie uns an.','<b>*Ich finde wichtig, dass…</b> – besser: Ich finde es wichtig, dass…','Zu viele Wiederholungen desselben Nomens – Verweiswörter nutzen.'],
 examples:[['Sollten Sie Fragen haben, stehe ich Ihnen gerne zur Verfügung.','Should you have any questions, I am happy to help.'],['Haben Sie die Rechnung bereits bezahlt, betrachten Sie dieses Schreiben als gegenstandslos.','If you have already paid the invoice, please disregard this letter.'],['Viele Pendler fahren mit dem Zug. Dies entlastet die Strassen.','Many commuters travel by train. This relieves the roads.'],['Ich halte es für sinnvoll, die Kosten zu teilen.','I think it makes sense to share the costs.'],['Es gibt zwei Varianten. Letztere ist kostenlos.','There are two options. The latter is free of charge.'],['Die Gemeinde will eine neue Schule bauen. Dafür braucht sie aber Geld.','The municipality wants to build a new school. But for that it needs money.'],['Der Arzt ist nur telefonisch erreichbar.','The doctor can only be reached by phone.'],['Die Beratung ist kostenlos.','The consultation is free of charge.'],['Wäre ich früher gekommen, hätte ich ihn noch getroffen.','Had I come earlier, I would still have met him.'],['Das ist eine wertvolle Erfahrung.','That is a valuable experience.']],
 ex:['t:conn|Ohne „wenn“: Wenn Sie Fragen haben, rufen Sie uns an.|Haben Sie Fragen, rufen Sie uns an/Haben Sie Fragen, dann rufen Sie uns an/Haben Sie Fragen, so rufen Sie uns an','t:conn|Formell mit „Sollten“: Wenn Sie verhindert sind, informieren Sie uns bitte.|Sollten Sie verhindert sein, informieren Sie uns bitte','t:conn|Ohne „wenn“: Wenn das Wetter gut ist, findet das Fest draussen statt.|Ist das Wetter gut, findet das Fest draussen statt/Ist das Wetter gut, findet das Fest draußen statt','g:nominal|Das Wasser kann man trinken. Es ist ___. (-bar)|trinkbar','g:nominal|Die Beratung kostet nichts. Sie ist ___. (-los)|kostenlos','g:nominal|Er hat keine Arbeit. Er ist ___. (-los)|arbeitslos','g:nominal|Das macht Sinn. Es ist ___. (-voll)|sinnvoll','g:nominal|Sie gibt wenig Geld aus. Sie ist ___. (-sam)|sparsam','g:conn|Ich finde ___ gut, dass du kommst. (Platzhalter)|es','g:conn|Wir haben zwei Hunde und eine Katze. ___ ist schon alt. (Letztere/Letzterer)|Letztere','m:conn|Die Mieten steigen. ___ ist für viele Familien ein Problem.|Dies~Dieser~Diese','m:conn|Er hat die Prüfung bestanden. ___ hat er hart gearbeitet.|Dafür~Davon~Dagegen','m:conn|Welcher Satz ist korrekt?|Sollten Sie Fragen haben, melden Sie sich.~Sollten Sie Fragen haben, Sie melden sich.~Sollten haben Sie Fragen, melden Sie sich.']},

{id:'b2-05',level:'B2',title:'Zeitliche Abläufe – Präposition oder Konnektor?',cat:'nominal',vocab:['b2-bildung'],
 topics:['gleichzeitig: während/bei – als/wenn/während','vorher/nachher: vor/bevor, nach/nachdem','seit/seitdem, bis zu/bis, ab/sobald','Nachsilbe -weise bei Adverbien'],
 source:'Sicher! B2 Grammatik L4 (Temporales ausdrücken, temporale Zusammenhänge, -weise)',
 goals:['zwischen Verbal- und Nominalstil wechseln','Zeitverhältnisse präzise ausdrücken'],
 grammar:`<h3>1. Gleichzeitig</h3><table><tr><th>Konnektor (Verbalstil)</th><th>Präposition (Nominalstil)</th></tr><tr><td><b>Während</b> ich studierte, jobbte ich.</td><td><b>Während</b> des Studiums jobbte ich.</td></tr><tr><td><b>Als/Wenn</b> ich ankam/ankomme, …</td><td><b>Bei</b> meiner Ankunft …</td></tr></table>
<h3>2. Nicht gleichzeitig</h3><table><tr><th>Konnektor</th><th>Präposition</th></tr>
<tr><td><b>Bevor</b> ich die Stelle antrat, …</td><td><b>Vor</b> dem Stellenantritt …</td></tr>
<tr><td><b>Nachdem</b> er die Prüfung bestanden hatte, …</td><td><b>Nach</b> der bestandenen Prüfung …</td></tr>
<tr><td><b>Seit(dem)</b> ich hier wohne, …</td><td><b>Seit</b> meinem Umzug …</td></tr>
<tr><td><b>Bis</b> die Bewilligung kommt, …</td><td><b>Bis zur</b> Bewilligung …</td></tr>
<tr><td><b>Sobald</b> die Unterlagen vollständig sind, …</td><td><b>Ab</b> Vollständigkeit / <b>Nach</b> Eingang der Unterlagen …</td></tr>
<tr><td><b>Solange</b> du Fieber hast, …</td><td>– (Während des Fiebers)</td></tr></table>
<div class="rule">Nominalisierung: Verb → Nomen (ankommen → die Ankunft, abreisen → die Abreise, beginnen → der Beginn, eintreffen → das Eintreffen), Subjekt → Possessiv oder Genitiv: <i>als <b>der Präsident</b> ankam</i> → <i>bei der Ankunft <b>des Präsidenten</b></i>; <i>nachdem <b>ich</b> umgezogen war</i> → <i>nach <b>meinem</b> Umzug</i>.</div>
<h3>3. -weise</h3><p>Adjektiv + -erweise = Kommentar des Sprechers: <b>glücklicherweise</b>, <b>überraschenderweise</b>, <b>normalerweise</b>, <b>möglicherweise</b>. Nomen + -weise = Art und Weise: <b>schrittweise</b>, <b>teilweise</b>, <b>beispielsweise</b>, <b>ausnahmsweise</b>, <b>stundenweise</b>.</p>`,
 pitfalls:['<b>*Nach ich gegessen habe</b> → Nachdem ich gegessen habe / Nach dem Essen.','<b>*Bevor dem Essen</b> → Vor dem Essen.','<b>*Während ich des Studiums</b> → Während des Studiums / Während ich studierte.','<b>*glücklichweise</b> → glücklicherweise.'],
 examples:[['Während des Studiums habe ich in einem Café gearbeitet.','During my studies I worked in a café.'],['Bei der Ankunft in Zürich regnete es.','On arrival in Zurich it was raining.'],['Vor Vertragsabschluss sollten Sie alle Bedingungen prüfen.','Before concluding the contract you should check all conditions.'],['Nach Eingang Ihrer Zahlung wird die Ware verschickt.','After receipt of your payment the goods will be dispatched.'],['Seit meinem Umzug in die Schweiz fahre ich kaum noch Auto.','Since my move to Switzerland I hardly drive any more.'],['Bis zur Entscheidung des Gemeinderats kann es Monate dauern.','It can take months until the municipal council decides.'],['Glücklicherweise hatte ich alle Unterlagen dabei.','Fortunately I had all the documents with me.'],['Die Massnahmen werden schrittweise eingeführt.','The measures are being introduced gradually.'],['Normalerweise arbeite ich teilweise im Homeoffice.','Normally I work partly from home.'],['Sobald die Unterlagen vollständig sind, beginnt die Prüfung.','As soon as the documents are complete, the review begins.']],
 ex:['t:nominal|Nominalstil: Während ich studierte, … (das Studium)|Während des Studiums/Während meines Studiums','t:nominal|Nominalstil: Bevor ich abreise, … (die Abreise)|Vor der Abreise/Vor meiner Abreise','t:nominal|Nominalstil: Nachdem er angekommen war, … (die Ankunft)|Nach der Ankunft/Nach seiner Ankunft','t:nominal|Nominalstil: Seitdem ich umgezogen bin, … (der Umzug)|Seit meinem Umzug/Seit dem Umzug','t:nominal|Verbalstil: Beim Essen spricht man nicht über Geld. (wenn)|Wenn man isst, spricht man nicht über Geld','t:nominal|Verbalstil: Vor der Unterschrift lesen Sie den Vertrag. (bevor)|Bevor Sie unterschreiben, lesen Sie den Vertrag','g:temporal|___ des Konzerts war es sehr laut. (during)|Während','g:temporal|___ Eintreffen der Gäste beginnt das Essen. (after)|Nach','g:temporal|___ meiner Ankunft rufe ich dich an. (on/at)|Bei','g:nominal|Ich habe ___ den Schlüssel gefunden. (glücklich + -erweise)|glücklicherweise','g:nominal|Das ist nur ___ richtig. (Teil + -weise)|teilweise','m:conn|___ dem Essen putze ich mir die Zähne.|Nach~Nachdem~Danach','m:conn|___ ich gegessen habe, putze ich mir die Zähne.|Nachdem~Nach~Danach','m:nominal|Nomen zu „ankommen“|die Ankunft~das Ankommung~die Ankommung']},

{id:'b2-06',level:'B2',title:'Veranlassen & vermuten – lassen, Futur II, Verbverbindungen',cat:'futur',vocab:['b2-wohnen'],
 topics:['lassen: veranlassen, erlauben, sich lassen','Futur II: Vermutungen über Vergangenes','Verbverbindungen (kennenlernen, spazieren gehen, liegen lassen)','Nominalisierung von Verben mit Nomen/Adverbien'],
 source:'Sicher! B2 Grammatik L5 (lassen, Futur II, Verbverbindungen, Nominalisierung)',
 goals:['sagen, was man machen lässt (Dienstleistungen)','Vermutungen über die Vergangenheit äussern'],
 grammar:`<h3>1. lassen</h3>
<table><tr><td>veranlassen (jemand anderes macht es)</td><td>Ich <b>lasse</b> mein Auto reparieren. Wir <b>haben</b> die Wohnung streichen <b>lassen</b>.</td></tr>
<tr><td>erlauben / zulassen</td><td>Meine Eltern <b>liessen</b> mich allein reisen.</td></tr>
<tr><td>nicht mitnehmen / zurücklassen</td><td>Ich habe den Schirm im Zug <b>liegen lassen</b>.</td></tr>
<tr><td>sich lassen (= kann gemacht werden)</td><td>Das Problem <b>lässt sich</b> lösen. (= kann gelöst werden)</td></tr></table>
<div class="rule">Perfekt mit Infinitiv: <b>Doppelinfinitiv</b>: Ich habe mir die Haare schneiden <b>lassen</b> (nicht: *gelassen). Im Nebensatz: …, weil ich das Auto habe reparieren lassen.</div>
<p>Formen: ich lasse, du <b>lässt</b>, er <b>lässt</b>; Präteritum liess; Partizip gelassen.</p>
<h3>2. Futur II – Vermutung über Vergangenes</h3>
<div class="rule">werden + Partizip II + haben/sein: <i>Er ist nicht gekommen. Er <b>wird</b> den Zug <b>verpasst haben</b>.</i> (= Er hat wahrscheinlich den Zug verpasst.) <i>Sie <b>wird</b> schon <b>angekommen sein</b>.</i></div>
<p>Vermutungen gestuft: Er hat <i>sicher/bestimmt</i> (90%) – <i>wahrscheinlich/vermutlich</i> (75%) – <i>vielleicht/möglicherweise</i> (50%) … Modal: Er <b>muss</b> den Zug verpasst haben (fast sicher), er <b>dürfte</b> … (wahrscheinlich), er <b>könnte</b> … (möglich).</p>
<h3>3. Verbverbindungen</h3><p>Verb + Verb: kennenlernen, spazieren gehen, einkaufen gehen, schwimmen gehen, liegen lassen, stehen bleiben, sitzen bleiben. Nomen + Verb: Rad fahren, Auto fahren, Ski fahren, Klavier spielen, Deutsch lernen. Nominalisiert gross und zusammen: das <b>Kennenlernen</b>, beim <b>Autofahren</b>, zum <b>Spazierengehen</b>, das <b>Deutschlernen</b>.</p>`,
 pitfalls:['<b>*Ich habe das Auto reparieren gelassen</b> → reparieren lassen.','<b>*Ich lasse reparieren mein Auto</b> → Ich lasse mein Auto reparieren.','<b>*beim auto fahren</b> → beim Autofahren.','<b>*Er wird den Zug verpasst</b> → … verpasst haben.'],
 examples:[['Ich lasse meine Steuererklärung von einem Treuhänder ausfüllen.','I have my tax return completed by an accountant.'],['Wir haben die Küche renovieren lassen.','We had the kitchen renovated.'],['Ich habe meinen Schirm im Tram liegen lassen.','I left my umbrella on the tram.'],['Das lässt sich leicht erklären.','That can easily be explained.'],['Lass mich bitte ausreden!','Please let me finish!'],['Sie ist noch nicht da. Sie wird den Bus verpasst haben.','She isn’t here yet. She’ll have missed the bus.'],['Bis Ende Jahr werde ich die Prüfung bestanden haben.','By the end of the year I will have passed the exam.'],['Beim Autofahren darf man nicht telefonieren.','You mustn’t phone while driving.'],['Wir haben uns bei einem Kurs kennengelernt.','We met on a course.'],['Er muss die E-Mail übersehen haben.','He must have overlooked the email.']],
 ex:['g:modal|Ich ___ mein Auto reparieren. (lassen)|lasse','g:modal|Er ___ sich die Haare schneiden. (lassen)|lässt','g:perfekt|Wir haben die Wohnung streichen ___.|lassen','g:futur|Er ist nicht hier. Er ___ krank geworden ___.|wird;sein','g:futur|Sie ___ die E-Mail schon gelesen ___.|wird;haben','t:modal|Mit „lassen“: Ein Mechaniker repariert mein Velo. (ich)|Ich lasse mein Velo reparieren','t:modal|Perfekt: Ich lasse den Pass verlängern.|Ich habe den Pass verlängern lassen','t:modal|„sich lassen“: Das Problem kann gelöst werden.|Das Problem lässt sich lösen','t:futur|Futur II: Er hat wahrscheinlich den Termin vergessen.|Er wird den Termin vergessen haben/Er wird den Termin wohl vergessen haben/Er wird wohl den Termin vergessen haben','t:futur|Futur II: Sie ist wahrscheinlich schon angekommen.|Sie wird schon angekommen sein/Sie wird wohl schon angekommen sein','m:modal|Ich habe meine Brille zu Hause ___.|liegen lassen~liegen gelassen~gelegen lassen','m:nominal|Richtig geschrieben:|beim Spazierengehen~beim spazieren gehen~beim Spazieren gehen','m:futur|„Er muss es vergessen haben.“ bedeutet:|Er hat es fast sicher vergessen.~Er ist verpflichtet, es zu vergessen.~Er wird es vergessen.']},

{id:'b2-07',level:'B2',title:'Hätte, wäre, könnte – Konjunktiv II vertieft & Adjektive mit Präposition',cat:'konj2',vocab:['b2-umwelt'],
 topics:['Bedeutungen des Konjunktiv II: Wunsch, Bedingung, Vergleich (als ob), Vorschlag, Vermutung, Bedauern','Konjunktiv II Vergangenheit mit Modalverben','Adjektive mit Präpositionen'],
 source:'Sicher! B2 Grammatik L6 (Bedeutungen des Konjunktiv II, Adjektive mit Präpositionen) · Tracker B2.1',
 goals:['nuanciert Ratschläge, Kritik und Bedauern ausdrücken','irreale Vergleiche formulieren'],
 grammar:`<h3>1. Bedeutungen</h3>
<table><tr><td>irrealer Wunsch</td><td>Wenn ich doch mehr Zeit <b>hätte</b>! / <b>Hätte</b> ich nur früher angefangen!</td></tr>
<tr><td>irreale Bedingung</td><td>Wenn die Mieten tiefer <b>wären</b>, <b>würden</b> mehr Familien in der Stadt bleiben.</td></tr>
<tr><td>irrealer Vergleich</td><td>Er tut so, <b>als ob</b> er alles <b>wüsste</b>. / … <b>als wüsste</b> er alles.</td></tr>
<tr><td>Höflichkeit</td><td><b>Dürfte</b> ich Sie kurz unterbrechen?</td></tr>
<tr><td>Vorschlag/Rat</td><td>Wir <b>könnten</b> uns in der Mitte treffen. Du <b>solltest</b> dich beschweren.</td></tr>
<tr><td>Vermutung</td><td>Das <b>dürfte</b> etwa 500 Franken kosten.</td></tr>
<tr><td>Bedauern/Kritik (Vergangenheit)</td><td>Du <b>hättest</b> mich anrufen <b>sollen</b>. Das <b>hätte</b> nicht passieren <b>dürfen</b>.</td></tr>
<tr><td>„beinahe“</td><td>Ich <b>hätte</b> fast den Zug <b>verpasst</b>.</td></tr></table>
<div class="rule">Vergangenheit + Modalverb = <b>hätte + Infinitiv + Modalverb-Infinitiv</b>: Ich hätte früher kommen <b>können</b>. Im Nebensatz: …, dass ich früher <b>hätte</b> kommen können.</div>
<h3>2. Adjektive mit Präpositionen</h3>
<table><tr><td>abhängig <b>von</b></td><td>begeistert <b>von</b></td><td>überzeugt <b>von</b></td><td>enttäuscht <b>von</b>/<b>über</b></td></tr>
<tr><td>stolz <b>auf</b></td><td>gespannt <b>auf</b></td><td>neidisch <b>auf</b></td><td>angewiesen <b>auf</b></td></tr>
<tr><td>zufrieden <b>mit</b></td><td>einverstanden <b>mit</b></td><td>vertraut <b>mit</b></td><td>verheiratet <b>mit</b></td></tr>
<tr><td>verantwortlich <b>für</b></td><td>zuständig <b>für</b></td><td>bekannt <b>für</b></td><td>dankbar <b>für</b></td></tr>
<tr><td>interessiert <b>an</b> + D</td><td>beteiligt <b>an</b> + D</td><td>froh <b>über</b></td><td>bereit <b>zu</b></td></tr></table>`,
 pitfalls:['<b>*Ich hätte mehr gelernt sollen</b> → Ich hätte mehr lernen sollen.','<b>*als ob er weiss alles</b> → als ob er alles wüsste.','<b>*zuständig von</b> → zuständig für.','<b>*stolz über</b> → stolz auf.'],
 examples:[['Er spricht, als ob er Schweizer wäre.','He speaks as if he were Swiss.'],['Du hättest mir früher Bescheid sagen sollen.','You should have told me earlier.'],['Das hätte nicht passieren dürfen.','That should not have happened.'],['Ich hätte beinahe die Frist verpasst.','I almost missed the deadline.'],['Das dürfte etwa zwei Wochen dauern.','That should take about two weeks.'],['Wir könnten die Kosten teilen.','We could share the costs.'],['Wer ist für die Baubewilligung zuständig?','Who is responsible for the building permit?'],['Die Schweiz ist bekannt für ihre direkte Demokratie.','Switzerland is known for its direct democracy.'],['Wir sind mit dem Ergebnis sehr zufrieden.','We are very satisfied with the result.'],['Ich bin gespannt auf die Resultate der Abstimmung.','I’m curious about the results of the vote.']],
 ex:['t:konj2|Kritik: Du hast mich nicht angerufen. (sollen)|Du hättest mich anrufen sollen','t:konj2|Konj. II Vergangenheit (Bedauern): Ich konnte nicht früher kommen. → Ich hätte …|Ich hätte früher kommen können/Ich hätte gern früher kommen können','t:konj2|Irrealer Vergleich: Er tut so, als ob … (er ist der Chef)|Er tut so, als ob er der Chef wäre','t:konj2|Irrealer Vergleich ohne „ob“: Sie lächelt, als … (sie weiss nichts)|Sie lächelt, als wüsste sie nichts/Sie lächelt, als wüsste sie von nichts','t:konj2|Nebensatz: Er hätte früher kommen können. → Ich glaube, dass …|Ich glaube, dass er früher hätte kommen können','g:konj2|Ich ___ fast den Zug verpasst.|hätte','g:konj2|Das ___ etwa 300 Franken kosten. (Vermutung)|dürfte','g:verbprep|Ich bin stolz ___ dich.|auf','g:verbprep|Wer ist ___ die Organisation verantwortlich?|für','g:verbprep|Die Gemeinde ist ___ Steuern angewiesen.|auf','g:verbprep|Bist du ___ dem Vorschlag einverstanden?|mit','g:verbprep|Er ist ___ dem Projekt beteiligt.|an','m:verbprep|Wir sind sehr gespannt ___ die Ergebnisse.|auf~über~für','m:verbprep|Das hängt ___ der Situation ab. → Das ist abhängig ___ der Situation.|von~an~mit','m:konj2|Er arbeitet, als ___ er nie müde.|wäre~ist~sei']},

{id:'b2-08',level:'B2',title:'Berichten, was andere sagen – indirekte Rede (Konjunktiv I)',cat:'konj1',vocab:['b2-politik'],
 topics:['Konjunktiv I: Formen','Ersatzformen mit Konjunktiv II','Vergangenheit & Zukunft in der indirekten Rede','Nomen mit Präposition','generalisierende Relativsätze (wer …, der …)','Vergleichssätze'],
 source:'Sicher! B2 Grammatik L7 (Nomen mit Präposition, Indirekte Rede, generalisierende Relativsätze, Vergleichssätze)',
 goals:['Nachrichten und Aussagen anderer korrekt wiedergeben','neutral berichten (Zeitungsstil)'],
 grammar:`<h3>1. Funktion</h3><p>Die indirekte Rede gibt neutral wieder, was jemand gesagt hat – typisch in Nachrichten (SRF, NZZ), Protokollen und Berichten. Mündlich wird oft der Indikativ oder Konjunktiv II verwendet.</p>
<h3>2. Formen des Konjunktiv I</h3>
<table><tr><th></th><th>sein</th><th>haben</th><th>können</th><th>kommen</th><th>werden</th></tr>
<tr><td>ich</td><td>sei</td><td>(habe → hätte)</td><td>könne</td><td>(komme → käme)</td><td>(werde → würde)</td></tr>
<tr><td>du</td><td>sei(e)st</td><td>habest</td><td>könnest</td><td>kommest</td><td>werdest</td></tr>
<tr><td>er/sie/es</td><td><b>sei</b></td><td><b>habe</b></td><td><b>könne</b></td><td><b>komme</b></td><td><b>werde</b></td></tr>
<tr><td>wir</td><td>seien</td><td>(haben → hätten)</td><td>(können → könnten)</td><td>(kommen → kämen)</td><td>(werden → würden)</td></tr>
<tr><td>sie/Sie</td><td>seien</td><td>(hätten)</td><td>(könnten)</td><td>(kämen)</td><td>(würden)</td></tr></table>
<div class="rule">Konjunktiv I = Stamm + e (er komm<b>e</b>, er müss<b>e</b>, er wiss<b>e</b>). In der Praxis vor allem <b>3. Person Singular</b>. Ist Konj. I = Indikativ (v. a. Plural), nimmt man <b>Konjunktiv II</b>: Sie sagen, sie <b>hätten</b> keine Zeit.</div>
<h3>3. Zeiten</h3><table><tr><td>Gegenwart</td><td>Er sagt: „Ich bin müde.“ → Er sagt, er <b>sei</b> müde.</td></tr><tr><td>Vergangenheit</td><td>„Ich war / bin gewesen / habe gearbeitet.“ → Er sagt, er <b>sei</b> müde <b>gewesen</b> / er <b>habe</b> gearbeitet.</td></tr><tr><td>Zukunft</td><td>„Ich werde kommen.“ → Er sagt, er <b>werde</b> kommen.</td></tr><tr><td>Frage</td><td>„Kommst du?“ → Sie fragt, <b>ob</b> er komme. „Wann kommt er?“ → Sie fragt, <b>wann</b> er komme.</td></tr><tr><td>Imperativ</td><td>„Warten Sie!“ → Er sagt, ich <b>solle</b> warten. (Bitte: ich <b>möge</b> warten.)</td></tr></table>
<p>Pronomen anpassen: „Ich helfe dir.“ → Sie sagt, sie helfe mir.</p>
<h3>4. Generalisierende Relativsätze & Vergleichssätze</h3><p><b>Wer</b> zu spät kommt, (<b>der</b>) muss draussen warten. <b>Was</b> du sagst, (das) stimmt. — Vergleich: Die Prüfung war leichter, <b>als</b> ich gedacht hatte. Es ist nicht so schlimm, <b>wie</b> alle sagen. Je … desto (B2-01).</p>
<h3>5. Nomen mit Präposition</h3><p>die Angst <b>vor</b>, die Bitte <b>um</b>, die Frage <b>nach</b>, das Interesse <b>an</b>, die Kritik <b>an</b>, die Lust <b>auf</b>, die Sorge <b>um</b>, die Teilnahme <b>an</b>, der Wunsch <b>nach</b>, die Zufriedenheit <b>mit</b>, die Abhängigkeit <b>von</b>, der Grund <b>für</b>.</p>`,
 pitfalls:['<b>*Er sagt, er ist krank sei</b> → er sei krank.','<b>*Sie sagen, sie haben keine Zeit</b> (in Nachrichten) → sie hätten keine Zeit.','<b>*Er fragte, ob ich komme würde</b> → ob ich käme / ob ich kommen würde.','<b>*das Interesse für</b> (möglich) – Standard: Interesse an.'],
 examples:[['Der Bundesrat teilte mit, die Massnahmen seien notwendig.','The Federal Council stated that the measures were necessary.'],['Die Ministerin sagte, sie werde im Herbst zurücktreten.','The minister said she would step down in autumn.'],['Der Sprecher erklärte, man habe die Situation unterschätzt.','The spokesman explained that the situation had been underestimated.'],['Die Gewerkschaften betonten, die Löhne müssten steigen.','The unions stressed that wages had to rise.'],['Er fragte, ob ich am Freitag Zeit hätte.','He asked whether I had time on Friday.'],['Sie meinte, ich solle mich bei der Gemeinde melden.','She said I should contact the municipality.'],['Wer sich einbürgern lassen will, muss die Sprachanforderungen erfüllen.','Anyone who wants to be naturalised must meet the language requirements.'],['Die Prüfung war schwieriger, als ich erwartet hatte.','The exam was harder than I had expected.'],['Die Kritik an der Reform wächst.','Criticism of the reform is growing.'],['Viele haben Angst vor steigenden Krankenkassenprämien.','Many are afraid of rising health insurance premiums.']],
 ex:['t:konj1|Indirekte Rede: Er sagt: „Ich bin krank.“|Er sagt, er sei krank','t:konj1|Indirekte Rede: Sie sagt: „Ich habe keine Zeit.“|Sie sagt, sie habe keine Zeit','t:konj1|Indirekte Rede: Der Chef sagt: „Wir haben ein Problem.“|Der Chef sagt, sie hätten ein Problem/Der Chef sagt, wir hätten ein Problem','t:konj1|Indirekte Rede: Er sagt: „Ich bin gestern angekommen.“|Er sagt, er sei gestern angekommen','t:konj1|Indirekte Rede: Sie sagt: „Ich werde morgen anrufen.“|Sie sagt, sie werde morgen anrufen','t:konj1|Indirekte Frage: Er fragt: „Kommst du mit?“ (zu mir)|Er fragt, ob ich mitkomme/Er fragt, ob ich mitkäme/Er fragt, ob ich mitkommen würde','t:konj1|Indirekte Rede (Aufforderung): Sie sagt zu mir: „Warten Sie hier!“|Sie sagt, ich solle hier warten','g:konj1|Der Minister erklärte, die Lage ___ stabil. (sein)|sei','g:konj1|Sie behauptet, sie ___ nichts davon gewusst. (haben)|habe','g:konj1|Er meinte, er ___ morgen kommen. (können)|könne','g:konj1|Die Bürger sagen, sie ___ zu wenig informiert worden. (sein)|seien','g:rel|___ rastet, der rostet.|Wer','g:verbprep|Es gibt grosses Interesse ___ dem Kurs.|an','g:verbprep|Ich habe eine Bitte ___ Sie.|an','m:konj1|Sie sagten, sie ___ das Formular abgeschickt.|hätten~haben~habe','m:verbprep|Die Angst ___ der Prüfung ist gross.|vor~von~für']},

{id:'b2-09',level:'B2',title:'Wenn, falls, obwohl – konditional & konzessiv, sollen/wollen subjektiv',cat:'conn',vocab:['b2-recht'],
 topics:['subjektives sollen (Gerücht) und wollen (Behauptung)','Nominalisierung von Verben','konditional: wenn, falls, sofern, im Falle, bei, ohne','konzessiv: obwohl, obgleich, selbst wenn, auch wenn, trotz, ungeachtet, zwar … aber'],
 source:'Sicher! B2 Grammatik L8 (Subjektive Bedeutung von sollen, Nominalisierung, konditionale & konzessive Zusammenhänge)',
 goals:['Hörensagen ausdrücken','Bedingungen und Einräumungen im Verbal- und Nominalstil formulieren'],
 grammar:`<h3>1. sollen und wollen – subjektiv</h3>
<table><tr><td><b>sollen</b> = man sagt, es heisst (Gerücht, Bericht)</td><td>Der neue Chef <b>soll</b> sehr streng <b>sein</b>. Er <b>soll</b> früher bei Google <b>gearbeitet haben</b>.</td></tr>
<tr><td><b>wollen</b> = jemand behauptet selbst (Zweifel)</td><td>Er <b>will</b> den Unfall nicht <b>gesehen haben</b>. Sie <b>will</b> fünf Sprachen <b>sprechen</b>.</td></tr></table>
<h3>2. Konditional</h3>
<table><tr><th>Nebensatz</th><th>Präposition (Nominalstil)</th></tr>
<tr><td><b>Wenn/Falls/Sofern</b> es regnet, findet das Fest drinnen statt.</td><td><b>Bei</b> Regen findet das Fest drinnen statt.</td></tr>
<tr><td><b>Falls</b> Sie verhindert sind, melden Sie sich.</td><td><b>Im Falle</b> einer Verhinderung melden Sie sich.</td></tr>
<tr><td><b>Wenn</b> Sie keine gültige Fahrkarte haben, …</td><td><b>Ohne</b> gültige Fahrkarte …</td></tr>
<tr><td><b>Nur wenn / Nur unter der Bedingung, dass</b> …</td><td><b>Unter der Bedingung</b> …</td></tr></table>
<p><b>falls</b> = für den (eher unwahrscheinlichen) Fall; <b>sofern</b> = vorausgesetzt, dass. Ohne wenn: Regnet es, … / Sollte es regnen, …</p>
<h3>3. Konzessiv</h3>
<table><tr><th>Nebensatz</th><th>Hauptsatz</th><th>Präposition</th></tr>
<tr><td><b>obwohl, obgleich, obschon</b><br><b>auch wenn, selbst wenn</b> (auch hypothetisch)<br><b>wenn … auch</b></td><td><b>trotzdem, dennoch</b><br><b>zwar … aber</b></td><td><b>trotz</b> + Gen<br><b>ungeachtet</b> + Gen (formell)</td></tr></table>
<p><i>Selbst wenn</i> ich Zeit hätte, würde ich nicht hingehen. <i>Trotz</i> intensiver Bemühungen fand man keine Lösung.</p>
<h3>4. Nominalisierung von Verben</h3><p>bewerben → die Bewerbung, entscheiden → die Entscheidung, teilnehmen → die Teilnahme, ankommen → die Ankunft, vorschlagen → der Vorschlag, verlieren → der Verlust, beginnen → der Beginn, abschliessen → der Abschluss, zunehmen → die Zunahme, steigen → der Anstieg, sinken → der Rückgang (!).</p>`,
 pitfalls:['<b>*Er soll gearbeitet bei Google</b> → Er soll bei Google gearbeitet haben.','<b>*Bei es regnet</b> → Bei Regen / Wenn es regnet.','<b>*Trotz es regnet</b> → Trotz des Regens / Obwohl es regnet.','<b>*Selbst wenn ich Zeit habe, würde ich…</b> → Selbst wenn ich Zeit hätte, würde ich …'],
 examples:[['Der neue Bundesrat soll sehr pragmatisch sein.','The new federal councillor is said to be very pragmatic.'],['Der Angeklagte will zur Tatzeit zu Hause gewesen sein.','The defendant claims to have been at home at the time of the crime.'],['Bei Glatteis fahren die Busse mit Verspätung.','In icy conditions the buses run late.'],['Im Falle einer Kündigung gilt eine Frist von drei Monaten.','In the event of termination a notice period of three months applies.'],['Ohne gültigen Ausweis dürfen Sie nicht abstimmen.','Without a valid ID you may not vote.'],['Sofern alle Unterlagen vorliegen, dauert das Verfahren etwa ein Jahr.','Provided all documents are available, the procedure takes about a year.'],['Selbst wenn es regnet, findet der Lauf statt.','Even if it rains, the race takes place.'],['Trotz intensiver Verhandlungen kam keine Einigung zustande.','Despite intensive negotiations no agreement was reached.'],['Ungeachtet der Kritik hielt die Regierung an ihrem Plan fest.','Regardless of the criticism the government stuck to its plan.'],['Der Anstieg der Mieten ist besorgniserregend.','The rise in rents is worrying.']],
 ex:['t:modal|Mit „sollen“ (Gerücht): Man sagt, dass der Film sehr gut ist.|Der Film soll sehr gut sein','t:modal|Mit „sollen“ (Vergangenheit): Man sagt, dass er früher in Basel gewohnt hat.|Er soll früher in Basel gewohnt haben','t:modal|Mit „wollen“: Er behauptet, dass er nichts gesehen hat.|Er will nichts gesehen haben','t:nominal|Nominalstil mit „bei“: Wenn es Nebel gibt, fahren Sie langsam.|Bei Nebel fahren Sie langsam','t:nominal|Nominalstil mit „im Falle“: Falls es brennt, benutzen Sie die Treppe.|Im Falle eines Brandes benutzen Sie die Treppe','t:nominal|Nominalstil mit „ohne“: Wenn Sie keine Bewilligung haben, dürfen Sie nicht bauen.|Ohne Bewilligung dürfen Sie nicht bauen','t:nominal|Nominalstil mit „trotz“: Obwohl die Preise hoch sind, ist die Nachfrage gross.|Trotz der hohen Preise ist die Nachfrage gross','g:nominal|steigen → der ___|Anstieg','g:nominal|teilnehmen → die ___|Teilnahme','g:nominal|verlieren → der ___|Verlust','g:nominal|entscheiden → die ___|Entscheidung','m:conn|___ ich Zeit hätte, würde ich nicht kommen.|Selbst wenn~Obwohl~Trotz','m:conn|___ Sie Fragen haben, wenden Sie sich an uns.|Falls~Trotzdem~Obwohl','m:modal|„Sie will Ärztin sein.“ bedeutet:|Sie behauptet, Ärztin zu sein.~Man sagt, sie sei Ärztin.~Sie möchte Ärztin werden.']},

{id:'b2-10',level:'B2',title:'Folgen ausdrücken – konsekutiv, Nomen-Verb-Verbindungen',cat:'nominal',vocab:['b2-wirtschaft'],
 topics:['konsekutiv: sodass, so … dass, folglich, infolgedessen, also, deshalb','zu … um zu / zu …, als dass','Nomen-Verb-Verbindungen (Funktionsverbgefüge)','Negation durch Vor-/Nachsilben (un-, miss-, -los, -frei, in-/il-/ir-/dis-)'],
 source:'Sicher! B2 Grammatik L9 (Konsekutive Zusammenhänge, feste Verbindungen von Nomen mit Verben, Negation durch Vor- und Nachsilben)',
 goals:['Folgen präzise ausdrücken','formell schreiben mit Nomen-Verb-Verbindungen'],
 grammar:`<h3>1. Konsekutiv</h3>
<table><tr><td><b>sodass / so dass</b> (Nebensatz)</td><td>Es regnete stark, <b>sodass</b> das Spiel abgesagt wurde.</td></tr>
<tr><td><b>so</b> + Adjektiv … <b>dass</b></td><td>Es regnete <b>so</b> stark, <b>dass</b> das Spiel abgesagt wurde.</td></tr>
<tr><td><b>derart / dermassen … dass</b></td><td>Er war <b>derart</b> nervös, <b>dass</b> er alles vergass.</td></tr>
<tr><td><b>folglich, infolgedessen, also, somit, daher</b> (Hauptsatz, Pos. 1)</td><td>Die Firma machte Verluste. <b>Infolgedessen</b> wurden Stellen gestrichen.</td></tr>
<tr><td><b>zu</b> + Adj., <b>um … zu</b> / <b>als dass</b> (negative Folge)</td><td>Er ist <b>zu</b> müde, <b>um</b> noch <b>zu</b> arbeiten. Die Zeit ist <b>zu</b> knapp, <b>als dass</b> wir alles schaffen <b>könnten</b>.</td></tr></table>
<h3>2. Nomen-Verb-Verbindungen</h3><p>Typisch für formelle Sprache (Briefe, Behörden, Prüfung Schreiben Teil 2). Das Nomen trägt die Bedeutung:</p>
<table><tr><td>einen Antrag stellen</td><td>= beantragen</td><td>eine Entscheidung treffen</td><td>= entscheiden</td></tr>
<tr><td>Kritik üben an</td><td>= kritisieren</td><td>in Kraft treten</td><td>= gültig werden</td></tr>
<tr><td>zur Verfügung stehen/stellen</td><td>= verfügbar sein/machen</td><td>Bescheid geben/sagen</td><td>= informieren</td></tr>
<tr><td>in Anspruch nehmen</td><td>= nutzen</td><td>Rücksicht nehmen auf</td><td>= berücksichtigen</td></tr>
<tr><td>Stellung nehmen zu</td><td>= sich äussern</td><td>zur Sprache bringen</td><td>= ansprechen</td></tr>
<tr><td>in Frage kommen</td><td>= möglich sein</td><td>eine Rolle spielen</td><td>= wichtig sein</td></tr>
<tr><td>Bezug nehmen auf</td><td>= sich beziehen</td><td>einen Beitrag leisten</td><td>= beitragen</td></tr>
<tr><td>Einspruch / Einsprache erheben</td><td>= widersprechen (rechtlich)</td><td>Massnahmen ergreifen</td><td>= handeln</td></tr></table>
<h3>3. Negation durch Wortbildung</h3><p><b>un-</b> (unklar, unzufrieden), <b>miss-</b> (missverständlich), <b>in-/il-/ir-</b> (instabil, illegal, irrelevant), <b>dis-</b> (diskontinuierlich), <b>-los</b> (erfolglos), <b>-frei</b> (alkoholfrei, barrierefrei), <b>-arm</b> (fettarm), <b>nicht-</b> (nichtöffentlich).</p>`,
 pitfalls:['<b>*sodass</b> im Hauptsatz: *sodass wurde das Spiel → sodass das Spiel abgesagt wurde.','<b>*eine Entscheidung machen</b> → treffen.','<b>*einen Antrag machen</b> → stellen.','<b>*Er ist zu müde, dass er arbeitet</b> → um zu arbeiten.'],
 swiss:'Schweizer Amtssprache: <b>Einsprache erheben</b> (gegen eine Baubewilligung, einen Steuerentscheid), <b>ein Gesuch stellen/einreichen</b> (= Antrag), <b>in Kraft treten</b>.',
 examples:[['Der Zug fiel aus, sodass ich zu spät zur Prüfung kam.','The train was cancelled, so I was late for the exam.'],['Die Nachfrage war so gross, dass die Tickets nach einer Stunde ausverkauft waren.','Demand was so high that the tickets sold out in an hour.'],['Ich möchte einen Antrag auf Verlängerung stellen.','I would like to apply for an extension.'],['Das neue Gesetz tritt am 1. Januar in Kraft.','The new law enters into force on 1 January.'],['Gegen den Entscheid können Sie innert 30 Tagen Einsprache erheben.','You can lodge an objection to the decision within 30 days.'],['Bitte geben Sie mir bis Freitag Bescheid.','Please let me know by Friday.'],['Für Fragen stehe ich Ihnen gerne zur Verfügung.','I am happy to answer any questions.'],['Die Zeit ist zu knapp, als dass wir alles besprechen könnten.','Time is too short for us to discuss everything.'],['Ich nehme Bezug auf Ihr Schreiben vom 3. März.','I refer to your letter of 3 March.'],['Die Erklärung war missverständlich.','The explanation was misleading.']],
 ex:['t:conn|Mit „sodass“: Es schneite stark. Die Strasse wurde gesperrt.|Es schneite stark, sodass die Strasse gesperrt wurde/Es schneite stark, so dass die Strasse gesperrt wurde','t:conn|Mit „so … dass“: Ich war müde. Ich bin eingeschlafen.|Ich war so müde, dass ich eingeschlafen bin','t:inf|Mit „zu … um zu“: Er ist sehr krank. Er kann nicht arbeiten.|Er ist zu krank, um zu arbeiten','g:nominal|eine Entscheidung ___|treffen','g:nominal|einen Antrag ___|stellen','g:nominal|Kritik ___ an etwas|üben','g:nominal|Das Gesetz tritt morgen in ___.|Kraft','g:nominal|Ich stehe Ihnen gerne zur ___.|Verfügung','g:nominal|Bitte nehmen Sie ___ auf die Nachbarn. (consideration)|Rücksicht','g:nominal|Ich nehme ___ auf Ihren Brief vom 5. Mai. (reference)|Bezug','g:nominal|Gegen die Baubewilligung erheben wir ___. (objection, Swiss)|Einsprache','m:nominal|Gegenteil von „legal“|illegal~unlegal~misslegal','m:nominal|Gegenteil von „verständlich“ (= kann falsch verstanden werden)|missverständlich~unverständlich~irrverständlich','m:conn|Er hatte Fieber, ___ er nicht zur Arbeit ging.|sodass~deshalb~folglich','m:nominal|„in Anspruch nehmen“ bedeutet:|nutzen~ablehnen~kritisieren']},

{id:'b2-11',level:'B2',title:'Unpersönlich formulieren – Passiv-Alternativen',cat:'passiv',vocab:['b2-technik'],
 topics:['man','sich lassen + Infinitiv','sein + zu + Infinitiv','Adjektive auf -bar/-lich','subjektlose Passivsätze (Es wird …)'],
 source:'Sicher! B2 Grammatik L10 (Alternativen zum Passiv, subjektlose Passivsätze)',
 goals:['Regeln, Möglichkeiten und Notwendigkeiten unpersönlich ausdrücken','Amtstexte verstehen'],
 grammar:`<h3>1. Möglichkeit (kann … werden)</h3>
<table><tr><td>Passiv</td><td>Das Problem <b>kann gelöst werden</b>.</td></tr><tr><td>sich lassen</td><td>Das Problem <b>lässt sich lösen</b>.</td></tr><tr><td>sein + zu</td><td>Das Problem <b>ist zu lösen</b>.</td></tr><tr><td>-bar / -lich</td><td>Das Problem <b>ist lösbar</b>. (Das ist erklär<b>lich</b>, verständ<b>lich</b>)</td></tr><tr><td>man</td><td><b>Man kann</b> das Problem lösen.</td></tr></table>
<h3>2. Notwendigkeit (muss … werden)</h3>
<table><tr><td>Passiv</td><td>Die Gebühr <b>muss</b> im Voraus <b>bezahlt werden</b>.</td></tr><tr><td>sein + zu</td><td>Die Gebühr <b>ist</b> im Voraus <b>zu bezahlen</b>.</td></tr><tr><td>man</td><td><b>Man muss</b> die Gebühr im Voraus bezahlen.</td></tr></table>
<div class="rule"><b>sein + zu + Infinitiv</b> kann „können“ ODER „müssen“ bedeuten – der Kontext entscheidet. In Amtstexten meist „müssen“: <i>Der Ausweis ist stets mitzuführen.</i> Partizip-Attribut (gerundiv): <i>die zu bezahlende Gebühr</i> (= die Gebühr, die bezahlt werden muss).</div>
<h3>3. Subjektloses Passiv</h3><p>Bei Verben ohne Akkusativobjekt: <i><b>Es wird</b> hier nicht geraucht.</i> → <i>Hier wird nicht geraucht.</i> (es fällt weg, wenn etwas anderes Position 1 besetzt.) <i>Am Sonntag wird nicht gearbeitet. Es wurde lange diskutiert.</i></p>`,
 pitfalls:['<b>*Das Problem lässt sich gelöst</b> → lässt sich lösen.','<b>*Die Gebühr ist zu bezahlt</b> → ist zu bezahlen.','<b>*Hier es wird nicht geraucht</b> → Hier wird nicht geraucht.','<b>*Das ist nicht erklärbar</b> ✓ / <b>*unerklärlich</b> ✓ – beide möglich.'],
 examples:[['Das Formular ist bis Ende Monat einzureichen.','The form must be submitted by the end of the month.'],['Der Ausweis ist stets mitzuführen.','The ID must be carried at all times.'],['Dieses Problem lässt sich leicht lösen.','This problem can easily be solved.'],['Die Gebühr ist nicht rückerstattbar.','The fee is non-refundable.'],['Am 1. August wird in der ganzen Schweiz gefeiert.','On 1 August there are celebrations throughout Switzerland.'],['Hier wird nicht parkiert!','No parking here!'],['Seine Handschrift ist kaum lesbar.','His handwriting is barely legible.'],['Die zu erwartenden Kosten sind hoch.','The expected costs are high.'],['Das lässt sich nicht ändern.','That can’t be changed.'],['Bei der Gemeindeversammlung wurde heftig diskutiert.','There was heated discussion at the municipal assembly.']],
 ex:['t:passiv|sich lassen: Das Fenster kann nicht geöffnet werden.|Das Fenster lässt sich nicht öffnen','t:passiv|sein + zu: Die Rechnung muss innert 30 Tagen bezahlt werden.|Die Rechnung ist innert 30 Tagen zu bezahlen','t:passiv|sein + zu: Das kann man leicht verstehen.|Das ist leicht zu verstehen','t:passiv|-bar: Das Wasser kann man trinken.|Das Wasser ist trinkbar','t:passiv|subjektlos: Es wird am Sonntag nicht gearbeitet. (Beginn: Am Sonntag)|Am Sonntag wird nicht gearbeitet','t:passiv|Partizipialattribut: die Unterlagen, die eingereicht werden müssen|die einzureichenden Unterlagen','g:passiv|Das Problem lässt sich ___. (lösen)|lösen','g:passiv|Der Ausweis ist immer ___. (mitführen, zu)|mitzuführen','g:passiv|Hier ___ nicht geraucht.|wird','g:passiv|Die Frage ist schwer zu ___. (beantworten)|beantworten','m:passiv|„Die Tür ist abzuschliessen.“ bedeutet:|Die Tür muss abgeschlossen werden.~Die Tür ist abgeschlossen.~Die Tür kann nicht abgeschlossen werden.','m:passiv|„Das ist nicht machbar.“ bedeutet:|Das kann nicht gemacht werden.~Das darf nicht gemacht werden.~Das wird nicht gemacht.','m:passiv|Welcher Satz ist korrekt?|Gestern wurde lange gefeiert.~Gestern es wurde lange gefeiert.~Es gestern wurde lange gefeiert.']},

{id:'b2-12',level:'B2',title:'Art und Weise – modale Nebensätze & Indefinitpronomen',cat:'conn',vocab:['b2-integration'],
 topics:['indem, dadurch dass, ohne dass, (an)statt dass','durch, mittels, ohne, anstelle','Indefinitpronomen: jemand, niemand, irgendwer, etwas, nichts, man, jeder, mancher, einige'],
 source:'Sicher! B2 Grammatik L11 (Indefinitpronomen, modale Zusammenhänge)',
 goals:['erklären, wie man etwas erreicht','Mittel und Methoden nennen'],
 grammar:`<h3>1. Modale Nebensätze</h3>
<table><tr><td><b>indem</b> (Mittel/Methode)</td><td>Man lernt eine Sprache am besten, <b>indem</b> man sie täglich spricht.</td></tr>
<tr><td><b>dadurch, dass</b> (Mittel, betont)</td><td>Er hat sich verbessert, <b>dadurch dass</b> er jeden Tag geübt hat. / <b>Dadurch</b>, <b>dass</b> er übte, …</td></tr>
<tr><td><b>ohne dass / ohne … zu</b></td><td>Er ging, <b>ohne dass</b> ihn jemand sah. / Er ging, <b>ohne</b> sich <b>zu</b> verabschieden.</td></tr>
<tr><td><b>(an)statt dass / (an)statt … zu</b></td><td><b>Statt dass</b> die Gemeinde handelt, diskutiert sie nur. / <b>Statt zu</b> handeln, …</td></tr>
<tr><td><b>wie</b> (Vergleich der Art)</td><td>Er hat es so gemacht, <b>wie</b> ich es ihm erklärt hatte.</td></tr></table>
<p>Präpositionen: <b>durch</b> + Akk (Durch tägliches Üben …), <b>mittels/mithilfe</b> + Gen (formell), <b>ohne</b> + Akk, <b>anstelle/statt</b> + Gen.</p>
<p>Frage: <b>Wie?</b> / <b>Auf welche Weise?</b> / <b>Wodurch?</b></p>
<h3>2. Indefinitpronomen</h3>
<table><tr><th></th><th>jemand</th><th>niemand</th><th>einer / keiner</th><th>etwas / nichts</th></tr>
<tr><td>Nom</td><td>jemand</td><td>niemand</td><td>einer/eine/eins</td><td rowspan="3">unveränderlich</td></tr><tr><td>Akk</td><td>jemand(en)</td><td>niemand(en)</td><td>einen/eine/eins</td></tr><tr><td>Dat</td><td>jemand(em)</td><td>niemand(em)</td><td>einem/einer/einem</td></tr></table>
<p><b>irgend-</b> = unbestimmt/egal wer: irgendjemand, irgendwer, irgendetwas, irgendwo, irgendwann, irgendwie. <b>mancher, einige, mehrere, wenige, viele, alle, jeder</b>. etwas/nichts + nominalisiertes Adjektiv: etwas <b>Neues</b>, nichts <b>Besonderes</b>, viel <b>Gutes</b>, alles <b>Gute</b>.</p>`,
 pitfalls:['<b>*indem man es zu üben</b> → indem man es übt.','<b>*Ich habe nichts besonderes gemacht</b> → nichts Besonderes.','<b>*ohne dass er sich zu verabschieden</b> → ohne sich zu verabschieden / ohne dass er sich verabschiedete.'],
 examples:[['Man integriert sich am besten, indem man sich in einem Verein engagiert.','The best way to integrate is by getting involved in a club.'],['Durch tägliches Üben habe ich meine Aussprache verbessert.','I improved my pronunciation through daily practice.'],['Er hat gekündigt, ohne dass sein Chef davon wusste.','He resigned without his boss knowing about it.'],['Statt sich zu beschweren, sollte man Vorschläge machen.','Instead of complaining, one should make suggestions.'],['Hat jemand meinen Schlüssel gesehen?','Has anyone seen my key?'],['Ich habe niemanden getroffen, den ich kenne.','I didn’t meet anyone I know.'],['Irgendwann werde ich perfekt Deutsch sprechen.','Some day I’ll speak perfect German.'],['Gibt es etwas Neues? – Nein, nichts Besonderes.','Anything new? – No, nothing special.'],['Ich wünsche Ihnen alles Gute für die Zukunft.','I wish you all the best for the future.'],['Mithilfe einer App lerne ich jeden Tag neue Wörter.','With the help of an app I learn new words every day.']],
 ex:['t:conn|Mit „indem“: Wie verbessert man die Aussprache? (man hört viel Radio)|Man verbessert die Aussprache, indem man viel Radio hört','t:conn|Mit „durch“: Indem man regelmässig übt, wird man sicherer.|Durch regelmässiges Üben wird man sicherer','t:inf|Mit „ohne … zu“: Er ist gegangen. Er hat nicht bezahlt.|Er ist gegangen, ohne zu bezahlen','t:conn|Mit „ohne dass“: Sie hat das Zimmer verlassen. Niemand hat es bemerkt.|Sie hat das Zimmer verlassen, ohne dass es jemand bemerkt hat','t:inf|Mit „statt … zu“: Er schaut fern. Er sollte lernen.|Statt zu lernen, schaut er fern/Er schaut fern, statt zu lernen','g:pron|Hast du ___ gesehen? (anyone)|jemand/jemanden','g:pron|Ich habe mit ___ gesprochen. (nobody, Dat)|niemandem/niemand','g:pron|Ich wünsche dir alles ___. (gut)|Gute','g:pron|Gibt es etwas ___? (neu)|Neues','g:pron|Er hat nichts ___ erzählt. (interessant)|Interessantes','m:conn|Man spart Geld, ___ man weniger Auto fährt.|indem~ohne dass~statt dass','m:pron|Ich gehe ___ hin, egal wohin. (somewhere)|irgendwo~irgendwer~irgendwann','m:conn|___ täglich zu üben, schaut er nur Videos.|Statt~Indem~Ohne dass']},

{id:'b2-13',level:'B2',title:'Dichte Texte – erweitertes Partizip & adversative Sätze',cat:'adj',vocab:['b2-kultur'],
 topics:['erweitertes Partizipialattribut ↔ Relativsatz','adversativ: während, wohingegen, (an)statt, im Gegensatz zu, dagegen, hingegen','Partizipien als Nomen (der Reisende, die Angestellten)','Fugen-s'],
 source:'Sicher! B2 Grammatik L12 (Erweitertes Partizip, Adversativsätze, Partizipien als Nomen, Fugenelement -s-)',
 goals:['Zeitungstexte mit langen Nominalgruppen entschlüsseln','Gegensätze kontrastieren'],
 grammar:`<h3>1. Erweitertes Partizip</h3><p>In Zeitungen, Gesetzen und Fachtexten steht zwischen Artikel und Nomen oft eine ganze Information:</p>
<div class="rule">die <b>[seit Jahren steigenden]</b> Mieten = die Mieten, <b>die seit Jahren steigen</b><br>der <b>[vom Parlament beschlossene]</b> Kompromiss = der Kompromiss, <b>der vom Parlament beschlossen wurde</b><br>die <b>[noch zu klärenden]</b> Fragen = die Fragen, <b>die noch geklärt werden müssen</b></div>
<p><b>Entschlüsseln:</b> 1. Artikel finden → 2. zugehöriges Nomen finden (Kasus/Genus!) → 3. Partizip am Ende der Erweiterung → Partizip I = aktiv/gleichzeitig, Partizip II = passiv/vorzeitig, zu + Partizip I = muss/kann.</p>
<h3>2. Adversativ (Gegensatz)</h3>
<table><tr><td><b>während</b> / <b>wohingegen</b> (Nebensatz)</td><td>Die Stadt wächst, <b>während</b> die Dörfer schrumpfen.</td></tr><tr><td><b>dagegen, hingegen, jedoch</b> (Hauptsatz)</td><td>Zürich ist teuer. In Schwyz <b>hingegen</b> sind die Mieten tiefer.</td></tr><tr><td><b>(an)statt</b> + Gen / <b>im Gegensatz zu</b> + Dat</td><td><b>Im Gegensatz zu</b> Deutschland gibt es in der Schweiz Volksabstimmungen.</td></tr><tr><td><b>aber, sondern</b> (Pos. 0)</td><td>Nicht der Bundesrat, <b>sondern</b> das Volk entscheidet.</td></tr></table>
<h3>3. Partizipien und Adjektive als Nomen</h3><p>Sie werden wie Adjektive dekliniert: der Reisend<b>e</b>, ein Reisend<b>er</b>, die Reisend<b>en</b>; die Angestellt<b>en</b>, ein Angestellt<b>er</b>, die Mitarbeitend<b>en</b> (geschlechtergerecht!), der/die Deutsch<b>e</b>, ein Deutsch<b>er</b>, die Erwachsen<b>en</b>, der/die Verwandt<b>e</b>.</p>
<h3>4. Fugen-s</h3><p>Nach -ung, -heit, -keit, -schaft, -ion, -tät, -ling, -um: Wohnung<b>s</b>markt, Gesundheit<b>s</b>system, Gemeinschaft<b>s</b>raum, Integration<b>s</b>kurs; oft auch nach Infinitiven und vielen maskulinen/neutralen Nomen: Arbeit<b>s</b>platz, Geburt<b>s</b>tag, Verkehr<b>s</b>mittel.</p>`,
 pitfalls:['<b>*die seit Jahren steigende Mieten</b> → steigenden (Plural).','<b>*ein Angestellte</b> → ein Angestellter.','<b>*mit den Reisende</b> → mit den Reisenden.','<b>*Während Zürich ist teuer, …</b> → Während Zürich teuer ist, …'],
 examples:[['Die seit Jahren steigenden Krankenkassenprämien belasten den Mittelstand.','The health insurance premiums, which have been rising for years, are a burden on the middle class.'],['Der vom Volk angenommene Vorschlag tritt nächstes Jahr in Kraft.','The proposal accepted by the people takes effect next year.'],['Die noch zu klärenden Fragen werden in der nächsten Sitzung besprochen.','The questions still to be clarified will be discussed in the next meeting.'],['Im Gegensatz zu vielen Ländern hat die Schweiz kein Staatsoberhaupt im klassischen Sinn.','Unlike many countries, Switzerland has no head of state in the classic sense.'],['Während in Zürich die Mieten steigen, bleiben sie auf dem Land stabil.','While rents in Zurich are rising, they remain stable in the countryside.'],['In der Stadt fährt man Tram, auf dem Land hingegen braucht man oft ein Auto.','In the city you take the tram; in the countryside, by contrast, you often need a car.'],['Alle Reisenden müssen ein gültiges Ticket haben.','All passengers must have a valid ticket.'],['Er ist Angestellter einer Bank.','He is an employee of a bank.'],['Der Wohnungsmarkt in Zug ist sehr angespannt.','The housing market in Zug is very tight.'],['Die Mitarbeitenden wurden über die Reorganisation informiert.','Staff were informed about the reorganisation.']],
 ex:['t:rel|Relativsatz → Partizip: die Preise, die ständig steigen|die ständig steigenden Preise','t:rel|Relativsatz → Partizip: das Gesetz, das letztes Jahr beschlossen wurde|das letztes Jahr beschlossene Gesetz','t:rel|Relativsatz → Partizip: die Kinder, die im Garten spielen|die im Garten spielenden Kinder','t:rel|Partizip → Relativsatz: der gestern angekommene Brief|der Brief, der gestern angekommen ist','t:rel|Partizip → Relativsatz: die zu erledigenden Aufgaben|die Aufgaben, die erledigt werden müssen','g:adj|Alle ___ müssen umsteigen. (reisen, Partizip als Nomen)|Reisenden','g:adj|Mein Bruder ist ___. (angestellt, als Nomen, ein …)|Angestellter','g:adj|Wir haben viele ___ in Deutschland. (verwandt, als Nomen, Pl.)|Verwandte','g:nominal|der Wohnung___markt (Fugenelement?)|s','g:nominal|der Integration___kurs (Fugenelement?)|s','m:conn|Zürich ist teuer, ___ Schwyz günstiger ist.|während~obwohl~sodass','m:conn|___ Deutschland hat die Schweiz kein Staatsoberhaupt im klassischen Sinn.|Im Gegensatz zu~Statt~Trotz','m:conn|In der Stadt gibt es viel Verkehr. Auf dem Land ___ ist es ruhig.|hingegen~jedoch nicht~obwohl']},

{id:'b2-14',level:'B2',title:'Prüfungssprache – Register, Redemittel, formelle Briefe',cat:'register',vocab:['b2-redemittel'],
 topics:['Meinung äussern & begründen','Zustimmen, widersprechen, Kompromiss','Vortrag strukturieren (Goethe B2 Sprechen Teil 1)','Formelle E-Mail (Schreiben Teil 2) vs. Forumsbeitrag (Teil 1)','gut/schlecht präzisieren'],
 source:'Tracker B2.2 (Register, Discourse markers) · So geht\'s zu B2 (Prüfungsstrategien) · Mock-Exam-Bank',
 goals:['für jede Prüfungssituation die passenden Redemittel abrufen','Register (formell/neutral/informell) gezielt wechseln'],
 grammar:`<h3>1. Meinung</h3><p>Meiner Meinung nach <b>ist</b> … (Verb Pos. 2!) · Meines Erachtens … · Ich bin der Ansicht/Auffassung, dass … · Ich halte es für (sinnvoll/problematisch), dass/zu … · Aus meiner Sicht … · Ich bin davon überzeugt, dass … · Für mich steht fest, dass …</p>
<h3>2. Diskutieren (Sprechen Teil 2)</h3>
<table><tr><td>zustimmen</td><td>Da stimme ich Ihnen voll und ganz zu. · Das sehe ich genauso. · Da haben Sie völlig recht.</td></tr>
<tr><td>teilweise zustimmen</td><td>Da haben Sie zwar recht, aber … · Das stimmt im Prinzip, allerdings … · Ich sehe das ein bisschen anders.</td></tr>
<tr><td>widersprechen</td><td>Da bin ich anderer Meinung. · Das überzeugt mich nicht, weil … · Ich möchte widersprechen: …</td></tr>
<tr><td>nachfragen</td><td>Wie meinen Sie das genau? · Habe ich Sie richtig verstanden, dass …?</td></tr>
<tr><td>Kompromiss</td><td>Wie wäre es, wenn wir …? · Könnten wir uns darauf einigen, dass …? · Ein Kompromiss wäre …</td></tr></table>
<h3>3. Vortrag (Sprechen Teil 1, ca. 4 Min.)</h3><p><b>Einleitung:</b> In meinem Vortrag geht es um … / Ich möchte über das Thema … sprechen. Zuerst …, dann …, zum Schluss … · <b>Situation im Heimatland:</b> In meinem Heimatland ist es so, dass … · <b>Vor- und Nachteile:</b> Ein grosser Vorteil ist … Dagegen spricht … · <b>Eigene Meinung:</b> Ich persönlich … · <b>Schluss:</b> Zusammenfassend lässt sich sagen, … Vielen Dank für Ihre Aufmerksamkeit.</p>
<h3>4. Formelle E-Mail (Schreiben Teil 2)</h3><p><b>Anrede:</b> Sehr geehrte Frau Meier, / Sehr geehrter Herr Huber, / Sehr geehrte Damen und Herren, (danach klein weiter!) · <b>Bezug:</b> Ich beziehe mich auf Ihr Schreiben vom … · Vielen Dank für Ihre Nachricht. · <b>Anliegen:</b> Ich wende mich an Sie, weil … · Ich möchte Sie bitten, … · Leider muss ich Ihnen mitteilen, dass … · <b>Schluss:</b> Für Rückfragen stehe ich Ihnen gerne zur Verfügung. · Ich danke Ihnen im Voraus. · Mit freundlichen Grüssen / Freundliche Grüsse</p>
<h3>5. Präziser als gut/schlecht/machen</h3><p>gut → hervorragend, überzeugend, gelungen, vorteilhaft, sinnvoll · schlecht → mangelhaft, enttäuschend, problematisch, nachteilig · machen → durchführen, erledigen, erstellen, treffen (Entscheidung), leisten (Beitrag) · sagen → betonen, erwähnen, behaupten, erklären · viel → zahlreich, erheblich, beträchtlich.</p>`,
 pitfalls:['<b>*Meiner Meinung nach, das ist</b> → Meiner Meinung nach ist das …','<b>*Sehr geehrte Herr Huber</b> → Sehr geehrter Herr Huber.','<b>*Sehr geehrte Damen und Herren, Ich …</b> → klein: ich.','<b>*In meiner Meinung</b> (Anglizismus) → Meiner Meinung nach.','<b>*Ich stimme zu Ihnen</b> → Ich stimme Ihnen zu.'],
 examples:[['Meiner Meinung nach sollte der öffentliche Verkehr günstiger werden.','In my opinion public transport should become cheaper.'],['Ich halte es für problematisch, dass die Mieten so stark steigen.','I think it is problematic that rents are rising so sharply.'],['Da haben Sie zwar recht, aber man muss auch die Kosten berücksichtigen.','You’re right there, but one also has to consider the costs.'],['Wie wäre es, wenn wir die Aufgaben aufteilen?','How about splitting the tasks?'],['In meinem Vortrag geht es um das Thema Homeoffice.','My talk is about working from home.'],['Zusammenfassend lässt sich sagen, dass beide Seiten gute Argumente haben.','In summary, both sides have good arguments.'],['Ich wende mich an Sie, weil ich eine Frage zu meiner Nebenkostenabrechnung habe.','I am contacting you because I have a question about my utilities statement.'],['Ich möchte Sie bitten, den Termin zu verschieben.','I would like to ask you to postpone the appointment.'],['Für Rückfragen stehe ich Ihnen gerne zur Verfügung.','I am happy to answer any further questions.'],['Das Projekt war ein voller Erfolg und hat erheblich zur Integration beigetragen.','The project was a complete success and contributed considerably to integration.']],
 ex:['m:register|Formelle Anrede an Herrn Huber|Sehr geehrter Herr Huber,~Sehr geehrte Herr Huber,~Lieber Herr Huber!','m:register|Formeller Schluss|Mit freundlichen Grüssen~Liebe Grüsse~Tschüss und bis bald','m:wordorder|Welcher Satz ist korrekt?|Meiner Meinung nach ist das falsch.~Meiner Meinung nach, das ist falsch.~Meiner Meinung nach das ist falsch.','m:register|Teilweise zustimmen:|Da haben Sie zwar recht, aber …~Das ist total falsch.~Genau, so ist es.','m:register|Höflich nachfragen:|Habe ich Sie richtig verstanden, dass …?~Was?~Sie meinen also nichts?','m:register|Vortrag beenden:|Vielen Dank für Ihre Aufmerksamkeit.~So, das wars.~Tschüss.','m:register|Präziser für „eine Entscheidung machen“|eine Entscheidung treffen~eine Entscheidung tun~eine Entscheidung geben','m:register|Präziser für „sehr gut“ in einem Bericht|hervorragend~mega~super gut','g:verbprep|Ich stimme ___ voll und ganz zu. (Ihnen/Sie)|Ihnen','g:register|Ich wende mich ___ Sie, weil ich eine Frage habe.|an','g:register|Ich beziehe mich ___ Ihr Schreiben vom 3. Mai.|auf','g:register|Ich halte es ___ wichtig, dass alle mitreden.|für','t:register|Formeller: Kannst du mir das schicken?|Könnten Sie mir das bitte schicken/Würden Sie mir das bitte schicken/Könnten Sie mir das schicken','t:register|Formeller: Ich will mich beschweren.|Ich möchte mich beschweren','t:wordorder|Beginnen Sie mit „Meines Erachtens“: Die Regel ist sinnvoll.|Meines Erachtens ist die Regel sinnvoll']},

{id:'b2-15',level:'B2',title:'Prüfungstraining – Fehler unter Zeitdruck vermeiden',cat:'wordorder',vocab:['b2-staatskunde'],
 topics:['Verbposition in komplexen Sätzen (Nebensatz im Nebensatz)','Kasus unter Zeitdruck','Adjektivendungen gemischt','Satzklammer mit Modalverb + Perfekt + Passiv','Gemischte Wiederholung A1–B2'],
 source:'Tracker B2.2 (Common error patterns specific to B2 exam graders) · Gemischte Wiederholung',
 goals:['die häufigsten Prüfungsfehler gezielt eliminieren','komplexe Sätze sicher bauen'],
 grammar:`<h3>Die 8 häufigsten Fehler auf B2-Niveau (laut Prüferinnen/Prüfern)</h3>
<table><tr><th>#</th><th>Fehler</th><th>Richtig</th></tr>
<tr><td>1</td><td>*Deshalb ich habe …</td><td>Deshalb <b>habe</b> ich …</td></tr>
<tr><td>2</td><td>*…, weil ich habe keine Zeit.</td><td>…, weil ich keine Zeit <b>habe</b>.</td></tr>
<tr><td>3</td><td>*…, dass er kommen wollen hat.</td><td>…, dass er <b>hat</b> kommen wollen. (Doppelinfinitiv: Hilfsverb steht VOR den Infinitiven!)</td></tr>
<tr><td>4</td><td>*mit die Kinder / *für meinem Chef</td><td>mit <b>den</b> Kinder<b>n</b> / für <b>meinen</b> Chef</td></tr>
<tr><td>5</td><td>*ein wichtige Punkt</td><td>ein wichtig<b>er</b> Punkt</td></tr>
<tr><td>6</td><td>*Ich habe nach Bern gefahren.</td><td>Ich <b>bin</b> nach Bern gefahren.</td></tr>
<tr><td>7</td><td>*Ich freue mich für das Wochenende.</td><td>Ich freue mich <b>auf</b> das Wochenende.</td></tr>
<tr><td>8</td><td>*Das ist nicht ein Problem. / *Ich habe nicht Zeit.</td><td>Das ist <b>kein</b> Problem. Ich habe <b>keine</b> Zeit.</td></tr></table>
<h3>Komplexe Verbgruppen im Nebensatz</h3>
<div class="rule">…, dass das Formular ausgefüllt werden <b>muss</b>. (Passiv + Modal)<br>…, dass das Formular hätte ausgefüllt werden <b>müssen</b>. → Hilfsverb <b>hätte</b> steht VOR allen Infinitiven (Doppelinfinitiv-Regel)<br>…, weil ich ihn nicht habe erreichen <b>können</b>.<br>…, obwohl er gestern angerufen worden <b>ist</b>.</div>
<h3>Strategie unter Zeitdruck</h3><p>1. Nach jedem Komma prüfen: Hauptsatz oder Nebensatz? 2. Nach jeder Präposition: welcher Kasus? 3. Vor jedem Nomen mit Adjektiv: Signal schon am Artikel? 4. Bei jeder Vergangenheit: Bewegung → sein. 5. Am Ende: Verben unterstreichen und Position prüfen.</p>`,
 pitfalls:['Doppelinfinitiv im Nebensatz: *…, weil ich ihn nicht erreichen können habe → weil ich ihn nicht habe erreichen können.','<b>*Trotzdem ich …</b> → Trotzdem habe ich …','Zu lange Sätze ohne Kontrolle – lieber zwei klare Sätze.'],
 examples:[['Ich bin überzeugt, dass die Integration gefördert werden muss.','I am convinced that integration must be promoted.'],['Er sagte, dass er mich nicht habe erreichen können.','He said that he had not been able to reach me.'],['Obwohl der Antrag rechtzeitig eingereicht worden war, wurde er abgelehnt.','Although the application had been submitted on time, it was rejected.'],['Deshalb habe ich mich entschieden, die Prüfung im Frühling abzulegen.','That’s why I decided to take the exam in spring.'],['Ich habe mich sehr über die positive Antwort der Gemeinde gefreut.','I was very pleased about the municipality’s positive answer.'],['Das ist kein Problem, ich habe heute keine Termine.','That’s no problem, I have no appointments today.'],['Mit den neuen Kolleginnen und Kollegen verstehe ich mich gut.','I get on well with the new colleagues.'],['Die Gemeindeversammlung ist ein wichtiger Teil der direkten Demokratie.','The municipal assembly is an important part of direct democracy.'],['Das Gesuch hätte früher eingereicht werden müssen.','The application should have been submitted earlier.'],['Wenn ich die Prüfung bestehe, kann ich das Einbürgerungsgesuch stellen.','If I pass the exam, I can submit the naturalisation application.']],

text:`Liebe Sarah

Wie geht es dir? Ich wohne jetzt seit zwei Wochen in Dietlikon. Das ist ein kleines Dorf bei Zürich. Die Wohnung ist schön und hell. Sie hat drei Zimmer, eine Küche, ein Bad und einen Balkon. Die Miete ist leider sehr hoch.

Am Samstag gehe ich auf den Markt. Dort kaufe ich Käse, Brot und Gemüse. Am Sonntag sind die Geschäfte geschlossen.

Besuchst du mich im Mai? Dann zeige ich dir Zürich und den See!

Liebe Grüsse
Tom`,

text:`Sehr geehrter Herr Patel

Vielen Dank für Ihre Anmeldung bei der Krankenkasse Helvetia Plus. Ihre Grundversicherung beginnt am 1. September. Die monatliche Prämie beträgt CHF 412.50. Sie haben die Franchise von CHF 2'500.– gewählt.

Ihre Versicherungskarte erhalten Sie in den nächsten zehn Tagen per Post. Bitte tragen Sie die Karte immer bei sich und zeigen Sie sie beim Arzt und in der Apotheke.

Die erste Rechnung schicken wir Ihnen Ende August. Sie können die Prämie monatlich, alle drei Monate oder einmal im Jahr bezahlen. Wenn Sie jährlich bezahlen, bekommen Sie 2 % Rabatt.

Haben Sie Fragen? Rufen Sie uns an (Montag bis Freitag, 8 bis 18 Uhr) oder schreiben Sie uns über das Kundenportal.

Freundliche Grüsse
Helvetia Plus – Kundendienst`,
gloss:[['die Grundversicherung','basic (compulsory) health insurance'],['die Prämie','premium'],['die Franchise','annual deductible/excess'],['der Rabatt','discount']],
qs:['m|Herr Patel ist ab 1. September versichert.|Richtig~Falsch','m|Die Franchise beträgt 412.50 Franken.|Falsch~Richtig','m|Wie bekommt Herr Patel die Versicherungskarte?|per Post~per E-Mail~beim Arzt','m|Wann kommt die erste Rechnung?|Ende August~am 1. September~in zehn Tagen','m|Wann gibt es Rabatt?|wenn man einmal im Jahr bezahlt~wenn man monatlich bezahlt~wenn man online schreibt','m|Herr Patel soll die Karte zu Hause lassen.|Falsch~Richtig']},
{id:'r-a2-2',level:'A2',title:'Mein erstes Jahr in der Schweiz',type:'Blogbeitrag',time:10,
text:`Vor einem Jahr bin ich mit meiner Familie von Singapur nach Zug gezogen. Am Anfang war alles neu und ein bisschen schwierig. Ich habe kein Wort Schweizerdeutsch verstanden, obwohl ich in der Schule Deutsch gelernt hatte. Die Leute haben zwar Hochdeutsch mit mir gesprochen, aber untereinander sprechen sie immer Dialekt.

Was mir sofort gefallen hat: Die Züge sind pünktlich und die Natur ist wunderschön. Jedes Wochenende sind wir gewandert oder an den See gefahren. Weniger gut gefallen hat mir, dass die Geschäfte so früh schliessen. Am Sonntag kann man fast nur am Bahnhof einkaufen.

Meine Kinder haben schnell Freunde gefunden. Sie gehen in die Primarschule und sprechen jetzt schon besser Deutsch als ich! Ich mache zweimal pro Woche einen Deutschkurs, weil ich in zwei Jahren die Einbürgerung beantragen möchte. Dafür brauche ich gute Deutschkenntnisse.

Mein Tipp für alle Neuen: Werden Sie Mitglied in einem Verein! Ich singe jetzt in einem Chor und habe dort viele nette Nachbarn kennengelernt.`,
qs:['m|Die Familie ist vor einem Jahr in die Schweiz gezogen.|Richtig~Falsch','m|Die Autorin hat am Anfang den Dialekt gut verstanden.|Falsch~Richtig','m|Was hat ihr NICHT so gut gefallen?|die Öffnungszeiten der Geschäfte~die Züge~die Natur','m|Die Kinder sprechen besser Deutsch als die Mutter.|Richtig~Falsch','m|Warum macht sie einen Deutschkurs?|Sie möchte sich einbürgern lassen.~Ihr Chef verlangt es.~Sie möchte Lehrerin werden.','m|Wo hat sie Nachbarn kennengelernt?|im Chor~im Deutschkurs~in der Schule']},
{id:'r-a2-3',level:'A2',title:'Hausordnung',type:'Regeln',time:8,
text:`Hausordnung – Überbauung Albisblick

1. Ruhezeiten: Von 22 bis 7 Uhr und von 12 bis 13 Uhr ist Ruhe. An Sonn- und Feiertagen bitte keinen Lärm (z. B. Bohren, Staubsaugen).
2. Waschküche: Bitte halten Sie sich an den Waschplan. Nach dem Waschen muss die Waschküche sauber hinterlassen werden.
3. Abfall: Der Abfall darf nur am Abholtag ab 7 Uhr vor das Haus gestellt werden. Glas und PET bringen Sie bitte zur Sammelstelle.
4. Velos und Kinderwagen gehören in den Veloraum, nicht ins Treppenhaus.
5. Grillieren auf dem Balkon ist nur mit Elektro- oder Gasgrill erlaubt.
6. Bei Problemen wenden Sie sich bitte an den Hauswart, Herrn Gashi (Tel. 044 123 45 67).`,
