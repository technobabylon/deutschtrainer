<h3>b) Word order</h3><table><tr><td>main clause before wenn clause</td><td>Ich würde eine Band gründen, wenn ich gut singen könnte.</td></tr><tr><td>wenn clause before main clause</td><td>Wenn ich gut singen könnte, würde ich eine Band gründen.</td></tr><tr><td>without wenn (verb first)</td><td>Könnte ich gut singen, würde ich eine Band gründen.</td></tr></table>
<h3>c) Wishes</h3><p>Wenn ich doch mehr Zeit <b>hätte</b>! · Ich <b>wünschte</b>, ich <b>wäre</b> schon B2. · <b>Hätte</b> ich nur früher angefangen!</p>
<h3>d) Past: hätte/wäre + past participle</h3><div class="rule">Wenn ich das <b>gewusst hätte</b>, <b>wäre</b> ich früher <b>gekommen</b>. – With a modal verb: Ich <b>hätte</b> mehr lernen <b>sollen</b>. (double infinitive)</div>`},
'b1-10':{title:'Goals & intentions – damit, um … zu, zum + infinitive',
 topics:['purpose clauses with damit','um … zu (same subject)','zum + infinitive used as a noun','ohne … zu / (an)statt … zu'],
 goals:['express goals and purposes','distinguish um … zu and damit correctly'],
 source:'Sicher! B1+ Grammatik L5 (purpose clauses) · Tracker B1.2 (Infinitive clauses) · Netzwerk neu B1 ch. 5',
 grammar:`<h3>a) damit – subordinate clause (verb at the end)</h3>
<div class="rule">Die Bewerber müssen sich kurzfassen, <b>damit</b> die Arbeitgeber viele Kandidaten kennenlernen <b>können</b>.<br>The damit clause can also come first: <b>Damit</b> die Arbeitgeber viele Kandidaten kennenlernen können, <b>müssen</b> sich die Bewerber kurzfassen.</div>
<p>The modal verbs <i>wollen, möchten, sollen</i> are not used in purpose clauses – they are often replaced by <i>können</i>.</p>
<h3>b) um … zu + infinitive – only with the same subject</h3>
<div class="rule">Die Bewerber haben höchstens fünf Minuten, <b>um</b> ihren Werdegang <b>zu erzählen</b>. (subject of both parts: die Bewerber)<br>Different subjects → <b>damit</b>: Ich erkläre es langsam, <b>damit</b> <i>du</i> es verstehst.</div>
<h3>c) zum + infinitive used as a noun</h3><p>Man braucht Papier und Stifte, um zu zeichnen. → <b>Zum Zeichnen</b> braucht man Papier und Stifte.</p>
<h3>d) ohne … zu / (an)statt … zu</h3><p>Er ging, <b>ohne</b> sich <b>zu</b> verabschieden. <b>Statt</b> den Bus <b>zu</b> nehmen, fahre ich Velo. (With different subjects: ohne dass / statt dass.)</p>`},
'b1-11':{title:'Giving reasons & objecting – causal & concessive, negation',
 topics:['negative words: nichts, nie, niemand, nirgends','causal: denn, weil, da, darum, deshalb, deswegen, daher, nämlich, wegen','concessive: obwohl, trotzdem, aber, trotz'],
 goals:['justify arguments','express contrasts','place connectors correctly in position 0/1 or as subordinate clauses'],
 source:'Sicher! B1+ Grammatik L6 (negative words, causal & concessive links) · Tracker B1.2 (Connectors) · Netzwerk neu B1 ch. 1, 2',
 pitfalls:['<b>*Deshalb ich bleibe zu Hause</b> → Deshalb bleibe ich zu Hause.','<b>*Nämlich ist er krank</b> → Er ist nämlich krank.','<b>*Obwohl es regnet, wir gehen spazieren</b> → gehen wir spazieren.','<b>*trotzdem es regnet</b> (colloquial) → obwohl es regnet.'],
 grammar:`<h3>1. Negative words</h3><p><b>nichts</b> (≠ etwas), <b>nie/niemals</b> (≠ immer), <b>niemand</b> (≠ jemand), <b>nirgends/nirgendwo</b> (≠ irgendwo), <b>kein</b> (≠ ein). No double negatives: <i>Ich habe <b>nichts</b> gesehen</i> (not: *nicht nichts).</p>
<h3>2. Word order after connectors</h3>
<table><tr><th></th><th>Position 0 (verb pos. 2)</th><th>Position 1 or 3 (verb straight after a connector in pos. 1)</th><th>Subordinate clause (verb at end)</th><th>Preposition</th></tr>
<tr><td>causal (reason)</td><td>denn</td><td>darum, deswegen, deshalb, daher, aus diesem Grund; <b>nämlich</b> (only pos. 3+)</td><td>weil, da</td><td>wegen + gen</td></tr>
<tr><td>concessive (despite)</td><td>aber</td><td>trotzdem, dennoch</td><td>obwohl</td><td>trotz + gen</td></tr></table>
<div class="rule">Der Sänger ist erkrankt, <b>darum wird</b> das Konzert verschoben. / Das Konzert wird <b>darum</b> verschoben.<br>Das Konzert wird verschoben. Der Sänger ist <b>nämlich</b> erkrankt.<br>Wir hatten schlechte Plätze. <b>Trotzdem waren</b> wir begeistert. / Wir waren <b>trotzdem</b> begeistert.<br><b>Obwohl</b> wir schlechte Plätze <b>hatten</b>, <b>waren</b> wir begeistert.<br><b>Wegen</b> der Krankheit des Sängers … / <b>Trotz</b> der schlechten Plätze …</div>
<p><b>da</b> vs. <b>weil</b>: <i>da</i> = a known reason, often at the start of the sentence (formal): <i>Da Sie die Frist verpasst haben, …</i></p>`},
'b1-12':{title:'Describing processes – the passive, complete',
 topics:['passive present, simple past, perfect','passive with a modal verb','von/durch','word formation: suffixes (review)'],
 goals:['understand and formulate processes, rules and news in the passive'],
 source:'Sicher! B1+ Grammatik L7 (passive) · Tracker B1.2 · Netzwerk neu B1 ch. 10',
 pitfalls:['<b>*Der Brief ist geschrieben geworden</b> → geschrieben worden.','<b>*Das muss gemacht sein</b> (process meant) → gemacht werden.','<b>*Die Brücke wurde von dem Sturm zerstört</b> – better: durch den Sturm.','Accusative object → nominative: *Den Antrag wird geprüft → Der Antrag wird geprüft.'],
 grammar:`<h3>a) Function</h3><p>The passive is used when the action is more important than the person doing it: <i>Active: Zuerst verteilt der Spielleiter das Startkapital. → Passive: Das Startkapital wird (vom Spielleiter) zuerst verteilt.</i></p>
<h3>b) The person acting: von + dative; cause/means: durch + accusative</h3><p>Das Startkapital wird <b>vom</b> Spielleiter verteilt. Das Haus wurde <b>durch</b> einen Sturm beschädigt.</p>
<h3>c) Tenses</h3>
<table><tr><th></th><th>Position 2</th><th>End</th></tr><tr><td>present</td><td>Das Startkapital <b>wird</b> zuerst</td><td><b>verteilt</b>.</td></tr><tr><td>simple past</td><td>Das Startkapital <b>wurde</b> zuerst</td><td><b>verteilt</b>.</td></tr><tr><td>perfect</td><td>Das Startkapital <b>ist</b> zuerst</td><td><b>verteilt worden</b>.</td></tr><tr><td>past perfect</td><td>Das Startkapital <b>war</b> zuerst</td><td><b>verteilt worden</b>.</td></tr></table>
<div class="warn">Perfect passive: <b>worden</b> (not <i>geworden</i>)!</div>
<h3>d) Passive with a modal verb</h3><p>modal verb + past participle + <b>werden</b>: Die Entscheidungen <b>müssen</b> genau <b>geprüft werden</b>. Eine Liste <b>kann</b> geschrieben werden. Simple past: Die Rechnung <b>musste</b> sofort bezahlt werden.</p>
<h3>e) In a subordinate clause</h3><p>…, dass der Antrag geprüft <b>wird</b> / geprüft <b>wurde</b> / geprüft worden <b>ist</b> / geprüft werden <b>muss</b>.</p>`},
'b1-13':{title:'Genitive, position of “nicht” & place prepositions',
 topics:['genitive: function and forms','von + dative as an alternative','position of nicht','um … herum, an … vorbei, entlang, gegenüber, innerhalb, ausserhalb'],
 goals:['recognise the genitive and use it in formal texts','put “nicht” in the right place','describe routes precisely'],
 source:'Sicher! B1+ Grammatik L8 (genitive, position of nicht, place prepositions) · Tracker B1.1 · Netzwerk neu B1 ch. 2, 9',
 pitfalls:['<b>*das Auto von meinem Vater</b> – fine when speaking; in writing: das Auto meines Vaters.','<b>*des Kurs</b> → des Kurses.','<b>*Ich habe nicht das gewusst</b> → Ich habe das nicht gewusst.','<b>*Ich kann nicht schwimmen gut</b> → Ich kann nicht gut schwimmen.'],
 swiss:'Civics: die Bundesverfassung <b>der</b> Schweizerischen Eidgenossenschaft (the Federal Constitution of the Swiss Confederation), die Mitglieder <b>des</b> Bundesrates (members of the Federal Council), das Recht <b>des</b> Volkes auf Initiative und Referendum (the people’s right to initiative and referendum) – formal texts use the genitive a lot.',
 grammar:`<h3>1. Genitive</h3><p>The genitive specifies something more closely (whose?). In spoken German often <b>von + dative</b> instead: <i>unter Anleitung eines Teams → unter Anleitung von einem Team</i>.</p>
<table><tr><th></th><th>definite</th><th>indefinite</th><th>possessive</th></tr><tr><td>m</td><td>die Unterlagen <b>des</b> Kurs<b>es</b></td><td>eines Kurses</td><td>meines Kurses</td></tr><tr><td>n</td><td>die Anleitung <b>des</b> Team<b>s</b></td><td>eines Teams</td><td>meines Teams</td></tr><tr><td>f</td><td>die Renovierung <b>der</b> Wohnung</td><td>einer Wohnung</td><td>meiner Wohnung</td></tr><tr><td>pl</td><td>der Austausch <b>der</b> Rezepte</td><td>eigener Rezepte / von Rezepten</td><td>Ihrer Rezepte</td></tr></table>
<p>-es is common after one-syllable nouns (des Kurses, des Mannes) and nouns ending in -s, -ss, -ß, -x, -z, -tz, -nis (des Hauses, des Zeugnisses). n-declension: des Kollegen, des Herrn, des Menschen. Names: Annas Wohnung, die Geschichte der Schweiz.</p>
<h3>2. The position of nicht</h3>
<table><tr><td>usually at the end of the clause</td><td>So weit ist man in der Politik noch <b>nicht</b>.</td></tr><tr><td>before the 2nd verb part</td><td>Früher musste man für ein Studium <b>nicht</b> bezahlen.</td></tr><tr><td>before nouns that belong to the verb</td><td>Sie spielt <b>nicht</b> Klavier. Er fährt <b>nicht</b> Auto.</td></tr><tr><td>before a prepositional object</td><td>Sie dürfen <b>nicht</b> auf das Kindergartenjahr verzichten.</td></tr><tr><td>before a place</td><td>Sie schicken ihre Kinder <b>nicht</b> dorthin.</td></tr><tr><td>before an adjective after sein/werden</td><td>Die Ausgaben waren <b>nicht</b> zu hoch.</td></tr><tr><td>before the negated part (contrast)</td><td>Ich glaube <b>nicht</b> der Politikerin, sondern der Studentin.</td></tr></table>
<h3>3. Place prepositions</h3>
<table><tr><th>+ acc</th><th>+ dat</th><th>+ gen</th></tr><tr><td>um das Haus herum (around)<br>den Fluss entlang (along – placed after)</td><td>an der Schule vorbei (past)<br>gegenüber dem Kino / dem Kino gegenüber (opposite)<br>entlang der Strasse (placed before, also + gen)</td><td>ausserhalb der Stadt (outside)<br>innerhalb des Kantons (inside)<br>oberhalb/unterhalb des Dorfes (above/below)</td></tr></table>`},
'b1-14':{title:'Reporting & writing – simple past & two-part connectors',
 topics:['simple past of all verbs (written narration)','past perfect','entweder … oder, sowohl … als auch, weder … noch, nicht nur … sondern auch'],
 goals:['write a report/story in the simple past','link alternatives and lists elegantly'],
 source:'Tracker B1.1/B1.2 · Basic German Unit 22 · Sicher! B2 L1 (preview) · Netzwerk neu B1 ch. 3, 8',
 grammar:`<h3>1. Simple past (Präteritum)</h3>
<table><tr><th>Type</th><th>Formation</th><th>Examples (ich/er – wir/sie)</th></tr>
<tr><td>regular</td><td>stem + te</td><td>machte – machten, arbeitete, kaufte, wohnte</td></tr>
<tr><td>irregular</td><td>vowel change, no ending for ich/er</td><td>ging, kam, sah, fuhr, las, sprach, nahm, gab, fand, blieb, schrieb, trank, stand, lag, sass, flog, zog, rief, hielt, schlief, liess, begann, verstand, bekam, verlor, traf, half, starb, wurde</td></tr>
<tr><td>mixed</td><td>vowel change + te</td><td>dachte, brachte, kannte, nannte, rannte, wusste</td></tr></table>
<p>Endings: ich ging, du ging<b>st</b>, er ging, wir ging<b>en</b>, ihr ging<b>t</b>, sie ging<b>en</b>.</p>
<h3>2. Past perfect (Plusquamperfekt)</h3><p>hatte/war + past participle – for something that happened <b>before</b> another past event: <i>Als wir ankamen, <b>war</b> der Zug schon <b>abgefahren</b>.</i></p>
<h3>3. Two-part connectors</h3>
<table><tr><td><b>entweder … oder</b> (either … or)</td><td><b>Entweder</b> wir fahren mit dem Zug <b>oder</b> wir nehmen das Auto.</td></tr>
<tr><td><b>sowohl … als auch</b> (both … and)</td><td>Er spricht <b>sowohl</b> Deutsch <b>als auch</b> Französisch.</td></tr>
<tr><td><b>weder … noch</b> (neither … nor)</td><td>Ich habe <b>weder</b> Zeit <b>noch</b> Lust.</td></tr>
<tr><td><b>nicht nur … sondern auch</b> (not only … but also)</td><td>Die Wohnung ist <b>nicht nur</b> gross, <b>sondern auch</b> günstig.</td></tr></table>
<p>Word order: <i>entweder</i> is in position 0 or 1 (Entweder <b>komme</b> ich / Entweder ich <b>komme</b>); <i>weder</i> in position 1 → the verb follows: <i>Weder <b>habe</b> ich Zeit noch Lust.</i></p>`}
});
Object.assign(I18N_C.units, {
'b1-15':{title:'Describing precisely – article words as pronouns, irgendein, adjectives as nouns',
 topics:['article words as pronouns: einer, keins, meins, welche','irgendein / irgendwelche, irgendwo, irgendwann','adjectives as nouns: der Bekannte, ein Bekannter, etwas Neues','relative clauses with was and wo'],
 goals:['name things and people without repeating the noun','talk about the indefinite (some/any – irgendein, irgendwo)','decline adjectives used as nouns correctly'],
 source:'Netzwerk neu B1 ch. 11 (Stadt, Land, Fluss) · Netzwerk neu A2 (article words, revision)',
 pitfalls:['<b>*Ich habe kein.</b> → Ich habe keinen / keins / keine (depending on gender).','<b>*Ja, das ist mein.</b> → Ja, das ist meins / meiner / meine.','<b>*Brauchst du Eier? – Ja, ich brauche eine.</b> → Ja, ich brauche welche (plural “some” = welche).','<b>*ein Bekannte</b> → ein Bekannter (after ein: -er/-es as with adjectives).','<b>*etwas neues</b> → etwas Neues (capitalised, ending -es).','<b>*Das ist alles, das ich weiss.</b> → alles, was ich weiss.'],
 grammar:`<h3>1. Article words as pronouns</h3>
<p>When the noun is already known, the article word stands alone – with the ending of the <b>definite</b> article:</p>
<table><tr><th></th><th>masc.</th><th>neut.</th><th>fem.</th><th>plural</th></tr>
<tr><td>Nom</td><td>ein<em>er</em> / kein<em>er</em> / mein<em>er</em></td><td>ein<em>(e)s</em> / kein<em>(e)s</em> / mein<em>(e)s</em></td><td>ein<em>e</em> / kein<em>e</em></td><td>welch<em>e</em> / kein<em>e</em></td></tr>
<tr><td>Acc</td><td>ein<em>en</em> / kein<em>en</em></td><td>ein<em>(e)s</em> / kein<em>(e)s</em></td><td>ein<em>e</em> / kein<em>e</em></td><td>welch<em>e</em> / kein<em>e</em></td></tr>
<tr><td>Dat</td><td>ein<em>em</em> / kein<em>em</em></td><td>ein<em>em</em> / kein<em>em</em></td><td>ein<em>er</em> / kein<em>er</em></td><td>welch<em>en</em> / kein<em>en</em></td></tr></table>
<div class="rule">Hast du einen Stift? – Ja, ich habe <b>einen</b>. / Nein, ich habe <b>keinen</b>. · Ist das dein Velo? – Ja, das ist <b>meins</b>. · Brauchst du Briefmarken? – Ja, ich brauche <b>welche</b>. (the plural of “eine” = <b>welche</b>, “some”)</div>
<h3>2. irgend-: indefinite, “any / some – it doesn’t matter which”</h3>
<p><b>irgendein</b> Restaurant (any restaurant), <b>irgendwelche</b> Fragen (plural), <b>irgendwo</b> (somewhere), <b>irgendwann</b> (sometime), <b>irgendwie</b> (somehow), <b>irgendjemand</b> (someone), <b>irgendetwas</b> (something). As pronoun: Ich nehme <b>irgendeinen</b>. / Gibt es <b>irgendwelche</b>?</p>
<h3>3. Adjectives as nouns</h3>
<p>Adjectives (and participles) can become nouns – <b>capitalised</b>, but with <b>adjective endings</b>:</p>
<table><tr><th></th><th>with der/die/das</th><th>with ein/kein</th></tr>
<tr><td>Nom</td><td>der Bekannt<em>e</em> / die Bekannt<em>e</em> / die Bekannt<em>en</em></td><td>ein Bekannt<em>er</em> / eine Bekannt<em>e</em> / Bekannt<em>e</em></td></tr>
<tr><td>Acc</td><td>den Bekannt<em>en</em></td><td>einen Bekannt<em>en</em></td></tr>
<tr><td>Dat</td><td>dem Bekannt<em>en</em></td><td>einem Bekannt<em>en</em></td></tr></table>
<p>Common: der/die Erwachsene (adult), Deutsche, Angestellte (employee), Verwandte (relative), Jugendliche (young person), Kranke, Arbeitslose, Reisende. After <b>etwas, nichts, viel, wenig</b>: neuter with -es: etwas <b>Neues</b>, nichts <b>Besonderes</b>, viel <b>Gutes</b>. After <b>alles</b>: alles <b>Gute</b>.</p>
<h3>4. Relative clauses with was and wo</h3>
<div class="rule"><b>was</b> after <i>alles, etwas, nichts, vieles, das</i> and after a superlative: Das ist alles, <b>was</b> ich weiss. Das ist das Beste, <b>was</b> mir passiert ist.<br><b>wo</b> after places (city, country, place): Zürich ist eine Stadt, <b>wo</b> man gut leben kann (= in der).</div>`},
'b1-16':{title:'The more, the better – je … desto/umso, participles as adjectives',
 topics:['je + comparative …, desto/umso + comparative …','past participle as adjective: die reparierte Uhr','present participle as adjective: das weinende Kind','participles with adjective endings'],
 goals:['express relationships with je … desto','describe people, things and situations more precisely with participles'],
 source:'Netzwerk neu B1 ch. 12 (Geld regiert die Welt?) · preparation for Sicher! B2 L1–2',
 pitfalls:['<b>*Je mehr man spart, desto man hat mehr.</b> → desto mehr hat man (verb directly after the comparative part).','<b>*Je mehr man spart, je mehr …</b> → desto/umso in the second part.','<b>das reparierte Fahrrad</b> is correct, but <b>*das reparierende Fahrrad</b> (active) makes no sense.','<b>*die steigende Preise</b> → die steigenden Preise (plural after die: -en).','<b>*ein spannende Film</b> → ein spannender Film.'],
 grammar:`<h3>1. je … desto / umso (the …, the …)</h3>
<div class="rule"><b>je</b> + comparative … (subordinate clause, verb at the end), <b>desto/umso</b> + comparative + <b>verb</b> + subject (main clause):<br>
<b>Je</b> mehr man spart, <b>desto</b> mehr Geld <b>hat</b> man später. (The more you save, the more money you have later.)<br>
<b>Je</b> früher wir losfahren, <b>umso</b> weniger Verkehr <b>gibt</b> es.</div>
<p>Short form in conversation: <i>Je früher, desto besser. Je mehr, desto lieber.</i></p>
<h3>2. Past participle as adjective (passive / completed)</h3>
<p>Past participle + adjective ending: das <b>reparierte</b> Fahrrad (= the bike that has been repaired), die <b>gekauften</b> Aktien, ein <b>gebrauchtes</b> Auto, frisch <b>gepresster</b> Saft.</p>
<h3>3. Present participle as adjective (active / simultaneous)</h3>
<p>Infinitive + <b>d</b> + adjective ending: das <b>weinende</b> Kind (= the child who is crying), die <b>steigenden</b> Preise, ein <b>spannendes</b> Buch, bei <b>laufendem</b> Motor.</p>
<table><tr><th>Relative clause</th><th>Participle</th></tr>
<tr><td>die Preise, die steigen</td><td>die steigen<em>d</em>en Preise (present participle)</td></tr>
<tr><td>das Konto, das eröffnet wurde</td><td>das eröffn<em>et</em>e Konto (past participle)</td></tr>
<tr><td>der Zug, der abfährt</td><td>der abfahren<em>d</em>e Zug</td></tr>
<tr><td>die Wohnung, die renoviert ist</td><td>die renoviert<em>e</em> Wohnung</td></tr></table>
<div class="warn">Participles take <b>normal adjective endings</b> (rules 1–3). Without a noun (predicative) there is no ending: <i>Das Buch ist spannend.</i></div>`},
'b2-01':{title:'Linking arguments – two-part connectors & the middle field',
 topics:['zwar … aber, einerseits … andererseits, je … desto/umso','nicht nur … sondern auch, sowohl … als auch, weder … noch, entweder … oder','middle field: adverbials (Te-Ka-Mo-Lo) and objects'],
 goals:['weigh up and prioritise in the exam discussion','order long middle fields correctly'],
 source:'Sicher! B2 Grammatik L1 (two-part connectors, middle field in the main clause)',
 pitfalls:['<b>*Je mehr ich lerne, desto ich verstehe mehr</b> → desto mehr verstehe ich.','<b>*Zwar ich verstehe das, aber …</b> → Zwar verstehe ich das / Ich verstehe das zwar, aber …','<b>*weder … oder</b> → weder … noch.','<b>*Einerseits … anderseits … auf der anderen Seite</b> – don’t mix them.'],
 grammar:`<h3>1. Two-part connectors</h3>
<table><tr><th>Connector</th><th>Function</th><th>Example</th></tr>
<tr><td><b>zwar … aber</b></td><td>concession (admittedly … but)</td><td>Freundschaften im Netz sind <b>zwar</b> praktisch, <b>aber</b> sie ersetzen keine echten Treffen.</td></tr>
<tr><td><b>einerseits … andererseits</b></td><td>weighing two sides</td><td><b>Einerseits</b> ist die Stadt teuer, <b>andererseits</b> bietet sie viele Möglichkeiten.</td></tr>
<tr><td><b>je … desto / umso</b></td><td>the more … the more</td><td><b>Je</b> länger ich in der Schweiz <b>lebe</b>, <b>desto</b> besser <b>gefällt</b> es mir.</td></tr>
<tr><td><b>nicht nur … sondern auch</b></td><td>addition</td><td>Er ist <b>nicht nur</b> Kollege, <b>sondern auch</b> ein guter Freund.</td></tr>
<tr><td><b>sowohl … als auch</b></td><td>listing (both … and)</td><td><b>Sowohl</b> Jung <b>als auch</b> Alt nutzen soziale Netzwerke.</td></tr>
<tr><td><b>weder … noch</b></td><td>double negation</td><td>Sie hat <b>weder</b> angerufen <b>noch</b> geschrieben.</td></tr>
<tr><td><b>entweder … oder</b></td><td>alternative</td><td><b>Entweder</b> wir finden einen Kompromiss, <b>oder</b> das Projekt scheitert.</td></tr></table>
<div class="rule"><b>je + comparative … (verb at the end), desto/umso + comparative + verb …</b>: Je mehr man übt, desto sicherer wird man.<br><b>zwar</b> and <b>einerseits</b> can take position 1 → the verb follows: Zwar <b>ist</b> die Wohnung klein, aber …</div>
<h3>2. The middle field</h3>
<p><b>a) Adverbials:</b> Te(mporal) – Ka(usal) – Mo(dal) – Lo(kal): <i>Ich treffe mich <b>heute</b> <b>wegen des Projekts</b> <b>gern</b> <b>im Büro</b> mit ihm.</i> (Flexible, but this order is neutral.)</p>
<p><b>b) Objects:</b> dative before accusative (nouns); accusative pronoun before dative pronoun; pronouns before nouns; prepositional and place complements at the end of the middle field: <i>Ich habe <b>meinem Freund</b> <b>das Buch</b> <b>gestern</b> zurückgegeben. Ich habe <b>es ihm</b> gestern zurückgegeben. Er hat sich gestern lange <b>über den Lärm</b> beschwert.</i></p>`},
'b2-02':{title:'States & qualities – state passive, participles as adjectives',
 topics:['state passive (sein + past participle)','process vs. state passive','present and past participles as adjectives','word formation: noun suffixes'],
 goals:['express results and states','build compact noun phrases with participles'],
 source:'Sicher! B2 Grammatik L1 & L2 (suffixes, state passive, participles I and II as adjectives)',
 pitfalls:['<b>*Das Geschäft wird geschlossen</b> (meaning: it is closed now) → ist geschlossen.','<b>*die gestiegenden Preise</b> → die gestiegenen / die steigenden Preise.','<b>*ein überzeugender Argument</b> → ein überzeugendes Argument (das Argument).'],
 grammar:`<h3>1. State passive: sein + past participle</h3>
<table><tr><th>Process passive (action)</th><th>State passive (result)</th></tr><tr><td>Das Büro <b>wird</b> gerade <b>geputzt</b>.</td><td>Das Büro <b>ist</b> jetzt <b>geputzt</b>.</td></tr><tr><td>Der Vertrag <b>wurde</b> gestern <b>unterschrieben</b>.</td><td>Der Vertrag <b>ist</b> (schon) <b>unterschrieben</b>.</td></tr></table>
<p>Simple past: Das Geschäft <b>war</b> geschlossen. With a modal verb: Die Unterlagen <b>müssen</b> bis Freitag <b>eingereicht sein</b>.</p>
<h3>2. Participles I and II as adjectives</h3>
<table><tr><th>Participle I (infinitive + d): active, simultaneous</th><th>Participle II: passive / completed</th></tr><tr><td>das <b>weinende</b> Kind (the child who is crying)<br>steigende Preise (rising prices)<br>die <b>wachsende</b> Bevölkerung<br>ein <b>überzeugendes</b> Argument</td><td>das <b>reparierte</b> Auto (the car that was repaired)<br>gestiegene Preise (prices that have risen)<br>die <b>ausgefüllten</b> Formulare<br>ein <b>geschlossenes</b> Fenster</td></tr></table>
<p>Participles take normal adjective endings. As an adverb: Er sprach <b>überzeugend</b>.</p>
<h3>3. Noun suffixes (review + B2)</h3><p>-ung (die Lösung), -heit/-keit (die Gesundheit, die Pünktlichkeit), -schaft (die Gesellschaft), -tum (das Eigentum, der Irrtum!), -nis (das Ergebnis, die Erlaubnis), -ling (der Lehrling), -ei (die Bäckerei), -ie (die Bürokratie), -ion (die Integration), -tät (die Qualität), -ismus (der Föderalismus), -ur (die Kultur), -enz/-anz (die Konkurrenz, die Toleranz).</p>`},
'b2-03':{title:'Naming causes – causal links & noun prefixes',
 topics:['causal: da, weil, zumal, nämlich, denn, deshalb, folglich','prepositions: wegen, aufgrund, infolge, dank, aus, vor','word formation: noun prefixes (Miss-, Un-, Ur-, Haupt-, Neben-)'],
 goals:['express causes in verbal and nominal style','use genitive prepositions in formal texts'],
 source:'Sicher! B2 Grammatik L2 & L3 (noun prefixes, causal links)',
 pitfalls:['<b>*wegen dem Wetter</b> – common in speech; in writing: wegen des Wetters.','<b>*aus der Angst</b> → aus Angst.','<b>*Aufgrund die Nachfrage</b> → aufgrund der Nachfrage.'],
 grammar:`<h3>1. Causal connectors</h3>
<table><tr><th>Subordinate clause</th><th>Main clause (pos. 0)</th><th>Main clause (pos. 1/3)</th></tr><tr><td>weil, da, zumal (= especially because)</td><td>denn</td><td>deshalb, deswegen, daher, darum, folglich, aus diesem Grund; nämlich (only pos. 3+)</td></tr></table>
<p><b>zumal</b>: an additional, reinforcing reason: <i>Ich nehme den Zug, <b>zumal</b> das Wetter schlecht ist.</i></p>
<h3>2. Causal prepositions (nominal style)</h3>
<table><tr><td><b>wegen</b> + gen</td><td>general</td><td>wegen des Streiks</td></tr><tr><td><b>aufgrund</b> + gen</td><td>formal (reason)</td><td>aufgrund der hohen Nachfrage</td></tr><tr><td><b>infolge</b> + gen</td><td>consequence of an event</td><td>infolge eines Unfalls</td></tr><tr><td><b>dank</b> + gen/dat</td><td>positive reason (thanks to)</td><td>dank Ihrer Hilfe</td></tr><tr><td><b>aus</b> + dat</td><td>inner motive, no article</td><td>aus Angst, aus Liebe, aus Neugier</td></tr><tr><td><b>vor</b> + dat</td><td>involuntary reaction</td><td>vor Freude weinen, vor Kälte zittern</td></tr></table>
<div class="rule">Verbal → nominal: <i>Weil die Nachfrage hoch ist, steigen die Preise.</i> → <i><b>Aufgrund der hohen Nachfrage</b> steigen die Preise.</i></div>
<h3>3. Noun prefixes</h3><p><b>Miss-</b> (negative/wrong: das Missverständnis, der Misserfolg), <b>Un-</b> (opposite/negative: die Unsicherheit, das Unglück, die Unmenge = a huge amount), <b>Ur-</b> (original/very old: der Urgrossvater, der Urwald), <b>Haupt-</b> (main: das Hauptproblem), <b>Neben-</b> (side/extra: die Nebenkosten), <b>Rück-</b> (back: die Rückfrage), <b>Gegen-</b> (counter: der Gegenvorschlag).</p>`},
'b2-04':{title:'Holding texts together – reference words, conditions without wenn',
 topics:['reference words: dies, das, es, dabei, darauf, dafür, deshalb, letzterer','conditional clauses without wenn','word formation: adjective suffixes (-bar, -lich, -ig, -isch, -los, -voll, -sam, -haft)'],
 goals:['write coherent texts','avoid repetition with reference words','express conditions formally without wenn'],
 source:'Sicher! B2 Grammatik L3 (reference words in texts, adjective suffixes, conditions without wenn)',
 pitfalls:['<b>*Sollten Sie Fragen haben, Sie können uns anrufen</b> → können Sie uns anrufen / rufen Sie uns an.','<b>*Ich finde wichtig, dass…</b> – better: Ich finde es wichtig, dass…','Repeating the same noun too often – use reference words.'],
 grammar:`<h3>1. Reference words</h3><p>They refer back (or forward) to what is said and make a text flow:</p>
<table><tr><td>pronouns</td><td>er, sie, es, dieser, jener, derselbe; <b>Letzterer/Ersterer</b> (the latter/the former)</td><td>Es gibt zwei Angebote. <b>Letzteres</b> ist günstiger.</td></tr>
<tr><td>dies / das</td><td>refers to whole statements</td><td>Viele arbeiten Teilzeit. <b>Dies</b> hat Vorteile.</td></tr>
<tr><td>da(r) + preposition</td><td>dabei, dafür, dagegen, darauf, damit, davon</td><td>Die Gemeinde plant einen Neubau. <b>Dagegen</b> gibt es Widerstand.</td></tr>
<tr><td>adverbs</td><td>dort, damals, deshalb, trotzdem, so</td><td>2015 zog ich nach Zug. <b>Damals</b> sprach ich kaum Deutsch.</td></tr>
<tr><td>es (placeholder)</td><td>points to a following clause</td><td>Ich finde <b>es</b> wichtig, <b>dass</b> alle mitreden können.</td></tr></table>
<h3>2. Conditional clauses without wenn</h3>
<div class="rule">The verb moves to position 1 and “wenn” disappears: <i>Wenn Sie Fragen haben, rufen Sie uns an.</i> → <i><b>Haben</b> Sie Fragen, (so/dann) rufen Sie uns an.</i><br><i>Sollten</i> Sie Fragen haben, … (formal, very common in letters!)</div>
<h3>3. Adjective suffixes</h3>
<table><tr><td>-bar</td><td>can be done</td><td>essbar, machbar, erreichbar, zahlbar</td></tr><tr><td>-lich</td><td>quality / can</td><td>freundlich, verständlich, ärztlich</td></tr><tr><td>-ig</td><td>has something</td><td>sonnig, wichtig, eilig</td></tr><tr><td>-isch</td><td>origin/kind</td><td>politisch, schweizerisch, typisch</td></tr><tr><td>-los</td><td>without</td><td>arbeitslos, kostenlos, hoffnungslos</td></tr><tr><td>-voll</td><td>full of</td><td>wertvoll, sinnvoll, respektvoll</td></tr><tr><td>-sam</td><td>tendency</td><td>sparsam, langsam, einsam</td></tr><tr><td>-haft</td><td>like</td><td>fehlerhaft, vorbildhaft, lebhaft</td></tr></table>`},
'b2-05':{title:'Sequences in time – preposition or connector?',
 topics:['at the same time: während/bei – als/wenn/während','before/after: vor/bevor, nach/nachdem','seit/seitdem, bis zu/bis, ab/sobald','the adverb suffix -weise'],
 goals:['switch between verbal and nominal style','express time relations precisely'],
 source:'Sicher! B2 Grammatik L4 (expressing time, time relations, -weise)',
 pitfalls:['<b>*Nach ich gegessen habe</b> → Nachdem ich gegessen habe / Nach dem Essen.','<b>*Bevor dem Essen</b> → Vor dem Essen.','<b>*Während ich des Studiums</b> → Während des Studiums / Während ich studierte.','<b>*glücklichweise</b> → glücklicherweise.'],
 grammar:`<h3>1. At the same time</h3><table><tr><th>Connector (verbal style)</th><th>Preposition (nominal style)</th></tr><tr><td><b>Während</b> ich studierte, jobbte ich.</td><td><b>Während</b> des Studiums jobbte ich.</td></tr><tr><td><b>Als/Wenn</b> ich ankam/ankomme, …</td><td><b>Bei</b> meiner Ankunft …</td></tr></table>
<h3>2. Not at the same time</h3><table><tr><th>Connector</th><th>Preposition</th></tr>
<tr><td><b>Bevor</b> ich die Stelle antrat, …</td><td><b>Vor</b> dem Stellenantritt …</td></tr>
<tr><td><b>Nachdem</b> er die Prüfung bestanden hatte, …</td><td><b>Nach</b> der bestandenen Prüfung …</td></tr>
<tr><td><b>Seit(dem)</b> ich hier wohne, …</td><td><b>Seit</b> meinem Umzug …</td></tr>
<tr><td><b>Bis</b> die Bewilligung kommt, …</td><td><b>Bis zur</b> Bewilligung …</td></tr>
<tr><td><b>Sobald</b> die Unterlagen vollständig sind, …</td><td><b>Ab</b> Vollständigkeit / <b>Nach</b> Eingang der Unterlagen …</td></tr>
<tr><td><b>Solange</b> du Fieber hast, …</td><td>– (Während des Fiebers)</td></tr></table>
<div class="rule">Nominalisation: verb → noun (ankommen → die Ankunft, abreisen → die Abreise, beginnen → der Beginn, eintreffen → das Eintreffen), subject → possessive or genitive: <i>als <b>der Präsident</b> ankam</i> → <i>bei der Ankunft <b>des Präsidenten</b></i>; <i>nachdem <b>ich</b> umgezogen war</i> → <i>nach <b>meinem</b> Umzug</i>.</div>
<h3>3. -weise</h3><p>Adjective + -erweise = the speaker’s comment: <b>glücklicherweise</b> (fortunately), <b>überraschenderweise</b>, <b>normalerweise</b>, <b>möglicherweise</b>. Noun + -weise = manner: <b>schrittweise</b> (step by step), <b>teilweise</b>, <b>beispielsweise</b>, <b>ausnahmsweise</b>, <b>stundenweise</b>.</p>`},
'b2-06':{title:'Getting things done & guessing – lassen, future II, verb combinations',
 topics:['lassen: have something done, allow, sich lassen','future II: assumptions about the past','verb combinations (kennenlernen, spazieren gehen, liegen lassen)','turning verbs with nouns/adverbs into nouns'],
 goals:['say what you have done for you (services)','make assumptions about the past'],
 source:'Sicher! B2 Grammatik L5 (lassen, future II, verb combinations, nominalisation)',
 pitfalls:['<b>*Ich habe das Auto reparieren gelassen</b> → reparieren lassen.','<b>*Ich lasse reparieren mein Auto</b> → Ich lasse mein Auto reparieren.','<b>*beim auto fahren</b> → beim Autofahren.','<b>*Er wird den Zug verpasst</b> → … verpasst haben.'],
 grammar:`<h3>1. lassen</h3>
<table><tr><td>have something done (someone else does it)</td><td>Ich <b>lasse</b> mein Auto reparieren. Wir <b>haben</b> die Wohnung streichen <b>lassen</b>.</td></tr>
<tr><td>allow / let</td><td>Meine Eltern <b>liessen</b> mich allein reisen.</td></tr>
<tr><td>leave behind</td><td>Ich habe den Schirm im Zug <b>liegen lassen</b>.</td></tr>
<tr><td>sich lassen (= can be done)</td><td>Das Problem <b>lässt sich</b> lösen. (= kann gelöst werden)</td></tr></table>
<div class="rule">Perfect with an infinitive: <b>double infinitive</b>: Ich habe mir die Haare schneiden <b>lassen</b> (not: *gelassen). In a subordinate clause: …, weil ich das Auto habe reparieren lassen.</div>
<p>Forms: ich lasse, du <b>lässt</b>, er <b>lässt</b>; simple past liess; participle gelassen.</p>
<h3>2. Future II – assumptions about the past</h3>
<div class="rule">werden + past participle + haben/sein: <i>Er ist nicht gekommen. Er <b>wird</b> den Zug <b>verpasst haben</b>.</i> (= He has probably missed the train.) <i>Sie <b>wird</b> schon <b>angekommen sein</b>.</i></div>
<p>Degrees of certainty: Er hat <i>sicher/bestimmt</i> (90%) – <i>wahrscheinlich/vermutlich</i> (75%) – <i>vielleicht/möglicherweise</i> (50%) … With modal verbs: Er <b>muss</b> den Zug verpasst haben (almost certain), er <b>dürfte</b> … (probable), er <b>könnte</b> … (possible).</p>
<h3>3. Verb combinations</h3><p>Verb + verb: kennenlernen, spazieren gehen, einkaufen gehen, schwimmen gehen, liegen lassen, stehen bleiben, sitzen bleiben. Noun + verb: Rad fahren, Auto fahren, Ski fahren, Klavier spielen, Deutsch lernen. As nouns they are capitalised and written as one word: das <b>Kennenlernen</b>, beim <b>Autofahren</b>, zum <b>Spazierengehen</b>, das <b>Deutschlernen</b>.</p>`},
'b2-07':{title:'Hätte, wäre, könnte – subjunctive II in depth & adjectives with prepositions',
 topics:['uses of subjunctive II: wish, condition, comparison (als ob), suggestion, assumption, regret','past subjunctive II with modal verbs','adjectives with prepositions'],
 goals:['express advice, criticism and regret with nuance','make unreal comparisons'],
 source:'Sicher! B2 Grammatik L6 (uses of subjunctive II, adjectives with prepositions) · Tracker B2.1',
 grammar:`<h3>1. Uses</h3>
<table><tr><td>unreal wish</td><td>Wenn ich doch mehr Zeit <b>hätte</b>! / <b>Hätte</b> ich nur früher angefangen!</td></tr>
<tr><td>unreal condition</td><td>Wenn die Mieten tiefer <b>wären</b>, <b>würden</b> mehr Familien in der Stadt bleiben.</td></tr>
<tr><td>unreal comparison (as if)</td><td>Er tut so, <b>als ob</b> er alles <b>wüsste</b>. / … <b>als wüsste</b> er alles.</td></tr>
<tr><td>politeness</td><td><b>Dürfte</b> ich Sie kurz unterbrechen?</td></tr>
<tr><td>suggestion/advice</td><td>Wir <b>könnten</b> uns in der Mitte treffen. Du <b>solltest</b> dich beschweren.</td></tr>
<tr><td>assumption</td><td>Das <b>dürfte</b> etwa 500 Franken kosten.</td></tr>
<tr><td>regret/criticism (past)</td><td>Du <b>hättest</b> mich anrufen <b>sollen</b>. Das <b>hätte</b> nicht passieren <b>dürfen</b>.</td></tr>
<tr><td>“almost”</td><td>Ich <b>hätte</b> fast den Zug <b>verpasst</b>.</td></tr></table>
<div class="rule">Past + modal verb = <b>hätte + infinitive + modal infinitive</b>: Ich hätte früher kommen <b>können</b>. In a subordinate clause: …, dass ich früher <b>hätte</b> kommen können.</div>
<h3>2. Adjectives with prepositions</h3>
<table><tr><td>abhängig <b>von</b> (dependent on)</td><td>begeistert <b>von</b> (enthusiastic about)</td><td>überzeugt <b>von</b> (convinced of)</td><td>enttäuscht <b>von</b>/<b>über</b> (disappointed by)</td></tr>
<tr><td>stolz <b>auf</b> (proud of)</td><td>gespannt <b>auf</b> (curious about)</td><td>neidisch <b>auf</b> (jealous of)</td><td>angewiesen <b>auf</b> (reliant on)</td></tr>
<tr><td>zufrieden <b>mit</b> (satisfied with)</td><td>einverstanden <b>mit</b> (in agreement with)</td><td>vertraut <b>mit</b> (familiar with)</td><td>verheiratet <b>mit</b> (married to)</td></tr>
<tr><td>verantwortlich <b>für</b> (responsible for)</td><td>zuständig <b>für</b> (in charge of)</td><td>bekannt <b>für</b> (known for)</td><td>dankbar <b>für</b> (grateful for)</td></tr>
<tr><td>interessiert <b>an</b> + D (interested in)</td><td>beteiligt <b>an</b> + D (involved in)</td><td>froh <b>über</b> (glad about)</td><td>bereit <b>zu</b> (ready for)</td></tr></table>`},
'b2-08':{title:'Reporting what others say – reported speech (subjunctive I)',
 topics:['subjunctive I: forms','replacement forms with subjunctive II','past & future in reported speech','nouns with prepositions','generalising relative clauses (wer …, der …)','comparative clauses'],
 goals:['report news and other people’s statements correctly','report neutrally (newspaper style)'],
 source:'Sicher! B2 Grammatik L7 (nouns with prepositions, reported speech, generalising relative clauses, comparative clauses)',
 pitfalls:['<b>*Er sagt, er ist krank sei</b> → er sei krank.','<b>*Sie sagen, sie haben keine Zeit</b> (in the news) → sie hätten keine Zeit.','<b>*Er fragte, ob ich komme würde</b> → ob ich käme / ob ich kommen würde.','<b>*das Interesse für</b> (possible) – standard: Interesse an.'],
 grammar:`<h3>1. Function</h3><p>Reported speech neutrally reproduces what someone said – typical in the news (SRF, NZZ), minutes and reports. In speech, the indicative or subjunctive II is often used instead.</p>
<h3>2. Forms of subjunctive I</h3>
<table><tr><th></th><th>sein</th><th>haben</th><th>können</th><th>kommen</th><th>werden</th></tr>
<tr><td>ich</td><td>sei</td><td>(habe → hätte)</td><td>könne</td><td>(komme → käme)</td><td>(werde → würde)</td></tr>
<tr><td>du</td><td>sei(e)st</td><td>habest</td><td>könnest</td><td>kommest</td><td>werdest</td></tr>
<tr><td>er/sie/es</td><td><b>sei</b></td><td><b>habe</b></td><td><b>könne</b></td><td><b>komme</b></td><td><b>werde</b></td></tr>
<tr><td>wir</td><td>seien</td><td>(haben → hätten)</td><td>(können → könnten)</td><td>(kommen → kämen)</td><td>(werden → würden)</td></tr>
<tr><td>sie/Sie</td><td>seien</td><td>(hätten)</td><td>(könnten)</td><td>(kämen)</td><td>(würden)</td></tr></table>
<div class="rule">Subjunctive I = stem + e (er komm<b>e</b>, er müss<b>e</b>, er wiss<b>e</b>). In practice mainly the <b>3rd person singular</b>. If subjunctive I looks the same as the indicative (mostly plural), use <b>subjunctive II</b>: Sie sagen, sie <b>hätten</b> keine Zeit.</div>
<h3>3. Tenses</h3><table><tr><td>present</td><td>Er sagt: „Ich bin müde.“ → Er sagt, er <b>sei</b> müde.</td></tr><tr><td>past</td><td>„Ich war / bin gewesen / habe gearbeitet.“ → Er sagt, er <b>sei</b> müde <b>gewesen</b> / er <b>habe</b> gearbeitet.</td></tr><tr><td>future</td><td>„Ich werde kommen.“ → Er sagt, er <b>werde</b> kommen.</td></tr><tr><td>question</td><td>„Kommst du?“ → Sie fragt, <b>ob</b> er komme. „Wann kommt er?“ → Sie fragt, <b>wann</b> er komme.</td></tr><tr><td>imperative</td><td>„Warten Sie!“ → Er sagt, ich <b>solle</b> warten. (request: ich <b>möge</b> warten.)</td></tr></table>
<p>Adjust the pronouns: „Ich helfe dir.“ → Sie sagt, sie helfe mir.</p>
<h3>4. Generalising relative clauses & comparative clauses</h3><p><b>Wer</b> zu spät kommt, (<b>der</b>) muss draussen warten. (Whoever …) <b>Was</b> du sagst, (das) stimmt. — Comparison: Die Prüfung war leichter, <b>als</b> ich gedacht hatte. Es ist nicht so schlimm, <b>wie</b> alle sagen. Je … desto (B2-01).</p>
<h3>5. Nouns with prepositions</h3><p>die Angst <b>vor</b>, die Bitte <b>um</b>, die Frage <b>nach</b>, das Interesse <b>an</b>, die Kritik <b>an</b>, die Lust <b>auf</b>, die Sorge <b>um</b>, die Teilnahme <b>an</b>, der Wunsch <b>nach</b>, die Zufriedenheit <b>mit</b>, die Abhängigkeit <b>von</b>, der Grund <b>für</b>.</p>`},
'b2-09':{title:'Wenn, falls, obwohl – conditional & concessive, sollen/wollen for claims',
 topics:['sollen for rumours and wollen for claims','turning verbs into nouns','conditional: wenn, falls, sofern, im Falle, bei, ohne','concessive: obwohl, obgleich, selbst wenn, auch wenn, trotz, ungeachtet, zwar … aber'],
 goals:['express hearsay','formulate conditions and concessions in verbal and nominal style'],
 source:'Sicher! B2 Grammatik L8 (subjective meaning of sollen, nominalisation, conditional & concessive links)',
 grammar:`<h3>1. sollen and wollen – subjective use</h3>
<table><tr><td><b>sollen</b> = people say, reportedly (rumour, report)</td><td>Der neue Chef <b>soll</b> sehr streng <b>sein</b>. Er <b>soll</b> früher bei Google <b>gearbeitet haben</b>.</td></tr>
<tr><td><b>wollen</b> = the person claims it themselves (doubt)</td><td>Er <b>will</b> den Unfall nicht <b>gesehen haben</b>. Sie <b>will</b> fünf Sprachen <b>sprechen</b>.</td></tr></table>
<h3>2. Conditional</h3>
<table><tr><th>Subordinate clause</th><th>Preposition (nominal style)</th></tr>
<tr><td><b>Wenn/Falls/Sofern</b> es regnet, findet das Fest drinnen statt.</td><td><b>Bei</b> Regen findet das Fest drinnen statt.</td></tr>
<tr><td><b>Falls</b> Sie verhindert sind, melden Sie sich.</td><td><b>Im Falle</b> einer Verhinderung melden Sie sich.</td></tr>
<tr><td><b>Wenn</b> Sie keine gültige Fahrkarte haben, …</td><td><b>Ohne</b> gültige Fahrkarte …</td></tr>
<tr><td><b>Nur wenn / Nur unter der Bedingung, dass</b> …</td><td><b>Unter der Bedingung</b> …</td></tr></table>
<p><b>falls</b> = in case (rather unlikely); <b>sofern</b> = provided that. Without wenn: Regnet es, … / Sollte es regnen, …</p>
<h3>3. Concessive</h3>
<table><tr><th>Subordinate clause</th><th>Main clause</th><th>Preposition</th></tr>
<tr><td><b>obwohl, obgleich, obschon</b> (although)<br><b>auch wenn, selbst wenn</b> (even if – also hypothetical)<br><b>wenn … auch</b></td><td><b>trotzdem, dennoch</b><br><b>zwar … aber</b></td><td><b>trotz</b> + gen<br><b>ungeachtet</b> + gen (formal)</td></tr></table>
<p><i>Selbst wenn</i> ich Zeit hätte, würde ich nicht hingehen. <i>Trotz</i> intensiver Bemühungen fand man keine Lösung.</p>
<h3>4. Turning verbs into nouns</h3><p>bewerben → die Bewerbung, entscheiden → die Entscheidung, teilnehmen → die Teilnahme, ankommen → die Ankunft, vorschlagen → der Vorschlag, verlieren → der Verlust, beginnen → der Beginn, abschliessen → der Abschluss, zunehmen → die Zunahme, steigen → der Anstieg, sinken → der Rückgang (!).</p>`},
'b2-10':{title:'Expressing consequences – consecutive clauses, noun–verb combinations',
 topics:['consecutive: sodass, so … dass, folglich, infolgedessen, also, deshalb','zu … um zu / zu …, als dass','noun–verb combinations (Funktionsverbgefüge)','negation with prefixes/suffixes (un-, miss-, -los, -frei, in-/il-/ir-/dis-)'],
 goals:['express consequences precisely','write formally with noun–verb combinations'],
 source:'Sicher! B2 Grammatik L9 (consecutive links, fixed noun–verb combinations, negation with prefixes and suffixes)',
 pitfalls:['<b>*sodass</b> as a main clause: *sodass wurde das Spiel → sodass das Spiel abgesagt wurde.','<b>*eine Entscheidung machen</b> → treffen.','<b>*einen Antrag machen</b> → stellen.','<b>*Er ist zu müde, dass er arbeitet</b> → um zu arbeiten.'],
 swiss:'Swiss official language: <b>Einsprache erheben</b> (to lodge an objection – against a building permit or a tax assessment), <b>ein Gesuch stellen/einreichen</b> (to submit an application = Antrag), <b>in Kraft treten</b> (to come into force).',
 grammar:`<h3>1. Consecutive (consequence)</h3>
<table><tr><td><b>sodass / so dass</b> (subordinate clause)</td><td>Es regnete stark, <b>sodass</b> das Spiel abgesagt wurde.</td></tr>
<tr><td><b>so</b> + adjective … <b>dass</b></td><td>Es regnete <b>so</b> stark, <b>dass</b> das Spiel abgesagt wurde.</td></tr>
<tr><td><b>derart / dermassen … dass</b></td><td>Er war <b>derart</b> nervös, <b>dass</b> er alles vergass.</td></tr>
<tr><td><b>folglich, infolgedessen, also, somit, daher</b> (main clause, pos. 1)</td><td>Die Firma machte Verluste. <b>Infolgedessen</b> wurden Stellen gestrichen.</td></tr>
<tr><td><b>zu</b> + adj., <b>um … zu</b> / <b>als dass</b> (negative consequence – too … to)</td><td>Er ist <b>zu</b> müde, <b>um</b> noch <b>zu</b> arbeiten. Die Zeit ist <b>zu</b> knapp, <b>als dass</b> wir alles schaffen <b>könnten</b>.</td></tr></table>
<h3>2. Noun–verb combinations</h3><p>Typical of formal language (letters, authorities, exam writing part 2). The noun carries the meaning:</p>
<table><tr><td>einen Antrag stellen</td><td>= beantragen (apply)</td><td>eine Entscheidung treffen</td><td>= entscheiden (decide)</td></tr>
<tr><td>Kritik üben an</td><td>= kritisieren (criticise)</td><td>in Kraft treten</td><td>= gültig werden (come into force)</td></tr>
<tr><td>zur Verfügung stehen/stellen</td><td>= verfügbar sein/machen (be/make available)</td><td>Bescheid geben/sagen</td><td>= informieren (let know)</td></tr>
<tr><td>in Anspruch nehmen</td><td>= nutzen (make use of)</td><td>Rücksicht nehmen auf</td><td>= berücksichtigen (take into account)</td></tr>
<tr><td>Stellung nehmen zu</td><td>= sich äussern (comment on)</td><td>zur Sprache bringen</td><td>= ansprechen (raise)</td></tr>
<tr><td>in Frage kommen</td><td>= möglich sein (be an option)</td><td>eine Rolle spielen</td><td>= wichtig sein (matter)</td></tr>
<tr><td>Bezug nehmen auf</td><td>= sich beziehen (refer to)</td><td>einen Beitrag leisten</td><td>= beitragen (contribute)</td></tr>
<tr><td>Einspruch / Einsprache erheben</td><td>= widersprechen (object – legal)</td><td>Massnahmen ergreifen</td><td>= handeln (take measures)</td></tr></table>
<h3>3. Negation through word formation</h3><p><b>un-</b> (unklar, unzufrieden), <b>miss-</b> (missverständlich), <b>in-/il-/ir-</b> (instabil, illegal, irrelevant), <b>dis-</b> (diskontinuierlich), <b>-los</b> (erfolglos), <b>-frei</b> (alkoholfrei, barrierefrei), <b>-arm</b> (fettarm = low-fat), <b>nicht-</b> (nichtöffentlich).</p>`},
'b2-11':{title:'Impersonal style – alternatives to the passive',
 topics:['man','sich lassen + infinitive','sein + zu + infinitive','adjectives in -bar/-lich','passive without a subject (Es wird …)'],
 goals:['express rules, possibilities and necessities impersonally','understand official texts'],
 source:'Sicher! B2 Grammatik L10 (alternatives to the passive, passive without a subject)',
 pitfalls:['<b>*Das Problem lässt sich gelöst</b> → lässt sich lösen.','<b>*Die Gebühr ist zu bezahlt</b> → ist zu bezahlen.','<b>*Hier es wird nicht geraucht</b> → Hier wird nicht geraucht.','<b>*Das ist nicht erklärbar</b> ✓ / <b>*unerklärlich</b> ✓ – both possible.'],
 grammar:`<h3>1. Possibility (can be …)</h3>
<table><tr><td>passive</td><td>Das Problem <b>kann gelöst werden</b>.</td></tr><tr><td>sich lassen</td><td>Das Problem <b>lässt sich lösen</b>.</td></tr><tr><td>sein + zu</td><td>Das Problem <b>ist zu lösen</b>.</td></tr><tr><td>-bar / -lich</td><td>Das Problem <b>ist lösbar</b>. (Das ist erklär<b>lich</b>, verständ<b>lich</b>)</td></tr><tr><td>man</td><td><b>Man kann</b> das Problem lösen.</td></tr></table>
<h3>2. Necessity (must be …)</h3>
<table><tr><td>passive</td><td>Die Gebühr <b>muss</b> im Voraus <b>bezahlt werden</b>.</td></tr><tr><td>sein + zu</td><td>Die Gebühr <b>ist</b> im Voraus <b>zu bezahlen</b>.</td></tr><tr><td>man</td><td><b>Man muss</b> die Gebühr im Voraus bezahlen.</td></tr></table>
<div class="rule"><b>sein + zu + infinitive</b> can mean “can” OR “must” – the context decides. In official texts it usually means “must”: <i>Der Ausweis ist stets mitzuführen.</i> As a participle attribute (gerundive): <i>die zu bezahlende Gebühr</i> (= the fee that has to be paid).</div>
<h3>3. Passive without a subject</h3><p>With verbs that have no accusative object: <i><b>Es wird</b> hier nicht geraucht.</i> → <i>Hier wird nicht geraucht.</i> (es disappears when something else is in position 1.) <i>Am Sonntag wird nicht gearbeitet. Es wurde lange diskutiert.</i></p>`},
'b2-12':{title:'Manner – modal clauses & indefinite pronouns',
 topics:['indem, dadurch dass, ohne dass, (an)statt dass','durch, mittels, ohne, anstelle','indefinite pronouns: jemand, niemand, irgendwer, etwas, nichts, man, jeder, mancher, einige'],
 goals:['explain how you achieve something','name means and methods'],
 source:'Sicher! B2 Grammatik L11 (indefinite pronouns, modal links)',
 grammar:`<h3>1. Modal clauses</h3>
<table><tr><td><b>indem</b> (means/method – by …ing)</td><td>Man lernt eine Sprache am besten, <b>indem</b> man sie täglich spricht.</td></tr>
<tr><td><b>dadurch, dass</b> (means, emphasised)</td><td>Er hat sich verbessert, <b>dadurch dass</b> er jeden Tag geübt hat. / <b>Dadurch</b>, <b>dass</b> er übte, …</td></tr>
<tr><td><b>ohne dass / ohne … zu</b> (without)</td><td>Er ging, <b>ohne dass</b> ihn jemand sah. / Er ging, <b>ohne</b> sich <b>zu</b> verabschieden.</td></tr>
<tr><td><b>(an)statt dass / (an)statt … zu</b> (instead of)</td><td><b>Statt dass</b> die Gemeinde handelt, diskutiert sie nur. / <b>Statt zu</b> handeln, …</td></tr>
<tr><td><b>wie</b> (comparison of manner)</td><td>Er hat es so gemacht, <b>wie</b> ich es ihm erklärt hatte.</td></tr></table>
<p>Prepositions: <b>durch</b> + acc (Durch tägliches Üben …), <b>mittels/mithilfe</b> + gen (formal), <b>ohne</b> + acc, <b>anstelle/statt</b> + gen.</p>
<p>Questions: <b>Wie?</b> / <b>Auf welche Weise?</b> / <b>Wodurch?</b> (How? / In what way? / By what means?)</p>
<h3>2. Indefinite pronouns</h3>
<table><tr><th></th><th>jemand (someone)</th><th>niemand (no one)</th><th>einer / keiner (one / none)</th><th>etwas / nichts (something / nothing)</th></tr>
<tr><td>Nom</td><td>jemand</td><td>niemand</td><td>einer/eine/eins</td><td rowspan="3">do not change</td></tr><tr><td>Acc</td><td>jemand(en)</td><td>niemand(en)</td><td>einen/eine/eins</td></tr><tr><td>Dat</td><td>jemand(em)</td><td>niemand(em)</td><td>einem/einer/einem</td></tr></table>
<p><b>irgend-</b> = any/some, it doesn’t matter who: irgendjemand, irgendwer, irgendetwas, irgendwo, irgendwann, irgendwie. <b>mancher, einige, mehrere, wenige, viele, alle, jeder</b>. etwas/nichts + adjective used as a noun: etwas <b>Neues</b>, nichts <b>Besonderes</b>, viel <b>Gutes</b>, alles <b>Gute</b>.</p>`},
'b2-13':{title:'Dense texts – extended participles & adversative clauses',
 topics:['extended participle attribute ↔ relative clause','adversative: während, wohingegen, (an)statt, im Gegensatz zu, dagegen, hingegen','participles as nouns (der Reisende, die Angestellten)','linking s'],
 goals:['decode newspaper texts with long noun phrases','contrast opposites'],
 source:'Sicher! B2 Grammatik L12 (extended participles, adversative clauses, participles as nouns, linking -s-)',
 pitfalls:['<b>*die seit Jahren steigende Mieten</b> → steigenden (plural).','<b>*ein Angestellte</b> → ein Angestellter.','<b>*mit den Reisende</b> → mit den Reisenden.','<b>*Während Zürich ist teuer, …</b> → Während Zürich teuer ist, …'],
 grammar:`<h3>1. Extended participles</h3><p>In newspapers, laws and specialist texts a whole piece of information often sits between the article and the noun:</p>
<div class="rule">die <b>[seit Jahren steigenden]</b> Mieten = die Mieten, <b>die seit Jahren steigen</b> (the rents that have been rising for years)<br>der <b>[vom Parlament beschlossene]</b> Kompromiss = der Kompromiss, <b>der vom Parlament beschlossen wurde</b><br>die <b>[noch zu klärenden]</b> Fragen = die Fragen, <b>die noch geklärt werden müssen</b></div>
<p><b>Decoding:</b> 1. find the article → 2. find the noun that belongs to it (case/gender!) → 3. the participle is at the end of the extension → participle I = active/simultaneous, participle II = passive/earlier, zu + participle I = must/can.</p>
<h3>2. Adversative (contrast)</h3>
<table><tr><td><b>während</b> / <b>wohingegen</b> (subordinate clause – whereas)</td><td>Die Stadt wächst, <b>während</b> die Dörfer schrumpfen.</td></tr><tr><td><b>dagegen, hingegen, jedoch</b> (main clause – however)</td><td>Zürich ist teuer. In Schwyz <b>hingegen</b> sind die Mieten tiefer.</td></tr><tr><td><b>(an)statt</b> + gen / <b>im Gegensatz zu</b> + dat (instead of / in contrast to)</td><td><b>Im Gegensatz zu</b> Deutschland gibt es in der Schweiz Volksabstimmungen.</td></tr><tr><td><b>aber, sondern</b> (pos. 0)</td><td>Nicht der Bundesrat, <b>sondern</b> das Volk entscheidet.</td></tr></table>
<h3>3. Participles and adjectives as nouns</h3><p>They are declined like adjectives: der Reisend<b>e</b>, ein Reisend<b>er</b>, die Reisend<b>en</b>; die Angestellt<b>en</b>, ein Angestellt<b>er</b>, die Mitarbeitend<b>en</b> (gender-neutral!), der/die Deutsch<b>e</b>, ein Deutsch<b>er</b>, die Erwachsen<b>en</b>, der/die Verwandt<b>e</b>.</p>
<h3>4. Linking s</h3><p>After -ung, -heit, -keit, -schaft, -ion, -tät, -ling, -um: Wohnung<b>s</b>markt, Gesundheit<b>s</b>system, Gemeinschaft<b>s</b>raum, Integration<b>s</b>kurs; often also after infinitives and many masculine/neuter nouns: Arbeit<b>s</b>platz, Geburt<b>s</b>tag, Verkehr<b>s</b>mittel.</p>`},
'b2-14':{title:'Exam language – register, useful phrases, formal letters',
 topics:['giving and justifying an opinion','agreeing, disagreeing, compromise','structuring a talk (Goethe B2 speaking part 1)','formal e-mail (writing part 2) vs. forum post (part 1)','more precise than gut/schlecht'],
 goals:['recall the right phrases for every exam situation','switch register deliberately (formal/neutral/informal)'],
 source:'Tracker B2.2 (register, discourse markers) · So geht’s zu B2 (exam strategies) · mock exam bank',
 pitfalls:['<b>*Meiner Meinung nach, das ist</b> → Meiner Meinung nach ist das …','<b>*Sehr geehrte Herr Huber</b> → Sehr geehrter Herr Huber.','<b>*Sehr geehrte Damen und Herren, Ich …</b> → lower case: ich.','<b>*In meiner Meinung</b> (anglicism) → Meiner Meinung nach.','<b>*Ich stimme zu Ihnen</b> → Ich stimme Ihnen zu.'],
 grammar:`<p class="small">The phrases below stay in German – they are what you should say in the exam. Labels and tips are translated.</p>
<h3>1. Opinion</h3><p>Meiner Meinung nach <b>ist</b> … (verb in position 2!) · Meines Erachtens … · Ich bin der Ansicht/Auffassung, dass … · Ich halte es für (sinnvoll/problematisch), dass/zu … · Aus meiner Sicht … · Ich bin davon überzeugt, dass … · Für mich steht fest, dass …</p>
<h3>2. Discussing (speaking part 2)</h3>
<table><tr><td>agreeing</td><td>Da stimme ich Ihnen voll und ganz zu. · Das sehe ich genauso. · Da haben Sie völlig recht.</td></tr>
<tr><td>partly agreeing</td><td>Da haben Sie zwar recht, aber … · Das stimmt im Prinzip, allerdings … · Ich sehe das ein bisschen anders.</td></tr>
<tr><td>disagreeing</td><td>Da bin ich anderer Meinung. · Das überzeugt mich nicht, weil … · Ich möchte widersprechen: …</td></tr>
<tr><td>asking for clarification</td><td>Wie meinen Sie das genau? · Habe ich Sie richtig verstanden, dass …?</td></tr>
<tr><td>compromise</td><td>Wie wäre es, wenn wir …? · Könnten wir uns darauf einigen, dass …? · Ein Kompromiss wäre …</td></tr></table>
<h3>3. Talk (speaking part 1, about 4 min.)</h3><p><b>Introduction:</b> In meinem Vortrag geht es um … / Ich möchte über das Thema … sprechen. Zuerst …, dann …, zum Schluss … · <b>Situation in your home country:</b> In meinem Heimatland ist es so, dass … · <b>Pros and cons:</b> Ein grosser Vorteil ist … Dagegen spricht … · <b>Your own opinion:</b> Ich persönlich … · <b>Conclusion:</b> Zusammenfassend lässt sich sagen, … Vielen Dank für Ihre Aufmerksamkeit.</p>
<h3>4. Formal e-mail (writing part 2)</h3><p><b>Greeting:</b> Sehr geehrte Frau Meier, / Sehr geehrter Herr Huber, / Sehr geehrte Damen und Herren, (continue in lower case after it!) · <b>Reference:</b> Ich beziehe mich auf Ihr Schreiben vom … · Vielen Dank für Ihre Nachricht. · <b>Your request:</b> Ich wende mich an Sie, weil … · Ich möchte Sie bitten, … · Leider muss ich Ihnen mitteilen, dass … · <b>Closing:</b> Für Rückfragen stehe ich Ihnen gerne zur Verfügung. · Ich danke Ihnen im Voraus. · Mit freundlichen Grüssen / Freundliche Grüsse</p>
<h3>5. More precise than gut/schlecht/machen</h3><p>gut (good) → hervorragend, überzeugend, gelungen, vorteilhaft, sinnvoll · schlecht (bad) → mangelhaft, enttäuschend, problematisch, nachteilig · machen (do/make) → durchführen, erledigen, erstellen, treffen (Entscheidung), leisten (Beitrag) · sagen (say) → betonen, erwähnen, behaupten, erklären · viel (a lot) → zahlreich, erheblich, beträchtlich.</p>`},
'b2-15':{title:'Exam training – avoiding mistakes under time pressure',
 topics:['verb position in complex sentences (clause within a clause)','case under time pressure','mixed adjective endings','verb bracket with modal + perfect + passive','mixed review A1–B2'],
 goals:['eliminate the most common exam mistakes','build complex sentences confidently'],
 source:'Tracker B2.2 (common error patterns specific to B2 exam graders) · mixed review',
 pitfalls:['Double infinitive in a subordinate clause: *…, weil ich ihn nicht erreichen können habe → weil ich ihn nicht habe erreichen können.','<b>*Trotzdem ich …</b> → Trotzdem habe ich …','Overlong sentences you can’t control – better two clear sentences.'],
 grammar:`<h3>The 8 most common mistakes at B2 level (according to examiners)</h3>
<table><tr><th>#</th><th>Mistake</th><th>Correct</th></tr>
<tr><td>1</td><td>*Deshalb ich habe …</td><td>Deshalb <b>habe</b> ich …</td></tr>
<tr><td>2</td><td>*…, weil ich habe keine Zeit.</td><td>…, weil ich keine Zeit <b>habe</b>.</td></tr>
<tr><td>3</td><td>*…, dass er kommen wollen hat.</td><td>…, dass er <b>hat</b> kommen wollen. (double infinitive: the auxiliary goes BEFORE the infinitives!)</td></tr>
<tr><td>4</td><td>*mit die Kinder / *für meinem Chef</td><td>mit <b>den</b> Kinder<b>n</b> / für <b>meinen</b> Chef</td></tr>
<tr><td>5</td><td>*ein wichtige Punkt</td><td>ein wichtig<b>er</b> Punkt</td></tr>
<tr><td>6</td><td>*Ich habe nach Bern gefahren.</td><td>Ich <b>bin</b> nach Bern gefahren.</td></tr>
<tr><td>7</td><td>*Ich freue mich für das Wochenende.</td><td>Ich freue mich <b>auf</b> das Wochenende.</td></tr>
<tr><td>8</td><td>*Das ist nicht ein Problem. / *Ich habe nicht Zeit.</td><td>Das ist <b>kein</b> Problem. Ich habe <b>keine</b> Zeit.</td></tr></table>
<h3>Complex verb groups in subordinate clauses</h3>
<div class="rule">…, dass das Formular ausgefüllt werden <b>muss</b>. (passive + modal)<br>…, dass das Formular hätte ausgefüllt werden <b>müssen</b>. → the auxiliary <b>hätte</b> goes BEFORE all infinitives (double-infinitive rule)<br>…, weil ich ihn nicht habe erreichen <b>können</b>.<br>…, obwohl er gestern angerufen worden <b>ist</b>.</div>
<h3>Strategy under time pressure</h3><p>1. After every comma check: main clause or subordinate clause? 2. After every preposition: which case? 3. Before every noun with an adjective: is the signal already on the article? 4. For every past event: movement → sein. 5. At the end: underline the verbs and check their position.</p>`}

{const _sw={
'a1-01':'In Switzerland people greet with <b>Grüezi</b> (formal, Sie) and <b>Hoi / Sali</b> (informal). In standard German you write “Guten Tag” / “Hallo”. Switzerland does not use “ß”: heissen, Strasse, Grüsse.',
'a1-02':'In Switzerland phone numbers are usually spoken in groups: 079 123 45 67 = null sieben neun, eins zwei drei, fünfundvierzig, siebenundsechzig.',
'a1-03':'In Switzerland people say <b>das Velo</b> (Germany: das Fahrrad – bicycle) and <b>das Tram</b> (Germany: die Strassenbahn/die Tram). Both are correct Swiss Standard German.',
'a1-04':'Swiss Standard German: <b>das Poulet</b> (chicken), <b>der Rahm</b> (cream), <b>das Rüebli</b> (colloquial; standard: die Karotte – carrot), <b>der Znüni</b> (mid-morning snack; dialect). Big supermarkets: Migros, Coop. You pay in francs and rappen.',
'a1-05':'Punctuality is very important in Switzerland. If you are late, you phone: „Entschuldigung, ich komme ca. zehn Minuten später.“ SBB timetables use the 24-hour clock.',
'a1-06':'Invitations in Switzerland: people often bring something (wine, flowers, chocolate) and cancel in good time if they can’t come.',
'a1-07':'Many commuters in Switzerland travel <b>mit der S-Bahn</b> or <b>mit dem Zug</b>; they have a <b>GA</b> (general travelcard) or a <b>Halbtax</b> (half-fare card).',
'a1-08':'In Switzerland people often say <b>das Spital</b> (Germany: das Krankenhaus – hospital). You first phone your family doctor (Hausärztin / Hausarzt); in an emergency 144. Arztzeugnis = doctor’s certificate for your employer.',
'a1-09':'Swiss flat adverts: “3½ Zimmer” (3½ rooms), “NK” = Nebenkosten (service charges), “Kaution” (deposit, usually 3 months’ rent), “Waschküche” (shared laundry room with a washing rota). Rents are given gross/net.',
'a1-10':'At the municipality or in the naturalisation interview you tell your life story in the perfect tense: „Ich bin 2018 in die Schweiz gekommen und habe zuerst in Zürich gewohnt.“',
'a1-11':'Many shops in Switzerland close at 5 or 6 pm on Saturday and are closed on Sunday (exceptions: railway stations, the airport).',
'a1-12':'Popular destinations in Switzerland: Ticino (Italian-speaking), Graubünden (also Romansh), the Bernese Oberland, Valais. Switzerland has four national languages: German, French, Italian, Romansh.',
'a2-03':'Moving house in Switzerland: register with the new municipality within 14 days (Einwohnerkontrolle) and deregister with the old one. The flat is handed over with a handover report (Abnahmeprotokoll).',
'a2-06':'Switzerland in comparison: the highest mountain is the Dufourspitze (4634 m), the largest lake entirely in Switzerland is Lake Neuchâtel (Neuenburgersee), the largest city is Zurich. Bern is the federal city (Bundesstadt).',
'a2-10':'At the municipality: „Können Sie mir sagen, welche Unterlagen ich für die Anmeldung brauche?“ – typically: passport, foreigner’s permit (Ausländerausweis), tenancy agreement, proof of health insurance.',
'a2-12':'Swiss official German: <b>innert</b> 30 Tagen (= within), <b>per</b> 1. Oktober (= as of), <b>die Frist</b> (deadline), <b>die Mahnung</b> (payment reminder), <b>die Einsprache</b> (= objection/appeal).',
'a2-13':'Waste in Switzerland: fee bags (Gebührensäcke, charged in many municipalities, e.g. “Züri-Sack”); glass, PET, paper and cardboard are collected separately. Disposing of waste incorrectly can be fined.'};

formats:{
 'Wichtig: fide geht nur bis B1':{name:'Important: fide only goes up to B1',html:'<p>The <b>fide test</b> covers levels A1–B1 (spoken and written separately). It therefore <b>cannot certify B2</b>. For B2 spoken (Schwyz/Zug) you need an internationally recognised B2 certificate, e.g. <b>Goethe-Zertifikat B2</b>, <b>telc Deutsch B2</b> or <b>ÖSD Zertifikat B2</b>. For Zurich, fide (B1 spoken / A2 written) or the KDE is enough.</p><p>The Goethe-Zertifikat B1 and B2 are <b>modular</b> (reading, listening, writing and speaking can be taken separately). A possible combination would be Goethe B2 <i>speaking</i> + B1 <i>writing</i> – confirm with the canton beforehand that separate modules are accepted.</p>'},
 'Goethe-Zertifikat B2':{name:'Goethe-Zertifikat B2',html:'<table class="t"><tr><td><b>Reading</b> 65 min.</td><td>5 parts (opinions, articles, guides, rules)</td></tr><tr><td><b>Listening</b> approx. 40 min.</td><td>4 parts (announcements, interview, discussion, talk)</td></tr><tr><td><b>Writing</b> 75 min.</td><td>Part 1: forum post/opinion (about 150 words); part 2: formal message (about 100 words)</td></tr><tr><td><b>Speaking</b> approx. 15 min.</td><td>Part 1: talk (about 4 min.) + questions; part 2: discussion with a partner (about 5 min.)</td></tr></table><p>Your book <i>So geht’s zu B2</i> (Klett) is designed exactly for this format.</p>'},
 'Goethe-Zertifikat B1 (Schreiben)':{name:'Goethe-Zertifikat B1 (writing)',html:'<p>60 min., 3 parts: (1) informal e-mail about 80 words, (2) opinion post about 80 words, (3) short formal message about 40 words.</p>'},
 'fide (A1–B1)':{name:'fide (A1–B1)',html:'<p>Scenario-based, Swiss everyday life: housing, work, health, authorities, children/school, shopping, mobility. Spoken: conversation about yourself, pictures, role plays. Written: forms, short messages, listening/reading everyday texts. The app contains fide-style role plays (speaking A2/B1).</p>'},
 'Kantonaler Deutschtest Zürich (KDE)':{name:'Zurich cantonal German test (KDE)',html:'<p>Spoken (B1): introduce yourself, talk about an everyday topic. Written (A2): listening, reading, writing (3 parts). The municipality tells you the place and date.</p>'}}
};

{id:'a1-01',level:'A1',title:'Guten Tag! – sich vorstellen',cat:'conj',vocab:['a1-hallo','a1-laender'],
 topics:['Personalpronomen','sein, heissen, kommen, wohnen','W-Fragen','Aussagesatz: Verb auf Position 2'],
 source:'Netzwerk neu A1 Kap. 1 · Basic German Units 1–2, 4, 7',
 goals:['sich und andere vorstellen','nach Name, Herkunft, Wohnort, Sprachen fragen','Verben im Präsens richtig konjugieren'],
 grammar:`<h3>1. Personal pronouns & present tense</h3>
<p>German verbs change their ending for every person. Take the stem (infinitive minus <code>-en</code>) and add the ending:</p>
<table><tr><th>Person</th><th>wohnen</th><th>kommen</th><th>heissen</th><th>sein (irregular!)</th></tr>
<tr><td>ich</td><td>wohn<em>e</em></td><td>komm<em>e</em></td><td>heiss<em>e</em></td><td><em>bin</em></td></tr>
<tr><td>du</td><td>wohn<em>st</em></td><td>komm<em>st</em></td><td>heiss<em>t</em> (!)</td><td><em>bist</em></td></tr>
<tr><td>er / sie / es</td><td>wohn<em>t</em></td><td>komm<em>t</em></td><td>heiss<em>t</em></td><td><em>ist</em></td></tr>
<tr><td>wir</td><td>wohn<em>en</em></td><td>komm<em>en</em></td><td>heiss<em>en</em></td><td><em>sind</em></td></tr>
<tr><td>ihr</td><td>wohn<em>t</em></td><td>komm<em>t</em></td><td>heiss<em>t</em></td><td><em>seid</em></td></tr>
<tr><td>sie / Sie</td><td>wohn<em>en</em></td><td>komm<em>en</em></td><td>heiss<em>en</em></td><td><em>sind</em></td></tr></table>
<div class="rule"><b>du vs. Sie:</b> <i>du</i> = friends, family, children, colleagues who offered it. <i>Sie</i> (always capital S) = formal, strangers, officials, at the Gemeinde. <i>Sie</i> takes the same verb form as <i>sie</i> (they).</div>
<p>Stems ending in <b>-s, -ss, -ß, -z</b> only add <b>-t</b> for <i>du</i>: du heisst, du tanzt. Stems ending in <b>-t / -d</b> add an <b>e</b>: du arbeit<em>e</em>st, er arbeit<em>e</em>t, ihr arbeit<em>e</em>t.</p>
<h3>2. W-questions (W-Fragen)</h3>
<p>Question word on position 1, verb on position 2, then the subject:</p>
<table><tr><th>Pos. 1</th><th>Pos. 2 (Verb)</th><th>Rest</th></tr>
<tr><td>Wie</td><td>heissen</td><td>Sie?</td></tr><tr><td>Woher</td><td>kommst</td><td>du?</td></tr><tr><td>Wo</td><td>wohnen</td><td>Sie?</td></tr><tr><td>Was</td><td>sprichst</td><td>du?</td></tr><tr><td>Wer</td><td>ist</td><td>das?</td></tr></table>
<p>wer = who · was = what · wo = where · woher = where from · wohin = where to · wie = how · wann = when · warum = why · wie viel(e) = how much/many</p>
<h3>3. Statements: the verb is ALWAYS in position 2</h3>
<div class="rule">Ich <b>wohne</b> in Zürich. → In Zürich <b>wohne</b> ich. → Seit zwei Jahren <b>wohne</b> ich in Zürich.<br>Position 1 can be anything (subject, time, place) – but the conjugated verb stays in position 2, and the subject moves behind it.</div>
<div class="ch">English allows “In Zurich I live”. German does <b>not</b>: *In Zürich ich wohne* is wrong. This is the most common error at every level – including B2.</div>
<h3>4. Languages and countries</h3>
<p>Ich komme <b>aus</b> Indien / <b>aus der</b> Schweiz / <b>aus der</b> Türkei / <b>aus den</b> USA. Most countries have no article; feminine ones (die Schweiz, die Türkei, die Slowakei) and plurals (die USA, die Niederlande) do. Languages: Ich spreche Englisch, Deutsch und ein bisschen Französisch.</p>`,
 pitfalls:['<b>*Ich bin heisse…</b> → Ich heisse… / Ich bin Anna.','<b>*Woher du kommst?</b> → Woher kommst du?','<b>*Ich komme von England</b> → Ich komme aus England.','<b>*Ich komme aus Schweiz</b> → aus der Schweiz.'],
 swiss:'In der Schweiz grüsst man mit <b>Grüezi</b> (formell, Sie) und <b>Hoi / Sali</b> (informell). Im Hochdeutsch schreiben Sie „Guten Tag“ / „Hallo“. In der Schweiz wird kein „ß“ verwendet: heissen, Strasse, Grüsse.',
 examples:[['Guten Tag, ich heisse Daniel Meier.','Hello, my name is Daniel Meier.'],['Wie heissen Sie?','What is your name? (formal)'],['Woher kommst du? – Ich komme aus England.','Where are you from? – I am from England.'],['Ich wohne in Dietlikon, das ist bei Zürich.','I live in Dietlikon, that is near Zurich.'],['Welche Sprachen sprechen Sie?','Which languages do you speak?'],['Ich spreche Englisch, Deutsch und ein bisschen Italienisch.','I speak English, German and a bit of Italian.'],['Das ist Frau Keller. Sie kommt aus Bern.','This is Ms Keller. She is from Bern.'],['Wir sind neu hier.','We are new here.'],['Seid ihr aus Österreich?','Are you (pl.) from Austria?'],['Er arbeitet bei einer Bank.','He works at a bank.'],['In Zürich wohne ich seit drei Jahren.','I have been living in Zurich for three years.'],['Wie geht es Ihnen? – Danke, gut. Und Ihnen?','How are you? – Fine, thanks. And you?']],
 ex:['g|Ich ___ Thomas. (heissen)|heisse','g|Woher ___ du? (kommen)|kommst','g|Sie ___ in Zug. (wohnen, she)|wohnt','g|Wir ___ aus Indien. (sein)|sind','g|___ ihr aus Österreich? (sein)|Seid','g|Er ___ Englisch und Deutsch. (sprechen)|spricht','g|Du ___ bei Google. (arbeiten)|arbeitest','g|Wie ___ du? (heissen)|heisst','g:prep|Ich komme ___ Kanada.|aus','g:case|Ich komme aus ___ Schweiz.|der','m|Which is correct?|In Zürich wohne ich.~In Zürich ich wohne.~Wohne in Zürich ich.','m|Formal: „What is your name?“|Wie heissen Sie?~Wie heisst du?~Wie heisst Sie?','m|___ kommen Sie? – Aus Portugal.|Woher~Wo~Wohin~Wie','o:wordorder|Where do you live?|Wo wohnst du','o:wordorder|Since 2020 I have been living in Zug.|Seit 2020 wohne ich in Zug','o:wordorder|Ms Huber speaks French.|Frau Huber spricht Französisch','t|Translate: I am from England and I live in Zurich.|Ich komme aus England und ich wohne in Zürich/Ich komme aus England und wohne in Zürich','t:wordorder|Start with „Heute“: Ich arbeite in Zug.|Heute arbeite ich in Zug']},
