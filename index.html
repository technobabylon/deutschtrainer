{id:'b1-01',level:'B1',title:'Satzbau sicher: Position 1, Mittelfeld, Zeitadverbien',cat:'wordorder',vocab:['b1-medien'],
 topics:['Temporaladverbien (oft, montags, zuerst, anschliessend)','Wortstellung im Hauptsatz','Te-Ka-Mo-Lo im Mittelfeld','Position von Pronomen'],
 source:'Sicher! B1+ Grammatik L1 & L4 (Temporaladverbien, Wortstellung im Hauptsatz)',
 goals:['beliebige Satzglieder auf Position 1 stellen','das Mittelfeld natürlich ordnen','Abläufe mit zuerst/dann/anschliessend strukturieren'],
 grammar:`<h3>1. Temporaladverbien (unveränderlich)</h3>
<table><tr><th>Bedeutung</th><th>Adverbien</th><th>Beispiel</th></tr>
<tr><td>Häufigkeit</td><td>immer, meistens, oft, manchmal, selten, nie</td><td>Nuriye trifft oft Freunde online.</td></tr>
<tr><td>Wiederholung</td><td>morgens, vormittags, abends, montags, täglich, wöchentlich, monatlich</td><td>Sonntags telefoniere ich mit meiner Mutter.</td></tr>
<tr><td>Reihenfolge</td><td>zuerst, dann, danach, anschliessend, schliesslich, zum Schluss</td><td>Zuerst gehen Sie auf die Webseite, anschliessend registrieren Sie sich.</td></tr></table>
<h3>2. Das Verb steht im Hauptsatz IMMER auf Position 2</h3>
<table><tr><th>Position 1</th><th>Pos. 2</th><th>Mittelfeld</th><th>Satzende</th></tr>
<tr><td>Meine Eltern (Subjekt)</td><td>wollen</td><td>dieses Jahr Urlaub am Meer</td><td>machen.</td></tr>
<tr><td>Den Haustausch (Akk-Objekt)</td><td>findet</td><td>Lukas nicht so gut.</td><td></td></tr>
<tr><td>Mir (Dat-Objekt)</td><td>gefällt</td><td>der Zürichsee viel besser.</td><td></td></tr>
<tr><td>Letztes Jahr (Zeit)</td><td>haben</td><td>meine Eltern auch so etwas</td><td>gemacht.</td></tr>
<tr><td>Weil es lustiger ist, (Nebensatz)</td><td>bleibt</td><td>Lukas lieber zu Hause.</td><td></td></tr></table>
<h3>3. Reihenfolge im Mittelfeld</h3>
<div class="rule"><b>Pronomen zuerst</b> (Nom → Akk → Dat): Gestern hat <b>er es ihr</b> gegeben.<br>Dann Nomen: Dativ vor Akkusativ: Er hat <b>seiner Frau</b> <b>Blumen</b> geschenkt.<br>Angaben: <b>Te – Ka – Mo – Lo</b> (temporal – kausal – modal – lokal): Ich fahre <b>morgen</b> <b>wegen eines Termins</b> <b>mit dem Zug</b> <b>nach Bern</b>.</div>
<p><i>nicht</i> steht meist spät im Mittelfeld (→ B1-13).</p>
<div class="ch">Englisch: Subject – Verb – Object – Place – Time. Deutsch: Zeit meist <b>vor</b> Ort! <i>Ich gehe am Abend ins Kino</i> (nicht: ins Kino am Abend).</div>`,
 pitfalls:['<b>*Danach ich habe gegessen</b> → Danach habe ich gegessen.','<b>*Ich fahre nach Bern morgen</b> → Ich fahre morgen nach Bern.','<b>*Ich gebe ihm es</b> → Ich gebe es ihm.'],
 examples:[['Morgens lese ich die Zeitung auf dem Handy.','In the mornings I read the paper on my phone.'],['Zuerst melden Sie sich an, anschliessend bekommen Sie ein Passwort.','First you register, then you get a password.'],['Den neuen Film finde ich nicht so gut.','I don’t think the new film is that good.'],['Letzte Woche habe ich meinem Kollegen beim Umzug geholfen.','Last week I helped my colleague move.'],['Ich fahre morgen wegen einer Sitzung mit dem Zug nach Bern.','Tomorrow I’m going to Bern by train because of a meeting.'],['Hast du es ihm schon gesagt?','Have you told him yet?'],['Mir gefällt die Altstadt von Zug besonders gut.','I particularly like the old town of Zug.'],['Selten sieht man so schönes Wetter im November.','You rarely see such nice weather in November.'],['Schliesslich haben wir uns doch für das kleinere Auto entschieden.','In the end we decided on the smaller car after all.'],['Normalerweise arbeite ich montags im Homeoffice.','Normally I work from home on Mondays.']],
 ex:['t:wordorder|Beginnen Sie mit „Zuerst“: Ich lese die Nachrichten.|Zuerst lese ich die Nachrichten','t:wordorder|Beginnen Sie mit „Den Film“: Ich finde den Film langweilig.|Den Film finde ich langweilig','t:wordorder|Beginnen Sie mit „Mir“: Die Wohnung gefällt mir.|Mir gefällt die Wohnung','t:wordorder|Beginnen Sie mit „Gestern“: Wir haben lange gearbeitet.|Gestern haben wir lange gearbeitet','t:wordorder|Ordnen (Te-Ka-Mo-Lo): Ich fahre / nach Luzern / mit dem Zug / morgen.|Ich fahre morgen mit dem Zug nach Luzern','t:pron|Pronomen: Er gibt seiner Frau das Buch. (das Buch → es, seiner Frau → ihr)|Er gibt es ihr','o:wordorder|Afterwards we went to a restaurant.|Danach sind wir in ein Restaurant gegangen','o:wordorder|On Sundays I often call my parents.|Sonntags rufe ich oft meine Eltern an','o:wordorder|I’m going to the cinema with friends tonight.|Ich gehe heute Abend mit Freunden ins Kino/Heute Abend gehe ich mit Freunden ins Kino','m:wordorder|Welcher Satz ist korrekt?|Anschliessend haben wir Kaffee getrunken.~Anschliessend wir haben Kaffee getrunken.~Anschliessend haben getrunken wir Kaffee.','m:wordorder|Welcher Satz ist korrekt?|Ich habe es ihm gestern gegeben.~Ich habe ihm es gestern gegeben.~Ich habe gestern ihm es gegeben.','m:wordorder|Welcher Satz ist korrekt?|Wir treffen uns am Freitag im Café.~Wir treffen uns im Café am Freitag.~Wir uns treffen am Freitag im Café.','g:wordorder|Normalerweise ___ ich um 7 Uhr ___. (aufstehen)|stehe;auf','m:temporal|Ich gehe ___ ins Fitnessstudio. (every Monday)|montags~am Montags~Montag']},

{id:'b1-02',level:'B1',title:'Adjektivdeklination komplett',cat:'adj',vocab:['b1-charakter'],
 topics:['nach bestimmtem Artikel','nach unbestimmtem Artikel/Possessiv/kein','ohne Artikel','Plural','Genitiv'],
 source:'Sicher! B1+ Grammatik L1 · Basic German Unit 25 · Tracker B1.1 · Netzwerk neu B1 Kap. 5, 9',
 goals:['Adjektivendungen systematisch (nicht auswendig) bilden','auch ohne Artikel und im Genitiv richtig deklinieren'],
 grammar:`<h3>a) Nach bestimmtem Artikel (der, dieser, jeder, welcher, alle)</h3>
<table><tr><th></th><th>maskulin</th><th>neutral</th><th>feminin</th><th>Plural</th></tr>
<tr><td>N</td><td>der schön<em>e</em> Satz</td><td>das schön<em>e</em> Wort</td><td>die schön<em>e</em> Sprache</td><td>die schön<b>en</b> Wörter</td></tr>
<tr><td>A</td><td>den schön<b>en</b> Satz</td><td>das schön<em>e</em> Wort</td><td>die schön<em>e</em> Sprache</td><td>die schön<b>en</b> Wörter</td></tr>
<tr><td>D</td><td>dem schön<b>en</b> Satz</td><td>dem schön<b>en</b> Wort</td><td>der schön<b>en</b> Sprache</td><td>den schön<b>en</b> Wörtern</td></tr>
<tr><td>G</td><td>des schön<b>en</b> Satzes</td><td>des schön<b>en</b> Wortes</td><td>der schön<b>en</b> Sprache</td><td>der schön<b>en</b> Wörter</td></tr></table>
<h3>b) Nach ein/kein/mein (Singular) – Plural: meine/keine</h3>
<table><tr><th></th><th>maskulin</th><th>neutral</th><th>feminin</th><th>Plural</th></tr>
<tr><td>N</td><td>ein schön<em>er</em> Satz</td><td>ein schön<em>es</em> Wort</td><td>eine schön<em>e</em> Sprache</td><td>meine schön<b>en</b> Wörter</td></tr>
<tr><td>A</td><td>einen schön<b>en</b> Satz</td><td>ein schön<em>es</em> Wort</td><td>eine schön<em>e</em> Sprache</td><td>meine schön<b>en</b> Wörter</td></tr>
<tr><td>D</td><td>einem schön<b>en</b> Satz</td><td>einem schön<b>en</b> Wort</td><td>einer schön<b>en</b> Sprache</td><td>meinen schön<b>en</b> Wörtern</td></tr>
<tr><td>G</td><td>eines schön<b>en</b> Satzes</td><td>eines schön<b>en</b> Wortes</td><td>einer schön<b>en</b> Sprache</td><td>meiner schön<b>en</b> Wörter</td></tr></table>
<h3>c) Ohne Artikel – das Adjektiv übernimmt die Artikelendung</h3>
<table><tr><th></th><th>maskulin</th><th>neutral</th><th>feminin</th><th>Plural</th></tr>
<tr><td>N</td><td>schnell<em>er</em> Erfolg</td><td>lang<em>es</em> Warten</td><td>gut<em>e</em> Leistung</td><td>schön<em>e</em> Wörter</td></tr>
<tr><td>A</td><td>schnell<em>en</em> Erfolg</td><td>lang<em>es</em> Warten</td><td>gut<em>e</em> Leistung</td><td>schön<em>e</em> Wörter</td></tr>
<tr><td>D</td><td>schnell<em>em</em> Erfolg</td><td>lang<em>em</em> Warten</td><td>gut<em>er</em> Leistung</td><td>schön<em>en</em> Wörtern</td></tr>
<tr><td>G</td><td>schnell<b>en</b> Erfolgs (!)</td><td>lang<b>en</b> Wartens (!)</td><td>gut<em>er</em> Leistung</td><td>schön<em>er</em> Wörter</td></tr></table>
<div class="rule"><b>Systematik in einem Satz:</b> Das Signal des Genus/Kasus (-r, -s, -e, -m, -n) erscheint genau einmal – am Artikel <i>oder</i> am Adjektiv. Trägt der Artikel es schon, bekommt das Adjektiv nur -e/-en. Ohne Artikel trägt das Adjektiv das Signal (Ausnahme Genitiv m/n: -en, weil das Nomen schon -s hat).</div>
<p>Auch nach Zahlen und <i>viele, einige, mehrere, wenige</i>: wie ohne Artikel (zwei gut<b>e</b> Freunde, mit vielen neu<b>en</b> Ideen). Nach <i>alle</i>: wie nach bestimmtem Artikel (alle neu<b>en</b> Mitarbeiter).</p>`,
 pitfalls:['<b>*mit freundliche Grüssen</b> → mit freundlichen Grüssen (Dat Pl ohne Artikel: -en).','<b>*Sehr geehrter Damen und Herren</b> → Sehr geehrte Damen und Herren (Nom Pl ohne Artikel).','<b>*ein gutes Wein</b> → ein guter Wein.','<b>*trotz schlechtes Wetters</b> → trotz schlechten Wetters.'],
 examples:[['Sehr geehrte Damen und Herren','Dear Sir or Madam'],['Mit freundlichen Grüssen','Kind regards'],['Wir suchen einen zuverlässigen Mitarbeiter mit guten Deutschkenntnissen.','We are looking for a reliable employee with good German skills.'],['Bei schönem Wetter essen wir draussen.','In nice weather we eat outside.'],['Das ist der Vorteil eines kleinen Dorfes.','That’s the advantage of a small village.'],['Frische Milch gibt es direkt beim Bauern.','Fresh milk is available directly from the farmer.'],['Trotz starken Regens fand das Fest statt.','Despite heavy rain the festival took place.'],['Ich habe zwei ältere Brüder.','I have two older brothers.'],['Sie ist eine sehr geduldige und hilfsbereite Person.','She’s a very patient and helpful person.'],['Alle neuen Mitarbeitenden erhalten eine Einführung.','All new employees receive an induction.']],
 ex:['g:adj|Sehr ___ Damen und Herren (geehrt)|geehrte','g:adj|Mit ___ Grüssen (freundlich)|freundlichen','g:adj|Bei ___ Wetter gehen wir wandern. (gut)|gutem','g:adj|Ich trinke gern ___ Tee. (grün)|grünen','g:adj|Wir suchen eine ___ Wohnung. (günstig)|günstige','g:adj|Das ist das Auto meines ___ Bruders. (älter)|älteren','g:adj|Trotz ___ Verkehrs kamen wir pünktlich. (stark)|starken','g:adj|Er hat ___ Ideen. (interessant, kein Artikel)|interessante','g:adj|Mit ___ Hilfe hat es geklappt. (gross, kein Artikel, die Hilfe)|grosser/großer','g:adj|Ein ___ Kaffee kostet 4.50. (gross)|grosser/großer','g:adj|Ich habe mit einem ___ Kollegen gesprochen. (neu)|neuen','g:adj|Die Kinder spielen mit ___ Bällen. (bunt, kein Artikel)|bunten','g:adj|Das ist der Preis eines ___ Lebens. (gesund)|gesunden','g:adj|Wir haben zwei ___ Katzen. (klein)|kleine','m:adj|Sie hat ___ Haare.|lange~langen~langer','m:adj|Er wohnt in einem ___ Haus.|alten~altem~altes','m:adj|___ Kaffee schmeckt mir nicht.|Kalter~Kalten~Kaltes','t:adj|Translate: with best regards (freundlich)|mit freundlichen Grüssen/mit freundlichen Grüßen','t:adj|Translate: in good weather (bei)|bei gutem Wetter']},

{id:'b1-03',level:'B1',title:'Natürlich sprechen – Modalpartikeln',cat:'particle',vocab:['b1-kommunikation'],
 topics:['doch','denn','eigentlich','ja','mal','halt/eben','schon'],
 source:'Sicher! B1+ Grammatik L2 (Modalpartikeln)',
 goals:['gesprochene Sprache natürlicher klingen lassen','Bitten freundlicher machen','Untertöne in Gesprächen verstehen'],
 grammar:`<p>Modalpartikeln verändern die <b>Wirkung</b> eines Satzes auf den Zuhörer – nicht seinen Inhalt. Sie stehen im Mittelfeld (meist nach Pronomen) und sind unbetont.</p>
<table><tr><th>Partikel</th><th>Funktion</th><th>Beispiel</th></tr>
<tr><td>doch</td><td>Gegensatz / Erinnerung</td><td>Der Bus war <b>doch</b> ganz pünktlich. Das weisst du <b>doch</b>!</td></tr>
<tr><td>doch</td><td>freundliche Aufforderung</td><td>Kommen Sie <b>doch</b> bitte herein! Setz dich <b>doch</b>!</td></tr>
<tr><td>denn</td><td>Interesse in Fragen</td><td>Sind wir hier <b>denn</b> richtig? Was ist <b>denn</b> los?</td></tr>
<tr><td>eigentlich</td><td>beiläufige Frage / Abschwächung</td><td>Kennen Sie sich <b>eigentlich</b>? Es war <b>eigentlich</b> ganz einfach.</td></tr>
<tr><td>ja</td><td>Überraschung / Bekanntes</td><td>Ihre Wohnung ist <b>ja</b> toll! Sie wissen <b>ja</b>, dass …</td></tr>
<tr><td>mal</td><td>Bitte abschwächen</td><td>Möchtest du <b>mal</b> probieren? Schau <b>mal</b> auf die Uhr!</td></tr>
<tr><td>halt / eben</td><td>Resignation, nicht änderbar</td><td>Das ist <b>halt</b> so. Dann nehmen wir <b>eben</b> den nächsten Zug.</td></tr>
<tr><td>schon</td><td>Beruhigung / Einschränkung</td><td>Das klappt <b>schon</b>. Das ist <b>schon</b> gut, aber teuer.</td></tr></table>
<div class="rule">Kombination: <i>Komm <b>doch mal</b> vorbei!</i> (freundliche Einladung). Im Imperativ ohne Partikel klingt Deutsch oft zu direkt.</div>
<p>In der Prüfung (Sprechen B1/B2) wirken Partikeln natürlich – aber nicht übertreiben. In formellen Texten vermeiden.</p>`,
 pitfalls:['<b>*Doch kommen Sie herein</b> – Partikel nicht auf Position 1: Kommen Sie doch herein!','<b>denn</b> als Partikel nur in Fragen.','Partikeln nicht in formelle Briefe schreiben.'],
 examples:[['Komm doch mal vorbei, wenn du in Zug bist!','Do drop by when you’re in Zug!'],['Was ist denn passiert?','What on earth happened?'],['Wohnen Sie eigentlich schon lange hier?','Have you actually lived here long?'],['Das ist ja eine schöne Überraschung!','What a lovely surprise!'],['Kannst du mir mal kurz helfen?','Can you give me a hand for a moment?'],['Das Wetter ist halt so in der Schweiz.','That’s just how the weather is in Switzerland.'],['Keine Sorge, das schaffst du schon.','Don’t worry, you’ll manage.'],['Du weisst doch, dass ich am Montag arbeite.','You know I work on Mondays.'],['Setzen Sie sich doch!','Do sit down!'],['Wir haben eigentlich keine Zeit, aber gut.','We don’t really have time, but OK.']],
 ex:['m:particle|Freundliche Einladung: Kommen Sie ___ herein!|doch~denn~ja','m:particle|Interessierte Frage: Was machst du ___ hier?|denn~doch~mal','m:particle|Überraschung: Das ist ___ toll!|ja~denn~mal','m:particle|Bitte abschwächen: Kannst du ___ das Fenster öffnen?|mal~denn~ja','m:particle|Beiläufige Frage: Woher kommen Sie ___?|eigentlich~doch~halt','m:particle|Resignation: Das ist ___ so.|halt~denn~mal','m:particle|Erinnerung/Widerspruch: Das habe ich dir ___ gesagt!|doch~denn~eigentlich','m:particle|Beruhigung: Keine Angst, das klappt ___.|schon~denn~mal','m:particle|Welcher Satz klingt natürlich und freundlich?|Setz dich doch!~Doch setz dich!~Setz dich denn!','g:particle|Schau ___ auf die Uhr! (mal/denn)|mal','g:particle|Wo ist ___ mein Schlüssel? (denn/ja)|denn','g:particle|Ihre Kinder sind ___ schon gross! (ja/denn)|ja']},

{id:'b1-04',level:'B1',title:'Verben mit Präposition & Präpositionaladverbien',cat:'verbprep',vocab:['b1-beziehungen'],
 topics:['Verben mit Präposition + Akk','Verben mit Präposition + Dat','wo(r)- und da(r)-','Personen vs. Sachen'],
 source:'Sicher! B1+ Grammatik L2 (Verben mit Präposition, Präpositionalpronomen) – Liste ab S. 112 im Kursbuch · Netzwerk neu B1 Kap. 4',
 goals:['die 40 wichtigsten Verb-Präposition-Kombinationen beherrschen','mit darauf/daran/dafür auf Sachen und Nebensätze verweisen'],
 grammar:`<h3>a) Präposition + Akkusativ</h3>
<table><tr><td><b>an</b></td><td>denken an, sich erinnern an, glauben an, sich gewöhnen an, schreiben an</td></tr>
<tr><td><b>auf</b></td><td>achten auf, sich freuen auf, hoffen auf, warten auf, sich verlassen auf, sich vorbereiten auf, sich konzentrieren auf, aufpassen auf, reagieren auf, antworten auf</td></tr>
<tr><td><b>für</b></td><td>sich bedanken für, sich entscheiden für, sich interessieren für, sorgen für, sich engagieren für, sich entschuldigen für, ausgeben für</td></tr>
<tr><td><b>über</b></td><td>sich ärgern über, sich beschweren über, sich freuen über, nachdenken über, sprechen/diskutieren über, sich informieren über, sich wundern über</td></tr>
<tr><td><b>um</b></td><td>bitten um, sich kümmern um, sich bewerben um, es geht um, sich sorgen um</td></tr></table>
<h3>b) Präposition + Dativ</h3>
<table><tr><td><b>an</b></td><td>teilnehmen an, arbeiten an, zweifeln an, leiden an</td></tr><tr><td><b>bei</b></td><td>sich bedanken bei, helfen bei, sich bewerben bei, sich entschuldigen bei, sich melden bei</td></tr>
<tr><td><b>mit</b></td><td>anfangen/aufhören mit, sich beschäftigen mit, telefonieren mit, sich treffen mit, sich verabreden mit, vergleichen mit, zufrieden sein mit</td></tr>
<tr><td><b>nach</b></td><td>fragen nach, suchen nach, sich erkundigen nach, riechen/schmecken nach</td></tr><tr><td><b>von</b></td><td>abhängen von, erzählen von, sich erholen von, träumen von, sich verabschieden von, überzeugt sein von</td></tr>
<tr><td><b>vor</b></td><td>Angst haben vor, warnen vor, sich fürchten vor, schützen vor</td></tr><tr><td><b>zu</b></td><td>einladen zu, gratulieren zu, gehören zu, passen zu, raten zu</td></tr></table>
<h3>c) Fragen und Verweisen</h3>
<div class="rule"><b>Sachen:</b> Wo(r)+Präp / Da(r)+Präp: <i>Worauf freust du dich? – Auf das Riesenrad. Darauf freue ich mich am meisten.</i><br><b>Personen:</b> Präp + wen/wem / Präp + Pronomen: <i>Auf wen wartest du? – Auf Claudia. Auf sie muss man immer warten.</i></div>
<p>Ebenso: woran/daran, wofür/dafür, worüber/darüber, worum/darum, wobei/dabei, womit/damit, wovon/davon, wozu/dazu, wovor/davor.</p>
<p><b>da(r)- + Nebensatz/Infinitiv:</b> <i>Ich freue mich <b>darauf</b>, dass du kommst. Er hat sich <b>darüber</b> beschwert, dass es zu laut ist. Denk <b>daran</b>, den Müll rauszubringen!</i></p>`,
 pitfalls:['<b>*Ich warte für dich</b> → auf dich.','<b>*Ich interessiere mich über Politik</b> → für Politik.','<b>*Ich nehme teil an den Kurs</b> → an dem (am) Kurs (Dativ).','<b>*Ich freue mich auf das Geschenk, das ich gestern bekommen habe</b> → über (Vergangenheit).'],
 examples:[['Ich bewerbe mich um eine Stelle bei einer Versicherung.','I’m applying for a job at an insurance company.'],['Es hängt davon ab, wie viel es kostet.','It depends on how much it costs.'],['Wir haben uns über den Lärm beschwert.','We complained about the noise.'],['Kannst du dich bitte um die Blumen kümmern?','Can you please take care of the flowers?'],['Ich nehme an einem Deutschkurs teil.','I’m taking part in a German course.'],['Worüber habt ihr diskutiert? – Über die neue Steuer.','What did you discuss? – The new tax.'],['Denk bitte daran, die Rechnung zu bezahlen.','Please remember to pay the bill.'],['Auf meine Nachbarin kann ich mich immer verlassen.','I can always rely on my neighbour.'],['Ich habe mich bei ihm für die Hilfe bedankt.','I thanked him for the help.'],['Wovor hast du Angst? – Vor der mündlichen Prüfung.','What are you afraid of? – The oral exam.']],
 ex:['g:verbprep|Ich bewerbe mich ___ die Stelle.|um','g:verbprep|Wir nehmen ___ der Sitzung teil.|an','g:verbprep|Er hat sich ___ den Lärm beschwert.|über','g:verbprep|Es hängt ___ Wetter ab. (von + dem)|vom','g:verbprep|Ich kann mich ___ dich verlassen.|auf','g:verbprep|Sie hat grosse Angst ___ Spinnen.|vor','g:verbprep|Ich gratuliere dir ___ Geburtstag. (zu + dem)|zum','g:verbprep|Ich habe mich ___ der Firma beworben. (company)|bei','g:verbprep|Wir haben uns ___ das Angebot entschieden.|für','g:verbprep|___ denkst du? – An meinen Urlaub.|Woran','g:verbprep|___ wem hast du telefoniert? – Mit meiner Chefin.|Mit','g:verbprep|Freust du dich auf die Ferien? – Ja, ich freue mich sehr ___.|darauf','g:verbprep|Hast du an den Termin gedacht? – Oh nein, ___ habe ich nicht gedacht!|daran','g:verbprep|Ich erinnere mich gut ___ meinen ersten Tag in der Schweiz.|an','m:verbprep|Ich habe mich ___ ihr für das Geschenk bedankt.|bei~für~mit','m:verbprep|Er träumt ___ einem Haus am See.|von~über~auf','m:verbprep|Wir beschäftigen uns ___ dem Thema Integration.|mit~über~an','t:verbprep|Translate: What are you waiting for? (du)|Worauf wartest du','t:verbprep|Translate: I am interested in history.|Ich interessiere mich für Geschichte']},

{id:'b1-05',level:'B1',title:'Zukunft & Vermutung – werden + Infinitiv',cat:'futur',vocab:['b1-zukunft'],
 topics:['Futur I','Vermutung mit wohl/wahrscheinlich','Vorhersage, Versprechen, Plan','Präsens für Zukunft'],
 source:'Sicher! B1+ Grammatik L3 (werden + Infinitiv) · Netzwerk neu B1 Kap. 6',
 goals:['Pläne, Vorhersagen und Versprechen ausdrücken','Vermutungen formulieren'],
 grammar:`<p><b>werden</b> (Position 2) + <b>Infinitiv</b> (Ende). Futur I hat oft eine <b>modale</b> Funktion:</p>
<table><tr><th>Funktion</th><th>Beispiel</th></tr>
<tr><td>Vermutung (+ wohl, wahrscheinlich, vermutlich, sicher)</td><td>Wir <b>werden</b> (wohl) dieses Jahr wieder ans Meer <b>fahren</b>. – Er <b>wird</b> wohl krank <b>sein</b>.</td></tr>
<tr><td>Vorhersage</td><td>Das Elektroauto <b>wird</b> leise und umweltschonend <b>sein</b>. Morgen <b>wird</b> es regnen.</td></tr>
<tr><td>Versprechen</td><td>Ja, das <b>werde</b> ich <b>machen</b>. Ich <b>werde</b> dich nie vergessen.</td></tr>
<tr><td>Plan / Vorsatz</td><td>Im Sommer <b>werde</b> ich nach Australien <b>fliegen</b>. Ab morgen <b>werde</b> ich weniger Zucker essen.</td></tr></table>
<div class="rule">Für einfache Zukunft mit Zeitangabe reicht im Deutschen oft das <b>Präsens</b>: <i>Morgen fahre ich nach Bern.</i> Futur betont Vermutung, Versprechen oder Vorsatz.</div>
<table><tr><td>ich werde</td><td>du wirst</td><td>er/sie/es wird</td><td>wir werden</td><td>ihr werdet</td><td>sie/Sie werden</td></tr></table>
<p>Im Nebensatz: …, dass er morgen kommen <b>wird</b>. Mit Modalverb (selten): Ich werde das machen <b>müssen</b>.</p>
<h3>werden – drei Verwendungen</h3><p>1. Vollverb (become): Sie <b>wird</b> Ärztin. 2. Futur: Sie <b>wird</b> kommen. 3. Passiv: Das Haus <b>wird</b> renoviert.</p>`,
 pitfalls:['<b>*Ich werde morgen nach Bern fahre</b> → fahren (Infinitiv).','<b>*Ich will morgen kommen</b> ≠ I will come; will = want → Ich werde morgen kommen.','<b>*Er wird wohl krank</b> → Er wird wohl krank sein.'],
 examples:[['In zwanzig Jahren werden die meisten Autos elektrisch fahren.','In twenty years most cars will be electric.'],['Sie ist nicht da. Sie wird wohl im Stau stehen.','She isn’t here. She’s probably stuck in traffic.'],['Ich verspreche dir, ich werde pünktlich sein.','I promise you I’ll be on time.'],['Nächstes Jahr werde ich die B2-Prüfung machen.','Next year I’m going to take the B2 exam.'],['Morgen wird es in den Alpen schneien.','Tomorrow it will snow in the Alps.'],['Das wird schon klappen.','It’ll work out.'],['Der Zug wird gleich ankommen.','The train will arrive shortly.'],['Ich glaube, dass die Mieten weiter steigen werden.','I think rents will continue to rise.'],['Wirst du dich um die Einbürgerung bewerben?','Will you apply for naturalisation?'],['Wir werden sehen.','We’ll see.']],
 ex:['g:futur|Ich ___ dich morgen anrufen. (werden)|werde','g:futur|___ du mir helfen? (werden)|Wirst','g:futur|Es ___ morgen regnen. (werden)|wird','g:futur|Ihr ___ das schaffen. (werden)|werdet','g:futur|Er ist nicht hier. Er ___ wohl noch ___. (schlafen)|wird;schlafen','t:futur|Futur (Vermutung): Er ist krank. (wohl)|Er wird wohl krank sein','t:futur|Futur (Versprechen): Ich helfe dir.|Ich werde dir helfen','t:futur|Futur: Wir ziehen nach Zug.|Wir werden nach Zug ziehen','t:futur|Nebensatz: Ich glaube, … (es wird teurer werden)|Ich glaube, dass es teurer werden wird/Ich glaube, dass es teurer wird','m:futur|„I will come tomorrow.“|Ich werde morgen kommen.~Ich will morgen kommen.~Ich wird morgen kommen.','m:futur|In welchem Satz ist „werden“ Passiv?|Die Strasse wird gebaut.~Er wird Lehrer.~Er wird bald kommen.','m:futur|In welchem Satz ist „werden“ Vollverb?|Sie wird Ärztin.~Sie wird anrufen.~Sie wird angerufen.','o:futur|She will probably come later.|Sie wird wohl später kommen']},

{id:'b1-06',level:'B1',title:'Genauer beschreiben – Relativsätze',cat:'rel',vocab:['b1-dienstleistungen'],
 topics:['Relativpronomen Nom/Akk/Dat/Gen','Relativsatz mit Präposition','wo, was, wer','Stellung'],
 source:'Sicher! B1+ Grammatik L3 (Relativsätze) · Tracker B1.1 · Netzwerk neu B1 Kap. 6, 11',
 goals:['Personen und Dinge mit Relativsätzen genauer beschreiben','das Relativpronomen in jedem Kasus wählen'],
 grammar:`<p>Ein Relativsatz beschreibt ein Nomen genauer. Er ist ein Nebensatz: <b>Verb am Ende</b>, Kommas davor und danach.</p>
<div class="rule">Sie erhalten eine Rechnung. Sie können die Rechnung bargeldlos bezahlen.<br>→ Sie erhalten eine Rechnung, <b>die</b> Sie bargeldlos bezahlen <b>können</b>.</div>
<h3>Relativpronomen</h3>
<table><tr><th></th><th>maskulin</th><th>neutral</th><th>feminin</th><th>Plural</th></tr>
<tr><td>Nom</td><td>der</td><td>das</td><td>die</td><td>die</td></tr><tr><td>Akk</td><td><em>den</em></td><td>das</td><td>die</td><td>die</td></tr><tr><td>Dat</td><td><em>dem</em></td><td><em>dem</em></td><td><em>der</em></td><td><em>denen</em></td></tr><tr><td>Gen</td><td><em>dessen</em></td><td><em>dessen</em></td><td><em>deren</em></td><td><em>deren</em></td></tr></table>
<div class="rule"><b>Genus und Zahl</b> kommen vom Bezugswort, der <b>Kasus</b> kommt aus dem Relativsatz.<br>der Mann, <b>der</b> dort steht (Nom) · der Mann, <b>den</b> ich kenne (Akk: ich kenne ihn) · der Mann, <b>dem</b> ich helfe (Dat: ich helfe ihm) · der Mann, <b>dessen</b> Auto kaputt ist (Gen)</div>
<h3>Mit Präposition</h3><p>Präposition + Relativpronomen am Anfang: <i>Kontrolleure haben einen Apparat, <b>mit dem</b> Sie die Anmeldung überprüfen können. Die Kollegin, <b>auf die</b> ich warte, …</i></p>
<h3>wo, was, wer</h3>
<table><tr><td><b>wo</b></td><td>nach Ortsangaben, Städte- und Ländernamen, da/dort/überall</td><td>Zürich ist die Stadt, <b>wo</b> ich arbeite. (= in der)</td></tr>
<tr><td><b>was</b></td><td>nach etwas, nichts, alles, vieles, das; nach nominalisiertem Superlativ; bezogen auf ganzen Satz</td><td>Das ist alles, <b>was</b> ich weiss. Das ist das Beste, <b>was</b> es gibt. Er kam pünktlich, <b>was</b> mich überraschte.</td></tr>
<tr><td><b>wo(r)+Präp</b></td><td>bei was/Satzbezug mit Präposition</td><td>Es gibt etwas, <b>worüber</b> ich mit Ihnen sprechen möchte.</td></tr></table>`,
 pitfalls:['<b>*die Leute, die ich helfe</b> → denen ich helfe (helfen + Dat).','<b>*das Buch, was ich lese</b> → das ich lese (was nur nach alles/etwas/nichts…).','<b>*die Frau, mit der ich habe gesprochen</b> → mit der ich gesprochen habe.','Komma am Ende des Relativsatzes vergessen.'],
 examples:[['Das ist die Kollegin, die mir bei der Steuererklärung geholfen hat.','That’s the colleague who helped me with my tax return.'],['Der Arzt, den ich empfohlen habe, hat leider keine Termine mehr.','The doctor I recommended unfortunately has no more appointments.'],['Die Nachbarn, denen die Katze gehört, sind in den Ferien.','The neighbours who own the cat are on holiday.'],['Das ist der Vermieter, mit dem ich gestern telefoniert habe.','That’s the landlord I spoke to on the phone yesterday.'],['Ich habe einen Freund, dessen Frau aus Zug kommt.','I have a friend whose wife is from Zug.'],['Das Dorf, wo ich aufgewachsen bin, liegt am See.','The village where I grew up is on the lake.'],['Das ist alles, was ich dazu sagen kann.','That’s all I can say about it.'],['Die Bootsfahrt war etwas, was ich nie vergessen werde.','The boat trip was something I’ll never forget.'],['Er hat die Prüfung bestanden, was mich sehr freut.','He passed the exam, which makes me very happy.'],['Die Formulare, die Sie ausfüllen müssen, finden Sie online.','You’ll find the forms you have to fill in online.']],
 ex:['g:rel|Der Mann, ___ dort steht, ist mein Chef.|der','g:rel|Die Frau, ___ ich gestern getroffen habe, heisst Eva.|die','g:rel|Der Zug, ___ ich nehme, fährt um 8 Uhr.|den','g:rel|Das Kind, ___ ich helfe, ist sieben.|dem','g:rel|Die Leute, ___ ich danke, waren sehr nett.|denen','g:rel|Die Nachbarin, ___ Hund immer bellt, ist nett.|deren','g:rel|Der Kollege, ___ Auto kaputt ist, kommt mit dem Bus.|dessen','g:rel|Die Firma, bei ___ ich arbeite, ist international.|der','g:rel|Der Kurs, an ___ ich teilnehme, ist sehr gut.|dem','g:rel|Das ist das Beste, ___ ich je gegessen habe.|was','g:rel|Luzern ist die Stadt, ___ ich geboren bin.|wo/in der','g:rel|Es gibt nichts, ___ ich nicht verstehe.|was','t:rel|Verbinden: Das ist der Vermieter. Ich habe mit ihm gesprochen.|Das ist der Vermieter, mit dem ich gesprochen habe','t:rel|Verbinden: Ich kenne eine Frau. Ihre Tochter spielt Klavier.|Ich kenne eine Frau, deren Tochter Klavier spielt','t:rel|Verbinden: Die Wohnung ist zu teuer. Wir haben sie besichtigt.|Die Wohnung, die wir besichtigt haben, ist zu teuer','m:rel|Die Kinder, mit ___ ich spiele, sind laut.|denen~den~die','m:rel|Das ist etwas, ___ mich interessiert.|was~das~welches']},

{id:'b1-07',level:'B1',title:'Wohnen & Tauschen – Wortbildung, (nicht) brauchen zu',cat:'nominal',vocab:['b1-wohnen'],
 topics:['Komposita: Adjektiv/Nomen/Verb + Nomen','Nachsilben -er, -ler, -ent, -chen, -ung, -heit, -keit, -ei, -ie, -ik','nicht/nur brauchen … zu'],
 source:'Sicher! B1+ Grammatik L4 & L7 (Wortbildung Nomen, nicht/nur brauchen … zu, Nachsilben) · Netzwerk neu B1 Kap. 8',
 goals:['den Artikel neuer Wörter ableiten','lange Komposita verstehen','„nicht müssen“ elegant mit „nicht brauchen zu“ ausdrücken'],
 grammar:`<h3>1. Zusammengesetzte Nomen</h3><p>Das <b>letzte</b> Wort bestimmt Artikel und Bedeutung:</p>
<table><tr><td>Adjektiv + Nomen</td><td>hoch + das Bett → <b>das</b> Hochbett</td></tr><tr><td>Nomen + Nomen</td><td>das Sofa + der Kasten → <b>der</b> Sofakasten</td></tr><tr><td>Verb + Nomen</td><td>klapp(en) + der Tisch → <b>der</b> Klapptisch</td></tr></table>
<p>Oft mit Fugen-s: die Wohnung<b>s</b>suche, die Arbeit<b>s</b>zeit (nach -ung, -heit, -keit, -ion, -tät, -ling, -schaft).</p>
<h3>2. Nachsilben verraten den Artikel</h3>
<table><tr><th>der</th><th>das</th><th>die</th></tr><tr><td>-er (Personen): Banker, Spieler<br>-ler: Händler · -ent: Student, Präsident · -ant: Praktikant · -ling · -ismus</td><td>-chen: Päckchen, Brötchen<br>-lein · -ment · -um</td><td>-ung: Quittung, Rechnung · -heit: Sicherheit · -keit: Möglichkeit · -ik: Elektronik · -ei: Bäckerei · -ie: Drogerie · -ion · -tät · -schaft</td></tr></table>
<p>Achtung: -er bei Sachen nicht immer der: <i>das Zimmer, das Wetter, das Fenster</i>.</p>
<h3>3. nicht/nur brauchen … zu</h3>
<div class="rule"><b>nicht brauchen … zu</b> = nicht müssen: Man <b>braucht</b> für die Unterkunft <b>nicht zu</b> bezahlen. = Man muss … nicht bezahlen.<br><b>kein- brauchen … zu</b>: Sie brauchen <b>keinen</b> Cent <b>zu</b> bezahlen.<br><b>nur brauchen … zu</b> = nur müssen: Sie <b>brauchen nur</b> einen Tauschpartner <b>zu</b> finden.</div>
<p>brauchen + Objekt (ohne zu): Ich brauche eine grössere Wohnung.</p>`,
 pitfalls:['<b>*die Haustür → das Haustür</b> – letzter Teil bestimmt: die Tür → die Haustür.','<b>*Du brauchst nicht kommen</b> (umgangssprachlich) → Du brauchst nicht zu kommen.','<b>*Du brauchst zu kommen</b> (positiv ohne nur) → Du musst kommen.'],
 examples:[['Die Wohnungssuche in Zürich ist schwierig.','Looking for a flat in Zurich is difficult.'],['Beim Haustausch braucht man keine Miete zu bezahlen.','With a house swap you don’t have to pay rent.'],['Sie brauchen nur das Formular auszufüllen.','You only need to fill in the form.'],['Du brauchst nicht zu warten, ich komme später.','You don’t need to wait, I’ll come later.'],['Wir haben ein Klappbett für Gäste.','We have a folding bed for guests.'],['Die Nebenkostenabrechnung kommt einmal pro Jahr.','The utilities statement comes once a year.'],['Der Mieter muss die Kaution bei der Bank hinterlegen.','The tenant has to deposit the security at the bank.'],['In der Bäckerei gibt es frische Brötchen.','There are fresh rolls at the bakery.'],['Die Sicherheit der Kinder ist am wichtigsten.','The children’s safety is the most important thing.'],['Ich brauche eine Quittung für die Steuererklärung.','I need a receipt for my tax return.']],
 ex:['m:gender|___ Haustür|die~das~der','m:gender|___ Schreibtisch|der~das~die','m:gender|___ Rechnung|die~der~das','m:gender|___ Möglichkeit|die~der~das','m:gender|___ Päckchen|das~der~die','m:gender|___ Praktikant|der~das~die','m:gender|___ Bäckerei|die~das~der','m:gender|___ Wohnungsschlüssel|der~die~das','m:gender|___ Mehrheit|die~das~der','m:gender|___ Zimmer|das~der~die','g:inf|Sie ___ nicht ___ kommen. (= müssen nicht)|brauchen;zu','g:inf|Du brauchst nur hier ___. (unterschreiben)|zu unterschreiben','t:inf|Umformen mit „brauchen“: Sie müssen nichts bezahlen.|Sie brauchen nichts zu bezahlen','t:inf|Umformen mit „brauchen“: Du musst nur anrufen.|Du brauchst nur anzurufen','t:nominal|Bilden Sie ein Kompositum: die Arbeit + die Zeit|die Arbeitszeit','t:nominal|Bilden Sie ein Kompositum: wohnen + das Zimmer|das Wohnzimmer']},

{id:'b1-08',level:'B1',title:'Zeit genau ausdrücken – temporale Präpositionen & Nebensätze',cat:'conn',vocab:['b1-arbeitswelt'],
 topics:['gegen, seit, von … an, ausserhalb, innerhalb, während','als, wenn, während, bevor, nachdem, seit(dem), bis, sobald','Zeitenfolge mit nachdem'],
 source:'Sicher! B1+ Grammatik L4 (Temporale Präpositionen) · Tracker B1.1 (Subordinate clauses II) · Netzwerk neu B1 Kap. 3, 7',
 goals:['zeitliche Abläufe präzise beschreiben','nachdem mit der richtigen Zeitform verwenden'],
 grammar:`<h3>1. Temporale Präpositionen</h3>
<table><tr><th>Präposition</th><th>Bedeutung</th><th>Beispiel</th></tr><tr><td>gegen + Akk</td><td>ungefähr (Zeitpunkt)</td><td>Sie gehen gegen 20 Uhr ins Bett.</td></tr><tr><td>seit + Dat</td><td>begann in der Vergangenheit, dauert an</td><td>Er wohnt seit drei Jahren in der WG.</td></tr><tr><td>von … an + Dat</td><td>ab diesem Zeitpunkt</td><td>von nächstem Montag an</td></tr><tr><td>ausserhalb + Gen</td><td>nicht in einem Zeitabschnitt</td><td>ausserhalb der Öffnungszeiten</td></tr><tr><td>innerhalb + Gen</td><td>in einem Zeitabschnitt</td><td>innerhalb des letzten Jahres</td></tr><tr><td>während + Gen</td><td>gleichzeitig</td><td>während des Essens</td></tr></table>
<h3>2. Temporale Nebensätze (Verb am Ende)</h3>
<table><tr><th>Konnektor</th><th>Bedeutung</th><th>Beispiel</th></tr>
<tr><td>als</td><td>einmal, Vergangenheit</td><td>Als ich in die Schweiz kam, war alles neu.</td></tr>
<tr><td>wenn</td><td>wiederholt / Gegenwart, Zukunft</td><td>Wenn ich nach Hause komme, koche ich.</td></tr>
<tr><td>während</td><td>gleichzeitig</td><td>Während ich koche, hört mein Mann Radio.</td></tr>
<tr><td>bevor</td><td>vorher</td><td>Bevor du gehst, mach bitte das Licht aus.</td></tr>
<tr><td>nachdem</td><td>nachher (Zeitenverschiebung!)</td><td>Nachdem ich gegessen <b>hatte</b>, <b>ging</b> ich spazieren.</td></tr>
<tr><td>seit(dem)</td><td>Beginn bis jetzt</td><td>Seitdem ich hier wohne, fahre ich Velo.</td></tr>
<tr><td>bis</td><td>Endpunkt</td><td>Warte, bis ich zurückkomme.</td></tr>
<tr><td>sobald</td><td>direkt nachdem</td><td>Sobald ich Bescheid weiss, melde ich mich.</td></tr></table>
<div class="rule"><b>nachdem</b>: Nebensatz eine Zeitstufe früher.<br>Hauptsatz Präsens/Futur → Nebensatz <b>Perfekt</b>: Nachdem ich die Arbeit beendet <b>habe</b>, gehe ich nach Hause.<br>Hauptsatz Präteritum/Perfekt → Nebensatz <b>Plusquamperfekt</b> (hatte/war + Partizip): Nachdem er angekommen <b>war</b>, rief er an.</div>`,
 pitfalls:['<b>*Wenn ich gestern nach Hause kam</b> → Als ich gestern …','<b>*Nachdem ich esse, gehe ich</b> → Nachdem ich gegessen habe, …','<b>*Während dem Essen</b> (umgangssprachlich) → während des Essens.','<b>*bevor zu gehen</b> → bevor du gehst / vor dem Gehen.'],
 examples:[['Als ich meine erste Stelle in Zürich antrat, kannte ich niemanden.','When I started my first job in Zurich I didn’t know anyone.'],['Nachdem ich die Unterlagen eingereicht hatte, wartete ich drei Monate.','After I had submitted the documents I waited three months.'],['Bevor Sie unterschreiben, lesen Sie den Vertrag genau.','Before you sign, read the contract carefully.'],['Während ich telefonierte, klingelte es an der Tür.','While I was on the phone, the doorbell rang.'],['Seitdem ich Deutsch lerne, verstehe ich die Nachrichten besser.','Since I’ve been learning German I understand the news better.'],['Sobald die Bewilligung da ist, kann ich anfangen.','As soon as the permit arrives I can start.'],['Bitte warten Sie, bis Sie aufgerufen werden.','Please wait until you are called.'],['Ausserhalb der Öffnungszeiten erreichen Sie uns per E-Mail.','Outside opening hours you can reach us by email.'],['Ich komme gegen 18 Uhr nach Hause.','I’ll get home around 6 pm.'],['Von nächstem Monat an arbeite ich Teilzeit.','From next month I’m working part time.']],
 ex:['g:conn|___ ich ein Kind war, lebten wir in London.|Als','g:conn|___ ich Zeit habe, lese ich Zeitung.|Wenn','g:conn|___ du losfährst, ruf mich bitte an. (before)|Bevor','g:conn|___ er gegessen hatte, ging er spazieren. (after)|Nachdem','g:conn|___ ich koche, deckst du den Tisch. (while)|Während','g:conn|Warte hier, ___ ich zurückkomme. (until)|bis','g:conn|___ ich hier wohne, fahre ich mehr Velo. (since)|Seit/Seitdem','g:conn|___ ich die Antwort habe, melde ich mich. (as soon as)|Sobald','g:perfekt|Nachdem er die Prüfung bestanden ___, feierte er. (haben)|hatte','g:perfekt|Nachdem wir angekommen ___, haben wir gegessen. (sein)|waren','g:temporal|___ des Kurses darf man nicht telefonieren. (during)|Während','g:temporal|Ich komme ___ 20 Uhr. (approx.)|gegen','m:conn|___ ich gestern nach Hause kam, war niemand da.|Als~Wenn~Wann','m:perfekt|Nachdem ich gefrühstückt ___, gehe ich zur Arbeit.|habe~hatte~hätte','t:conn|Verbinden mit „bevor“: Ich gehe ins Bett. Ich putze mir die Zähne. (Zähne zuerst)|Bevor ich ins Bett gehe, putze ich mir die Zähne/Ich putze mir die Zähne, bevor ich ins Bett gehe','t:conn|Verbinden mit „während“: Ich fahre Zug. Ich lese.|Während ich Zug fahre, lese ich/Ich lese, während ich Zug fahre']},

{id:'b1-09',level:'B1',title:'Wenn ich könnte … – Konjunktiv II: Wünsche & Bedingungen',cat:'konj2',vocab:['b1-traeume'],
 topics:['irreale Wünsche','irreale Bedingungen (wenn … würde)','Formen: würde, hätte, wäre, könnte, käme, ginge, wüsste','Konjunktiv II der Vergangenheit','uneingeleiteter Bedingungssatz'],
 source:'Sicher! B1+ Grammatik L5 (Konjunktiv II) · Tracker B1.2 · Netzwerk neu B1 Kap. 4',
 goals:['Wünsche und irreale Situationen ausdrücken','über verpasste Chancen sprechen (hätte … sollen)'],
 grammar:`<div class="rule">Wenn ich gut singen <b>könnte</b>, <b>würde</b> ich eine Band gründen. (→ Aber ich kann nicht gut singen.)</div>
<h3>a) Formen (Präsens)</h3><p>Meist <b>würde + Infinitiv</b>. Bei haben, sein, Modalverben und einigen häufigen Verben (kommen, gehen, wissen, geben, finden) ist die Originalform üblicher. Sie wird aus dem Präteritum abgeleitet (kam → käme).</p>
<table><tr><th></th><th>werden</th><th>haben</th><th>sein</th><th>müssen</th><th>kommen</th><th>gehen</th><th>wissen</th></tr>
<tr><td>ich</td><td>würde</td><td>hätte</td><td>wäre</td><td>müsste</td><td>käme</td><td>ginge</td><td>wüsste</td></tr><tr><td>du</td><td>würdest</td><td>hättest</td><td>wär(e)st</td><td>müsstest</td><td>käm(e)st</td><td>ging(e)st</td><td>wüsstest</td></tr><tr><td>er/sie/es</td><td>würde</td><td>hätte</td><td>wäre</td><td>müsste</td><td>käme</td><td>ginge</td><td>wüsste</td></tr><tr><td>wir/sie/Sie</td><td>würden</td><td>hätten</td><td>wären</td><td>müssten</td><td>kämen</td><td>gingen</td><td>wüssten</td></tr><tr><td>ihr</td><td>würdet</td><td>hättet</td><td>wärt</td><td>müsstet</td><td>käm(e)t</td><td>ging(e)t</td><td>wüsstet</td></tr></table>
<p>Ebenso: können → könnte, dürfen → dürfte, sollen → sollte, wollen → wollte (= Präteritum!), mögen → möchte.</p>
<h3>b) Wortstellung</h3><table><tr><td>Hauptsatz vor wenn-Satz</td><td>Ich würde eine Band gründen, wenn ich gut singen könnte.</td></tr><tr><td>wenn-Satz vor Hauptsatz</td><td>Wenn ich gut singen könnte, würde ich eine Band gründen.</td></tr><tr><td>ohne wenn (Verb zuerst)</td><td>Könnte ich gut singen, würde ich eine Band gründen.</td></tr></table>
<h3>c) Wünsche</h3><p>Wenn ich doch mehr Zeit <b>hätte</b>! · Ich <b>wünschte</b>, ich <b>wäre</b> schon B2. · <b>Hätte</b> ich nur früher angefangen!</p>
<h3>d) Vergangenheit: hätte/wäre + Partizip II</h3><div class="rule">Wenn ich das <b>gewusst hätte</b>, <b>wäre</b> ich früher <b>gekommen</b>. – Mit Modalverb: Ich <b>hätte</b> mehr lernen <b>sollen</b>. (Doppelinfinitiv)</div>`,
 pitfalls:['<b>*Wenn ich würde Zeit haben</b> → Wenn ich Zeit hätte.','<b>*Wenn ich reich wäre, ich würde …</b> → würde ich …','<b>*Ich hätte mehr gelernt sollen</b> → Ich hätte mehr lernen sollen.','<b>*ich wollte</b> (Präteritum) für Wunsch → ich möchte / ich würde gern.'],
 examples:[['Wenn ich mehr Zeit hätte, würde ich öfter wandern gehen.','If I had more time I’d go hiking more often.'],['Wenn ich du wäre, würde ich die Stelle annehmen.','If I were you I’d accept the job.'],['Hätte ich das gewusst, wäre ich zu Hause geblieben.','Had I known that, I’d have stayed at home.'],['Ich wünschte, ich könnte schon fliessend Deutsch.','I wish I could already speak fluent German.'],['Was würdest du machen, wenn du im Lotto gewinnen würdest?','What would you do if you won the lottery?'],['Wenn der Zug pünktlich gewesen wäre, hätte ich den Anschluss erreicht.','If the train had been on time I’d have made the connection.'],['Ich hätte früher mit Deutsch anfangen sollen.','I should have started German earlier.'],['Wenn es nicht so teuer wäre, würden wir in Zug wohnen.','If it weren’t so expensive we would live in Zug.'],['Wüsstest du, wen ich fragen könnte?','Would you know whom I could ask?'],['Ohne deine Hilfe hätte ich das nicht geschafft.','Without your help I wouldn’t have managed.']],
 ex:['g:konj2|Wenn ich Zeit ___, würde ich kommen. (haben)|hätte','g:konj2|Wenn ich reich ___, würde ich reisen. (sein)|wäre','g:konj2|Wenn er ___, würde er dich anrufen. (können)|könnte','g:konj2|Wenn ich das ___, würde ich es dir sagen. (wissen)|wüsste','g:konj2|Ich ___ gern länger bleiben. (werden)|würde','g:konj2|Wenn du früher ___, hättest du ihn gesehen. (kommen, Vergangenheit: … gekommen …)|gekommen wärst','t:konj2|Irreal: Ich habe kein Auto. Ich fahre nicht in die Berge.|Wenn ich ein Auto hätte, würde ich in die Berge fahren','t:konj2|Irreal: Es regnet. Wir gehen nicht schwimmen.|Wenn es nicht regnen würde, würden wir schwimmen gehen/Wenn es nicht regnete, würden wir schwimmen gehen/Wenn es nicht regnen würde, gingen wir schwimmen','t:konj2|Wunsch: Ich spreche nicht perfekt Deutsch. (Wenn … doch)|Wenn ich doch perfekt Deutsch sprechen würde/Wenn ich doch perfekt Deutsch sprechen könnte/Wenn ich nur perfekt Deutsch sprechen könnte/Wenn ich doch nur perfekt Deutsch sprechen könnte','t:konj2|Vergangenheit: Ich habe es nicht gewusst. Ich bin nicht gekommen.|Wenn ich es gewusst hätte, wäre ich gekommen','t:konj2|Ohne wenn: Wenn ich mehr Geld hätte, würde ich ein Haus kaufen.|Hätte ich mehr Geld, würde ich ein Haus kaufen','t:konj2|Bedauern (sollen): Ich habe nicht mehr gelernt.|Ich hätte mehr lernen sollen','m:konj2|Wenn ich du ___, würde ich das nicht tun.|wäre~würde~hätte','m:konj2|Ich ___ das nicht gemacht. (would not have done)|hätte~wäre~würde','m:konj2|Wenn sie gekommen ___, hätten wir gefeiert.|wäre~hätte~würde']},

{id:'b1-10',level:'B1',title:'Ziele & Absichten – damit, um … zu, zum + Infinitiv',cat:'inf',vocab:['b1-bewerbung'],
 topics:['Finalsätze mit damit','um … zu (gleiches Subjekt)','zum + nominalisierter Infinitiv','ohne … zu / (an)statt … zu'],
 source:'Sicher! B1+ Grammatik L5 (Finalsätze) · Tracker B1.2 (Infinitive clauses) · Netzwerk neu B1 Kap. 5',
 goals:['Ziele und Zwecke ausdrücken','um … zu und damit richtig unterscheiden'],
 grammar:`<h3>a) damit – Nebensatz (Verb am Ende)</h3>
<div class="rule">Die Bewerber müssen sich kurzfassen, <b>damit</b> die Arbeitgeber viele Kandidaten kennenlernen <b>können</b>.<br>Damit … steht auch vorne: <b>Damit</b> die Arbeitgeber viele Kandidaten kennenlernen können, <b>müssen</b> sich die Bewerber kurzfassen.</div>
<p>Die Modalverben <i>wollen, möchten, sollen</i> kommen in Finalsätzen nicht vor – sie werden oft durch <i>können</i> ersetzt.</p>
<h3>b) um … zu + Infinitiv – nur bei gleichem Subjekt</h3>
<div class="rule">Die Bewerber haben höchstens fünf Minuten, <b>um</b> ihren Werdegang <b>zu erzählen</b>. (Subjekt beider Teile: die Bewerber)<br>Verschiedene Subjekte → <b>damit</b>: Ich erkläre es langsam, <b>damit</b> <i>du</i> es verstehst.</div>
<h3>c) zum + nominalisierter Infinitiv</h3><p>Man braucht Papier und Stifte, um zu zeichnen. → <b>Zum Zeichnen</b> braucht man Papier und Stifte.</p>
<h3>d) ohne … zu / (an)statt … zu</h3><p>Er ging, <b>ohne</b> sich <b>zu</b> verabschieden. <b>Statt</b> den Bus <b>zu</b> nehmen, fahre ich Velo. (Bei verschiedenen Subjekten: ohne dass / statt dass.)</p>`,
 pitfalls:['<b>*Ich lerne Deutsch, um ich mich einbürgern lassen kann</b> → um mich einbürgern lassen zu können / damit ich mich einbürgern lassen kann.','<b>*um zu arbeiten in Zürich</b> → um in Zürich zu arbeiten.','<b>*Ich spare, damit ich will ein Haus kaufen</b> → damit ich ein Haus kaufen kann.'],
 examples:[['Ich lerne Deutsch, um mich einbürgern zu lassen.','I’m learning German in order to become naturalised.'],['Ich spreche langsam, damit alle mich verstehen.','I speak slowly so that everyone understands me.'],['Um die Stelle zu bekommen, braucht man gute Deutschkenntnisse.','To get the job you need good German.'],['Zum Wandern braucht man gute Schuhe.','For hiking you need good shoes.'],['Er hat die Wohnung gekündigt, ohne einen Nachmieter zu suchen.','He gave notice on the flat without looking for a new tenant.'],['Statt mit dem Auto zu fahren, nehme ich den Zug.','Instead of driving I take the train.'],['Wir sparen, damit unsere Kinder später studieren können.','We are saving so our children can study later.'],['Ich habe angerufen, um einen Termin zu vereinbaren.','I called to make an appointment.'],['Damit Sie Ihre Bewilligung rechtzeitig bekommen, melden Sie sich früh an.','So that you get your permit on time, register early.'],['Zum Bezahlen brauchen Sie die Kundennummer.','To pay you need the customer number.']],
 ex:['t:inf|um … zu: Ich gehe zur Bank. Ich will Geld abheben.|Ich gehe zur Bank, um Geld abzuheben','t:inf|um … zu: Sie lernt Deutsch. Sie will in Zug arbeiten.|Sie lernt Deutsch, um in Zug zu arbeiten','t:conn|damit: Ich erkläre es langsam. Du verstehst es.|Ich erkläre es langsam, damit du es verstehst','t:conn|damit: Wir sprechen leise. Das Baby schläft.|Wir sprechen leise, damit das Baby schläft','t:inf|zum + Infinitiv: Um zu kochen, brauche ich einen Topf.|Zum Kochen brauche ich einen Topf','t:inf|ohne … zu: Er geht. Er sagt nicht Tschüss.|Er geht, ohne Tschüss zu sagen','m:conn|Ich spare Geld, ___ meine Kinder studieren können.|damit~um~zu','m:inf|Ich spare Geld, ___ ein Auto zu kaufen.|um~damit~für','m:inf|Er lernt viel, ___ er die Prüfung besteht.|damit~um~zum','g:inf|Ich rufe an, um einen Termin ___. (vereinbaren)|zu vereinbaren','g:inf|Sie fährt nach Bern, um ihre Freundin ___. (besuchen)|zu besuchen','g:inf|Ich bin früh aufgestanden, um den Zug nicht ___. (verpassen)|zu verpassen','g:inf|Er kam, um mich ___. (abholen)|abzuholen','o:inf|I’m learning German to pass the exam.|Ich lerne Deutsch, um die Prüfung zu bestehen']},

{id:'b1-11',level:'B1',title:'Begründen & widersprechen – kausal & konzessiv, Negation',cat:'conn',vocab:['b1-musik'],
 topics:['Negationswörter: nichts, nie, niemand, nirgends','kausal: denn, weil, da, darum, deshalb, deswegen, daher, nämlich, wegen','konzessiv: obwohl, trotzdem, aber, trotz'],
 source:'Sicher! B1+ Grammatik L6 (Negationswörter, kausale & konzessive Zusammenhänge) · Tracker B1.2 (Connectors) · Netzwerk neu B1 Kap. 1, 2',
 goals:['Argumente begründen','Gegensätze ausdrücken','Konnektoren auf Position 0/1/Nebensatz sicher stellen'],
 grammar:`<h3>1. Negationswörter</h3><p><b>nichts</b> (≠ etwas), <b>nie/niemals</b> (≠ immer), <b>niemand</b> (≠ jemand), <b>nirgends/nirgendwo</b> (≠ irgendwo), <b>kein</b> (≠ ein). Keine doppelte Verneinung: <i>Ich habe <b>nichts</b> gesehen</i> (nicht: *nicht nichts).</p>
<h3>2. Wortstellung nach Konnektoren</h3>
<table><tr><th></th><th>Position 0 (Verb Pos. 2)</th><th>Position 1 oder 3 (Verb direkt nach Konnektor auf Pos. 1)</th><th>Nebensatz (Verb am Ende)</th><th>Präposition</th></tr>
<tr><td>kausal (Grund)</td><td>denn</td><td>darum, deswegen, deshalb, daher, aus diesem Grund; <b>nämlich</b> (nur Pos. 3+)</td><td>weil, da</td><td>wegen + Gen</td></tr>
<tr><td>konzessiv (Gegengrund)</td><td>aber</td><td>trotzdem, dennoch</td><td>obwohl</td><td>trotz + Gen</td></tr></table>
<div class="rule">Der Sänger ist erkrankt, <b>darum wird</b> das Konzert verschoben. / Das Konzert wird <b>darum</b> verschoben.<br>Das Konzert wird verschoben. Der Sänger ist <b>nämlich</b> erkrankt.<br>Wir hatten schlechte Plätze. <b>Trotzdem waren</b> wir begeistert. / Wir waren <b>trotzdem</b> begeistert.<br><b>Obwohl</b> wir schlechte Plätze <b>hatten</b>, <b>waren</b> wir begeistert.<br><b>Wegen</b> der Krankheit des Sängers … / <b>Trotz</b> der schlechten Plätze …</div>
<p><b>da</b> vs. <b>weil</b>: <i>da</i> = bekannter Grund, oft am Satzanfang (formell): <i>Da Sie die Frist verpasst haben, …</i></p>`,
 pitfalls:['<b>*Deshalb ich bleibe zu Hause</b> → Deshalb bleibe ich zu Hause.','<b>*Nämlich ist er krank</b> → Er ist nämlich krank.','<b>*Obwohl es regnet, wir gehen spazieren</b> → gehen wir spazieren.','<b>*trotzdem es regnet</b> (umgangssprachlich) → obwohl es regnet.'],
 examples:[['Der Zug hatte Verspätung, deshalb habe ich den Anschluss verpasst.','The train was late, so I missed my connection.'],['Ich bleibe heute zu Hause. Ich bin nämlich erkältet.','I’m staying home today. You see, I have a cold.'],['Obwohl die Wohnung teuer ist, haben wir sie genommen.','Although the flat is expensive, we took it.'],['Die Wohnung ist teuer. Trotzdem haben wir sie genommen.','The flat is expensive. We took it anyway.'],['Wegen des Streiks fallen viele Flüge aus.','Because of the strike many flights are cancelled.'],['Trotz des schlechten Wetters fand das Fest statt.','Despite the bad weather the festival took place.'],['Da Sie die Frist verpasst haben, müssen Sie eine Gebühr bezahlen.','As you missed the deadline you have to pay a fee.'],['Niemand hat mir gesagt, dass der Kurs ausfällt.','Nobody told me that the course was cancelled.'],['Ich habe den Schlüssel nirgends gefunden.','I couldn’t find the key anywhere.'],['Er war nie in Graubünden, obwohl er seit zehn Jahren hier lebt.','He has never been to Graubünden, although he has lived here for ten years.']],
 ex:['t:conn|Verbinden mit „deshalb“: Ich bin krank. Ich komme nicht.|Ich bin krank, deshalb komme ich nicht/Ich bin krank. Deshalb komme ich nicht','t:conn|Verbinden mit „obwohl“: Es regnet. Wir gehen spazieren.|Obwohl es regnet, gehen wir spazieren/Wir gehen spazieren, obwohl es regnet','t:conn|Verbinden mit „trotzdem“: Es regnet. Wir gehen spazieren.|Es regnet, trotzdem gehen wir spazieren/Es regnet. Trotzdem gehen wir spazieren','t:conn|Mit „nämlich“: Ich komme nicht. (Ich muss arbeiten.)|Ich komme nicht. Ich muss nämlich arbeiten','t:conn|Mit „wegen“: Weil es regnet, bleiben wir zu Hause. (der Regen)|Wegen des Regens bleiben wir zu Hause','t:conn|Mit „trotz“: Obwohl es kalt war, gingen wir baden. (die Kälte)|Trotz der Kälte gingen wir baden','m:conn|Ich habe Hunger, ___ esse ich jetzt.|deshalb~weil~obwohl','m:conn|___ er viel verdient, ist er nicht zufrieden.|Obwohl~Trotzdem~Deshalb','m:conn|Er kommt nicht, ___ er ist krank.|denn~weil~deshalb','m:wordorder|Welcher Satz ist korrekt?|Trotzdem sind wir gekommen.~Trotzdem wir sind gekommen.~Trotzdem wir gekommen sind.','g:neg|Hast du etwas gehört? – Nein, ich habe ___ gehört.|nichts','g:neg|Ist jemand zu Hause? – Nein, ___ ist zu Hause.|niemand','g:neg|Warst du schon mal in Island? – Nein, ich war ___ in Island.|nie/noch nie','g:neg|Ich finde meinen Schlüssel ___. (nowhere)|nirgends/nirgendwo']},

{id:'b1-12',level:'B1',title:'Prozesse beschreiben – Passiv komplett',cat:'passiv',vocab:['b1-wirtschaft'],
 topics:['Passiv Präsens, Präteritum, Perfekt','Passiv mit Modalverb','von/durch','Wortbildung: Nachsilben (Wiederholung)'],
 source:'Sicher! B1+ Grammatik L7 (Passiv) · Tracker B1.2 · Netzwerk neu B1 Kap. 10',
 goals:['Vorgänge, Regeln und Nachrichten im Passiv verstehen und formulieren'],
 grammar:`<h3>a) Funktion</h3><p>Man benutzt das Passiv, wenn die Tätigkeit wichtiger ist als die Person: <i>Aktiv: Zuerst verteilt der Spielleiter das Startkapital. → Passiv: Das Startkapital wird (vom Spielleiter) zuerst verteilt.</i></p>
<h3>b) Handelnde Person: von + Dativ; Ursache/Mittel: durch + Akkusativ</h3><p>Das Startkapital wird <b>vom</b> Spielleiter verteilt. Das Haus wurde <b>durch</b> einen Sturm beschädigt.</p>
<h3>c) Zeitformen</h3>
<table><tr><th></th><th>Position 2</th><th>Satzende</th></tr><tr><td>Präsens</td><td>Das Startkapital <b>wird</b> zuerst</td><td><b>verteilt</b>.</td></tr><tr><td>Präteritum</td><td>Das Startkapital <b>wurde</b> zuerst</td><td><b>verteilt</b>.</td></tr><tr><td>Perfekt</td><td>Das Startkapital <b>ist</b> zuerst</td><td><b>verteilt worden</b>.</td></tr><tr><td>Plusquamperfekt</td><td>Das Startkapital <b>war</b> zuerst</td><td><b>verteilt worden</b>.</td></tr></table>
<div class="warn">Perfekt Passiv: <b>worden</b> (nicht <i>geworden</i>)!</div>
<h3>d) Passiv mit Modalverb</h3><p>Modalverb + Partizip II + <b>werden</b>: Die Entscheidungen <b>müssen</b> genau <b>geprüft werden</b>. Eine Liste <b>kann</b> geschrieben werden. Präteritum: Die Rechnung <b>musste</b> sofort bezahlt werden.</p>
<h3>e) Im Nebensatz</h3><p>…, dass der Antrag geprüft <b>wird</b> / geprüft <b>wurde</b> / geprüft worden <b>ist</b> / geprüft werden <b>muss</b>.</p>`,
 pitfalls:['<b>*Der Brief ist geschrieben geworden</b> → geschrieben worden.','<b>*Das muss gemacht sein</b> (Vorgang gemeint) → gemacht werden.','<b>*Die Brücke wurde von dem Sturm zerstört</b> – besser: durch den Sturm.','Akkusativobjekt → Nominativ: *Den Antrag wird geprüft → Der Antrag wird geprüft.'],
 examples:[['Die Abstimmungsresultate werden am Sonntagabend veröffentlicht.','The voting results are published on Sunday evening.'],['Das Gesetz wurde 2024 vom Parlament angenommen.','The law was passed by parliament in 2024.'],['Mein Antrag ist noch nicht bearbeitet worden.','My application has not yet been processed.'],['Die Rechnung muss innert 30 Tagen bezahlt werden.','The invoice must be paid within 30 days.'],['Die Strasse wurde durch das Unwetter beschädigt.','The road was damaged by the storm.'],['In der Sitzung wurde lange diskutiert.','There was a long discussion in the meeting.'],['Der Vertrag kann jederzeit gekündigt werden.','The contract can be terminated at any time.'],['Die Schokolade wird seit 1900 in dieser Fabrik hergestellt.','The chocolate has been made in this factory since 1900.'],['Ich weiss nicht, ob das Paket schon abgeschickt worden ist.','I don’t know whether the parcel has already been sent.'],['Die Kandidaten wurden zu einem Gespräch eingeladen.','The candidates were invited to an interview.']],
 ex:['t:passiv|Passiv Präteritum: Man baute die Brücke 1900.|Die Brücke wurde 1900 gebaut/1900 wurde die Brücke gebaut','t:passiv|Passiv Perfekt: Man hat das Paket geliefert.|Das Paket ist geliefert worden','t:passiv|Passiv Präsens mit von: Die Gemeinde prüft den Antrag.|Der Antrag wird von der Gemeinde geprüft','t:passiv|Passiv mit Modalverb: Man muss das Formular unterschreiben.|Das Formular muss unterschrieben werden','t:passiv|Passiv Präteritum: Man lud uns zum Essen ein.|Wir wurden zum Essen eingeladen','t:passiv|Passiv Perfekt: Der Chef hat die Mitarbeiter informiert.|Die Mitarbeiter sind vom Chef informiert worden/Die Mitarbeiter sind von dem Chef informiert worden','g:passiv|Das Haus ist 1950 gebaut ___.|worden','g:passiv|Die Rechnung ___ gestern bezahlt. (Präteritum)|wurde','g:passiv|Das Problem kann schnell gelöst ___.|werden','g:passiv|Die Fenster ___ jedes Jahr geputzt. (Präsens)|werden','m:passiv|Das Dorf wurde ___ eine Lawine zerstört.|durch~von~mit','m:passiv|Der Film ist im Kino gezeigt ___.|worden~geworden~werden','m:passiv|Ich weiss, dass das Paket gestern ___ worden ist.|geschickt~schicken~geschickt hat','o:passiv|The results were published yesterday.|Die Resultate wurden gestern veröffentlicht/Gestern wurden die Resultate veröffentlicht']},

{id:'b1-13',level:'B1',title:'Genitiv, Position von „nicht“ & lokale Präpositionen',cat:'gen',vocab:['b1-politik'],
 topics:['Genitiv: Funktion und Formen','von + Dativ als Alternative','Position von nicht','um … herum, an … vorbei, entlang, gegenüber, innerhalb, ausserhalb'],
 source:'Sicher! B1+ Grammatik L8 (Genitiv, Position von nicht, lokale Präpositionen) · Tracker B1.1 · Netzwerk neu B1 Kap. 2, 9',
 goals:['Genitiv erkennen und in formellen Texten verwenden','„nicht“ an die richtige Stelle setzen','Wege präzise beschreiben'],
 grammar:`<h3>1. Genitiv</h3><p>Mit dem Genitiv wird etwas näher bestimmt (wessen?). In der gesprochenen Sprache oft <b>von + Dativ</b>: <i>unter Anleitung eines Teams → unter Anleitung von einem Team</i>.</p>
<table><tr><th></th><th>bestimmt</th><th>unbestimmt</th><th>Possessiv</th></tr><tr><td>m</td><td>die Unterlagen <b>des</b> Kurs<b>es</b></td><td>eines Kurses</td><td>meines Kurses</td></tr><tr><td>n</td><td>die Anleitung <b>des</b> Team<b>s</b></td><td>eines Teams</td><td>meines Teams</td></tr><tr><td>f</td><td>die Renovierung <b>der</b> Wohnung</td><td>einer Wohnung</td><td>meiner Wohnung</td></tr><tr><td>Pl</td><td>der Austausch <b>der</b> Rezepte</td><td>eigener Rezepte / von Rezepten</td><td>Ihrer Rezepte</td></tr></table>
<p>-es oft nach Einsilbern (des Kurses, des Mannes) und Nomen auf -s, -ss, -ß, -x, -z, -tz, -nis (des Hauses, des Zeugnisses). n-Deklination: des Kollegen, des Herrn, des Menschen. Namen: Annas Wohnung, die Geschichte der Schweiz.</p>
<h3>2. Die Position von nicht</h3>
<table><tr><td>meist am Satzende</td><td>So weit ist man in der Politik noch <b>nicht</b>.</td></tr><tr><td>vor dem 2. Verbteil</td><td>Früher musste man für ein Studium <b>nicht</b> bezahlen.</td></tr><tr><td>vor Nomen, die zum Verb gehören</td><td>Sie spielt <b>nicht</b> Klavier. Er fährt <b>nicht</b> Auto.</td></tr><tr><td>vor Präpositionalergänzung</td><td>Sie dürfen <b>nicht</b> auf das Kindergartenjahr verzichten.</td></tr><tr><td>vor lokaler Ergänzung</td><td>Sie schicken ihre Kinder <b>nicht</b> dorthin.</td></tr><tr><td>vor Adjektiv nach sein/werden</td><td>Die Ausgaben waren <b>nicht</b> zu hoch.</td></tr><tr><td>vor dem verneinten Satzteil (Kontrast)</td><td>Ich glaube <b>nicht</b> der Politikerin, sondern der Studentin.</td></tr></table>
<h3>3. Lokale Präpositionen</h3>
<table><tr><th>+ Akk</th><th>+ Dat</th><th>+ Gen</th></tr><tr><td>um das Haus herum<br>den Fluss entlang (nachgestellt)</td><td>an der Schule vorbei<br>gegenüber dem Kino / dem Kino gegenüber<br>entlang der Strasse (vorangestellt, auch + Gen)</td><td>ausserhalb der Stadt<br>innerhalb des Kantons<br>oberhalb/unterhalb des Dorfes</td></tr></table>`,
 pitfalls:['<b>*das Auto von meinem Vater</b> – mündlich ok; schriftlich: das Auto meines Vaters.','<b>*des Kurs</b> → des Kurses.','<b>*Ich habe nicht das gewusst</b> → Ich habe das nicht gewusst.','<b>*Ich kann nicht schwimmen gut</b> → Ich kann nicht gut schwimmen.'],
 swiss:'Staatskunde: die Bundesverfassung <b>der</b> Schweizerischen Eidgenossenschaft, die Mitglieder <b>des</b> Bundesrates, das Recht <b>des</b> Volkes auf Initiative und Referendum – formelle Texte verwenden viel Genitiv.',
 examples:[['Die Schweiz besteht aus 26 Kantonen; Bern ist der Sitz der Bundesregierung.','Switzerland consists of 26 cantons; Bern is the seat of the federal government.'],['Das Ergebnis der Abstimmung war sehr knapp.','The result of the vote was very close.'],['Die Wohnung meiner Eltern liegt ausserhalb der Stadt.','My parents’ flat is outside the city.'],['Die Rechte des Volkes sind in der Verfassung geregelt.','The rights of the people are set out in the constitution.'],['Gehen Sie am Bahnhof vorbei und dann den See entlang.','Go past the station and then along the lake.'],['Die Post ist gegenüber dem Gemeindehaus.','The post office is opposite the municipal building.'],['Ich habe das leider nicht gewusst.','Unfortunately I didn’t know that.'],['Wir fahren heute nicht nach Luzern, sondern nach Bern.','We’re not going to Lucerne today but to Bern.'],['Innerhalb des Kantons ist der Umzug einfach.','Moving within the canton is easy.'],['Er hat die Kündigung nicht unterschrieben.','He didn’t sign the notice of termination.']],
 ex:['g:gen|Das ist das Auto ___ Vaters. (my)|meines','g:gen|Die Farbe ___ Hauses gefällt mir. (the)|des','g:gen|Das Büro ___ Chefin ist im 3. Stock. (the)|der','g:gen|Die Meinung ___ Experten ist wichtig. (the, pl.)|der','g:gen|Das Ende des ___ war traurig. (der Film)|Films','g:gen|Wegen des ___ blieb ich zu Hause. (der Regen)|Regens','g:gen|Die Ergebnisse der ___ werden am Abend bekannt. (die Wahl)|Wahl','g:prep|Wir wohnen ausserhalb ___ Stadt.|der','g:prep|Er geht an ___ Kino vorbei.|dem','g:prep|Wir fahren den Fluss ___. (along)|entlang','m:neg|Wo steht „nicht“ richtig?|Ich habe den Brief nicht gelesen.~Ich habe nicht den Brief gelesen.~Ich habe den Brief gelesen nicht.','m:neg|Wo steht „nicht“ richtig?|Er wohnt nicht in Zürich.~Er wohnt in Zürich nicht gern nicht.~Er nicht wohnt in Zürich.','m:neg|Wo steht „nicht“ richtig?|Die Wohnung ist nicht teuer.~Die Wohnung nicht ist teuer.~Nicht die Wohnung ist teuer.','t:gen|Genitiv: das Haus von meinen Eltern|das Haus meiner Eltern','t:gen|Genitiv: die Rechte von dem Volk|die Rechte des Volkes','t:neg|Verneinen: Ich kann heute kommen.|Ich kann heute nicht kommen']},

{id:'b1-14',level:'B1',title:'Berichten & schreiben – Präteritum & zweiteilige Konnektoren',cat:'praet',vocab:['b1-geschichte'],
 topics:['Präteritum aller Verben (schriftliches Erzählen)','Plusquamperfekt','entweder … oder, sowohl … als auch, weder … noch, nicht nur … sondern auch'],
 source:'Tracker B1.1/B1.2 · Basic German Unit 22 · Sicher! B2 L1 (Vorschau) · Netzwerk neu B1 Kap. 3, 8',
 goals:['einen Bericht/eine Geschichte im Präteritum schreiben','Alternativen und Aufzählungen elegant verbinden'],
 grammar:`<h3>1. Präteritum</h3>
<table><tr><th>Typ</th><th>Bildung</th><th>Beispiele (ich/er – wir/sie)</th></tr>
<tr><td>regelmässig</td><td>Stamm + te</td><td>machte – machten, arbeitete, kaufte, wohnte</td></tr>
<tr><td>unregelmässig</td><td>Vokalwechsel, ich/er ohne Endung</td><td>ging, kam, sah, fuhr, las, sprach, nahm, gab, fand, blieb, schrieb, trank, stand, lag, sass, flog, zog, rief, hielt, schlief, liess, begann, verstand, bekam, verlor, traf, half, starb, wurde</td></tr>
<tr><td>gemischt</td><td>Vokalwechsel + te</td><td>dachte, brachte, kannte, nannte, rannte, wusste</td></tr></table>
<p>Endungen: ich ging, du ging<b>st</b>, er ging, wir ging<b>en</b>, ihr ging<b>t</b>, sie ging<b>en</b>.</p>
<h3>2. Plusquamperfekt</h3><p>hatte/war + Partizip II – für etwas, das <b>vor</b> einem anderen Ereignis in der Vergangenheit geschah: <i>Als wir ankamen, <b>war</b> der Zug schon <b>abgefahren</b>.</i></p>
<h3>3. Zweiteilige Konnektoren</h3>
<table><tr><td><b>entweder … oder</b> (Alternative)</td><td><b>Entweder</b> wir fahren mit dem Zug <b>oder</b> wir nehmen das Auto.</td></tr>
<tr><td><b>sowohl … als auch</b> (beides)</td><td>Er spricht <b>sowohl</b> Deutsch <b>als auch</b> Französisch.</td></tr>
<tr><td><b>weder … noch</b> (keins von beiden)</td><td>Ich habe <b>weder</b> Zeit <b>noch</b> Lust.</td></tr>
<tr><td><b>nicht nur … sondern auch</b> (Steigerung)</td><td>Die Wohnung ist <b>nicht nur</b> gross, <b>sondern auch</b> günstig.</td></tr></table>
<p>Wortstellung: <i>Entweder</i> steht auf Position 0 oder 1 (Entweder <b>komme</b> ich / Entweder ich <b>komme</b>); <i>weder</i> auf Position 1 → Verb folgt: <i>Weder <b>habe</b> ich Zeit noch Lust.</i></p>`,
 pitfalls:['<b>*er gehte</b> → er ging.','<b>*ich dachtete</b> → ich dachte.','<b>*weder … oder</b> → weder … noch.','<b>*sowohl … und auch</b> → sowohl … als auch.'],
 examples:[['Im Jahr 1291 schlossen sich drei Orte zu einem Bund zusammen.','In 1291 three cantons formed an alliance.'],['Die Schweiz wurde 1848 ein Bundesstaat.','Switzerland became a federal state in 1848.'],['Als ich ankam, hatte der Kurs schon begonnen.','When I arrived the course had already started.'],['Er stand auf, trank einen Kaffee und ging zur Arbeit.','He got up, drank a coffee and went to work.'],['Wir fanden die Wohnung nach drei Monaten Suche.','We found the flat after three months of searching.'],['Entweder du rufst an, oder du schreibst eine E-Mail.','Either you call or you write an email.'],['Ich habe weder Zeit noch Geld für Ferien.','I have neither time nor money for a holiday.'],['Sie spricht sowohl Englisch als auch Mandarin.','She speaks both English and Mandarin.'],['Das Seminar war nicht nur interessant, sondern auch nützlich.','The seminar was not only interesting but also useful.'],['Die Frauen in der Schweiz bekamen das Stimmrecht auf Bundesebene erst 1971.','Women in Switzerland only got the federal vote in 1971.']],
 ex:['g:praet|Gestern ___ ich ins Kino. (gehen)|ging','g:praet|Er ___ den Brief zweimal. (lesen)|las','g:praet|Wir ___ um 8 Uhr in Bern an. (ankommen)|kamen','g:praet|Sie ___ an ihre Familie. (denken)|dachte','g:praet|Der Zug ___ pünktlich ab. (fahren)|fuhr','g:praet|Ich ___ nicht, was ich sagen sollte. (wissen)|wusste','g:praet|Die Kinder ___ im Garten. (spielen)|spielten','g:praet|Er ___ mir ein Geschenk. (bringen)|brachte','g:praet|1971 ___ die Schweizerinnen das Stimmrecht. (bekommen)|bekamen','g:perfekt|Als ich am Bahnhof ankam, ___ der Zug schon abgefahren. (Plusquamperfekt)|war','m:conn|Ich trinke ___ Kaffee noch Tee.|weder~entweder~sowohl','m:conn|Er spricht sowohl Deutsch ___ Englisch.|als auch~noch~oder','m:conn|___ wir gehen ins Kino oder wir bleiben zu Hause.|Entweder~Weder~Sowohl','m:conn|Die Arbeit ist nicht nur interessant, ___ auch gut bezahlt.|sondern~aber~oder','t:conn|Verbinden mit weder … noch: Ich habe keine Zeit. Ich habe keine Lust.|Ich habe weder Zeit noch Lust','t:praet|Präteritum: Wir haben lange gewartet.|Wir warteten lange/Wir haben lange gewartet']}

,{id:'b1-15',level:'B1',title:'Genauer beschreiben – Artikelwörter als Pronomen, irgendein, Adjektive als Nomen',cat:'pron',vocab:['b1-nw11'],
 topics:['Artikelwörter als Pronomen: einer, keins, meins, welche','irgendein / irgendwelche, irgendwo, irgendwann','Adjektive als Nomen: der Bekannte, ein Bekannter, etwas Neues','Relativsätze mit was und wo'],
 source:'Netzwerk neu B1 Kap. 11 (Stadt, Land, Fluss) · Netzwerk neu A2 (Artikelwörter, Wiederholung)',
 goals:['Dinge und Personen benennen, ohne das Nomen zu wiederholen','über Unbestimmtes sprechen (irgendein, irgendwo)','Adjektive als Nomen richtig deklinieren'],
 grammar:`<h3>1. Artikelwörter als Pronomen</h3>
<p>Wenn das Nomen schon bekannt ist, steht das Artikelwort allein – mit der Endung des <b>bestimmten</b> Artikels:</p>
<table><tr><th></th><th>mask.</th><th>neutr.</th><th>fem.</th><th>Plural</th></tr>
<tr><td>Nom</td><td>ein<em>er</em> / kein<em>er</em> / mein<em>er</em></td><td>ein<em>(e)s</em> / kein<em>(e)s</em> / mein<em>(e)s</em></td><td>ein<em>e</em> / kein<em>e</em></td><td>welch<em>e</em> / kein<em>e</em></td></tr>
<tr><td>Akk</td><td>ein<em>en</em> / kein<em>en</em></td><td>ein<em>(e)s</em> / kein<em>(e)s</em></td><td>ein<em>e</em> / kein<em>e</em></td><td>welch<em>e</em> / kein<em>e</em></td></tr>
<tr><td>Dat</td><td>ein<em>em</em> / kein<em>em</em></td><td>ein<em>em</em> / kein<em>em</em></td><td>ein<em>er</em> / kein<em>er</em></td><td>welch<em>en</em> / kein<em>en</em></td></tr></table>
<div class="rule">Hast du einen Stift? – Ja, ich habe <b>einen</b>. / Nein, ich habe <b>keinen</b>. · Ist das dein Velo? – Ja, das ist <b>meins</b>. · Brauchst du Briefmarken? – Ja, ich brauche <b>welche</b>. (Plural von „eine“ = <b>welche</b>)</div>
<h3>2. irgend-: unbestimmt, egal welche/r</h3>
<p><b>irgendein</b> Restaurant (egal welches), <b>irgendwelche</b> Fragen (Plural), <b>irgendwo</b>, <b>irgendwann</b>, <b>irgendwie</b>, <b>irgendjemand</b>, <b>irgendetwas</b>. Als Pronomen: Ich nehme <b>irgendeinen</b>. / Gibt es <b>irgendwelche</b>?</p>
<h3>3. Adjektive als Nomen</h3>
<p>Adjektive (und Partizipien) können Nomen werden – <b>gross geschrieben</b>, aber mit <b>Adjektivendungen</b>:</p>
<table><tr><th></th><th>mit der/die/das</th><th>mit ein/kein</th></tr>
<tr><td>Nom</td><td>der Bekannt<em>e</em> / die Bekannt<em>e</em> / die Bekannt<em>en</em></td><td>ein Bekannt<em>er</em> / eine Bekannt<em>e</em> / Bekannt<em>e</em></td></tr>
<tr><td>Akk</td><td>den Bekannt<em>en</em></td><td>einen Bekannt<em>en</em></td></tr>
<tr><td>Dat</td><td>dem Bekannt<em>en</em></td><td>einem Bekannt<em>en</em></td></tr></table>
<p>Häufig: der/die Erwachsene, Deutsche, Angestellte, Verwandte, Jugendliche, Kranke, Arbeitslose, Reisende. Nach <b>etwas, nichts, viel, wenig</b>: neutral mit -es: etwas <b>Neues</b>, nichts <b>Besonderes</b>, viel <b>Gutes</b>. Nach <b>alles</b>: alles <b>Gute</b>.</p>
<h3>4. Relativsätze mit was und wo</h3>
<div class="rule"><b>was</b> nach <i>alles, etwas, nichts, vieles, das</i> und nach Superlativ: Das ist alles, <b>was</b> ich weiss. Das ist das Beste, <b>was</b> mir passiert ist.<br><b>wo</b> nach Orten (Stadt, Land, Ort): Zürich ist eine Stadt, <b>wo</b> man gut leben kann (= in der).</div>`,
 pitfalls:['<b>*Ich habe kein.</b> → Ich habe keinen / keins / keine (je nach Genus).','<b>*Ja, das ist mein.</b> → Ja, das ist meins / meiner / meine.','<b>*Brauchst du Eier? – Ja, ich brauche eine.</b> → Ja, ich brauche welche.','<b>*ein Bekannte</b> → ein Bekannter (nach ein: -er/-es wie bei Adjektiven).','<b>*etwas neues</b> → etwas Neues (gross, Endung -es).','<b>*Das ist alles, das ich weiss.</b> → alles, was ich weiss.'],
 examples:[['Hast du ein Ladegerät? – Ja, ich habe eins dabei.','Do you have a charger? – Yes, I have one with me.'],['Wem gehört der Schirm? – Das ist meiner.','Whose umbrella is it? – It’s mine.'],['Wir brauchen noch Gläser. – Im Schrank sind welche.','We still need glasses. – There are some in the cupboard.'],['Lass uns irgendwo in der Altstadt essen.','Let’s eat somewhere in the old town.'],['Hast du noch irgendwelche Fragen?','Do you have any questions?'],['Ein Bekannter von mir arbeitet bei der Gemeinde.','An acquaintance of mine works at the municipality.'],['Die Jugendlichen treffen sich am Seeufer.','The young people meet at the lakeshore.'],['Gibt es etwas Neues aus dem Quartier?','Is there anything new from the neighbourhood?'],['Das ist das Schönste, was ich in Zürich gesehen habe.','That’s the most beautiful thing I’ve seen in Zurich.'],['Ich suche eine Stadt, wo man ohne Auto leben kann.','I’m looking for a city where you can live without a car.']],
 ex:['g:pron|Hast du einen Kugelschreiber? – Ja, ich habe ___.|einen','g:pron|Hast du ein Velo? – Nein, ich habe ___.|keins/keines','g:pron|Ist das deine Jacke? – Ja, das ist ___.|meine','g:pron|Ist das dein Schlüssel? – Ja, das ist ___.|meiner','g:pron|Brauchen wir noch Tomaten? – Ja, kauf bitte ___.|welche','g:pron|Mit welchem Bus fährst du? – Mit ___ (one) aus der Linie 32.|einem','m:pron|Ich habe kein Ticket. Hast du ___?|eins~ein~einen','m:pron|Es gibt keine Brötchen mehr. – Doch, hier sind noch ___.|welche~eine~einige','g:pron|Wir können uns ___ treffen – mir ist der Ort egal. (somewhere)|irgendwo','g:pron|Hast du noch ___ Fragen? (any, Plural)|irgendwelche','g:adj|Ein ___ von mir wohnt in Winterthur. (bekannt)|Bekannter','g:adj|Die ___ dürfen hier nicht rauchen. (jugendlich, Plural)|Jugendlichen','g:adj|Ich wünsche dir alles ___! (gut)|Gute','g:adj|Gibt es etwas ___? (neu)|Neues','g:adj|Ich habe mit dem ___ gesprochen. (angestellt, m.)|Angestellten','g:rel|Das ist alles, ___ ich dazu sagen kann.|was','g:rel|Bern ist eine Stadt, ___ viele Politiker arbeiten.|wo','m:rel|Das ist das Beste, ___ du machen kannst.|was~das~welches','t:adj|Schreiben Sie mit Adjektiv als Nomen: der Mann ist krank → der …|der Kranke','t:pron|Antworten Sie mit Pronomen: Hast du einen Stadtplan? (ja)|Ja, ich habe einen/Ja, ich habe einen.']},
{id:'b1-16',level:'B1',title:'Je mehr, desto besser – je … desto/umso, Partizipien als Adjektive',cat:'conn',vocab:['b1-nw12'],
 topics:['je + Komparativ …, desto/umso + Komparativ …','Partizip II als Adjektiv: die reparierte Uhr','Partizip I als Adjektiv: das weinende Kind','Partizipien mit Adjektivendungen'],
 source:'Netzwerk neu B1 Kap. 12 (Geld regiert die Welt?) · Vorbereitung auf Sicher! B2 L1–2',
 goals:['Zusammenhänge mit je … desto ausdrücken','Personen, Dinge und Situationen mit Partizipien genauer beschreiben'],
 grammar:`<h3>1. je … desto / umso</h3>
<div class="rule"><b>je</b> + Komparativ … (Nebensatz, Verb am Ende), <b>desto/umso</b> + Komparativ + <b>Verb</b> + Subjekt (Hauptsatz):<br>
<b>Je</b> mehr man spart, <b>desto</b> mehr Geld <b>hat</b> man später.<br>
<b>Je</b> früher wir losfahren, <b>umso</b> weniger Verkehr <b>gibt</b> es.</div>
<p>Kurzform in Gesprächen: <i>Je früher, desto besser. Je mehr, desto lieber.</i></p>
<h3>2. Partizip II als Adjektiv (passiv / abgeschlossen)</h3>
<p>Partizip II + Adjektivendung: das <b>reparierte</b> Fahrrad (= das Fahrrad, das repariert worden ist), die <b>gekauften</b> Aktien, ein <b>gebrauchtes</b> Auto, frisch <b>gepresster</b> Saft.</p>
<h3>3. Partizip I als Adjektiv (aktiv / gleichzeitig)</h3>
<p>Infinitiv + <b>d</b> + Adjektivendung: das <b>weinende</b> Kind (= das Kind, das weint), die <b>steigenden</b> Preise, ein <b>spannendes</b> Buch, bei <b>laufendem</b> Motor.</p>
<table><tr><th>Relativsatz</th><th>Partizip</th></tr>
<tr><td>die Preise, die steigen</td><td>die stei­gen<em>d</em>en Preise (Partizip I)</td></tr>
<tr><td>das Konto, das eröffnet wurde</td><td>das eröffn<em>et</em>e Konto (Partizip II)</td></tr>
<tr><td>der Zug, der abfährt</td><td>der abfahren<em>d</em>e Zug</td></tr>
<tr><td>die Wohnung, die renoviert ist</td><td>die renoviert<em>e</em> Wohnung</td></tr></table>
<div class="warn">Partizipien bekommen <b>normale Adjektivendungen</b> (Regel 1–3). Ohne Nomen (prädikativ) keine Endung: <i>Das Buch ist spannend.</i></div>`,
 pitfalls:['<b>*Je mehr man spart, desto man hat mehr.</b> → desto mehr hat man (Verb direkt nach dem Komparativ-Teil).','<b>*Je mehr man spart, je mehr …</b> → desto/umso im zweiten Teil.','<b>*das reparierte Fahrrad</b> ist richtig, aber <b>*das reparierende Fahrrad</b> (aktiv) ergibt keinen Sinn.','<b>*die steigende Preise</b> → die steigenden Preise (Plural nach die: -en).','<b>*ein spannende Film</b> → ein spannender Film.'],
 examples:[['Je länger ich in der Schweiz lebe, desto besser verstehe ich Schweizerdeutsch.','The longer I live in Switzerland, the better I understand Swiss German.'],['Je höher der Betrag, umso höher die Gebühr.','The higher the amount, the higher the fee.'],['Je früher, desto besser!','The earlier, the better!'],['Die steigenden Mieten sind ein grosses Problem in Zürich.','The rising rents are a big problem in Zurich.'],['Das reparierte Velo fährt wieder wie neu.','The repaired bike rides like new again.'],['Ich habe ein gebrauchtes Auto gekauft.','I bought a used car.'],['Das war ein spannender Vortrag über Globalisierung.','That was an exciting talk about globalisation.'],['Bitte nicht in den abfahrenden Zug einsteigen!','Please do not board the departing train!'],['Die unterschriebenen Formulare schicken Sie bitte an die Gemeinde.','Please send the signed forms to the municipality.'],['Je mehr ich übe, umso sicherer fühle ich mich in der Prüfung.','The more I practise, the more confident I feel in the exam.']],
 ex:['g:conn|___ mehr du lernst, desto mehr weisst du.|Je','g:conn|Je früher wir kommen, ___ mehr Plätze gibt es. (desto)|desto/umso','g:comp|Je ___ das Wetter ist, desto mehr Leute gehen baden. (warm)|wärmer','g:comp|Je mehr man verdient, desto ___ Steuern zahlt man. (hoch)|höhere','m:conn|Je länger der Film dauerte, desto ___.|müder wurde ich~ich wurde müder~ich müder wurde','m:conn|___ höher der Betrag ist, desto höher ist die Gebühr.|Je~Desto~Wenn','t:conn|Verbinden mit je … desto: Man fährt schnell. Der Unfall ist gefährlich.|Je schneller man fährt, desto gefährlicher ist der Unfall/Je schneller man fährt, umso gefährlicher ist der Unfall','g:adj|das Velo, das repariert wurde → das ___ Velo|reparierte','g:adj|die Preise, die steigen → die ___ Preise|steigenden','g:adj|ein Kind, das lacht → ein ___ Kind|lachendes','g:adj|ein Buch, das spannend ist → ein ___ Buch|spannendes','g:adj|die Formulare, die ausgefüllt sind → die ___ Formulare|ausgefüllten','g:adj|Ich kaufe nur ___ Möbel. (gebraucht, Plural ohne Artikel)|gebrauchte','m:adj|Bitte steigen Sie nicht in den ___ Zug ein.|abfahrenden~abgefahrenen~abfahrende','m:adj|Wir haben eine frisch ___ Wohnung gemietet.|renovierte~renovierende~renoviert','t:adj|Mit Partizip I: die Kosten, die wachsen → die …|die wachsenden Kosten']}
]);
