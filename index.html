{id:'r-a2-4',level:'A2',title:'SBB-Information',type:'Durchsage / Information',time:6,
text:`Information für Reisende

Wegen Bauarbeiten zwischen Zürich Hauptbahnhof und Zürich Oerlikon fahren vom 12. bis 26. März keine S-Bahnen der Linien S7 und S16. Bitte benutzen Sie die Ersatzbusse. Die Busse fahren ab Zürich HB, Ausgang Sihlquai, alle 10 Minuten. Rechnen Sie mit 20 Minuten mehr Reisezeit.

Die Fernverkehrszüge (IC und IR) fahren normal. Billette und Abonnemente sind in den Ersatzbussen gültig. Velos können in den Bussen leider nicht mitgenommen werden.

Aktuelle Informationen finden Sie in der App SBB Mobile.`,
qs:['m|Die S7 fährt am 15. März normal.|Falsch~Richtig','m|Warum fahren keine S-Bahnen?|wegen Bauarbeiten~wegen eines Streiks~wegen des Wetters','m|Wie oft fahren die Ersatzbusse?|alle 10 Minuten~alle 20 Minuten~jede Stunde','m|Man braucht für den Bus ein neues Billett.|Falsch~Richtig','m|Man kann das Velo im Bus mitnehmen.|Falsch~Richtig']},

{id:'r-b1-1',level:'B1',title:'Leserbrief: Sollen Läden am Sonntag öffnen?',type:'Meinungstexte',time:12,
text:`Marianne K., Schwyz: Ich bin klar dagegen. Der Sonntag ist für die Familie da. Wenn die Läden öffnen, müssen vor allem Verkäuferinnen arbeiten, die ohnehin wenig verdienen. Wer am Samstag nicht einkaufen kann, sollte seine Woche besser planen.

Reto B., Zug: Ich arbeite oft bis 19 Uhr und am Samstag habe ich Sport mit den Kindern. Für mich wäre es eine grosse Erleichterung, wenn ich am Sonntag einkaufen könnte. Niemand wird gezwungen einzukaufen – und Angestellte könnten freiwillig mehr verdienen.

Leila M., Zürich: Einerseits verstehe ich die Familien, die den freien Sonntag schützen wollen. Andererseits haben wir schon heute Läden an Bahnhöfen, die jeden Tag geöffnet sind. Ich fände einen Kompromiss gut: zum Beispiel vier offene Sonntage pro Jahr, etwa vor Weihnachten.

Thomas W., Einsiedeln: Für die kleinen Geschäfte im Dorf wäre eine Öffnung am Sonntag ein Problem. Grosse Ketten können mehr Personal bezahlen, wir nicht. Am Ende würden die kleinen Läden verschwinden.`,
qs:['m|Marianne K. findet, dass die Leute ihre Einkäufe besser planen sollten.|Richtig~Falsch','m|Wer ist für die Sonntagsöffnung?|Reto B.~Marianne K.~Thomas W.','m|Was schlägt Leila M. vor?|einige offene Sonntage pro Jahr~alle Sonntage offen~keine Läden an Bahnhöfen','m|Thomas W. befürchtet, dass …|kleine Geschäfte verschwinden.~die Preise sinken.~zu wenige Kunden in die Stadt kommen.','m|Reto B. meint, Angestellte würden gezwungen, am Sonntag zu arbeiten.|Falsch~Richtig','m|Wer sieht Vor- und Nachteile?|Leila M.~Reto B.~Marianne K.']},
{id:'r-b1-2',level:'B1',title:'Die Gemeindeversammlung',type:'Informationstext',time:12,
text:`In vielen Schweizer Gemeinden gibt es kein Gemeindeparlament. Stattdessen entscheiden die Stimmberechtigten direkt an der Gemeindeversammlung. Diese findet meistens zwei- bis viermal pro Jahr statt, oft am Abend in einer Turnhalle oder einem Gemeindesaal.

Teilnehmen dürfen alle Schweizer Bürgerinnen und Bürger ab 18 Jahren, die in der Gemeinde wohnen. In einigen Kantonen dürfen auch Ausländerinnen und Ausländer mit Niederlassungsbewilligung auf Gemeindeebene mitbestimmen – in den Kantonen Zürich, Schwyz und Zug ist das aber nicht der Fall.

An der Versammlung wird zum Beispiel über das Budget, den Steuerfuss oder den Bau eines neuen Schulhauses abgestimmt. Jede Person darf Fragen stellen oder Anträge machen. Abgestimmt wird meistens offen, mit erhobener Hand.

Kritiker bemängeln, dass oft nur fünf bis zehn Prozent der Stimmberechtigten teilnehmen. Befürworter betonen dagegen, dass die Versammlung die direkte Demokratie besonders gut sichtbar macht: Man kann direkt mit dem Gemeinderat diskutieren.`,
gloss:[['die Stimmberechtigten','those entitled to vote'],['der Steuerfuss','municipal tax rate multiplier'],['der Antrag','motion, proposal'],['bemängeln','to criticise']],
qs:['m|Alle Gemeinden in der Schweiz haben ein Parlament.|Falsch~Richtig','m|Wer darf an der Gemeindeversammlung abstimmen?|Schweizer Bürger ab 18, die in der Gemeinde wohnen~alle Einwohner~nur Mitglieder des Gemeinderats','m|In Zug dürfen Ausländer mit C-Bewilligung an der Gemeindeversammlung abstimmen.|Falsch~Richtig','m|Worüber wird NICHT an der Gemeindeversammlung entschieden (laut Text)?|über die Bundesverfassung~über das Budget~über ein neues Schulhaus','m|Wie wird meistens abgestimmt?|mit erhobener Hand~geheim auf Papier~online','m|Was kritisieren manche?|die niedrige Teilnahme~die hohen Kosten~die langen Diskussionen']},
{id:'r-b1-3',level:'B1',title:'Beschwerde an die Verwaltung',type:'Formeller Brief',time:10,
text:`Sehr geehrte Damen und Herren

Seit drei Wochen funktioniert die Heizung in meiner Wohnung (3. Stock, links) nicht richtig. Im Wohnzimmer und im Schlafzimmer sind es tagsüber nur 16 Grad. Ich habe das Problem am 4. November telefonisch gemeldet. Man hat mir versprochen, dass innerhalb von zwei Tagen ein Techniker kommt. Leider ist bis heute niemand gekommen.

Da ich zwei kleine Kinder habe, ist die Situation für uns nicht akzeptabel. Ich bitte Sie deshalb, die Heizung bis spätestens Freitag, 29. November, reparieren zu lassen. Ausserdem möchte ich Sie bitten, eine Reduktion der Miete für diesen Monat zu prüfen.

Für einen Termin bin ich am Vormittag unter 079 345 67 89 erreichbar.

Freundliche Grüsse
Elena Rossi`,
qs:['m|Die Heizung funktioniert seit drei Tagen nicht.|Falsch~Richtig','m|Wie hat Frau Rossi das Problem zuerst gemeldet?|telefonisch~per Brief~per E-Mail','m|Was hat man ihr versprochen?|dass in zwei Tagen ein Techniker kommt~eine Mietreduktion~einen neuen Heizkörper','m|Was verlangt Frau Rossi?|die Reparatur bis zu einem Termin und die Prüfung einer Mietreduktion~eine neue Wohnung~die Kündigung des Vertrags','m|Frau Rossi ist am Nachmittag am besten erreichbar.|Falsch~Richtig']},
{id:'r-b1-4',level:'B1',title:'Homeoffice – Fluch oder Segen?',type:'Zeitungsartikel',time:12,
text:`Seit der Pandemie arbeiten in der Schweiz deutlich mehr Menschen zumindest teilweise von zu Hause aus. Laut einer Umfrage möchte die Mehrheit der Angestellten auch in Zukunft zwei bis drei Tage pro Woche im Homeoffice arbeiten.

Die Vorteile liegen auf der Hand: Man spart Zeit, weil das Pendeln wegfällt, und kann Familie und Beruf besser vereinbaren. Viele Befragte gaben an, zu Hause konzentrierter arbeiten zu können.

Doch es gibt auch Nachteile. Wer immer allein arbeitet, fühlt sich schneller isoliert. Ausserdem fällt es manchen schwer, nach Feierabend abzuschalten, weil Arbeit und Privatleben nicht mehr klar getrennt sind. Arbeitgeber befürchten zudem, dass der Teamgeist leidet.

Experten empfehlen deshalb ein Mischmodell: feste Bürotage für Sitzungen und Teamarbeit, Homeoffice für konzentrierte Aufgaben. Wichtig sei auch ein richtiger Arbeitsplatz zu Hause – der Küchentisch sei auf Dauer keine Lösung.`,
qs:['m|Die Mehrheit möchte ganz im Homeoffice arbeiten.|Falsch~Richtig','m|Welcher Vorteil wird genannt?|weniger Zeit für das Pendeln~höherer Lohn~weniger Arbeit','m|Welches Problem nennt der Text?|Man kann schlechter abschalten.~Die Internetverbindung ist schlecht.~Man verdient weniger.','m|Was befürchten Arbeitgeber?|dass der Teamgeist leidet~dass die Mitarbeitenden kündigen~dass die Büros zu klein sind','m|Was empfehlen Experten?|ein Mischmodell~nur Büroarbeit~nur Homeoffice','m|Laut Experten ist der Küchentisch ein guter Arbeitsplatz.|Falsch~Richtig']},

{id:'r-b2-1',level:'B2',title:'Direkte Demokratie unter Druck?',type:'Kommentar (Goethe B2 Lesen Teil 2)',time:15,
text:`Rund viermal im Jahr sind die Schweizer Stimmberechtigten aufgerufen, über eidgenössische Vorlagen zu entscheiden. Was im Ausland oft bewundert wird, sorgt im Inland zunehmend für Diskussionen. Die durchschnittliche Stimmbeteiligung liegt seit Jahren bei knapp unter fünfzig Prozent – bei komplexen Vorlagen nicht selten darunter.

Kritiker argumentieren, die Vorlagen seien inzwischen derart technisch geworden, dass sich viele Bürgerinnen und Bürger überfordert fühlten. Wer verstehe schon im Detail, wie eine Reform der beruflichen Vorsorge die eigene Rente beeinflusse? Hinzu komme, dass gut finanzierte Kampagnen die öffentliche Meinung stark prägen könnten, ohne dass transparent sei, wer dahinterstehe. Seit einigen Jahren müssen grössere Kampagnenbudgets allerdings offengelegt werden.

Befürworter halten dagegen, gerade die regelmässigen Abstimmungen zwängen Regierung und Parlament, ihre Vorhaben verständlich zu erklären und breit abgestützte Kompromisse zu suchen. Das sogenannte Abstimmungsbüchlein, das allen Stimmberechtigten zugestellt wird, stelle die Argumente beider Seiten ausgewogen dar. Zudem zeige die Forschung, dass „selektive Teilnahme“ kein Zeichen von Desinteresse sei: Die meisten Stimmberechtigten nehmen über mehrere Jahre hinweg durchaus an Abstimmungen teil – nur eben nicht an jeder.

Unbestritten ist, dass die direkte Demokratie von informierten Bürgerinnen und Bürgern lebt. Ob Schulen, Medien oder digitale Informationsangebote diese Aufgabe künftig besser erfüllen können, dürfte eine der zentralen Fragen der nächsten Jahre sein.`,
gloss:[['die Stimmbeteiligung','voter turnout'],['überfordert','overwhelmed'],['die berufliche Vorsorge','occupational pension'],['offenlegen','to disclose'],['breit abgestützt','broadly supported']],
qs:['m|Wie oft finden etwa eidgenössische Abstimmungen statt?|rund viermal im Jahr~einmal im Jahr~jeden Monat','m|Die Stimmbeteiligung liegt meist über 60 Prozent.|Falsch~Richtig','m|Was kritisieren Kritiker unter anderem?|Die Vorlagen sind oft zu kompliziert.~Es gibt zu wenige Abstimmungen.~Die Regierung informiert gar nicht.','m|Was gilt heute für grössere Kampagnenbudgets?|Sie müssen offengelegt werden.~Sie sind verboten.~Sie werden vom Staat bezahlt.','m|Was sagen Befürworter über das Abstimmungsbüchlein?|Es stellt beide Seiten ausgewogen dar.~Es ist zu lang.~Es wird nur online verschickt.','m|„Selektive Teilnahme“ bedeutet laut Forschung, dass …|viele nicht an jeder, aber an manchen Abstimmungen teilnehmen.~die meisten nie abstimmen.~nur ältere Menschen abstimmen.','m|Welche Haltung hat der Autor am Ende?|Er sieht die Information der Bürger als zentrale Aufgabe.~Er will die direkte Demokratie abschaffen.~Er hält Abstimmungen für überflüssig.']},
{id:'r-b2-2',level:'B2',title:'Forum: Sprachanforderungen bei der Einbürgerung',type:'Meinungen (Goethe B2 Lesen Teil 1)',time:15,
text:`Nadia (Zug): Seit 2025 verlangt unser Kanton B2 mündlich. Ich finde das grundsätzlich richtig. Wer Schweizerin oder Schweizer werden will, sollte sich an einer Gemeindeversammlung zu Wort melden und Abstimmungsunterlagen verstehen können. Mit B1 ist das kaum möglich.

Paolo (Zürich): Ich halte die Verschärfungen für unfair. Meine Mutter lebt seit 30 Jahren hier, hat immer gearbeitet und Steuern bezahlt. Sie spricht gut genug für den Alltag, aber eine B2-Prüfung mit Vortrag und Diskussion würde sie nie bestehen. Integration lässt sich nicht nur an einem Zertifikat messen.

Ingrid (Schwyz): Das Problem ist weniger das Niveau als die Unterschiede zwischen den Kantonen. Wer in Zürich wohnt, braucht B1, ein paar Kilometer weiter in Schwyz B2. Das ist schwer zu erklären. Ich wäre für eine einheitliche Regelung auf Bundesebene.

Jonas (Zug): Als Deutschlehrer erlebe ich, dass klare Ziele motivieren. Viele meiner Kursteilnehmenden erreichen B2, wenn sie regelmässig üben. Wichtig wäre allerdings, dass die Kantone günstige Kurse anbieten – sonst wird die Einbürgerung eine Frage des Geldes.`,
qs:['m|Wer findet die höheren Anforderungen grundsätzlich richtig?|Nadia~Paolo~Ingrid','m|Wer kritisiert vor allem die kantonalen Unterschiede?|Ingrid~Jonas~Paolo','m|Wer meint, Integration könne man nicht nur mit einer Prüfung messen?|Paolo~Nadia~Jonas','m|Wer fordert günstige Kurse?|Jonas~Ingrid~Nadia','m|Laut Ingrid braucht man in Zürich B2 mündlich.|Falsch~Richtig','m|Jonas glaubt, dass viele Lernende B2 erreichen können.|Richtig~Falsch']},
{id:'r-b2-3',level:'B2',title:'Ratgeber: Mietzinserhöhung – was tun?',type:'Ratgebertext (Goethe B2 Lesen Teil 3)',time:15,
text:`Steigt der hypothekarische Referenzzinssatz, dürfen Vermieter unter bestimmten Bedingungen die Miete erhöhen. Doch nicht jede Erhöhung ist rechtens. Mieterinnen und Mieter sollten daher genau hinschauen.

Zunächst gilt: Eine Mietzinserhöhung muss auf einem amtlich genehmigten Formular mitgeteilt und begründet werden. Ein gewöhnlicher Brief oder eine E-Mail genügt nicht. Zudem muss die Mitteilung mindestens zehn Tage vor Beginn der Kündigungsfrist eintreffen. Fehlt das Formular oder die Begründung, ist die Erhöhung nichtig.

Wer die Erhöhung für ungerechtfertigt hält, kann sie innert 30 Tagen bei der Schlichtungsbehörde anfechten. Das Verfahren ist in der Regel kostenlos, und eine anwaltliche Vertretung ist nicht zwingend. Während des Verfahrens darf der Vermieter das Mietverhältnis nicht aus Rache kündigen.

Empfehlenswert ist es, sich vorab beim Mieterverband beraten zu lassen. Dort lässt sich auch berechnen, ob die geforderte Erhöhung dem gesunkenen oder gestiegenen Referenzzinssatz tatsächlich entspricht. Erfahrungsgemäss sind nicht wenige Erhöhungen zu hoch angesetzt.`,
gloss:[['der Referenzzinssatz','reference interest rate'],['nichtig','void'],['anfechten','to contest'],['die Schlichtungsbehörde','conciliation authority']],
qs:['m|Eine Mietzinserhöhung per E-Mail ist gültig.|Falsch~Richtig','m|Was passiert, wenn die Begründung fehlt?|Die Erhöhung ist nichtig.~Die Erhöhung gilt erst später.~Der Mieter muss einen Anwalt nehmen.','m|Innerhalb welcher Frist kann man die Erhöhung anfechten?|30 Tage~10 Tage~3 Monate','m|Das Verfahren bei der Schlichtungsbehörde ist meistens teuer.|Falsch~Richtig','m|Was darf der Vermieter während des Verfahrens nicht tun?|aus Rache kündigen~die Wohnung besichtigen~das Formular schicken','m|Wo kann man sich vorher beraten lassen?|beim Mieterverband~beim Steueramt~bei der Gemeindeversammlung']},
{id:'r-b2-4',level:'B2',title:'Der Fachkräftemangel und seine Folgen',type:'Sachtext (B2)',time:15,
text:`Ob in der Pflege, im Ingenieurwesen oder in der Informatik: Schweizer Unternehmen klagen über einen zunehmenden Mangel an qualifizierten Fachkräften. Verschärft wird die Situation durch den demografischen Wandel. Jedes Jahr gehen mehr Angehörige der geburtenstarken Jahrgänge in Pension, als junge Menschen in den Arbeitsmarkt eintreten.

Die Wirtschaft setzt traditionell stark auf ausländische Arbeitskräfte. Rund ein Drittel der Erwerbstätigen in der Schweiz hat keinen Schweizer Pass. Dank der Personenfreizügigkeit mit der EU können Unternehmen vergleichsweise unkompliziert Personal rekrutieren. Kritiker weisen jedoch darauf hin, dass die Zuwanderung Infrastruktur und Wohnungsmarkt belaste.

Als Alternativen werden mehrere Massnahmen diskutiert: Erstens solle das inländische Potenzial besser genutzt werden, etwa indem Frauen nach der Familienphase ihr Pensum leichter erhöhen könnten. Voraussetzung dafür seien bezahlbare Kinderbetreuungsplätze. Zweitens könnten ältere Arbeitnehmende länger im Erwerbsleben bleiben, sofern flexible Modelle angeboten würden. Drittens wird gefordert, ausländische Abschlüsse schneller anzuerkennen, damit gut ausgebildete Zugewanderte nicht unter ihrem Qualifikationsniveau arbeiten müssen.

Klar ist: Eine einzelne Massnahme wird nicht ausreichen. Gefragt ist ein Bündel von Lösungen, das von Politik, Unternehmen und Bildungsinstitutionen gemeinsam getragen wird.`,
qs:['m|Der Fachkräftemangel betrifft laut Text nur die Informatik.|Falsch~Richtig','m|Was verstärkt den Mangel?|der demografische Wandel~die Digitalisierung~sinkende Löhne','m|Wie viele Erwerbstätige haben keinen Schweizer Pass?|etwa ein Drittel~etwa die Hälfte~etwa zehn Prozent','m|Was kritisieren manche an der Zuwanderung?|die Belastung von Infrastruktur und Wohnungsmarkt~zu niedrige Qualifikationen~die hohen Steuern','m|Welche Voraussetzung wird für Frauen genannt?|bezahlbare Kinderbetreuung~höhere Löhne~mehr Homeoffice','m|Warum sollen ausländische Abschlüsse schneller anerkannt werden?|damit Zugewanderte entsprechend ihrer Qualifikation arbeiten können~damit weniger Leute einwandern~damit die Universitäten Geld sparen','m|Welche Schlussfolgerung zieht der Text?|Es braucht mehrere Massnahmen gemeinsam.~Die Zuwanderung muss gestoppt werden.~Das Problem löst sich von selbst.']}

lem Spass.~Die Hormone sind schuld.", "m|Wann findet Dr. Hoßfeld Extremsport in Ordnung?|solange die Sicherheit gewährleistet ist~nie~nur ohne Sponsoren"]}, {"id": "sg08", "label": "Track 8", "title": "Radiosendung: Lachforschung", "chapter": "2 Alltag und Routine", "task": "Aufgabe B1", "file": "So Geht's zu B2 2019/So Geht's zu B2 2019/audio/SoGehts_B2_neu_08.mp3", "text": "", "qs": ["m|Professor Niemitz erforscht das Lachen bei Menschenaffen und Menschen.|Richtig~Falsch", "m|Ein Ergebnis: Lachen ist angeboren.|Richtig~Falsch", "m|Warum lachen Babys?|um die Zuwendung anderer zu bekommen~weil sie Witze verstehen~weil sie müde sind", "m|Ab wann setzen Kinder Lachen bewusst als Strategie ein?|im Schulalter (ca. 6–7 Jahre)~mit zwei Jahren~erst in der Pubertät", "m|Zwischen 10 Jahren und Pubertät entwickelt sich vor allem …|die bindende und trennende Funktion in der Gruppe~das Lachen über Witze~das Babylachen", "m|Erwachsene lachen weniger, weil sie weniger lustig sind.|Falsch~Richtig", "m|Woran erkennt man ein echtes Lachen?|Es ist explosiv, die volle Mimik ist in unter einer halben Sekunde da.~Es ist besonders laut.~Es dauert besonders lange.", "m|Falsche Lacher werden vom Gegenüber fast immer erkannt.|Richtig~Falsch", "m|Paviane und Makaken lachen genau wie Schimpansen.|Falsch~Richtig"]}, {"id": "sg09", "label": "Track 9", "title": "Interview Abschnitt 1 (Lücken)", "chapter": "2 Alltag und Routine", "task": "Aufgabe B2", "file": "So Geht's zu B2 2019/So Geht's zu B2 2019/audio/SoGehts_B2_neu_09.mp3", "text": "", "qs": []}, {"id": "sg10", "label": "Track 10", "title": "Gesundheitsmagazin: Reisemedizin", "chapter": "3 Gesundheit und Medizin", "task": "Aufgabe A1", "file": "So Geht's zu B2 2019/So Geht's zu B2 2019/audio/SoGehts_B2_neu_10.mp3", "text": "", "qs": ["m|Dr. Gerber arbeitet am Tropeninstitut in …|Basel~Zürich~Bern", "m|Impfungen werden meistens direkt im Institut gemacht.|Richtig~Falsch", "m|Warum soll man abends in tropischen Ländern eine Taschenlampe mitnehmen?|Viele Gifttiere sind nachts aktiv.~Es gibt keinen Strom.~Man sieht die Sterne besser.", "m|Was soll man im Notfall nach einem Gifttierunfall tun?|ruhig bleiben und sofort medizinische Hilfe suchen~das Tier fangen~abwarten", "m|Starke Sonnenbrände erhöhen bei Kindern bis 15 das Hautkrebsrisiko.|Richtig~Falsch", "m|Leitungswasser in den Tropen darf man in guten Hotels trinken.|Falsch~Richtig", "m|Wie viel sollte man auf Langstreckenflügen pro Stunde trinken?|ca. 150 ml~ca. 500 ml~einen Liter", "m|Wo sollen Diabetiker eine zweite Ration Medikamente mitnehmen?|im Handgepäck, nicht im Koffer~im Koffer~gar nicht", "m|Was hilft bei Reisekrankheit?|Augen schliessen oder feste Punkte fixieren~nach unten schauen~viel essen"]}, {"id": "sg11", "label": "Track 11", "title": "Namen & Ansagen", "chapter": "4 Länder und Reisen", "task": "Aufgabe A1", "file": "So Geht's zu B2 2019/So Geht's zu B2 2019/audio/SoGehts_B2_neu_11.mp3", "text": "", "qs": []}, {"id": "sg12", "label": "Track 12", "title": "Gespräch: Last-Minute-Reise", "chapter": "4 Länder und Reisen", "task": "Aufgabe B1", "file": "So Geht's zu B2 2019/So Geht's zu B2 2019/audio/SoGehts_B2_neu_12.mp3", "text": "", "qs": ["m|Welches Reiseziel hat den frühesten Abflug?|Ägypten (5. März)~Dubai (6. März)~Kuba (7. März)", "m|Von wo fliegt man nach Ägypten?|Graz~Wien~Frankfurt", "m|Welcher Flug ist ein Direktflug?|Ägypten~Kuba~Dubai", "m|Welches Hotel hat nur vier Sterne?|das Hotel in Ägypten~das Hotel in Kuba~das Hotel in Dubai", "m|Wie viel kostet Kuba pro Person?|1455 Euro~1200 Euro~654 Euro", "m|Wo ist Vollpension inbegriffen?|Kuba~Dubai~Ägypten", "m|Wo gibt es keine Angebote für Kinder?|Dubai~Kuba~Ägypten", "m|Wie kommt man in Kuba vom Flughafen ins Hotel?|mit einem Mietwagen (inbegriffen)~mit dem Bus~mit dem Taxi", "m|Wofür entscheidet sich das Paar?|Kuba~Dubai~Ägypten"]}, {"id": "sg13", "label": "Track 13", "title": "Fünf kurze Texte: Reisen", "chapter": "4 Länder und Reisen", "task": "Aufgabe C1", "file": "So Geht's zu B2 2019/So Geht's zu B2 2019/audio/SoGehts_B2_neu_13.mp3", "text": "", "qs": ["m|Die Frau war in Venedig, um sich zu erholen.|Falsch~Richtig", "m|Was kritisiert die Bürgerinitiative „No grandi navi“?|die Kreuzfahrtschiffe~die hohen Preise~das Hochwasser allein", "m|Seit wann gehört das Salzbergwerk Wieliczka zum UNESCO-Weltkulturerbe?|seit 1978~seit 1987~seit 1958", "m|Was kann man im Salzbergwerk auch machen?|heiraten~übernachten~schwimmen", "m|Die Frau hat die letzten 20 Jahre in Peking gelebt.|Richtig~Falsch", "m|Wie viel Trinkgeld ist in Frankreich laut dem Mann üblich?|ca. 10 Prozent~gar keins~ca. 20 Prozent", "m|Wofür interessiert sich der Kunde im Reisebüro?|Astro-Tourismus~Safari-Jagd~Tauchen", "m|Was ist im Botswana-Angebot NICHT inbegriffen?|der Flug~Essen und Trinken~die Unterkunft", "m|Wie beschreibt die Studentin ihr Jahr in Taiwan?|als das aufregendste Jahr ihres Lebens~als schwierig und einsam~als zu teuer"]}, {"id": "sg14", "label": "Track 14", "title": "Radiosendung: Geschichte der Gastarbeiter", "chapter": "5 Menschen und Beziehungen", "task": "Aufgabe A2", "file": "So Geht's zu B2 2019/So Geht's zu B2 2019/audio/SoGehts_B2_neu_14.mp3", "text": "", "qs": ["m|Herr Delatolas kommt von einer griechischen Insel.|Richtig~Falsch", "m|Was war laut Delatolas der eigentliche Grund für die Anwerbung?|ein allgemeiner Arbeitskräftemangel~die Deutschen wollten bestimmte Arbeiten nicht machen~die Löhne waren zu hoch", "m|Die meisten Gastarbeiter wollten ursprünglich für immer in Deutschland bleiben.|Falsch~Richtig", "m|Mit welchem Land wurde 1955 das erste Anwerbeabkommen geschlossen?|Italien~der Türkei~Griechenland", "m|Welches Ereignis machte die Anwerbung 1961 noch dringender?|der Mauerbau~das Wirtschaftswunder~der Zweite Weltkrieg", "m|Was gehörte zu den Problemen der Neuankömmlinge?|Sprachprobleme und das ungewohnte Klima~zu viel Freizeit~zu hohe Mieten", "m|Wie versuchte die Regierung anfangs die Integration?|mit Filmen über die deutsche Mentalität~mit kostenlosen Sprachkursen~mit eigenen Wohnungen"]}, {"id": "sg15", "label": "Track 15", "title": "Diskussion: Online-Dating", "chapter": "5 Menschen und Beziehungen", "task": "Aufgabe B1", "file": "So Geht's zu B2 2019/So Geht's zu B2 2019/audio/SoGehts_B2_neu_15.mp3", "text": "", "qs": ["m|Beate hat ihren Mann über das Internet kennengelernt.|Richtig~Falsch", "m|Soziale Netzwerke werden hauptsächlich als Partnerbörse genutzt.|Falsch~Richtig", "m|Frau Gerloff hat die ersten Jahre nach der Scheidung das Singleleben genossen.|Richtig~Falsch", "m|Was ist laut Frau Gerloff für Frauen ab 50 schwierig?|einen neuen Partner zu finden~online zu gehen~Annoncen zu lesen", "m|Für welche Zielgruppe sind Online-Singlebörsen laut Beate vor allem gedacht?|ab 30~Studenten~über 60", "m|Was empfiehlt der Moderator am Ende?|Mobile-Dating mit GPS-Suche~klassische Annoncen~Speed-Dating"]}, {"id": "sg16", "label": "Track 16", "title": "Gespräch: Malkurse in Köln", "chapter": "6 Kunst und Kultur", "task": "Aufgabe A1", "file": "So Geht's zu B2 2019/So Geht's zu B2 2019/audio/SoGehts_B2_neu_16.mp3", "text": "", "qs": ["m|Welcher Kurs ist am billigsten?|Köln-Poll (12 Euro pro Jahr)~Köln-Kalk~Köln-Zentrum", "m|Wann beginnt der Kurs in Köln-Poll?|am 15. Oktober~am 1. September~am 15. September", "m|Was wird im Zentrum angeboten?|Modern Art~Malen und Zeichnen~Basteln und Werken", "m|Wo kann man sich online anmelden?|in Poll~im Zentrum~in Kalk", "m|Ab welchem Alter ist der Kurs im Zentrum?|ab 12~ab 14~ab 16", "m|Welcher Kurs bietet eine Probestunde an?|Poll~Kalk~Zentrum", "m|Wo ist Ratenzahlung möglich?|Kalk~Poll~Zentrum", "g|Telefonnummer Köln-Kalk: 0221 ___|21 72 13/217213/21.72.13"]}, {"id": "sg17", "label": "Track 17", "title": "Radiosendung: Beruf Journalist", "chapter": "7 Medienlandschaft und Information", "task": "Aufgabe A1", "file": "So Geht's zu B2 2019/So Geht's zu B2 2019/audio/SoGehts_B2_neu_17.mp3", "text": "", "qs": ["m|Ein Journalist verbringt den Grossteil der Zeit mit Reisen.|Falsch~Richtig", "m|Was gehört laut der jungen Frau zum Beruf?|Interviews führen und Pressekonferenzen besuchen~Werbung verkaufen~Filme drehen", "m|Journalisten können auch freiberuflich arbeiten.|Richtig~Falsch", "m|Wovon hängt das Einkommen u. a. ab?|vom Geschlecht, der Branche und der Erfahrung~nur vom Alter~vom Wohnort", "m|Wie wird man Journalist?|Es gibt viele Wege, auch für Quereinsteiger.~Nur über ein Studium.~Nur über eine staatliche Prüfung.", "m|Was kommt bei einem Studium zusätzlich hinzu?|Medien- und Sozialwissenschaften~Fotografie~Wirtschaftsrecht", "m|Wie können Krisenreporter belastende Erlebnisse verarbeiten?|in Seminaren mit Gesprächstherapeuten~gar nicht~durch längere Ferien"]}, {"id": "sg18", "label": "Track 18", "title": "Interview: Invasionsbiologie", "chapter": "8 Natur und Klima", "task": "Aufgabe A4", "file": "So Geht's zu B2 2019/So Geht's zu B2 2019/audio/SoGehts_B2_neu_18.mp3", "text": "", "qs": ["m|Invasionsbiologie beschäftigt sich mit …|der Ausbreitung nicht-einheimischer Arten~dem Schutz seltener Tiere~Haustieren", "m|Warum ist das Jahr 1492 wichtig?|Seitdem hat sich die Ausbreitung fremder Arten stark beschleunigt.~Damals begann die Eiszeit.~Damals wurde die Biologie gegründet.", "m|Der Waschbär wurde in Deutschland zur Jagd und Zucht angesiedelt.|Richtig~Falsch", "m|Warum vermehren sich „Invasoren“ oft sehr schnell?|Sie haben keine natürlichen Feinde.~Es ist wärmer geworden.~Sie werden gefüttert.", "m|Warum wurde die Aga-Kröte nach Australien gebracht?|gegen eine Käferplage~für den Tourismus~als Haustier", "m|Was ist die Folge der Verdrängung heimischer Arten?|Die Lebensgemeinschaft gerät aus dem Gleichgewicht.~Es gibt mehr Arten.~Nichts."]}, {"id": "sg19", "label": "Track 19", "title": "Diskussion: Beruf Tierfilmer", "chapter": "8 Natur und Klima", "task": "Aufgabe A5", "file": "So Geht's zu B2 2019/So Geht's zu B2 2019/audio/SoGehts_B2_neu_19.mp3", "text": "", "qs": ["m|Leon glaubt, dass Tierfilmer ein Beruf mit Zukunft in Deutschland ist.|Falsch~Richtig", "m|Was braucht ein Tierfilmer laut Frau Roth?|zoologisches Wissen und Aufnahmetechnik~nur eine Kamera~eine Schauspielausbildung", "m|Welche Ausbildung hat Frau Roth zuerst gemacht?|Technische Zeichnerin~Fotografin~Tierärztin", "m|Frau Roth war auf Expeditionen immer allein unterwegs.|Falsch~Richtig", "m|Was ist dem Kameramann Andy passiert?|Er wurde von einem Elefanten angegriffen.~Er hat sich verlaufen.~Er wurde krank.", "m|Was ist laut Leon besonders wichtig?|das Verhalten der Tiere gut zu kennen~möglichst nah heranzugehen~teure Technik"]}, {"id": "sg20", "label": "Track 20", "title": "Vortrag: Jugend forscht", "chapter": "9 Technik und Fortschritt", "task": "Aufgabe A1", "file": "So Geht's zu B2 2019/So Geht's zu B2 2019/audio/SoGehts_B2_neu_20.mp3", "text": "", "qs": ["m|Wer darf an „Jugend forscht“ teilnehmen?|Personen bis 21 Jahre~nur Studenten~alle Altersgruppen", "m|Was gewinnen die Bundessieger meistens?|Geld, Sachpreise, Praktika oder Reisen~einen Studienplatz~ein Auto", "m|In welchem Gebiet werden die meisten Arbeiten eingereicht?|Biologie~Physik~Technik", "m|Wer sollte ein Projekt begleiten?|ein Betreuer mit Fachwissen, meist ein Lehrer~die Eltern~niemand", "m|Was ist laut Sprecher oft sinnvoller, um an Ausrüstung zu kommen?|Universitäten oder Firmen direkt fragen~alles selbst kaufen~im Internet bestellen", "m|Was ist wichtiger als Talent?|Neugier, Fleiss und Durchhaltevermögen~gute Noten~viel Geld", "m|Was lernt man durch die Präsentation?|wie man ein Produkt bewirbt und verständlich erklärt~wie man programmiert~wie man Geld spart"]}, {"id": "sg21", "label": "Track 21", "title": "Fünf kurze Texte: Studium", "chapter": "10 Studium und Studentenleben", "task": "Aufgabe A1", "file": "So Geht's zu B2 2019/So Geht's zu B2 2019/audio/SoGehts_B2_neu_21.mp3", "text": "", "qs": ["m|Wie oft kann man zum Nobelpreisträgertreffen eingeladen werden?|nur einmal im Leben~jedes Jahr~zweimal", "m|Die Ruderregatta findet zwischen einer polnischen und einer deutschen Universität statt.|Richtig~Falsch", "m|Julia ist durch die Prüfung gefallen.|Falsch~Richtig", "m|Warum hat Julia den Termin verpasst?|Ihr Handy war kaputt.~Sie war krank.~Der Zug hatte Verspätung.", "m|Wobei hilft der Servicepoint?|Bewerbungen, Prüfungsanmeldungen, Beurlaubung~Wohnungssuche~Jobsuche", "m|Der Servicepoint ist in den Semesterferien geschlossen.|Falsch~Richtig", "m|Wo wohnt der Student jetzt?|im Studentenwohnheim~in einer WG~bei den Eltern", "m|Warum ist er aus der WG ausgezogen?|Die Chemie zwischen den Mitbewohnern stimmte nicht.~Die Miete war zu hoch.~Die WG war zu weit weg.", "m|Die Studentin weiss schon, was sie studieren will.|Falsch~Richtig"]}, {"id": "sg22", "label": "Track 22", "title": "Vortrag: Tipps zum Semesterbeginn", "chapter": "10 Studium und Studentenleben", "task": "Aufgabe B1", "file": "So Geht's zu B2 2019/So Geht's zu B2 2019/audio/SoGehts_B2_neu_22.mp3", "text": "", "qs": ["m|Was rät der Studienberater zuerst?|die Einführungsveranstaltungen unbedingt zu besuchen~sofort zu lernen~einen Job zu suchen", "m|Welches Problem kennt der Berater gut?|Einsamkeit~zu wenig Geld~zu viele Prüfungen", "m|Was sagt er über den Hochschulsport?|Es gibt eine riesige Auswahl zu günstigen Bedingungen.~Er ist teuer.~Er ist nur für Profis.", "m|Wann kann man die Hotline der Uni anrufen?|rund um die Uhr~nur vormittags~nur in den Ferien", "m|Lernen an der Uni ist wie in der Schule.|Falsch~Richtig", "m|Wofür kann man die Campus-App nutzen?|Stundenplan, Seminare und Prüfungstermine~Essen bestellen~Bücher kaufen", "m|Was kann man mit der iMensa-App?|Speisepläne abrufen und bewerten~Mensa-Essen bezahlen~einen Tisch reservieren"]}, {"id": "sg23", "label": "Track 23", "title": "Diskussion: Berufsberatung", "chapter": "11 Arbeitswelt und Recht", "task": "Aufgabe A1", "file": "So Geht's zu B2 2019/So Geht's zu B2 2019/audio/SoGehts_B2_neu_23.mp3", "text": "", "qs": ["m|Was ist eine Integrierte Gesamtschule?|eine Schule für alle Kinder, unabhängig vom angestrebten Abschluss~eine Schule nur für ausländische Kinder~ein Gymnasium", "m|Was wurde im zweiten Schritt der Workshops erarbeitet?|konkrete Handlungsschritte zum Berufswunsch~Bewerbungsfotos~ein Lebenslauf", "m|Warum mussten die Workshops wiederholt werden?|Das Interesse war sehr gross.~Sie waren schlecht.~Der Berater war krank.", "m|Wo arbeitet Herr Meerstein ausserhalb der Sprechzeiten?|bei der Agentur für Arbeit~in einer Privatfirma~an der Universität", "m|Was passiert oft, wenn man irgendeine freie Ausbildung beginnt?|Man bricht die Ausbildung ab.~Man wird befördert.~Man verdient mehr.", "m|Was ist ein Berufsparcours?|eine Art Minipraktikum, um Berufe auszuprobieren~ein Sportwettkampf~eine Jobmesse für Erwachsene"]}, {"id": "sg24", "label": "Track 24", "title": "Gespräch: Ausflüge ab Wien", "chapter": "12 Politik und Wirtschaft", "task": "Aufgabe A1", "file": "So Geht's zu B2 2019/So Geht's zu B2 2019/audio/SoGehts_B2_neu_24.mp3", "text": "", "qs": ["m|Woher kommt die Firma von Herrn Steinberger?|aus der Schweiz~aus Österreich~aus Deutschland", "m|Wie viel kostet der Tagesausflug nach Salzburg?|178 Euro~110 Euro~45 Euro", "m|Wie lange dauert der Spaziergang durch Alt-Wien?|fünfeinhalb Stunden~zehn Stunden~zwölf Stunden", "m|Was gibt es in Graz?|einen Rundgang mit einem Nachtwächter~den Besuch von Mozarts Geburtshaus~die Hofburg", "m|Wie viele Personen dürfen maximal beim Wien-Spaziergang mit?|8~10~12", "m|Bei welchem Angebot sind Eintritt und Mittagessen inbegriffen?|Salzburg~Graz~Wien", "m|In wie vielen Sprachen gibt es die Wien-Tour?|3~7~10", "m|Den Wien-Spaziergang kann man online buchen.|Falsch~Richtig"]}, {"id": "sg25", "label": "Track 25", "title": "Radiosendung: Kapitalismus und Klimawandel", "chapter": "12 Politik und Wirtschaft", "task": "Aufgabe B1", "file": "So Geht's zu B2 2019/So Geht's zu B2 2019/audio/SoGehts_B2_neu_25.mp3", "text": "", "qs": ["m|Worum geht es in der Sendung?|Kapitalismus und Klimawandel~Tourismus in Afrika~Autoindustrie", "m|Was fand Frau Kaufmann besonders schlimm?|den Bericht über die Erdölgewinnung in Nigeria~die Preise für Benzin~den Film selbst", "m|Was kritisieren die Menschen in Nigeria?|Korruption und fehlende Investitionen in die Lebensumstände~zu viele Touristen~zu hohe Steuern", "m|Was fordert die Naturschützerin?|Reformen innerhalb des Kapitalismus~die Abschaffung aller Autos~mehr Wachstum", "m|Frau Stadler hält die Umweltprobleme innerhalb des bestehenden Systems für lösbar.|Richtig~Falsch", "m|Was sagen Klimawandelskeptiker?|Die Klimamodelle seien zu ungenau für verlässliche Vorhersagen.~Der Klimawandel ist bewiesen.~Kapitalismus ist schuld."]}]}, {"title": "Sicher! B2.1 – Kursbuch-Hörtexte", "level": "B2", "note": "Lektionen 1–5 (Freunde, In der Firma, Medien, Nach der Schule, Körperbewusstsein). Ideal zum Shadowing.", "tracks": [{"id": "kb02", "label": "1-02", "title": "Hören, Aufgabe 2, Abschnitt 1", "chapter": "Sicher! B2.1 L1 Freunde", "task": "", "file": "Sicher B21/audio KB/1-02 L01_Hoeren_Aufgabe 2a_1.mp3", "text": "", "qs": []}, {"id": "kb03", "label": "1-03", "title": "Aufgabe 2, Abschnitt 2", "chapter": "Sicher! B2.1 L1 Freunde", "task": "", "file": "Sicher B21/audio KB/1-03 L01_Hoeren_Aufgabe 2a_2.mp3", "text": "", "qs": ["m|Wie viele enge Freunde hat der Experte ungefähr?|ein halbes Dutzend~hunderte~zwei", "m|Wie nennt er seine engen Freunde?|Lebenszeugen~Kollegen~Nachbarn", "m|Laut Studien wird Freundschaft immer weniger wichtig.|Falsch~Richtig", "m|Was bedeutet „friend“ in den USA laut Experte?|fast alle Menschen, die man etwas besser kennt~nur enge Freunde~Familienmitglieder"]}, {"id": "kb04", "label": "1-04", "title": "Aufgabe 2, Abschnitt 3", "chapter": "Sicher! B2.1 L1 Freunde", "task": "", "file": "Sicher B21/audio KB/1-04 L01_Hoeren_Aufgabe 2a_3.mp3", "text": "", "qs": ["m|Was beobachtet Herr Bader?|Männerfreundschaften werden ab 30 seltener.~Männer haben mehr Freunde als Frauen.~Freundschaften im Internet sind besser.", "m|Wann nimmt die Zahl der Freunde laut Experte oft ab?|wenn man eine Familie gründet~in der Schulzeit~nach der Pensionierung"]}, {"id": "kb05", "label": "1-05", "title": "Aufgabe 2, Abschnitt 1", "chapter": "Sicher! B2.1 L1 Freunde", "task": "", "file": "Sicher B21/audio KB/1-05 L01_Hoeren_Aufgabe 2a_4.mp3", "text": "", "qs": ["m|Lissy findet es leicht, Freunde zu finden.|Falsch~Richtig", "m|Wie alt ist Lissy?|17~27~15", "m|Was rät der Experte indirekt?|bei Gesprächen genau hinzuhören~sich neue Freunde online zu suchen~nur über Persönliches zu sprechen"]}, {"id": "kb06", "label": "1-06", "title": "Aufgabe 2, Abschnitt 5", "chapter": "Sicher! B2.1 L1 Freunde", "task": "", "file": "Sicher B21/audio KB/1-06 L01_Hoeren_Aufgabe 2a_5.mp3", "text": "", "qs": ["m|Warum hat Frau Herrmann ihre Freundin verloren?|Nach dem Umzug schlief die Freundschaft langsam ein.~Sie hatten Streit.~Die Freundin ist gestorben.", "m|Was ist laut Experte das Wichtigste, um Freundschaften zu pflegen?|sich ab und zu melden~sich jede Woche treffen~gemeinsam Urlaub machen"]}, {"id": "kb07", "label": "1-07", "title": "Einstieg, Aufgabe 1c", "chapter": "Sicher! B2.1 L2 In Der Firma", "task": "", "file": "Sicher B21/audio KB/1-07 L02_Einstieg_Aufgabe 1.mp3", "text": "", "qs": ["m|Wofür ist Herr Lange zuständig?|Infotainment im Auto~Personal~Marketing", "m|Warum beginnt er um 7.30 Uhr?|wegen der Staus im Berufsverkehr~weil die Kantine dann öffnet~weil sein Chef es will", "m|Wie lange ist seine Mittagspause?|30 Minuten~eine Stunde~15 Minuten"]}, {"id": "kb08", "label": "1-08", "title": "Hören, Aufgabe 1b", "chapter": "Sicher! B2.1 L2 In Der Firma", "task": "", "file": "Sicher B21/audio KB/1-08 L02_Hoeren_Aufgabe 1b.mp3", "text": "", "qs": []}, {"id": "kb09", "label": "1-09", "title": "Aufgabe 2 (gesamt)", "chapter": "Sicher! B2.1 L2 In Der Firma", "task": "", "file": "Sicher B21/audio KB/1-09 L02_Hoeren_Aufgabe 2.mp3", "text": "", "qs": []}, {"id": "kb10", "label": "1-10", "title": "Aufgabe 3, Abschnitt 1", "chapter": "Sicher! B2.1 L2 In Der Firma", "task": "", "file": "Sicher B21/audio KB/1-10 L02_Hoeren_Aufgabe 3_1.mp3", "text": "", "qs": ["m|Was machen die Angestellten in der Extrapause?|Entspannungsübungen auf Kissen~Sport im Fitnessstudio~einen Spaziergang", "m|Die Mitarbeiter fanden die Idee am Anfang ungewohnt.|Richtig~Falsch"]}, {"id": "kb11", "label": "1-11", "title": "Aufgabe 3, Abschnitt 2", "chapter": "Sicher! B2.1 L2 In Der Firma", "task": "", "file": "Sicher B21/audio KB/1-11 L02_Hoeren_Aufgabe 3_2.mp3", "text": "", "qs": ["m|Wer hatte die Idee mit den Entspannungskursen?|die Geschäftsführerin Marta Wolf~ein Mitarbeiter~der Coach", "m|Was ist einem Geschäftspartner von Frau Wolf passiert?|Er hatte einen Zusammenbruch (Burnout).~Er hat gekündigt.~Er hat einen Unfall gehabt."]}, {"id": "kb12", "label": "1-12", "title": "Aufgabe 3, Abschnitt 3", "chapter": "Sicher! B2.1 L2 In Der Firma", "task": "", "file": "Sicher B21/audio KB/1-12 L02_Hoeren_Aufgabe 3_3.mp3", "text": "", "qs": ["m|Wie oft findet die „Sitzung“ statt?|einmal pro Woche mittags~jeden Tag~einmal im Monat", "m|Wie lange dauert sie?|15 bis 20 Minuten~eine Stunde~5 Minuten", "m|Frau Wolf macht immer bei den Pausen mit.|Falsch~Richtig"]}, {"id": "kb13", "label": "1-13", "title": "Hören, Aufgabe 2, Abschnitt 1", "chapter": "Sicher! B2.1 L3 Medien", "task": "", "file": "Sicher B21/audio KB/1-13 L03_Hoeren_Aufgabe 2_1.mp3", "text": "", "qs": ["m|Wie heisst der Film?|Almanya – Willkommen in Deutschland~Gegen die Wand~Türkisch für Anfänger", "m|Was verkündet Grossmutter Fatma?|dass sie und Hüseyin einen deutschen Pass haben~dass sie zurück in die Türkei ziehen~dass sie heiraten", "m|Was hat Hüseyin gekauft?|ein Haus in der Türkei~ein Auto~ein Restaurant"]}, {"id": "kb14", "label": "1-14", "title": "Aufgabe 2, Abschnitt 2", "chapter": "Sicher! B2.1 L3 Medien", "task": "", "file": "Sicher B21/audio KB/1-14 L03_Hoeren_Aufgabe 2_2.mp3", "text": "", "qs": ["m|Wer hat den Film gemacht?|die Schwestern Samdereli~ein Hollywood-Regisseur~der Grossvater", "m|Wie viele Zuschauer sahen den Film in Deutschland?|über 1,4 Millionen~140.000~14 Millionen", "m|Welchen Preis bekam der Film u. a.?|bestes Drehbuch~beste Musik~beste Kamera"]}, {"id": "kb15", "label": "1-15", "title": "Aufgabe 4b, Abschnitt 1", "chapter": "Sicher! B2.1 L3 Medien", "task": "", "file": "Sicher B21/audio KB/1-15 L03_Hoeren_Aufgabe 4_1.mp3", "text": "", "qs": []}, {"id": "kb16", "label": "1-16", "title": "Aufgabe 4b, Abschnitt 2", "chapter": "Sicher! B2.1 L3 Medien", "task": "", "file": "Sicher B21/audio KB/1-16 L03_Hoeren_Aufgabe 4_2.mp3", "text": "", "qs": []}, {"id": "kb17", "label": "1-17", "title": "Aufgabe 4b, Abschnitt 3", "chapter": "Sicher! B2.1 L3 Medien", "task": "", "file": "Sicher B21/audio KB/1-17 L03_Hoeren_Aufgabe 4_3.mp3", "text": "", "qs": []}, {"id": "kb18", "label": "1-18", "title": "Hören, Aufgabe 2, Abschnitt 1", "chapter": "Sicher! B2.1 L4 Nach Der Schule", "task": "", "file": "Sicher B21/audio KB/1-18 L04_Hoeren_Aufgabe 2_1.mp3", "text": "", "qs": ["m|Was bedeutet „Work & Travel“?|Arbeiten und Reisen~Studieren und Reisen~Urlaub machen", "m|Wobei helfen Agenturen vor allem?|bei der Jobsuche und bei Problemen~beim Studium~beim Sprachenlernen", "m|Wo war Florian ein Jahr lang?|in Australien~in Kanada~in Neuseeland"]}, {"id": "kb19", "label": "1-19", "title": "Aufgabe 2, Abschnitt 2", "chapter": "Sicher! B2.1 L4 Nach Der Schule", "task": "", "file": "Sicher B21/audio KB/1-19 L04_Hoeren_Aufgabe 2_2.mp3", "text": "", "qs": ["m|Was braucht man für Work & Travel eigentlich nur?|ein Visum~eine Agentur~viel Geld", "m|Wie kam Florian auf die Idee?|Eine Kollegin hat ihm davon erzählt.~Seine Eltern wollten es.~Er hat eine Werbung gesehen.", "m|Florian hat seine Entscheidung bereut.|Falsch~Richtig"]}, {"id": "kb20", "label": "1-20", "title": "Aufgabe 2, Abschnitt 3", "chapter": "Sicher! B2.1 L4 Nach Der Schule", "task": "", "file": "Sicher B21/audio KB/1-20 L04_Hoeren_Aufgabe 2_3.mp3", "text": "", "qs": ["m|Woh  redemittel:['Grüezi, ich bin neu hier im 2. Stock.','Wie lange wohnen Sie schon hier?','Wie funktioniert das mit der Waschküche?','Könnten Sie vielleicht … ?','Das ist sehr nett von Ihnen!'],
 model:'Grüezi! Ich bin Ihre neue Nachbarin, ich wohne im zweiten Stock. Mein Name ist Priya Patel. – Ah, willkommen! Ich bin Frau Keller. – Wohnen Sie schon lange hier? – Seit zwölf Jahren. – Darf ich Sie etwas fragen? Wie funktioniert das mit der Waschküche? – Es gibt einen Waschplan, Sie haben jeden Dienstag. – Danke! Und noch eine Bitte: Wir fahren im Juli zwei Wochen in die Ferien. Könnten Sie vielleicht unsere Pflanzen giessen? – Ja, gern. – Das ist sehr nett von Ihnen! Ich bringe Ihnen dann den Schlüssel.'},
{id:'s-b1-gemeinde',level:'B1',exam:'fide-Szenario B1',title:'Auf der Gemeinde: Problem erklären',short:'Höflich ein Problem darstellen, nachfragen, Lösung finden',time:3,prep:2,

{id:'s-b1-vermieter',level:'B1',exam:'fide-Szenario B1',title:'Telefonat mit der Verwaltung: Heizung defekt',short:'Beschweren, Dringlichkeit ausdrücken, Termin vereinbaren',time:3,prep:2,

 redemittel:['Ich rufe an wegen …','Ich habe das Problem bereits am … gemeldet.','Leider ist bis heute niemand gekommen.','Das ist für uns wirklich nicht akzeptabel, weil …','Ich muss Sie bitten, …','Bis wann kann ein Techniker kommen?','Ich erwarte, dass …'],
 model:'Guten Tag, hier spricht Elena Rossi, Albisstrasse 12, dritter Stock links. Ich rufe wegen unserer Heizung an. Sie funktioniert seit fünf Tagen nicht mehr. Ich habe das Problem bereits letzten Mittwoch gemeldet und man hat mir gesagt, dass innerhalb von zwei Tagen ein Techniker kommt. Leider ist bis heute niemand gekommen. In der Wohnung sind es nur 16 Grad und wir haben zwei kleine Kinder. Das ist für uns wirklich nicht akzeptabel. Ich muss Sie bitten, dass spätestens morgen jemand kommt. – Könnten Sie mir bitte einen genauen Termin geben? … Gut, dann morgen zwischen 8 und 10 Uhr. Ich bitte Sie, mir das per E-Mail zu bestätigen. Vielen Dank.'},
{id:'s-b1-planen',level:'B1',exam:'Goethe B1 Sprechen Teil 1',title:'Gemeinsam etwas planen: Abschiedsfest',short:'Vorschläge machen, reagieren, sich einigen',time:3,prep:2,
 prompt:'<p>Eine Kollegin verlässt nach zehn Jahren die Firma. Planen Sie mit einem Kollegen ein kleines Abschiedsfest. (Sprechen Sie beide Rollen oder üben Sie Ihre Hälfte.)</p>',points:['Wann und wo?','Essen und Getränke?','Geschenk?','Wer macht was?'],
 redemittel:['Was hältst du davon, wenn wir …?','Wie wäre es mit …?','Das ist eine gute Idee, aber …','Ich schlage vor, dass …','Einverstanden. / Lass uns das so machen.','Wer kümmert sich um …?','Ich kann … übernehmen.'],
 model:'Wie wäre es, wenn wir das Fest am Freitag nach der Arbeit machen? – Gute Idee, dann haben alle Zeit. Wo sollen wir feiern? – Ich schlage vor, dass wir den Sitzungsraum im Erdgeschoss nehmen. – Einverstanden. Und was gibt es zu essen? – Wir könnten Apéro-Häppchen beim Bäcker bestellen. – Ja, und Getränke kaufe ich im Coop. Was schenken wir ihr? – Sie wandert gern. Was hältst du von einem Gutschein für ein Wellness-Wochenende in den Bergen? – Super! Dann sammle ich das Geld. – Und ich schreibe die Einladung an alle. Lass uns das so machen.'},
{id:'s-b1-stadtland',level:'B1',exam:'Goethe B1 Sprechen Teil 2',title:'Präsentation: Leben in der Stadt oder auf dem Land?',short:'Struktur, eigene Erfahrung, Situation im Heimatland, Vor-/Nachteile, Meinung',time:4,prep:3,
 prompt:'<p>Halten Sie eine kurze Präsentation (3–4 Min.) zum Thema „Wohnen in der Stadt oder auf dem Land?“.</p>',points:['Thema vorstellen und Struktur nennen','Eigene Erfahrung','Situation im Heimatland','Vor- und Nachteile','Eigene Meinung und Abschluss'],
 redemittel:['Ich möchte über das Thema … sprechen.','Zuerst …, dann …, zum Schluss …','Ich persönlich habe … erlebt.','In meinem Heimatland ist es so, dass …','Ein Vorteil ist …, ein Nachteil …','Meiner Meinung nach …','Vielen Dank für Ihre Aufmerksamkeit.'],
 model:'Ich möchte heute über das Thema „Wohnen in der Stadt oder auf dem Land“ sprechen. Zuerst erzähle ich von meiner Erfahrung, dann von der Situation in meinem Heimatland, danach nenne ich Vor- und Nachteile und zum Schluss sage ich meine Meinung. Ich habe lange in London und Hongkong gewohnt, also in sehr grossen Städten. Jetzt wohne ich in einem kleinen Ort bei Zürich. In England ziehen viele junge Leute in die Städte, weil es dort mehr Arbeit gibt. Ein Vorteil der Stadt ist das grosse Angebot an Kultur und die kurzen Wege. Ein Nachteil sind die hohen Mieten und der Lärm. Auf dem Land ist es ruhiger und man ist schnell in der Natur, aber man braucht oft ein Auto. Meiner Meinung nach ist die Schweiz ideal, weil man auf dem Land wohnen und trotzdem mit dem Zug schnell in der Stadt sein kann. Vielen Dank für Ihre Aufmerksamkeit.'},
{id:'s-b2-vortrag1',level:'B2',exam:'Goethe B2 Sprechen Teil 1',title:'Vortrag: Sollen Kinder schon früh eine Fremdsprache lernen?',short:'ca. 4 Min., Struktur – Situation Heimatland – Vor-/Nachteile – Meinung',time:4,prep:15,
 prompt:'<p>Halten Sie einen Vortrag (ca. 4 Minuten). Danach beantworten Sie Fragen der Prüfer.</p>',points:['Beschreiben Sie verschiedene Möglichkeiten (z. B. Kindergarten, Primarschule, später).','Beschreiben Sie eine Möglichkeit genauer.','Nennen Sie Vor- und Nachteile und bewerten Sie diese.'],
 redemittel:['In meinem Vortrag geht es um die Frage, ob …','Ich werde zunächst …, anschliessend …, abschliessend …','Es gibt verschiedene Möglichkeiten: …','Ein Argument dafür ist …, dagegen spricht, dass …','Aus meiner Sicht überwiegen die Vorteile, weil …','Zusammenfassend lässt sich sagen, dass …','Ich danke Ihnen für Ihre Aufmerksamkeit und beantworte gern Ihre Fragen.'],
 model:'In meinem Vortrag geht es um die Frage, ob Kinder schon früh eine Fremdsprache lernen sollten. Ich werde zunächst verschiedene Möglichkeiten vorstellen, anschliessend eine davon genauer beschreiben und abschliessend Vor- und Nachteile abwägen. Grundsätzlich kann man eine Fremdsprache spielerisch im Kindergarten, in der Primarschule oder erst ab der Sekundarstufe lernen. In der Schweiz beginnen Kinder in den meisten Kantonen in der Primarschule mit einer zweiten Landessprache und mit Englisch. Diese Variante möchte ich genauer betrachten. Ein wichtiges Argument dafür ist, dass jüngere Kinder Aussprache und Intonation besonders leicht übernehmen. Zudem bauen sie keine Hemmungen auf. Dagegen spricht, dass zwei Fremdsprachen gleichzeitig manche Kinder überfordern, insbesondere wenn sie zu Hause schon eine andere Sprache sprechen. Ausserdem fehlen oft qualifizierte Lehrpersonen. Aus meiner Sicht überwiegen dennoch die Vorteile – vorausgesetzt, der Unterricht ist spielerisch und die Klassen sind nicht zu gross. Zusammenfassend lässt sich sagen: Früher Beginn ja, aber mit realistischen Zielen. Ich danke Ihnen für Ihre Aufmerksamkeit.'},
{id:'s-b2-vortrag2',level:'B2',exam:'Goethe B2 Sprechen Teil 1',title:'Vortrag: Homeoffice – Zukunftsmodell oder Risiko?',short:'ca. 4 Min.',time:4,prep:15,

{id:'s-b2-disk1',level:'B2',exam:'Goethe B2 Sprechen Teil 2',title:'Diskussion: Sollten Läden am Sonntag öffnen?',short:'ca. 5 Min., Argumente austauschen, reagieren, Kompromiss',time:5,prep:5,

{id:'s-b2-einb',level:'B2',exam:'Einbürgerungsgespräch SZ/ZG',title:'Einbürgerungsgespräch: Motivation & Integration',short:'Fragen zu Ihrer Person, Motivation, Alltag, Staatskunde',time:6,prep:3,
 prompt:'<p>Beantworten Sie die typischen Fragen eines Einbürgerungsgesprächs ausführlich (je 30–60 Sekunden):</p><ol><li>Warum möchten Sie sich einbürgern lassen?</li><li>Wie sind Sie in Ihrer Gemeinde integriert (Verein, Nachbarn, Freiwilligenarbeit)?</li><li>Was gefällt Ihnen an der Schweiz – und was weniger?</li><li>Erklären Sie, wie die direkte Demokratie funktioniert (Initiative, Referendum).</li><li>Wie viele Mitglieder hat der Bundesrat und wie wird er gewählt?</li><li>Nennen Sie Rechte und Pflichten von Schweizer Bürgerinnen und Bürgern.</li><li>Was wissen Sie über Ihren Kanton (Hauptort, Regierung, Parlament)?</li></ol>',
 redemittel:['Ich lebe seit … Jahren in der Schweiz und fühle mich hier zu Hause.','Ich möchte nicht nur hier leben, sondern auch mitbestimmen.','Ich engagiere mich im … / Ich bin Mitglied im …','Mit einer Volksinitiative können 100 000 Stimmberechtigte eine Verfassungsänderung verlangen.','Mit dem fakultativen Referendum (50 000 Unterschriften) kann das Volk über ein Gesetz abstimmen.','Der Bundesrat hat sieben Mitglieder und wird von der Vereinigten Bundesversammlung gewählt.','Zu den Pflichten gehören …, zu den Rechten …'],
 model:'Ich lebe seit elf Jahren in der Schweiz, die meiste Zeit im Kanton Zürich. Die Schweiz ist für mich und meine Familie zur Heimat geworden. Ich möchte mich einbürgern lassen, weil ich nicht nur hier leben, arbeiten und Steuern bezahlen, sondern auch mitbestimmen möchte – zum Beispiel bei Abstimmungen über Themen, die meine Gemeinde betreffen. … Die Schweiz ist eine direkte Demokratie: Mit einer Volksinitiative können 100 000 Stimmberechtigte innerhalb von 18 Monaten eine Änderung der Bundesverfassung verlangen. Mit dem fakultativen Referendum können 50 000 Stimmberechtigte innerhalb von 100 Tagen verlangen, dass das Volk über ein vom Parlament beschlossenes Gesetz abstimmt. Verfassungsänderungen unterliegen dem obligatorischen Referendum und brauchen das Volks- und das Ständemehr. Der Bundesrat ist die Regierung; er hat sieben Mitglieder, die von der Vereinigten Bundesversammlung für vier Jahre gewählt werden. … Zu den Rechten gehören das Stimm- und Wahlrecht, die Meinungsfreiheit und die Niederlassungsfreiheit; zu den Pflichten gehören die Steuerpflicht, die Schulpflicht und für Männer die Militär- oder Zivildienstpflicht.'}
],

 redemittel:['Lieber …','wie geht es dir? Ich muss dir etwas erzählen: …','Die Wohnung ist … und hat …','Wir sind umgezogen, weil …','Hast du Lust, mich am … zu besuchen?','Ich freue mich auf deine Antwort!','Viele Grüsse'],
 model:'Lieber Thomas\n\nwie geht es dir? Endlich wohnen wir in unserer neuen Wohnung in Affoltern am Albis! Sie hat vier Zimmer, eine moderne Küche und einen grossen Balkon mit Blick auf die Berge. Wir sind umgezogen, weil die alte Wohnung für uns zu klein war und wir näher an der Schule unserer Tochter wohnen wollten. Der Umzug war anstrengend, aber jetzt ist fast alles eingerichtet. Hast du Lust, uns am Samstag, den 14., zu besuchen? Dann grillieren wir auf dem Balkon.\n\nIch freue mich auf deine Antwort!\nViele Grüsse\nDaniel'},
{id:'w-b1-t2a',level:'B1',exam:'Goethe B1 Schreiben Teil 2',title:'Forumsbeitrag: Smartphones für Kinder?',words:80,time:25,
 prompt:'<p>Sie haben in einer Fernsehsendung eine Diskussion zum Thema „Ab welchem Alter sollten Kinder ein Smartphone haben?“ gesehen. Im Online-Gästebuch der Sendung finden Sie folgende Meinung: <i>„Kinder brauchen heute schon in der Primarschule ein Handy. So können die Eltern sie immer erreichen.“ (Katrin)</i>. Schreiben Sie nun Ihre Meinung (ca. 80 Wörter).</p>',
 redemittel:['Ich habe die Diskussion mit Interesse verfolgt.','Ich bin (nicht) der Meinung von Katrin, weil …','Einerseits …, andererseits …','Ich finde es wichtig, dass …','Zum Schluss möchte ich sagen, dass …'],
 model:'Ich habe die Diskussion mit grossem Interesse verfolgt. Ich verstehe Katrin, denn es ist praktisch, wenn Eltern ihre Kinder erreichen können. Trotzdem bin ich nicht ihrer Meinung. Meiner Meinung nach brauchen Kinder in der Primarschule noch kein Smartphone, weil sie sonst zu viel Zeit am Bildschirm verbringen und weniger draussen spielen. Ausserdem gibt es Risiken im Internet. Ein einfaches Handy ohne Internet wäre ein guter Kompromiss. Ein eigenes Smartphone sollten Kinder erst mit etwa zwölf Jahren bekommen.'},

{id:'w-b2-t1a',level:'B2',exam:'Goethe B2 Schreiben Teil 1',title:'Forumsbeitrag: Wohnen in der Stadt',words:150,time:50,
 prompt:'<p>Sie schreiben einen Beitrag in einem Online-Forum zum Thema <b>„Immer mehr Menschen zieht es in die Städte – eine gute Entwicklung?“</b>. Behandeln Sie die folgenden Punkte (ca. 150 Wörter). Achten Sie auf eine Einleitung und einen Schluss.</p>',points:['Ihre Meinung zu dieser Entwicklung','Gründe, warum Menschen in die Stadt ziehen','Folgen für ländliche Regionen','Alternativen / Lösungsvorschläge'],
 redemittel:['In letzter Zeit wird viel darüber diskutiert, ob …','Ich persönlich bin der Ansicht, dass …','Einer der Hauptgründe dafür ist …','Dies hat zur Folge, dass …','Eine mögliche Lösung wäre …','Abschliessend möchte ich festhalten, dass …'],
 model:'In letzter Zeit wird viel darüber diskutiert, ob der Zuzug in die Städte eine positive Entwicklung ist. Ich persönlich sehe diese Entwicklung mit gemischten Gefühlen.\n\nEiner der Hauptgründe, warum Menschen in die Stadt ziehen, ist zweifellos das Arbeitsangebot. Hinzu kommen bessere Bildungsmöglichkeiten, ein vielfältiges Kulturangebot und kurze Wege. Gerade junge Erwachsene schätzen diese Vorteile.\n\nFür ländliche Regionen hat dies jedoch erhebliche Folgen: Schulen und Geschäfte schliessen, Busverbindungen werden reduziert und die Bevölkerung wird älter. Gleichzeitig steigen in den Städten die Mieten, sodass sich Familien mit mittlerem Einkommen das Stadtleben kaum noch leisten können.\n\nEine mögliche Lösung wäre, Homeoffice und Co-Working-Räume auf dem Land zu fördern und den öffentlichen Verkehr auszubauen. Die Schweiz zeigt, dass ein dichtes Bahnnetz Wohnen auf dem Land attraktiv machen kann.\n\nAbschliessend möchte ich festhalten, dass Stadt und Land nicht gegeneinander ausgespielt werden sollten – beide brauchen gezielte Förderung.'},
{id:'w-b2-t2a',level:'B2',exam:'Goethe B2 Schreiben Teil 2',title:'Formelle Nachricht: Beschwerde an die Liegenschaftsverwaltung',words:100,time:25,formal:true,
 prompt:'<p>In Ihrem Haus wird seit Wochen renoviert. Die Arbeiten beginnen jeden Morgen um 6.30 Uhr, obwohl in der Hausordnung 7 Uhr steht. Ausserdem ist der Lift seit zwei Wochen ausser Betrieb. Schreiben Sie an die Verwaltung (ca. 100 Wörter).</p>',points:['Grund des Schreibens','Problem genau beschreiben','Folgen für Sie','Forderung / Lösungsvorschlag'],

function backupNag(){const lb=S.lastBackup;if(lb&&daysBetween(lb,today())<7)return '';return `<div class="fb warn small">${L('Ihr Fortschritt wird im Browser gespeichert.','Your progress is stored in the browser.')} ${lb?L('Letztes Backup: '+lb+'.','Last backup: '+lb+'.'):L('Noch kein Backup.','No backup yet.')} <a href="#" onclick="event.preventDefault();backupNow()">💾 Jetzt sichern</a></div>`}

/* UNIT */
R.unit=function(id,tab){const u=unitById(id);if(!u)return R.path();

    ${u.swiss?`<div class="card" style="margin-top:14px"><b>🇨🇭 Schweiz-Hinweis</b><p class="small" style="margin:6px 0 0">${TH(u.swiss,UE(u).swiss)}</p></div>`:''}
    ${unitTracksHTML(u)}
    <div class="row" style="margin-top:18px"><button class="pri" onclick="nav('#/unit/${u.id}/exs')">Weiter: Beispiele →</button></div>`}
  else if(tab==='exs'){ut.innerHTML=`<div class="card"><div class="row" style="margin-bottom:6px"><button class="sm" id="playall">▶ Alle vorlesen</button><span class="small muted">Laut mitsprechen! Englisch ausblenden: <label><input type="checkbox" id="hideEn"> </label></span></div>${(u.examples||[]).map(e=>`<div class="ex">${sayBtn(e[0])}${starBtn(e[0],e[1],u.level+' · '+u.title)}<div><div class="de">${esc(e[0])}</div><div class="en">${esc(e[1]||'')}</div></div></div>`).join('')}</div>
    <div class="row" style="margin-top:14px"><button class="pri" onclick="nav('#/unit/${u.id}/voc')">Weiter: Wortschatz →</button><a class="btn" href="#/dictation/${u.id}">Diktat mit diesen Sätzen</a><a class="btn" href="#/shadow/${u.id}">Nachsprechen</a></div>`;
    $('#hideEn').onchange=e=>$$('.ex .en').forEach(x=>x.style.visibility=e.target.checked?'hidden':'');
    $('#playall').onclick=()=>{const exs=(u.examples||[]).map(e=>e[0]);let i=0;const nx=()=>{if(i>=exs.length)return;const ut=say(exs[i++]);if(ut)ut.onend=()=>setTimeout(nx,700)};nx()}}
  else if(tab==='voc'){ut.innerHTML=vc.length?`<div class="card"><div class="row"><b>${vc.length} Wörter</b><span class="spacer"></span><button class="pri" id="learnU">Diese Wörter lernen</button></div><table class="t" style="margin-top:10px">${vc.map(c=>`<tr><td class="nw">${sayBtn(nounStr(c))}${starBtn(nounStr(c),c.en,u.level+' · '+u.title,c.id)}</td><td>${artSpan(c)}${c.plural?` <span class="small muted">· Pl. ${esc(c.plural)}</span>`:''}${c.forms?` <span class="small muted">(${esc(c.forms)})</span>`:''}</td><td>${esc(c.en)}</td><td class="small muted">${esc(c.exDe)}</td><td>${vstate(c.id)?`<span class="pill ${vstate(c.id).box>=3?'ok':''}">Box ${vstate(c.id).box}</span>`:''}</td></tr>`).join('')}</table></div>`:'<p class="muted">Kein eigener Wortschatz für diese Einheit – siehe Bereich Wortschatz.</p>';
    const b=$('#learnU');if(b)b.onclick=()=>vocabSession(vc.filter(c=>!S.vocab[c.id]).slice(0,S.settings.dailyNew*2).concat(vc.filter(c=>S.vocab[c.id]&&S.vocab[c.id].due<=today())),'Wortschatz: '+u.title,'#/unit/'+u.id+'/voc')}

      passMsg:st2=>st2.pct>=0.8?'✓ Einheit abgeschlossen. Weiter mit der nächsten Einheit.':'Noch nicht 80 % – Fehler wiederholen, Grammatik nochmal ansehen, dann neu versuchen.'})}};
function shuffleKeepGroups(items){return shuffle(items)}

/* LEVEL TEST */
R.test=function(l){const us=levelUnits(l);const pool=[];
  us.forEach(u=>{const its=unitItems(u).map(i=>Object.assign(i,{key:i.key}));pool.push(...sample(its,Math.max(2,Math.ceil(40/us.length))))});
  const vc=sample(cards().filter(c=>c.level===l&&c.kind==='noun'),6).map(c=>vItem(c,'prod'));
  const items=shuffle(sample(pool,40).concat(vc));
  main().innerHTML=`<h1>Niveautest ${l}</h1><p class="sub">${items.length} Aufgaben aus allen ${l}-Einheiten (Grammatik + Wortschatz). Bestehen ab 80 %.</p><div class="card"><p>${L('Bestehen (≥ 80 %) markiert das Niveau als bestanden.','Passing (≥ 80 %) marks the level as passed.')} ${false?LH('Da '+l+' noch gesperrt ist, gilt dies als <b>Einstufungstest</b>: Bestehen schaltet '+l+' frei und markiert die Einheiten als „getestet“.','As '+l+' is still locked, this counts as a <b>placement test</b>: passing unlocks '+l+' and marks its units as “tested”.'):''}</p><button class="pri" id="go">Test starten</button></div>`;
  $('#go').onclick=()=>runSession({title:'Niveautest '+l,items,back:'#/path/'+l,onDone:st=>{const L=S.levels[l]=S.levels[l]||{};L.best=Math.max(L.best||0,st.pct);L.tries=(L.tries||0)+1;
      if(st.pct>=0.8){L.passed=true;L.unlocked=true;L.testedOut=true;const i=LEVELS.indexOf(l);for(let k=0;k<i;k++){const P=S.levels[LEVELS[k]]=S.levels[LEVELS[k]]||{};P.passed=true;P.unlocked=true;P.testedOut=true}if(LEVELS[i+1]){S.levels[LEVELS[i+1]]=S.levels[LEVELS[i+1]]||{};S.levels[LEVELS[i+1]].unlocked=true}}save()},
    passMsg:st=>st.pct>=0.8?`✓ ${l} bestanden!`:'Nicht bestanden. Die falsch beantworteten Aufgaben sind jetzt im Fehlertraining.'})};

/* VOCAB */
function vItem(c,mode){const src='vocab';const key='v:'+c.id+':'+mode;
  if(mode==='prod'){const ans=[nounStr(c)];const l2=c.lemma.replace(/^(jdm\.|jdn\.|etw\.)\s+/,'');if(l2!==c.lemma)ans.push(l2);if(c.lemma.startsWith('sich '))ans.push(c.lemma.slice(5));return{type:'t',prompt:L('Auf Deutsch'+(c.art?' (mit Artikel)':''),'In German'+(c.art?' (with article)':''))+': '+c.en,answers:ans,hint:c.exEn?'':'',cat:c.art?'gender':'vocab',src,key,spec:'v|'+c.id+'|prod',level:c.level,card:c,explain:c.exDe}}
  if(mode==='plural')return{type:'t',prompt:L('Plural von','Plural of')+' '+nounStr(c)+' '+L('(mit Artikel)','(with article)')+': ',answers:['die '+c.plural],cat:'plural',src,key,spec:'v|'+c.id+'|plural',level:c.level,card:c};
  if(mode==='perf'){const m=c.forms.match(/(hat|ist)\s+((?:sich\s+)?\S+)\s*$/)||c.forms.match(/(hat|ist)\s+(\S+)/);return{type:'t',prompt:L('Perfekt','Perfect tense')+' (er/sie/es): '+c.lemma+' → er ___',answers:[m[1]+' '+m[2]],cat:'perfekt',src,key,spec:'v|'+c.id+'|perf',level:c.level,card:c,explain:c.forms}}
  if(mode==='listen')return{type:'d',prompt:L('Wort mit Artikel schreiben','Write the word with its article'),answers:[nounStr(c)],cat:'spelling',src,key,spec:'v|'+c.id+'|listen',level:c.level,card:c};
  // recog
  const others=sample(cards().filter(x=>x.level===c.level&&x.id!==c.id&&x.en!==c.en),3).map(x=>x.en);
  return{type:'m',prompt:L('Was bedeutet','What does this mean')+': '+nounStr(c)+'?',correct:c.en,options:[c.en,...others],answers:[c.en],cat:'vocab',src,key,spec:'v|'+c.id+'|recog',level:c.level,card:c}}
function itemFromSpec(spec,e){if(spec.startsWith('sv|')){const x=(S.saved||[]).find(y=>y.k===spec.slice(3));return x?{type:'t',prompt:L('Auf Deutsch','In German')+': '+(x.en||x.de),answers:[x.de],cat:'vocab',src:'saved',key:e.key,spec,level:''}:null}
  if(spec.startsWith('v|')){const [,id,mode]=spec.split('|');const c=cardById(id);return c?vItem(c,mode):null}
  if(spec.startsWith('man|')){const p=spec.split('|');return{type:'t',prompt:L('Korrigieren Sie','Correct this')+': „'+p[1]+'“',answers:[p[2]],cat:e.cat,src:'manual',key:e.key,spec,level:e.level||'',explain:p[3]||''}}
  if(spec.startsWith('dict|')){const p=spec.split('|');return{type:'d',prompt:'',answers:[p[1]],cat:'listening',src:'dict',key:e.key,spec,level:e.level||''}}
  return parseItem(spec,{src:e.src,key:e.key,cat:e.cat,level:e.level})}
function vocabSession(list,title,back){
  if(!list.length){toast('Keine Wörter fällig.');return}
  const intro=list.filter(c=>!S.vocab[c.id]);let i=0;
  function showIntro(){if(i>=intro.length)return quiz();const c=intro[i];
    main().innerHTML=`<div class="quiz"><div class="qhead"><a class="btn sm" href="${back}">✕</a><div class="bar"><i style="width:${i/intro.length*100}%"></i></div><span class="small muted">Neu ${i+1}/${intro.length}</span></div>
    ${levelBarHTML(c.level)}<div class="qcard flash"><div class="muted small">${esc(c.theme||'')}</div><div class="w">${artSpan(c)} ${sayBtn(nounStr(c))} ${starBtn(nounStr(c),c.en,c.level+' · '+(c.theme||''),c.id)}</div>${c.plural?`<div class="pl">Plural: <span class="plu">die ${esc(c.plural)}</span></div>`:''}${c.forms?`<div class="pl">${esc(c.forms)}</div>`:''}<div style="font-size:20px;margin-top:10px">${esc(c.en)}</div>${c.exDe?`<div class="exs">${sayBtn(c.exDe)} ${esc(c.exDe)}${c.exEn?`<br><span class="small">${esc(c.exEn)}</span>`:''}</div>`:''}
    <div class="row" style="justify-content:center;margin-top:22px"><button class="pri" id="n">Gemerkt → ⏎</button></div></div></div>`;
    say(nounStr(c));$('#n').onclick=()=>{i++;showIntro()};document.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#n').click()}}}
  function quiz(){document.onkeydown=null;const items=[];
    for(const c of list){const v=S.vocab[c.id];const box=v?v.box:0;let mode;
      if(box<=1)mode=Math.random()<.5?'recog':'prod';else{const r=Math.random();mode=r<.55?'prod':r<.75?'listen':'recog';if(c.kind==='noun'&&c.plural&&c.plural!=='(nur Plural)'&&Math.random()<.3)mode='plural';if(c.kind==='verb'&&c.forms&&/(hat|ist) \S+/.test(c.forms)&&Math.random()<.4)mode='perf'}
      if(mode==='listen'&&!window.speechSynthesis)mode='prod';items.push(vItem(c,mode))}
    runSession({title,items:shuffle(items),back,onItem:(it,ok)=>{vReview(it.card,ok);if(!S.vocab[it.card.id].first){S.vocab[it.card.id].first=today();hist().new++}}})}
  showIntro();}
R.vocab=function(sub){

  const decks=VOCAB.map(d=>{const cs=cards().filter(c=>c.deck===d.id);return{d,n:cs.length,st:cs.filter(c=>S.vocab[c.id]).length,ln:cs.filter(c=>S.vocab[c.id]&&S.vocab[c.id].box>=3).length}});
